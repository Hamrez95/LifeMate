name: caremate
description: CareMate Caregiver App
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  google_fonts: ^8.0.1 
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/
    - lib/localization/en.json
    - lib/localization/fa.json
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/PoppinsLatin-Regular.ttf
        - asset: assets/fonts/PoppinsLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/PoppinsLatin-Bold.ttf
          weight: 700
