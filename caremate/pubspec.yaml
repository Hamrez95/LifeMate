name: caremate
description: CareMate Caregiver App
publish_to: 'none'
version: 0.8.0-beta.3+10
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  lifemate_client:
    path: ../packages/lifemate_client
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  table_calendar: ^3.2.0
  shamsi_date: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/
    - lib/core/localization/en.json
    - lib/core/localization/fa.json
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/PoppinsLatin-Regular.ttf
        - asset: assets/fonts/PoppinsLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/PoppinsLatin-Bold.ttf
          weight: 700
