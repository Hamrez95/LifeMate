name: caremate
description: CareMate Caregiver App
publish_to: 'none'
version: 0.9.0-internal.5+16
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  lifemate_client:
    path: ../packages/lifemate_client
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  table_calendar: ^3.2.0
  shamsi_date: ^1.0.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  image_path: assets/images/CareMateWithoutBack.png
  adaptive_icon_background: '#F1FAF5'
  adaptive_icon_foreground: assets/images/CareMateWithoutBack.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - lib/core/localization/en.json
    - lib/core/localization/fa.json
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/PoppinsLatin-Regular.ttf
        - asset: assets/fonts/PoppinsLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/PoppinsLatin-Bold.ttf
          weight: 700
