name: lifemate
description: LifeMate parent application and Living Shell host.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  lifemate_client:
    path: ../packages/lifemate_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: 1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/living_camp/v1/raster/base/camp_background_day.webp
