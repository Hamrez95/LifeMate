name: wellmate
description: WellMate Patient App
publish_to: 'none'
version: 0.8.0-beta.2+9
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  lifemate_client:
    path: ../packages/lifemate_client
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  table_calendar: ^3.2.0
  flutter_gen: ^5.12.0
  shamsi_date: ^1.0.0
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - lib/localization/en.json
    - lib/localization/fa.json
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/PoppinsLatin-Regular.ttf
        - asset: assets/fonts/PoppinsLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/PoppinsLatin-Bold.ttf
          weight: 700
  generate: true
