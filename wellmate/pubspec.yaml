name: wellmate
description: WellMate Patient App
publish_to: 'none'
version: 0.9.0-internal.9+20
# Internal Device-QA candidate only; not Stable or RC.
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  lifemate_client:
    path: ../packages/lifemate_client
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  shamsi_date: ^1.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/sounds/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
