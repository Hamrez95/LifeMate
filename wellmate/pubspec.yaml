name: wellmate
description: WellMate Patient App
publish_to: 'none'
version: 0.9.0-internal.9+20
# Internal Device-QA candidate only; not Stable or RC.
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  lifemate_client:
    path: ../packages/lifemate_client
  lifemate_core:
    path: ../packages/lifemate_core
  lifemate_ui:
    path: ../packages/lifemate_ui
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  url_launcher: ^6.3.2
  flutter_local_notifications: ^19.5.0
  home_widget: 0.9.2
  timezone: ^0.10.1
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  table_calendar: ^3.2.0
  flutter_gen: ^5.12.0
  flutter_svg: ^2.2.0
  shamsi_date: ^1.0.0
  qr_flutter: ^4.1.0
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/images/WellMateWithoutBack.png
  adaptive_icon_background: '#F1FAF5'
  adaptive_icon_foreground: assets/images/WellMateWithoutBack.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - feature_assets/women_cycle/
    - lib/localization/en.json
    - lib/localization/fa.json
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/PoppinsLatin-Regular.ttf
        - asset: assets/fonts/PoppinsLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/PoppinsLatin-Bold.ttf
          weight: 700
  generate: true
