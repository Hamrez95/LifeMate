plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def lifemateRequireReleaseSigning = System.getenv("LIFEMATE_REQUIRE_RELEASE_SIGNING") == "true"
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

if (lifemateRequireReleaseSigning) {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException("Stable WellMate release signing is required but key.properties is missing.")
    }
    def requiredSigningProperties = ["keyAlias", "keyPassword", "storeFile", "storePassword"]
    def missingSigningProperties = requiredSigningProperties.findAll { name ->
        def value = keystoreProperties[name]
        value == null || value.toString().trim().isEmpty()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException("Stable WellMate release signing configuration is incomplete.")
    }
    def configuredStore = file(keystoreProperties["storeFile"])
    if (!configuredStore.isFile()) {
        throw new GradleException("Stable WellMate release keystore file is missing.")
    }
}

// GitHub's GITHUB_RUN_NUMBER is scoped per workflow, so two valid LifeMate
// release workflows can otherwise produce Android versionCodes that move
// backwards relative to one another. Every CI Android build therefore uses one
// repository-wide monotonic time scale: UTC seconds since 2025-01-01.
def lifemateCiVersionCode = null
if (System.getenv("GITHUB_ACTIONS") == "true") {
    final long baseEpochSeconds = 1735689600L
    final long currentEpochSeconds = Math.floorDiv(System.currentTimeMillis(), 1000L)
    final long computedVersionCode = currentEpochSeconds - baseEpochSeconds
    if (computedVersionCode <= 0L || computedVersionCode > 2100000000L) {
        throw new GradleException("LifeMate CI versionCode is outside Android's supported range: ${computedVersionCode}")
    }
    lifemateCiVersionCode = (int) computedVersionCode
}

android {
    namespace = "com.lifemate.wellmate"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.lifemate.wellmate"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = lifemateCiVersionCode != null ? lifemateCiVersionCode : flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                // Internal installable checkpoints may still use debug signing,
                // but stable/release workflows set LIFEMATE_REQUIRE_RELEASE_SIGNING=true
                // and fail during configuration before this fallback is reachable.
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
