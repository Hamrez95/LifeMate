services:
  postgres:
    image: postgres:17-alpine
    container_name: lifemate-postgres
    environment:
      POSTGRES_DB: lifemate
      POSTGRES_USER: lifemate
      POSTGRES_PASSWORD: lifemate_dev_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - lifemate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifemate -d lifemate"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lifemate-postgres-data:
