name: combine-edge-baselines-once

on:
  push:
    branches:
      - ci/edge-api-format-baseline-20260904

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge admin baseline branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin ci/admin-edge-format-baseline-20260904
          git merge --no-ff --no-edit origin/ci/admin-edge-format-baseline-20260904
          rm .github/workflows/combine-edge-baselines-once.yml
          git add -A
          git commit -m 'chore(ci): finalize combined edge API baseline cleanup'
          git push origin HEAD:ci/edge-api-format-baseline-20260904
