name: temp-edge-format-reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-edge-format-reconcile.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          show-progress: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Canonical format
        run: deno fmt supabase/functions/lifemate-api supabase/functions/lifemate-care-management
      - name: Commit formatter-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/lifemate-api supabase/functions/lifemate-care-management; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-api supabase/functions/lifemate-care-management
          git commit -m 'style(edge): apply canonical Deno formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
