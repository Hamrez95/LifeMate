name: apply-caregiver-request-flow

on:
  push:
    branches:
      - feat/caremate-care-requests
    paths:
      - .github/workflows/apply-caregiver-request-flow.yml

permissions:
  contents: write

env:
  PUB_ENVIRONMENT: bot:github_actions

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/caremate-care-requests
          fetch-depth: 0

      - name: Apply deterministic UX and API patch
        run: python3 tools/hotfix/apply_caregiver_request_flow.py

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Format and verify Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          (
            cd supabase/functions/lifemate-api
            deno fmt index.ts care_requests.ts
            deno check index.ts
          )
          (
            cd supabase/functions/lifemate-care-management
            deno fmt index.ts path_utils.ts path_utils_test.ts
            deno check index.ts
            deno test path_utils_test.ts
          )

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Format Dart changes
        shell: bash
        run: |
          dart format \
            packages/lifemate_client/lib/src/lifemate_api_client.dart \
            packages/lifemate_client/test/lifemate_api_client_test.dart \
            caremate/lib/screens/feature_preview_screen.dart \
            caremate/lib/widgets/care_request_card.dart \
            caremate/test/care_request_flow_contract_test.dart \
            wellmate/lib/screens/profile/care_access_screen.dart \
            wellmate/lib/screens/profile/incoming_care_request_card.dart \
            wellmate/test/incoming_care_request_contract_test.dart

      - name: Verify shared client
        run: |
          cd packages/lifemate_client
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        run: |
          cd wellmate
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify CareMate
        run: |
          cd caremate
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-caregiver-request-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit' >&2; exit 1; }
          git commit -m 'feat: add caregiver initiated care requests'
          git push origin HEAD:feat/caremate-care-requests
