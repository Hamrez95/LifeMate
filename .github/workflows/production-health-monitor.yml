name: production-health-monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  lifemate-application-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DEFAULT_READINESS_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-readiness
      CONFIGURED_READINESS_URL: ${{ vars.LIFEMATE_READINESS_URL }}
    steps:
      - name: Check production Edge and restricted database dependency
        shell: bash
        run: |
          set -euo pipefail
          READINESS_URL="${CONFIGURED_READINESS_URL:-$DEFAULT_READINESS_URL}"
          response_file="$RUNNER_TEMP/lifemate-readiness.json"
          status="$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 3 \
            --max-time 8 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "$READINESS_URL")"

          if [[ "$status" != "200" ]]; then
            echo "LifeMate readiness endpoint returned HTTP $status" >&2
            exit 1
          fi

          jq -e '
            .status == "ok" and
            .database == "application_ready" and
            .role == "lifemate_edge_runtime" and
            .service == "lifemate-readiness" and
            .mode == "lightweight" and
            (.durationMs | type == "number" and . >= 0 and . <= 2000) and
            (.version | type == "string" and length > 0)
          ' "$response_file" >/dev/null

          version="$(jq -r '.version' "$response_file")"
          duration_ms="$(jq -r '.durationMs' "$response_file")"
          {
            echo '## LifeMate production lightweight readiness'
            echo ''
            echo '- readiness Edge: healthy'
            echo '- restricted DB identity/connectivity: healthy'
            echo '- frequent probe DB work: one read-only constant-cost query'
            echo "- probe query duration: ${duration_ms} ms"
            echo "- deployed version: \`$version\`"
            echo '- deep grant/RLS/DML verification is intentionally kept in deployment CI, not the recurring production monitor'
          } >> "$GITHUB_STEP_SUMMARY"
