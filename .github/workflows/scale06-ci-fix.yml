name: scale06-ci-fix

on:
  push:
    branches: ['perf/scale-06-outbox-safety']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-06-outbox-safety
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Make claim-function return-shape migration legal
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/migrations/20260814170000_harden_outbox_queue_safety.sql')
          text = path.read_text()
          marker = '''create or replace function integration.claim_outbox_messages_for_events(
          '''
          replacement = '''-- PostgreSQL cannot CREATE OR REPLACE a function when its OUT/RETURNS TABLE
          -- row shape changes. Drop the previous signature inside this migration and
          -- recreate it immediately below; worker EXECUTE grants are restored later.
          drop function if exists integration.claim_outbox_messages_for_events(
            character varying, integer, character varying[]
          );

          create or replace function integration.claim_outbox_messages_for_events(
          '''
          if replacement not in text:
            if text.count(marker) != 1:
              raise SystemExit(f'expected one claim function marker, got {text.count(marker)}')
            text = text.replace(marker, replacement, 1)
          path.write_text(text)
      - name: Format Deno sources
        run: |
          deno fmt \
            supabase/functions/lifemate-worker/policy.ts \
            supabase/functions/lifemate-worker/policy_test.ts \
            supabase/functions/lifemate-worker/queue_integration_test.ts
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/migrations/20260814170000_harden_outbox_queue_safety.sql \
            supabase/functions/lifemate-worker/policy.ts \
            supabase/functions/lifemate-worker/policy_test.ts \
            supabase/functions/lifemate-worker/queue_integration_test.ts
          if git diff --cached --quiet; then
            echo 'No fixes required.'
            exit 0
          fi
          git commit -m 'fix(scale): make outbox migration replayable and format tests'
          git push origin HEAD:perf/scale-06-outbox-safety
