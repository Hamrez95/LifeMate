name: temp-offline-03-sync-format

on:
  push:
    branches: [platform/offline-03-sync-state]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: platform/offline-03-sync-state
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Canonical format
        run: |
          dart format \
            packages/lifemate_core/lib/lifemate_core.dart \
            packages/lifemate_core/lib/src/local_health_store.dart \
            packages/lifemate_core/lib/src/local_sync_checkpoint.dart \
            packages/lifemate_core/lib/src/local_projection_reconciler.dart \
            packages/lifemate_core/test/local_sync_checkpoint_test.dart \
            packages/lifemate_core/test/local_projection_reconciler_test.dart
      - name: Verify core
        working-directory: packages/lifemate_core
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
      - name: Commit formatter result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/lifemate_core
          git commit -m "style(offline): canonical-format sync reconciliation slice"
          git push origin HEAD:platform/offline-03-sync-state
