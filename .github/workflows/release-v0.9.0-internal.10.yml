name: release-v0.9.0-internal.10

on:
  push:
    branches:
      - release/build-v0.9.0-internal.10

permissions:
  contents: read

concurrency:
  group: release-v0.9.0-internal.10
  cancel-in-progress: false

env:
  RELEASE_NAME: 0.9.0-internal.10
  RELEASE_BUILD_NUMBER: '21'
  MAIN_COMMIT: 69d39b1d888f4addf3546692dc6d9449f9a72197
  API_RELEASE: 3cdf7344db065b1c8d30f196bc5e4b0eed8bd637
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Compute release metadata
        id: meta
        shell: bash
        run: echo "short_sha=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Verify production backend contract
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$LIFEMATE_API_BASE_URL/health")"
          echo "$health" | jq -e --arg version "$API_RELEASE" \
            '.status == "ok" and .database == "ready" and .service == "lifemate-api" and .version == $version' >/dev/null

          assert_auth_route() {
            local path="$1"
            local status
            status="$(curl --silent --show-error --output /tmp/route.json --write-out '%{http_code}' "$LIFEMATE_API_BASE_URL$path")"
            test "$status" = '401'
          }

          assert_auth_route '/api/v1/me'
          assert_auth_route '/api/v1/me/profile'
          assert_auth_route '/api/v1/treatment-plans'
          assert_auth_route '/api/v1/dose-occurrences?fromDate=2026-08-06&toDate=2026-08-13'
          assert_auth_route '/api/v1/care-events?fromDate=2026-08-06&toDate=2026-08-13'
          assert_auth_route '/api/v1/women-calendar/profile'
          assert_auth_route '/api/v1/women-calendar/episodes'
          assert_auth_route '/api/v1/women-calendar/daily-logs?fromDate=2026-08-01&toDate=2026-08-13'

      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter test --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true test/women_companion_experience_test.dart
          flutter test test/home_schedule_loader_test.dart

      - name: Verify CareMate
        working-directory: caremate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter test --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true test/care_women_companion_experience_test.dart

      - name: Build installable Android APKs
        shell: bash
        run: |
          set -euo pipefail
          build_args=(
            --release
            --build-name="$RELEASE_NAME"
            --build-number="$RELEASE_BUILD_NUMBER"
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_GOOGLE_AUTH=false"
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=true"
          )
          (cd wellmate && flutter build apk "${build_args[@]}")
          (cd caremate && flutter build apk "${build_args[@]}")

      - name: Inspect APKs and create manifest
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          mkdir -p dist
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk \
            "dist/WellMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER.apk"
          cp caremate/build/app/outputs/flutter-apk/app-release.apk \
            "dist/CareMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER.apk"

          "$aapt_bin" dump badging "dist/WellMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER.apk" \
            | grep -q "package: name='com.lifemate.wellmate'"
          "$aapt_bin" dump badging "dist/CareMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER.apk" \
            | grep -q "package: name='com.lifemate.caremate'"
          for apk in dist/*.apk; do
            "$aapt_bin" dump permissions "$apk" | grep -Fq 'android.permission.INTERNET'
          done

          wellmate_sha="$(sha256sum dist/WellMate-*.apk | awk '{print $1}')"
          caremate_sha="$(sha256sum dist/CareMate-*.apk | awk '{print $1}')"
          jq -n \
            --arg releaseName "$RELEASE_NAME" \
            --arg version "$RELEASE_NAME+$RELEASE_BUILD_NUMBER" \
            --arg mainCommit "$MAIN_COMMIT" \
            --arg buildCommit "$GITHUB_SHA" \
            --arg apiVersion "$API_RELEASE" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wellmateSha256 "$wellmate_sha" \
            --arg caremateSha256 "$caremate_sha" \
            '{releaseName:$releaseName,version:$version,mainCommit:$mainCommit,buildCommit:$buildCommit,apiVersion:$apiVersion,builtAtUtc:$builtAt,channel:"internal/physical-qa",signing:"debug fallback; not Play Store",backend:{deployed:true,migrationsApplied:true},featureFlags:{womenCalendarPilot:true,googleAuth:false},apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256}},fixes:["Production API promoted from candidate route set","Missing women-calendar migrations applied","WellMate home survives partial schedule endpoint failure"]}' \
            > dist/LifeMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER-manifest.json

      - name: Upload Android physical-QA bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemate-${{ env.RELEASE_NAME }}-android-physical-qa
          path: dist
          if-no-files-found: error
          retention-days: 30
