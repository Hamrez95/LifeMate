name: performance-harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/load/**'
      - 'docs/operations/capacity.md'
      - '.github/workflows/performance-harness.yml'
  push:
    branches: [main]
    paths:
      - 'tools/load/**'
      - 'docs/operations/capacity.md'
      - '.github/workflows/performance-harness.yml'

permissions:
  contents: read

concurrency:
  group: performance-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-k6:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Install pinned k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: '2.1.0'

      - name: Validate script execution requirements
        run: |
          set -euo pipefail
          k6 version
          k6 inspect --execution-requirements tools/load/lifemate-api-local.js >/tmp/lifemate-k6-inspect.json
          test -s /tmp/lifemate-k6-inspect.json

      - name: Prove remote targets fail closed
        shell: bash
        run: |
          set -euo pipefail
          if BASE_URL='https://example.invalid/functions/v1/lifemate-api' \
            K6_NO_USAGE_REPORT=true \
            k6 run --vus 1 --iterations 1 tools/load/lifemate-api-local.js >/tmp/remote-guard.log 2>&1; then
            echo '::error::Local-only load harness unexpectedly accepted a remote target.'
            cat /tmp/remote-guard.log
            exit 1
          fi
          grep -q 'intentionally local-only' /tmp/remote-guard.log

      - name: Run local smoke against disposable stub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b'{"status":"ok"}'
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_args):
                  return

          ThreadingHTTPServer(('127.0.0.1', 54321), Handler).serve_forever()
          PY
          stub_pid=$!
          trap 'kill "$stub_pid" 2>/dev/null || true' EXIT
          sleep 1
          K6_NO_USAGE_REPORT=true LOAD_PROFILE=smoke k6 run tools/load/lifemate-api-local.js
          test -s load-summary.json

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-harness-smoke-summary
          path: load-summary.json
          if-no-files-found: ignore
          retention-days: 3
