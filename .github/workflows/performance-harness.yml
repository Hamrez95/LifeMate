name: performance-harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/load/**'
      - 'docs/operations/capacity.md'
      - 'docs/operations/reliability-slos.md'
      - '.github/workflows/performance-harness.yml'
      - '.github/workflows/staging-capacity.yml'
  push:
    branches: [main]
    paths:
      - 'tools/load/**'
      - 'docs/operations/capacity.md'
      - 'docs/operations/reliability-slos.md'
      - '.github/workflows/performance-harness.yml'
      - '.github/workflows/staging-capacity.yml'

permissions:
  contents: read

concurrency:
  group: performance-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-k6:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Install pinned k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: '2.1.0'

      - name: Validate script execution requirements
        run: |
          set -euo pipefail
          k6 version
          k6 inspect --execution-requirements tools/load/lifemate-api-local.js >/tmp/lifemate-k6-local-inspect.json
          k6 inspect --execution-requirements tools/load/lifemate-api-capacity.js >/tmp/lifemate-k6-capacity-inspect.json
          test -s /tmp/lifemate-k6-local-inspect.json
          test -s /tmp/lifemate-k6-capacity-inspect.json
          bash -n tools/load/collect-runtime-pressure.sh
          node --check tools/load/summarize-runtime-pressure.mjs
          test -s tools/load/runtime-pressure.sql

      - name: Prove production and arbitrary remote targets fail closed
        shell: bash
        run: |
          set -euo pipefail
          if BASE_URL='https://example.invalid/functions/v1/lifemate-api' \
            K6_NO_USAGE_REPORT=true \
            k6 run --vus 1 --iterations 1 tools/load/lifemate-api-local.js >/tmp/local-remote-guard.log 2>&1; then
            echo '::error::Local-only load harness unexpectedly accepted a remote target.'
            cat /tmp/local-remote-guard.log
            exit 1
          fi
          grep -q 'intentionally local-only' /tmp/local-remote-guard.log

          if LIFEMATE_LOAD_TARGET=staging \
            CONFIRM_STAGING_LOAD=LIFEMATE-STAGING-ONLY \
            TARGET_PROJECT_REF=bwdvmniywyyijjauipnh \
            BASE_URL='https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api' \
            ACCESS_TOKEN='synthetic-token' \
            K6_NO_USAGE_REPORT=true \
            k6 run --vus 1 --iterations 1 tools/load/lifemate-api-capacity.js >/tmp/api-production-guard.log 2>&1; then
            echo '::error::Capacity runner unexpectedly accepted production.'
            cat /tmp/api-production-guard.log
            exit 1
          fi
          grep -q 'Production project ref is explicitly blocked' /tmp/api-production-guard.log

          if DATABASE_URL='postgres://user:pass@db.bwdvmniywyyijjauipnh.supabase.co/postgres' \
            TARGET_PROJECT_REF=bwdvmniywyyijjauipnh \
            LIFEMATE_OBSERVABILITY_TARGET=staging \
            DURATION_SECONDS=5 \
            bash tools/load/collect-runtime-pressure.sh >/tmp/db-production-guard.log 2>&1; then
            echo '::error::Database pressure collector unexpectedly accepted production.'
            cat /tmp/db-production-guard.log
            exit 1
          fi
          grep -q 'Production project ref is explicitly blocked' /tmp/db-production-guard.log

      - name: Prove capacity profiles cannot masquerade as one-user throttle tests
        shell: bash
        run: |
          set -euo pipefail
          if LIFEMATE_LOAD_TARGET=staging \
            CONFIRM_STAGING_LOAD=LIFEMATE-STAGING-ONLY \
            TARGET_PROJECT_REF=abcdefghijkl \
            BASE_URL='https://abcdefghijkl.supabase.co/functions/v1/lifemate-api' \
            ACCESS_TOKEN='single-synthetic-token' \
            LOAD_PROFILE=read-heavy \
            K6_NO_USAGE_REPORT=true \
            k6 run tools/load/lifemate-api-capacity.js >/tmp/identity-pool-guard.log 2>&1; then
            echo '::error::Read-heavy capacity profile accepted a single synthetic subject.'
            cat /tmp/identity-pool-guard.log
            exit 1
          fi
          grep -q 'requires at least 20 unique synthetic auth sessions' /tmp/identity-pool-guard.log

          sessions='[{"accessToken":"a","subject":"one"},{"accessToken":"b","subject":"two"}]'
          if LIFEMATE_LOAD_TARGET=staging \
            CONFIRM_STAGING_LOAD=LIFEMATE-STAGING-ONLY \
            TARGET_PROJECT_REF=abcdefghijkl \
            BASE_URL='https://abcdefghijkl.supabase.co/functions/v1/lifemate-api' \
            AUTH_SESSIONS_JSON="$sessions" \
            LOAD_PROFILE=single-user-throttle \
            K6_NO_USAGE_REPORT=true \
            k6 run tools/load/lifemate-api-capacity.js >/tmp/single-user-guard.log 2>&1; then
            echo '::error::Single-user throttle profile accepted multiple identities.'
            cat /tmp/single-user-guard.log
            exit 1
          fi
          grep -q 'single-user-throttle requires exactly one synthetic identity' /tmp/single-user-guard.log

      - name: Run local smoke against disposable stub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b'{"status":"ok","version":"local"}'
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.send_header('X-Correlation-Id', '123e4567-e89b-42d3-a456-426614174888')
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_args):
                  return

          ThreadingHTTPServer(('127.0.0.1', 18080), Handler).serve_forever()
          PY
          stub_pid=$!
          trap 'kill "$stub_pid" 2>/dev/null || true' EXIT
          sleep 1
          K6_NO_USAGE_REPORT=true \
            LIFEMATE_LOAD_TARGET=local \
            LOAD_PROFILE=smoke \
            BASE_URL=http://127.0.0.1:18080 \
            RUN_ID=ci-local-smoke \
            k6 run tools/load/lifemate-api-capacity.js
          test -s load-summary.json
          test -s capacity-result.json
          jq -e '.schemaVersion == "lifemate.capacity.v1" and .target == "local" and .profile == "smoke" and .thresholdsPassed == true' capacity-result.json >/dev/null

      - name: Prove pressure collector records complete and failed runs
        shell: bash
        run: |
          set -euo pipefail
          mock_dir="$(mktemp -d)"
          cat > "$mock_dir/psql" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' '{"sampledAtUtc":"2026-08-15T00:00:00Z","database":{"maxConnections":60,"databaseConnections":1,"lifeMateRuntimeConnections":0,"waitingRuntimeConnections":0,"runtimeQueriesOverOneSecond":0},"outbox":{"pendingCount":0,"oldestPendingAgeSeconds":0}}'
          EOF
          chmod +x "$mock_dir/psql"
          PATH="$mock_dir:$PATH" \
            DATABASE_URL='postgres://user:pass@127.0.0.1:5432/local' \
            LIFEMATE_OBSERVABILITY_TARGET=local \
            DURATION_SECONDS=5 \
            INTERVAL_SECONDS=1 \
            OUTPUT_FILE=/tmp/pressure-success.ndjson \
            STATUS_FILE=/tmp/pressure-success-status.json \
            bash tools/load/collect-runtime-pressure.sh
          jq -e '.exitCode == 0 and .coverageSeconds >= 5 and .samples >= 4' \
            /tmp/pressure-success-status.json >/dev/null

          cat > "$mock_dir/psql" <<'EOF'
          #!/usr/bin/env bash
          exit 7
          EOF
          chmod +x "$mock_dir/psql"
          if PATH="$mock_dir:$PATH" \
            DATABASE_URL='postgres://user:pass@127.0.0.1:5432/local' \
            LIFEMATE_OBSERVABILITY_TARGET=local \
            DURATION_SECONDS=5 \
            INTERVAL_SECONDS=1 \
            OUTPUT_FILE=/tmp/pressure-failed.ndjson \
            STATUS_FILE=/tmp/pressure-failed-status.json \
            bash tools/load/collect-runtime-pressure.sh; then
            echo '::error::Pressure collector hid a psql failure.'
            exit 1
          fi
          jq -e '.exitCode != 0 and .samples == 0' /tmp/pressure-failed-status.json >/dev/null

      - name: Validate runtime-pressure summarizer
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/runtime-pressure.ndjson <<'EOF'
          {"sampledAtUtc":"2026-08-15T00:00:00Z","database":{"maxConnections":60,"databaseConnections":8,"lifeMateRuntimeConnections":2,"waitingRuntimeConnections":0,"runtimeQueriesOverOneSecond":0},"outbox":{"pendingCount":1,"oldestPendingAgeSeconds":3}}
          {"sampledAtUtc":"2026-08-15T00:00:05Z","database":{"maxConnections":60,"databaseConnections":12,"lifeMateRuntimeConnections":5,"waitingRuntimeConnections":1,"runtimeQueriesOverOneSecond":1},"outbox":{"pendingCount":4,"oldestPendingAgeSeconds":9}}
          EOF
          node tools/load/summarize-runtime-pressure.mjs /tmp/runtime-pressure.ndjson /tmp/runtime-pressure-summary.json
          jq -e '.samples == 2 and .database.peakDatabaseConnections == 12 and .database.peakLifeMateRuntimeConnections == 5 and .outboxNumericMax.pendingCount == 4' /tmp/runtime-pressure-summary.json >/dev/null

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-harness-smoke-summary
          path: |
            load-summary.json
            capacity-result.json
          if-no-files-found: ignore
          retention-days: 3
