name: release-v0.9.0-internal.9

on:
  push:
    branches:
      - release/build-v0.9.0-internal.9

permissions:
  contents: read

concurrency:
  group: release-v0.9.0-internal.9-build
  cancel-in-progress: true

env:
  RELEASE_NAME: 0.9.0-internal.9
  RELEASE_BUILD_NUMBER: '20'
  MAIN_MERGE_COMMIT: 3cdf7344db065b1c8d30f196bc5e4b0eed8bd637
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PUB_ENVIRONMENT: bot:github_actions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/lifemate_client && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd wellmate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd caremate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd supabase/functions/lifemate-api && deno --version >/dev/null 2>&1 || true)

      - name: Build feature-enabled installable APKs
        shell: bash
        run: |
          set -euo pipefail
          build_args=(
            --release
            --build-name="$RELEASE_NAME"
            --build-number="$RELEASE_BUILD_NUMBER"
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_GOOGLE_AUTH=false"
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=true"
          )
          (cd wellmate && flutter build apk "${build_args[@]}")
          (cd caremate && flutter build apk "${build_args[@]}")

      - name: Inspect APKs and create release manifest
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          mkdir -p dist
          short_sha="${GITHUB_SHA:0:8}"
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk \
            "dist/WellMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER-$short_sha.apk"
          cp caremate/build/app/outputs/flutter-apk/app-release.apk \
            "dist/CareMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER-$short_sha.apk"

          "$aapt_bin" dump badging dist/WellMate-*.apk \
            | grep -q "package: name='com.lifemate.wellmate'"
          "$aapt_bin" dump badging dist/CareMate-*.apk \
            | grep -q "package: name='com.lifemate.caremate'"
          for apk in dist/*.apk; do
            "$aapt_bin" dump permissions "$apk" | grep -Fq 'android.permission.INTERNET'
          done

          wellmate_sha="$(sha256sum dist/WellMate-*.apk | awk '{print $1}')"
          caremate_sha="$(sha256sum dist/CareMate-*.apk | awk '{print $1}')"
          jq -n \
            --arg releaseName "$RELEASE_NAME" \
            --arg version "$RELEASE_NAME+$RELEASE_BUILD_NUMBER" \
            --arg mainCommit "$MAIN_MERGE_COMMIT" \
            --arg buildCommit "$GITHUB_SHA" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wellmateSha256 "$wellmate_sha" \
            --arg caremateSha256 "$caremate_sha" \
            '{releaseName:$releaseName,version:$version,mainCommit:$mainCommit,buildCommit:$buildCommit,builtAtUtc:$builtAt,channel:"internal/unstable",signing:"debug fallback; not Play Store",backendDeployment:"not_performed_missing_github_release_secrets",featureFlags:{womenCalendarPilot:true,googleAuth:false},apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256}},knownLimitations:["Internal physical-device test build","Live database migrations and Edge deployment were not performed because required GitHub release secrets were unavailable to the release branch","Founder-owned Play Store signing is not configured","User device/accessibility/privacy review remains required"]}' \
            > dist/release-manifest.json

      - name: Upload Android internal release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemate-${{ env.RELEASE_NAME }}-android-internal
          path: dist
          if-no-files-found: error
          retention-days: 30
