name: Agent patch health record task 1
on:
  push:
    branches:
      - feat/health-record-caregiver-doc-access-20260907
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/health-record-caregiver-doc-access-20260907
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 .github/scripts/run_health_record_task1_patch.py
      - name: Commit focused patch
        run: |
          rm -f .github/scripts/_agent_patch_health_record_task1_source.txt
          rm -f .github/scripts/run_health_record_task1_patch.py
          rm -f .github/workflows/_agent_patch_health_record_task1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(health-record): enable revocable caregiver document reads"
          git push origin HEAD:feat/health-record-caregiver-doc-access-20260907
