name: edge-api-baseline-fix-once

on:
  push:
    branches:
      - ci/edge-api-format-baseline-20260904

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply minimal baseline fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              expected = count if count is not None else 1
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              'supabase/functions/lifemate-api/medication_schedule_sleep_solver.ts',
              'const proposedOffsets = <number> [0];',
              'const proposedOffsets: number[] = [0];'
          )
          replace(
              'supabase/functions/lifemate-api/medication_schedule_sleep_store.ts',
              '            mode,\n            intervalHours,\n            ...proposal,',
              '            intervalHours,\n            ...proposal,'
          )
          replace(
              'supabase/functions/lifemate-api/support_attachment_storage.ts',
              '        body: bytes,',
              '        body: bytes.slice().buffer as ArrayBuffer,',
              count=2
          )
          replace(
              'supabase/functions/lifemate-api/support_conversations_routes.ts',
              'const digest = await crypto.subtle.digest("SHA-256", bytes);',
              'const digest = await crypto.subtle.digest(\n    "SHA-256",\n    bytes.slice().buffer as ArrayBuffer,\n  );'
          )

          migration = Path('supabase/migrations/20260827001500_admin_custom_roles.sql')
          text = migration.read_text()
          old = '''revoke all on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) from public,anon,authenticated;
          revoke all on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) from public,anon,authenticated;
          grant execute on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) to lifemate_admin_runtime;
          grant execute on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) to lifemate_admin_runtime;'''.replace('          ', '')
          new = '''revoke all on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) from public;
          revoke all on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) from public;

          do $$
          declare v_role text;
          begin
            foreach v_role in array array['anon','authenticated'] loop
              if to_regrole(v_role) is not null then
                execute format(
                  'revoke all on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) from %I',
                  v_role
                );
                execute format(
                  'revoke all on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) from %I',
                  v_role
                );
              end if;
            end loop;
            if to_regrole('lifemate_admin_runtime') is not null then
              grant execute on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) to lifemate_admin_runtime;
              grant execute on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) to lifemate_admin_runtime;
            end if;
          end
          $$;'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('migration portability block mismatch')
          migration.write_text(text.replace(old, new))

          Path('ci_edge_api_diagnostic.txt').unlink(missing_ok=True)
          Path('.github/workflows/edge-api-baseline-fix-once.yml').unlink()
      - name: Canonical format
        run: deno fmt supabase/functions/lifemate-api supabase/functions/lifemate-care-management
      - name: Type check lifemate API
        working-directory: supabase/functions/lifemate-api
        run: deno task check
      - name: Type check and test care management
        working-directory: supabase/functions/lifemate-care-management
        run: |
          deno task check
          deno task test
      - name: Apply portable schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Commit fixes and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): resolve edge API baseline gates'
          git push origin HEAD:ci/edge-api-format-baseline-20260904
