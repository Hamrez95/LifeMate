name: package-v0.9.0-internal.11

on:
  push:
    branches:
      - release/build-v0.9.0-internal.11

permissions:
  contents: read

env:
  RELEASE_NAME: 0.9.0-internal.11
  RELEASE_BUILD_NUMBER: '22'
  SOURCE_COMMIT: ae7950822cad8888f687ed33d29b563814bb29ae
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Confirm reviewed source and Edge checks
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          (cd supabase/functions/lifemate-api && deno fmt --check && deno task check && deno task test)

      - name: Build installable Android APKs
        shell: bash
        run: |
          set -euo pipefail
          build_args=(
            --release
            --build-name="$RELEASE_NAME"
            --build-number="$RELEASE_BUILD_NUMBER"
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_GOOGLE_AUTH=false"
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=true"
          )
          (cd wellmate && flutter pub get && flutter build apk "${build_args[@]}")
          (cd caremate && flutter pub get && flutter build apk "${build_args[@]}")

      - name: Inspect and package
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          mkdir -p dist/edge-source
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk "dist/WellMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER.apk"
          cp caremate/build/app/outputs/flutter-apk/app-release.apk "dist/CareMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER.apk"
          cp supabase/functions/lifemate-api/*.ts dist/edge-source/
          cp supabase/functions/lifemate-api/deno.json dist/edge-source/
          cp supabase/functions/lifemate-api/deno.lock dist/edge-source/
          "$aapt_bin" dump badging "dist/WellMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER.apk" | grep -q "package: name='com.lifemate.wellmate'"
          "$aapt_bin" dump badging "dist/CareMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER.apk" | grep -q "package: name='com.lifemate.caremate'"
          wellmate_sha="$(sha256sum dist/WellMate-*.apk | awk '{print $1}')"
          caremate_sha="$(sha256sum dist/CareMate-*.apk | awk '{print $1}')"
          jq -n \
            --arg releaseName "$RELEASE_NAME" \
            --arg version "$RELEASE_NAME+$RELEASE_BUILD_NUMBER" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg buildCommit "$GITHUB_SHA" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wellmateSha256 "$wellmate_sha" \
            --arg caremateSha256 "$caremate_sha" \
            '{releaseName:$releaseName,version:$version,sourceCommit:$sourceCommit,buildCommit:$buildCommit,builtAtUtc:$builtAt,channel:"internal/physical-qa",backend:{deploymentPending:true,databasePool:"shared max=1",aggregateRoutes:["home-snapshot","women-calendar/dashboard"]},apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256}}}' > "dist/LifeMate-$RELEASE_NAME+$RELEASE_BUILD_NUMBER-manifest.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemate-${{ env.RELEASE_NAME }}-android-and-edge-source
          path: dist
          if-no-files-found: error
          retention-days: 30
