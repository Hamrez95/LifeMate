name: fix-wellmate-metric-layout

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0
      - name: Bound metric card height
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wellmate/lib/screens/profile/profile_destination_screens.dart')
          text = path.read_text()
          old = '      constraints: const BoxConstraints(minHeight: 132),\n'
          new = '      height: 132,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one metric constraint, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-wellmate-metric-layout.yml
          git config user.name 'LifeMate UI Test Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add wellmate/lib/screens/profile/profile_destination_screens.dart .github/workflows/fix-wellmate-metric-layout.yml
          git commit -m 'fix: bound WellMate health metric cards in scroll views'
          git push origin HEAD:feat/full-bb287-ui-parity
