name: edge-api-baseline-commit-once

on:
  push:
    branches:
      - ci/edge-api-format-baseline-20260904

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply verified baseline fixes
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(); actual=text.count(old)
              if actual != count: raise SystemExit(f'{path}: expected {count}, got {actual}')
              p.write_text(text.replace(old,new))
          replace('supabase/functions/lifemate-api/medication_schedule_sleep_solver.ts','const proposedOffsets = <number> [0];','const proposedOffsets: number[] = [0];')
          replace('supabase/functions/lifemate-api/medication_schedule_sleep_store.ts','            mode,\n            intervalHours,\n            ...proposal,','            intervalHours,\n            ...proposal,')
          replace('supabase/functions/lifemate-api/support_attachment_storage.ts','        body: bytes,','        body: bytes.slice().buffer as ArrayBuffer,',2)
          replace('supabase/functions/lifemate-api/support_conversations_routes.ts','const digest = await crypto.subtle.digest("SHA-256", bytes);','const digest = await crypto.subtle.digest(\n    "SHA-256",\n    bytes.slice().buffer as ArrayBuffer,\n  );')
          p=Path('supabase/migrations/20260827001500_admin_custom_roles.sql'); text=p.read_text()
          old='''revoke all on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) from public,anon,authenticated;
          revoke all on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) from public,anon,authenticated;
          grant execute on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) to lifemate_admin_runtime;
          grant execute on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) to lifemate_admin_runtime;'''.replace('          ','')
          new='''revoke all on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) from public;
          revoke all on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) from public;

          do $$
          declare v_role text;
          begin
            foreach v_role in array array['anon','authenticated'] loop
              if to_regrole(v_role) is not null then
                execute format(
                  'revoke all on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) from %I',
                  v_role
                );
                execute format(
                  'revoke all on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) from %I',
                  v_role
                );
              end if;
            end loop;
            if to_regrole('lifemate_admin_runtime') is not null then
              grant execute on function admin.mutate_custom_role(uuid,character varying,character varying,character varying,smallint,bigint,character varying,uuid,character varying,character varying) to lifemate_admin_runtime;
              grant execute on function admin.mutate_custom_role_permission(uuid,character varying,character varying,character varying,bigint,character varying,uuid,character varying,character varying) to lifemate_admin_runtime;
            end if;
          end
          $$;'''.replace('          ','')
          if text.count(old)!=1: raise SystemExit('migration block mismatch')
          p.write_text(text.replace(old,new))
          Path('ci_edge_api_diagnostic.txt').unlink(missing_ok=True)
          Path('.github/workflows/edge-api-baseline-fix-once.yml').unlink(missing_ok=True)
          Path('.github/workflows/edge-api-baseline-commit-once.yml').unlink()
      - name: Format and verify type gates
        run: |
          deno fmt supabase/functions/lifemate-api supabase/functions/lifemate-care-management
          (cd supabase/functions/lifemate-api && deno task check)
          (cd supabase/functions/lifemate-care-management && deno task check && deno task test)
      - name: Commit verified source fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): resolve edge API baseline type and role gates'
          git push origin HEAD:ci/edge-api-format-baseline-20260904
