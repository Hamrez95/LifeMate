name: cocoon-internal-release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Cocoon internal release name, for example 0.1.0-internal.1
        required: true
        default: 0.1.0-internal.1
        type: string
      release_environment:
        description: Endpoint environment baked into this candidate
        required: true
        default: production
        type: choice
        options:
          - production
          - nonproduction
      confirm_build:
        description: Type BUILD-COCOON-INTERNAL to confirm candidate creation
        required: true
        type: string
  pull_request:
    paths:
      - 'cocoonmate/**'
      - 'packages/cocoonmate_module/**'
      - 'packages/lifemate_client/**'
      - 'tools/release/prepare-cocoon-android.sh'
      - '.github/workflows/cocoon-internal-release.yml'
      - 'docs/release/cocoonmate-android-candidates.md'

permissions:
  contents: read

concurrency:
  group: cocoon-internal-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || '0.1.0-ci.0' }}
      RELEASE_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_environment || 'ci' }}
      SUPABASE_URL: ${{ github.event_name == 'workflow_dispatch' && vars.SUPABASE_URL || 'https://ci.example.test' }}
      LIFEMATE_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && vars.LIFEMATE_API_BASE_URL || 'https://ci.example.test/functions/v1/lifemate-api' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'workflow_dispatch' && vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_only_not_a_secret' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Validate manual inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CONFIRM_BUILD: ${{ inputs.confirm_build }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM_BUILD" = 'BUILD-COCOON-INTERNAL'
          [[ "$RELEASE_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-internal\.[0-9]+$ ]]
          test -n "$SUPABASE_PUBLISHABLE_KEY"

      - name: Validate release tooling and environment guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/release/prepare-cocoon-android.sh
          shellcheck tools/release/prepare-cocoon-android.sh

          LIFEMATE_RELEASE_ENVIRONMENT=production \
          SUPABASE_URL=https://bwdvmniywyyijjauipnh.supabase.co \
          LIFEMATE_API_BASE_URL=https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api \
            bash tools/release/prepare-cocoon-android.sh verify-environment

          if LIFEMATE_RELEASE_ENVIRONMENT=production \
            SUPABASE_URL=https://staging.example.test \
            LIFEMATE_API_BASE_URL=https://staging.example.test/functions/v1/lifemate-api \
              bash tools/release/prepare-cocoon-android.sh verify-environment; then
            echo '::error::production environment mismatch was not rejected'
            exit 1
          fi

          if LIFEMATE_RELEASE_ENVIRONMENT=nonproduction \
            SUPABASE_URL=https://bwdvmniywyyijjauipnh.supabase.co \
            LIFEMATE_API_BASE_URL=https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api \
              bash tools/release/prepare-cocoon-android.sh verify-environment; then
            echo '::error::non-production candidate accepted production origin'
            exit 1
          fi

          if LIFEMATE_RELEASE_ENVIRONMENT=ci \
            SUPABASE_URL=https://one.example.test \
            LIFEMATE_API_BASE_URL=https://two.example.test/functions/v1/lifemate-api \
              bash tools/release/prepare-cocoon-android.sh verify-environment; then
            echo '::error::cross-environment API origin mismatch was not rejected'
            exit 1
          fi

      - name: Prepare deterministic Cocoon Android identity
        shell: bash
        env:
          LIFEMATE_RELEASE_ENVIRONMENT: ${{ env.RELEASE_ENVIRONMENT }}
        run: bash tools/release/prepare-cocoon-android.sh prepare

      - name: Resolve and verify Cocoon source
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/cocoonmate_module && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd cocoonmate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)

      - name: Build compact immutable internal APKs
        working-directory: cocoonmate
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --build-name="$RELEASE_NAME" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"

      - name: Verify package identity and create compact provenance bundles
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          mkdir -p dist
          short_sha="${GITHUB_SHA:0:8}"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="cocoonmate/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$apk"
            badging="$("$aapt_bin" dump badging "$apk")"
            permissions="$("$aapt_bin" dump permissions "$apk")"
            grep -Fq "package: name='com.mylifemate.cocoonmate'" <<<"$badging"
            grep -Fq "application-label:'CocoonMate'" <<<"$badging"
            grep -Fq 'android.permission.INTERNET' <<<"$permissions"

            mkdir -p "dist/$abi"
            candidate="dist/$abi/cocoonmate-$RELEASE_NAME-$short_sha-$RELEASE_ENVIRONMENT-$abi-internal.apk"
            cp "$apk" "$candidate"
            sha256sum "$candidate" > "$candidate.sha256"
          done

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          dist = Path('dist')
          artifacts = {}
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              target = next((dist / abi).glob('*.apk'))
              artifacts[abi] = {
                  'file': target.name,
                  'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                  'size_bytes': target.stat().st_size,
              }

          payload = {
              'schemaVersion': 2,
              'application': 'cocoonmate',
              'packageId': 'com.mylifemate.cocoonmate',
              'releaseName': os.environ['RELEASE_NAME'],
              'buildNumber': os.environ['GITHUB_RUN_NUMBER'],
              'commit': os.environ['GITHUB_SHA'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'environment': os.environ['RELEASE_ENVIRONMENT'],
              'apiOrigin': os.environ['LIFEMATE_API_BASE_URL'],
              'buildMode': 'release',
              'distribution': 'split-per-abi',
              'recommendedPhoneAbi': 'arm64-v8a',
              'artifacts': artifacts,
              'signing': 'ephemeral Android debug signing; release-optimized internal testing only',
              'rebuildAfterQaForbidden': True,
          }
          provenance = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          (dist / 'cocoonmate-provenance.json').write_text(provenance)
          for abi in artifacts:
              (dist / abi / 'cocoonmate-provenance.json').write_text(provenance)
          PY

          jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg environment "$RELEASE_ENVIRONMENT" \
            '.commit == $sha and .environment == $environment and .packageId == "com.mylifemate.cocoonmate" and .rebuildAfterQaForbidden == true and .distribution == "split-per-abi"' \
            dist/cocoonmate-provenance.json >/dev/null

          arm64_bytes="$(stat -c%s dist/arm64-v8a/*.apk)"
          if [[ "$arm64_bytes" -gt $((60 * 1024 * 1024)) ]]; then
            echo "Compact arm64 APK unexpectedly exceeds 60 MiB: $arm64_bytes bytes" >&2
            exit 1
          fi

      - name: Upload compact phone APK (arm64-v8a)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cocoonmate-${{ env.RELEASE_NAME }}-${{ github.sha }}-${{ env.RELEASE_ENVIRONMENT }}-arm64-v8a
          path: dist/arm64-v8a
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload legacy ARM APK (armeabi-v7a)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cocoonmate-${{ env.RELEASE_NAME }}-${{ github.sha }}-${{ env.RELEASE_ENVIRONMENT }}-armeabi-v7a
          path: dist/armeabi-v7a
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload emulator APK (x86_64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cocoonmate-${{ env.RELEASE_NAME }}-${{ github.sha }}-${{ env.RELEASE_ENVIRONMENT }}-x86_64
          path: dist/x86_64
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
