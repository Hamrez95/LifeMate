name: Agent format health record task 1
on:
  push:
    branches:
      - feat/health-record-caregiver-doc-access-20260907
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/health-record-caregiver-doc-access-20260907
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Format changed Edge files
        run: |
          deno fmt \
            supabase/functions/lifemate-api/health_document_sharing.ts \
            supabase/functions/lifemate-api/health_documents.ts \
            supabase/functions/lifemate-api/index.ts
          rm .github/workflows/_agent_fmt_health_record_task1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "style(edge): format caregiver document access"
          git push origin HEAD:feat/health-record-caregiver-doc-access-20260907
