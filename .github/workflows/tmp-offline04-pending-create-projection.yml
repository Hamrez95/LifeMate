name: tmp offline04 pending create projection

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-04-pending-treatment-create-projection-20260905
      - name: Apply and guard patch
        run: |
          python3 .tmp-offline04-pending-create-projection.py
          git diff --check
          grep -q "pendingTreatmentCreates" packages/lifemate_client/lib/src/shared_offline_runtime_native.dart
          grep -q "pendingOfflineTreatmentPlanCreates" packages/lifemate_client/lib/src/durable_lifemate_api_client.dart
          grep -q "Protected offline health execution is unavailable on web" packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/lifemate_client/lib/src/shared_offline_runtime_native.dart packages/lifemate_client/lib/src/durable_lifemate_api_client.dart packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart packages/lifemate_client/test/durable_treatment_create_enqueue_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(client): expose pending treatment create projections"
          git push origin HEAD:feat/offline-04-pending-treatment-create-projection-20260905
