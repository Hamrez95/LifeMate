name: identity-link-token-backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a count-only dry run or apply the reviewed token backfill
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: For apply mode type BACKFILL-IDENTITY-TOKENS
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-identity-link-token-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: beta
    env:
      LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_IDENTITY_LINK_KEY: ${{ secrets.LIFEMATE_IDENTITY_LINK_KEY }}
      LIFEMATE_IDENTITY_LINK_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_LINK_KEY_VERSION }}
      LIFEMATE_IDENTITY_LINK_BACKFILL_MODE: ${{ inputs.mode }}
      LIFEMATE_IDENTITY_LINK_BACKFILL_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          case "$LIFEMATE_IDENTITY_LINK_BACKFILL_MODE" in
            dry-run)
              ;;
            apply)
              test "$LIFEMATE_IDENTITY_LINK_BACKFILL_CONFIRM" = 'BACKFILL-IDENTITY-TOKENS'
              ;;
            *)
              echo '::error::Invalid identity-link backfill mode.'
              exit 1
              ;;
          esac
          test -n "$LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL"
          test "${#LIFEMATE_IDENTITY_LINK_KEY}" -ge 32
          [[ "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" -ge 1
          test "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" -le 65535

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify backfill source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check \
            tools/security/identity-link-token-backfill.ts \
            supabase/functions/lifemate-api/identity_link_token.ts
          deno check tools/security/identity-link-token-backfill.ts

      - name: Execute identity-link token backfill
        id: backfill
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/identity-link-token-backfill-summary.json"
          deno run \
            --allow-env=LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL,LIFEMATE_IDENTITY_LINK_KEY,LIFEMATE_IDENTITY_LINK_KEY_VERSION,LIFEMATE_IDENTITY_LINK_BACKFILL_MODE,LIFEMATE_IDENTITY_LINK_BACKFILL_CONFIRM \
            --allow-net \
            tools/security/identity-link-token-backfill.ts \
            > "$summary_file"

          jq -e \
            --arg mode "$LIFEMATE_IDENTITY_LINK_BACKFILL_MODE" \
            '.mode == $mode and (.canonicalAccounts | type == "number") and (.providerIdentities | type == "number") and (.plannedTokens | type == "number") and (.insertedOrRefreshed | type == "number")' \
            "$summary_file" >/dev/null

          canonical_accounts="$(jq -r '.canonicalAccounts' "$summary_file")"
          provider_identities="$(jq -r '.providerIdentities' "$summary_file")"
          planned_tokens="$(jq -r '.plannedTokens' "$summary_file")"
          inserted_or_refreshed="$(jq -r '.insertedOrRefreshed' "$summary_file")"
          {
            echo '## Identity-link token backfill'
            echo ''
            echo "- mode: $LIFEMATE_IDENTITY_LINK_BACKFILL_MODE"
            echo "- key version: $LIFEMATE_IDENTITY_LINK_KEY_VERSION"
            echo "- canonical Accounts inspected: $canonical_accounts"
            echo "- provider identities inspected: $provider_identities"
            echo "- opaque tokens planned: $planned_tokens"
            echo "- opaque tokens inserted/refreshed: $inserted_or_refreshed"
            echo '- raw provider subjects, token values, database URLs and key material are intentionally omitted'
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f "$summary_file"
