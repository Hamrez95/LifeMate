name: migration-idempotency-diagnostic

on:
  pull_request:
    paths:
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - '.github/workflows/migration-idempotency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_schema_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_schema_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_schema_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Apply portable bootstrap and canonical migrations
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql >/dev/null
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql >/dev/null
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration" >/dev/null
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Diagnose all non-idempotent migrations
        id: rerun
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/migration-idempotency-report.txt"
          : > "$report"
          failed=0
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql >/dev/null 2>&1 || true
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql >/dev/null 2>&1 || true
          while IFS= read -r migration; do
            stderr="$RUNNER_TEMP/migration-rerun.stderr"
            : > "$stderr"
            if ! psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration" >/dev/null 2>"$stderr"; then
              {
                echo "migration=$migration"
                echo "--- stderr ---"
                cat "$stderr"
                echo "--- end ---"
              } | tee -a "$report"
              failed=1
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "all migrations reran successfully" | tee "$report"

      - name: Upload idempotency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-idempotency-diagnostics
          path: ${{ runner.temp }}/migration-idempotency-report.txt
          if-no-files-found: error
          retention-days: 1
