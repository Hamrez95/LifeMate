# One-shot workflow. It removes itself after a verified build.
name: wellmate-feedback-hotfix

on:
  push:
    branches:
      - feat/bb287-parity-completion
    paths:
      - tools/hotfix/apply_wellmate_feedback_hotfix.py
      - .github/workflows/wellmate-feedback-hotfix.yml

permissions:
  contents: write

concurrency:
  group: wellmate-feedback-hotfix
  cancel-in-progress: false

env:
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api-candidate
  ENABLE_GOOGLE_AUTH: 'false'
  RELEASE_NAME: 0.9.0-internal.2

jobs:
  apply-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/bb287-parity-completion
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply physical-QA feedback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hotfix/apply_wellmate_feedback_hotfix.py
          rm -f tools/hotfix/apply_wellmate_feedback_hotfix.py
          rm -f .github/workflows/wellmate-feedback-hotfix.yml
          dart format \
            wellmate/lib/core/utils/persian_date_utils.dart \
            wellmate/lib/screens/treatments/add_treatment_screen.dart \
            wellmate/lib/screens/treatments/care_plan_hub_screen.dart \
            wellmate/lib/screens/calendar/calendar_screen.dart \
            wellmate/lib/screens/calendar/custom_table_calendar.dart \
            wellmate/lib/screens/home/home_screen.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            packages/lifemate_client/lib/src/session_gate_secure.dart \
            wellmate/test/add_treatment_accessibility_test.dart

      - name: Generate branded launcher icons
        shell: bash
        run: |
          set -euo pipefail
          (cd wellmate && flutter pub get && dart run flutter_launcher_icons)
          (cd caremate && flutter pub get && dart run flutter_launcher_icons)
          test -f wellmate/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f caremate/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Verify shared client and both apps
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/lifemate_client && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd wellmate && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd caremate && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)

      - name: Verify internal signup is immediately confirmed
        shell: bash
        run: |
          set -euo pipefail
          email="lifemate-feedback-${GITHUB_RUN_ID}@example.com"
          password="$(openssl rand -base64 24 | tr -d '\n')Aa1!"
          body="$(jq -cn --arg email "$email" --arg password "$password" '{email:$email,password:$password,data:{display_name:"Feedback QA"}}')"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$body" \
            "$SUPABASE_URL/auth/v1/signup")"
          echo "$response" | jq -e '.access_token and .user.id and .user.email_confirmed_at' >/dev/null
          echo "$email" > /tmp/lifemate-feedback-signup-email.txt
          jq -n --arg email "$email" '{status:"passed",email:$email,confirmationRequired:false}' \
            > /tmp/lifemate-feedback-signup-smoke.json

      - name: Build feedback APKs
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --release
            --build-name="$RELEASE_NAME"
            --build-number="$GITHUB_RUN_NUMBER"
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_GOOGLE_AUTH=$ENABLE_GOOGLE_AUTH"
          )
          (cd wellmate && flutter build apk "${args[@]}")
          (cd caremate && flutter build apk "${args[@]}")

      - name: Commit verified source and generated icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply WellMate physical QA feedback'
          git push origin HEAD:feat/bb287-parity-completion
          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Inspect and package feedback bundle
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          test -x "$apksigner_bin"
          short_sha="${NEW_SHA:0:8}"
          mkdir -p dist/inspection
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk \
            "dist/WellMate-$RELEASE_NAME-$short_sha-feedback.apk"
          cp caremate/build/app/outputs/flutter-apk/app-release.apk \
            "dist/CareMate-$RELEASE_NAME-$short_sha-feedback.apk"
          for app in WellMate CareMate; do
            apk="$(find dist -maxdepth 1 -name "$app-*.apk" -print -quit)"
            "$aapt_bin" dump badging "$apk" > "dist/inspection/$app.txt"
            "$aapt_bin" dump permissions "$apk" >> "dist/inspection/$app.txt"
            "$apksigner_bin" verify --verbose --print-certs "$apk" >> "dist/inspection/$app.txt"
            grep -Eq '^application-icon-[0-9]+:' "dist/inspection/$app.txt"
          done
          cp /tmp/lifemate-feedback-signup-smoke.json dist/signup-smoke.json
          sha256sum dist/*.apk > dist/apk-sha256.txt
          wellmate_sha="$(sha256sum dist/WellMate-*.apk | awk '{print $1}')"
          caremate_sha="$(sha256sum dist/CareMate-*.apk | awk '{print $1}')"
          jq -n \
            --arg release "$RELEASE_NAME" \
            --arg commit "$NEW_SHA" \
            --arg wellmateSha "$wellmate_sha" \
            --arg caremateSha "$caremate_sha" \
            '{releaseName:$release,commit:$commit,channel:"internal/unstable-feedback",backend:"lifemate-api-candidate",features:{singlePageTreatment:true,persianJalaliCalendar:true,persianDigits:true,homeCareEvents:true,automaticCalendarRefresh:true,emailConfirmationRequired:false,brandedLauncherIcons:true},apps:{wellmate:{sha256:$wellmateSha},caremate:{sha256:$caremateSha}},knownLimitations:["Physical Android re-test is still required","Not a stable or store release","Do not use real patient health data"]}' \
            > dist/release-manifest.json

      - name: Upload feedback bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemate-${{ env.RELEASE_NAME }}-${{ env.NEW_SHA }}-feedback
          path: dist
          if-no-files-found: error
          retention-days: 30
