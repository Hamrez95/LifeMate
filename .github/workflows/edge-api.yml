name: edge-api

on:
  pull_request:
    paths:
      - '.github/workflows/edge-api.yml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  postgres-role-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: supabase/functions/lifemate-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply canonical portable schema
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Capture and report sanitized database integration failure
        shell: bash
        run: |
          set +e
          deno test --no-check --allow-env --allow-net=localhost:5432,127.0.0.1:5432 database_integration_test.ts > /tmp/db-test.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          {
            echo 'Temporary diagnostic output from `database_integration_test.ts` on the #919 reconciled head:'
            echo
            echo '```text'
            tail -n 120 /tmp/db-test.log \
              | sed -E 's#postgres://[^ ]+#postgres://[redacted]#g' \
              | sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[uuid]/g'
            echo '```'
          } > /tmp/comment.md
          gh pr comment 930 --repo Hamrez95/LifeMate --body-file /tmp/comment.md
          exit "$code"
