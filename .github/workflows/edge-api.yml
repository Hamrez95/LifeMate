name: edge-api

on:
  pull_request:
    paths:
      - '.github/workflows/edge-api.yml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  postgres-role-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: supabase/functions/lifemate-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply canonical portable schema
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Evaluate exact normalized recurrence against constraint predicate
        shell: bash
        run: |
          cat > diag_predicate.ts <<'DENO'
          import postgres from "postgres";
          import { normalizeRecurrenceRule } from "./recurrence_schedule.ts";
          const url = Deno.env.get("TEST_DATABASE_URL")!;
          const sql = postgres(url, { max: 1, prepare: false });
          const rule = normalizeRecurrenceRule({ enabled: true, unit: "month", interval: 6, weekdays: [] });
          const recurrenceJson = rule == null ? null : JSON.stringify(rule);
          const rows = await sql`
            select
              ${recurrenceJson}::jsonb as value,
              jsonb_typeof(${recurrenceJson}::jsonb) as json_type,
              (${recurrenceJson}::jsonb @> '{"enabled":true}'::jsonb) as enabled_ok,
              ((${recurrenceJson}::jsonb->>'version')::integer between 1 and 1000) as version_ok,
              ((${recurrenceJson}::jsonb->>'unit') in ('hour','day','week','month','year')) as unit_ok,
              ((${recurrenceJson}::jsonb->>'interval')::integer between 1 and 8760) as interval_ok,
              (not (${recurrenceJson}::jsonb ? 'maxOccurrences') or ((${recurrenceJson}::jsonb->>'maxOccurrences')::integer between 1 and 10000)) as max_ok,
              (jsonb_typeof(${recurrenceJson}::jsonb)='object'
                and ${recurrenceJson}::jsonb @> '{"enabled":true}'::jsonb
                and ((${recurrenceJson}::jsonb->>'version')::integer between 1 and 1000)
                and ((${recurrenceJson}::jsonb->>'unit') in ('hour','day','week','month','year'))
                and ((${recurrenceJson}::jsonb->>'interval')::integer between 1 and 8760)
                and (not (${recurrenceJson}::jsonb ? 'maxOccurrences') or ((${recurrenceJson}::jsonb->>'maxOccurrences')::integer between 1 and 10000))) as full_ok
          `;
          console.log("RULE", recurrenceJson);
          console.log("EVAL", JSON.stringify(rows[0]));
          await sql.end({ timeout: 1 });
          DENO
          deno run --allow-env --allow-net=localhost:5432,127.0.0.1:5432 diag_predicate.ts > /tmp/diag.log 2>&1
          {
            echo 'Exact normalized recurrence predicate diagnostic:'
            echo
            echo '```text'
            grep -E '^(RULE|EVAL)' /tmp/diag.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 930 --repo Hamrez95/LifeMate --body-file /tmp/comment.md
