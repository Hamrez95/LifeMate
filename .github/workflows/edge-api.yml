name: edge-api

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/migrations/**'
      - 'backend-dotnet/src/LifeMate.Infrastructure/Persistence/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/edge-api.yml'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/migrations/**'
      - 'backend-dotnet/src/LifeMate.Infrastructure/Persistence/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/edge-api.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: edge-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: supabase/functions/lifemate-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Format
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Unit tests
        run: deno task test

      - name: Security and privacy invariants
        shell: bash
        run: |
          set -euo pipefail

          check() {
            local label="$1"
            shift
            if "$@"; then
              echo "PASS: $label"
            else
              echo "::error::$label"
              exit 1
            fi
          }

          check_absent() {
            local label="$1"
            shift
            if "$@"; then
              echo "::error::$label"
              exit 1
            else
              echo "PASS: $label"
            fi
          }

          check_absent \
            'Service-role environment access is forbidden.' \
            grep -R --line-number -F 'SUPABASE_SERVICE_ROLE_KEY' .
          check 'Runtime configuration reads secrets from Vault.' \
            grep -Fq 'vault.decrypted_secrets' runtime_config.ts
          check 'Contact secret length is validated.' \
            grep -Fq 'value.length >= 32' runtime_config.ts
          check 'Contact secret cannot reuse the service-role value.' \
            grep -Fq 'value !== serviceRole' runtime_config.ts
          check_absent \
            'Generic default secrets must not be selected.' \
            grep -Fq 'sources.defaultSecret' runtime_config.ts

          check 'Care-event access fails closed.' \
            grep -Fq 'care_access_denied' care_events.ts
          check 'Overdue care events expose an effective status.' \
            grep -Fq 'effective_status' care_events.ts
          check 'Patient reminder lead time is persisted.' \
            grep -Fq 'patientReminderMinutesBefore' care_events.ts
          check 'Caregiver reminder lead time is persisted.' \
            grep -Fq 'caregiverReminderMinutesBefore' care_events.ts

          check 'Profile avatar keys remain allow-listed.' \
            grep -Fq 'invalid_avatar_key' profile.ts
          check 'Profile audit writes use redacted metadata.' \
            grep -Fq 'metadata_json' profile.ts
          check 'Profile-photo bucket is private.' \
            grep -Fq 'public: false' profile_photo.ts
          check 'Profile-photo file signatures are validated.' \
            grep -Fq 'validateProfilePhoto' profile_photo.ts
          check 'Profile-photo size is bounded.' \
            grep -Fq 'profilePhotoMaximumBytes' profile_photo.ts
          check 'Spoofed and oversized photo tests are present.' \
            grep -Fq 'profile_photo_too_large' profile_photo_test.ts
          check 'Caregiver calendar responses exclude private notes.' \
            grep -Fq 'privateNotes' women_calendar_integration_test.ts

          check 'Reminder lead-time migration is included.' \
            grep -Fq 'patient_reminder_minutes_before' \
              ../../migrations/20260805013000_add_reminder_lead_times.sql
          check 'Private profile-photo path migration is included.' \
            grep -Fq 'profile_photo_path character varying(512)' \
              ../../migrations/20260805023000_add_profile_photo_path.sql
          check 'Private women check-in migration is included.' \
            grep -Fq 'daily_private_note character varying(500)' \
              ../../migrations/20260805224500_add_women_calendar_daily_checkin.sql
          check_absent \
            'Profile photos must never use a public bucket.' \
            grep -R --line-number -E 'profile-photo.*public.*true' \
              . ../../migrations
          check_absent \
            'Profile-photo paths must not enter audit metadata.' \
            grep -R --line-number -E 'profilePhotoPath.*metadata' .

  postgres-role-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__LifeMateDb: Host=localhost;Port=5432;Database=lifemate_edge_tests;Username=postgres;Password=postgres
      Security__Invitations__ContactPepper: integration-only-invitation-contact-pepper-32-bytes-minimum
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Restore and build canonical schema source
        run: |
          set -euo pipefail
          dotnet restore backend-dotnet/LifeMate.sln --verbosity minimal
          dotnet tool restore
          dotnet build backend-dotnet/LifeMate.sln --configuration Release --no-restore

      - name: Apply canonical and additive schemas
        run: |
          set -euo pipefail
          dotnet ef database update \
            --configuration Release \
            --no-build \
            --project backend-dotnet/src/LifeMate.Infrastructure \
            --startup-project backend-dotnet/src/LifeMate.Api
          for migration in \
            supabase/migrations/20260803173000_add_consent_scoped_care_events.sql \
            supabase/migrations/20260804002000_lock_down_public_health_status.sql \
            supabase/migrations/20260804003000_add_user_profile_version.sql \
            supabase/migrations/20260804130000_add_women_calendar_pilot.sql \
            supabase/migrations/20260804213000_add_profile_avatar_key.sql \
            supabase/migrations/20260805013000_add_reminder_lead_times.sql \
            supabase/migrations/20260805023000_add_profile_photo_path.sql \
            supabase/migrations/20260805224500_add_women_calendar_daily_checkin.sql
          do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done

      - name: Run patient caregiver privacy and cleanup journeys
        working-directory: supabase/functions/lifemate-api
        run: deno task test:integration
