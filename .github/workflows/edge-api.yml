name: edge-api

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-api/**'
      - '.github/workflows/edge-api.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/lifemate-api/**'
      - '.github/workflows/edge-api.yml'
      - 'AGENTS.md'

permissions:
  contents: write

concurrency:
  group: edge-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/lifemate-api
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno environment
        run: deno --version

      - name: Apply deterministic formatting
        id: format
        shell: bash
        run: |
          set -euo pipefail
          deno fmt
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatting to internal PR branch
        if: >-
          ${{
            steps.format.outputs.changed == 'true' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-api
          git commit -m 'style(edge-api): apply deno fmt'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Type check
        run: deno task check

      - name: Unit tests
        run: deno task test

      - name: Security invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number 'SUPABASE_SERVICE_ROLE_KEY' .
          test "$(grep -R --include='*.ts' -l 'postgres(databaseUrl' . | wc -l)" -eq 1
          grep -q 'actor_user_id = \${userId}' database.ts
          grep -q 'client_request_id = \${clientRequestId}' database.ts

      - name: Enforce clean formatting
        working-directory: .
        shell: bash
        run: git diff --exit-code
