name: restore-edge-api-workflow

on:
  pull_request:
    paths:
      - '.github/workflows/edge-api.yml'

permissions:
  contents: write

concurrency:
  group: restore-edge-api-workflow
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/bb287-parity-completion
          fetch-depth: 0

      - name: Restore reviewed permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/Hamrez95/LifeMate/94f36e7bcdfa9c46f200ad2d23612ab056b88b2b/.github/workflows/edge-api.yml \
            --output .github/workflows/edge-api.yml
          grep -q 'contents: read' .github/workflows/edge-api.yml
          grep -q 'postgres-role-journey' .github/workflows/edge-api.yml
          ! grep -q 'one-shot' .github/workflows/edge-api.yml
          git diff --check

      - name: Commit restored workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/edge-api.yml
          git commit -m 'chore(ci): restore permanent Edge verification workflow'
          git push origin HEAD:feat/bb287-parity-completion
