name: edge-api

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-api/**'
      - '.github/workflows/edge-api.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/lifemate-api/**'
      - '.github/workflows/edge-api.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: edge-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/lifemate-api
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno environment
        run: deno --version

      - name: Format sources
        id: format
        shell: bash
        run: |
          set -euo pipefail
          deno fmt
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload formatted sources
        if: ${{ steps.format.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: edge-api-formatted-sources
          path: supabase/functions/lifemate-api
          if-no-files-found: error
          retention-days: 1

      - name: Type check
        run: deno task check

      - name: Unit tests
        run: deno task test

      - name: Security invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number 'SUPABASE_SERVICE_ROLE_KEY' .
          test "$(grep -R --include='*.ts' -l 'postgres(databaseUrl' . | wc -l)" -eq 1
          grep -q 'actor_user_id = \${userId}' database.ts
          grep -q 'client_request_id = \${clientRequestId}' database.ts

      - name: Enforce committed formatting
        shell: bash
        run: test '${{ steps.format.outputs.changed }}' = 'false'
