name: edge-api-auth-pairing-patch

on:
  pull_request:
    paths:
      - '.github/workflows/edge-api.yml'
      - '.github/workflows/one-shot-auth-pairing.yml'

permissions:
  contents: write

concurrency:
  group: edge-api-auth-pairing-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/bb287-parity-completion
          fetch-depth: 0

      - name: Execute reviewed staged patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-auth-pairing.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Staged patch markers were not found.')
          raw = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw.splitlines()
          )
          exec(compile(script, 'auth_pairing_patch.py', 'exec'))
          PY
          git diff --check
          grep -q 'auth-google' packages/lifemate_client/lib/src/session_gate.dart
          grep -q 'createQrInvitation' supabase/functions/lifemate-api/database.ts
          grep -q 'CareInvitationScannerScreen' caremate/lib/screens/dashboard_screen.dart

      - name: Commit integrated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Google sign-in and QR caregiver pairing'
          git push origin HEAD:feat/bb287-parity-completion
