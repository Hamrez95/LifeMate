name: edge-api-auth-pairing-patch

on:
  pull_request:
    paths:
      - '.github/workflows/edge-api.yml'
      - 'tools/maintenance/auth_pairing_patch.py'

permissions:
  contents: write

concurrency:
  group: edge-api-auth-pairing-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/bb287-parity-completion
          fetch-depth: 0

      - name: Execute deterministic source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maintenance/auth_pairing_patch.py
          git diff --check
          grep -q 'auth-google' packages/lifemate_client/lib/src/session_gate.dart
          grep -q 'createQrInvitation' supabase/functions/lifemate-api/database.ts
          grep -q 'CareInvitationScannerScreen' caremate/lib/screens/dashboard_screen.dart

      - name: Commit integrated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Google sign-in and QR caregiver pairing'
          git push origin HEAD:feat/bb287-parity-completion
