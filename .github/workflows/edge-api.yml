name: edge-api

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-api/**'
      - '.github/workflows/edge-api.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/lifemate-api/**'
      - '.github/workflows/edge-api.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: edge-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/lifemate-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Deno environment
        run: deno --version

      - name: Format
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Unit tests
        run: deno task test

      - name: Security invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number 'SUPABASE_SERVICE_ROLE_KEY' .
          test "$(grep -R --include='*.ts' -l 'postgres(databaseUrl' . | wc -l)" -eq 1
          grep -q 'actor_user_id = \${userId}' database.ts
          grep -q 'client_request_id = \${clientRequestId}' database.ts
          grep -q 'contactHashingSecret.length < 32' index.ts
