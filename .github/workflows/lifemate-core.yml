name: lifemate-core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/lifemate_core/**'
      - 'docs/architecture/offline-first-local-health-store.md'
      - '.github/workflows/lifemate-core.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'packages/lifemate_core/**'
      - 'docs/architecture/offline-first-local-health-store.md'
      - '.github/workflows/lifemate-core.yml'
      - 'AGENTS.md'

permissions:
  contents: write

concurrency:
  group: lifemate-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Reconcile known formatter and analyzer fixes
        working-directory: packages/lifemate_core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/src/local_health_store.dart')
          text = source.read_text()
          text = text.replace(
              "import 'package:crypto/crypto.dart';",
              "import 'package:crypto/crypto.dart' as crypto;",
          )
          text = text.replace(
              'final hmac = Hmac(sha256, _keyBytes);',
              'final hmac = crypto.Hmac(crypto.sha256, _keyBytes);',
          )
          text = text.replace('database.dispose();', 'database.close();')
          text = text.replace('_database.dispose();', '_database.close();')
          source.write_text(text)

          tests = Path('test/local_health_store_test.dart')
          tests.write_text(tests.read_text().replace('database.dispose();', 'database.close();'))
          PY
          flutter pub get
          dart format lib test

      - name: Upload reconciled sources
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-core-reconciled-sources
          path: |
            packages/lifemate_core/lib/
            packages/lifemate_core/test/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Analyze and test reconciled shared core
        working-directory: packages/lifemate_core
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit reconciled source after green validation
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/lifemate_core/lib packages/lifemate_core/test; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_core/lib packages/lifemate_core/test
          git commit -m 'fix(offline): reconcile local core formatting and analyzer'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
