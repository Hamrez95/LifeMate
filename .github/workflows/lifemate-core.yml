name: lifemate-core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/lifemate_core/**'
      - 'docs/architecture/offline-first-local-health-store.md'
      - '.github/workflows/lifemate-core.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'packages/lifemate_core/**'
      - 'docs/architecture/offline-first-local-health-store.md'
      - '.github/workflows/lifemate-core.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: lifemate-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Resolve and format shared core for reconciliation
        working-directory: packages/lifemate_core
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test

      - name: Upload formatted reconciliation sources
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-core-formatted-sources
          path: |
            packages/lifemate_core/lib/
            packages/lifemate_core/test/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Analyze and test shared core
        working-directory: packages/lifemate_core
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          git diff --exit-code -- lib test
