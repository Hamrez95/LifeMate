name: lifemate-core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/lifemate_core/**'
      - 'docs/architecture/offline-first-local-health-store.md'
      - '.github/workflows/lifemate-core.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'packages/lifemate_core/**'
      - 'docs/architecture/offline-first-local-health-store.md'
      - '.github/workflows/lifemate-core.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: lifemate-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Resolve, inspect formatting, analyze and test shared core
        working-directory: packages/lifemate_core
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          git diff -- lib test | tee /tmp/lifemate-core-format.diff
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          test ! -s /tmp/lifemate-core-format.diff
