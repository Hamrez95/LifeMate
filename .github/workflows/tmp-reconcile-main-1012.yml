name: tmp-reconcile-main-1012

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-reconcile-main-1012.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-833-women-confirmed-daily-log-cache-20260906
          fetch-depth: 0
      - name: Merge exact current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feat/offline-833-women-confirmed-daily-log-cache-20260906
