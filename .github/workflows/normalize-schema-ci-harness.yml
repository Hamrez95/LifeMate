name: normalize-schema-ci-harness

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'ci/edge-api-format-baseline-20260904' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/edge-api-format-baseline-20260904
          show-progress: false

      - name: Normalize vanilla PostgreSQL schema consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          fixture = 'supabase/bootstrap/test_provider_compatibility_roles.sql'
          baseline = 'supabase/bootstrap/legacy_lifemate_baseline.sql'
          changed = []

          multiline = re.compile(
              r'(?P<indent>^[ \t]*)psql (?P<url>"\$[A-Z0-9_]+") --set=ON_ERROR_STOP=1 \\\n'
              r'(?P<subindent>[ \t]*)--file=' + re.escape(baseline),
              re.MULTILINE,
          )
          singleline = re.compile(
              r'(?P<indent>^[ \t]*)psql (?P<url>"\$[A-Z0-9_]+") --set=ON_ERROR_STOP=1 --file='
              + re.escape(baseline)
              + r'(?P<suffix>[^\n]*)$',
              re.MULTILINE,
          )

          for path in sorted(root.glob('*.yml')):
              if path.name == 'normalize-schema-ci-harness.yml':
                  continue
              text = path.read_text()
              if baseline not in text or fixture in text:
                  continue

              original = text

              def replace_multiline(match):
                  indent = match.group('indent')
                  url = match.group('url')
                  subindent = match.group('subindent')
                  return (
                      f'{indent}psql {url} --set=ON_ERROR_STOP=1 \\\n'
                      f'{subindent}--file={fixture}\n'
                      f'{indent}psql {url} --set=ON_ERROR_STOP=1 \\\n'
                      f'{subindent}--file={baseline}'
                  )

              text = multiline.sub(replace_multiline, text)

              def replace_singleline(match):
                  indent = match.group('indent')
                  url = match.group('url')
                  suffix = match.group('suffix')
                  return (
                      f'{indent}psql {url} --set=ON_ERROR_STOP=1 --file={fixture}{suffix}\n'
                      f'{indent}psql {url} --set=ON_ERROR_STOP=1 --file={baseline}{suffix}'
                  )

              text = singleline.sub(replace_singleline, text)
              if text == original:
                  raise SystemExit(f'Could not normalize schema application block in {path}')
              path.write_text(text)
              changed.append(str(path))

          if not changed:
              raise SystemExit('No schema-consuming workflows required normalization')
          print('\n'.join(changed))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git diff --cached --check
          git commit -m 'fix(ci): provision provider compatibility roles in schema consumers'
          git push origin HEAD:ci/edge-api-format-baseline-20260904
