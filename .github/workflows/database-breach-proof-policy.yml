name: database-breach-proof-policy

on:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-api/database_only_breach_proof_integration_test.ts'
      - 'supabase/functions/lifemate-api/deno.json'
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - 'tools/security/verify-database-breach-proof.mjs'
      - 'docs/security/IDENTITY_MEDICAL_LINKAGE_THREAT_MODEL.md'
      - '.github/workflows/database-breach-proof-policy.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/lifemate-api/database_only_breach_proof_integration_test.ts'
      - 'supabase/functions/lifemate-api/deno.json'
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - 'tools/security/verify-database-breach-proof.mjs'
      - 'docs/security/IDENTITY_MEDICAL_LINKAGE_THREAT_MODEL.md'
      - '.github/workflows/database-breach-proof-policy.yml'

permissions:
  contents: read

concurrency:
  group: database-breach-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-dump-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_database_breach_proof
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_database_breach_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_database_breach_proof
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Freeze database-only breach proof boundary
        run: node tools/security/verify-database-breach-proof.mjs

      - name: Format and type-check synthetic proof
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check \
            supabase/functions/lifemate-api/database_only_breach_proof_integration_test.ts
          cd supabase/functions/lifemate-api
          deno check database_only_breach_proof_integration_test.ts

      - name: Apply canonical portable schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Pin pg_dump client to PostgreSQL 17.6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/db-proof-bin"
          cat > "$RUNNER_TEMP/db-proof-bin/pg_dump" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host postgres:17.6-alpine pg_dump "$@"
          SCRIPT
          chmod 0755 "$RUNNER_TEMP/db-proof-bin/pg_dump"
          echo "$RUNNER_TEMP/db-proof-bin" >> "$GITHUB_PATH"

      - name: Prove synthetic post-retirement database separation
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-api
          deno test --no-check \
            --allow-env \
            --allow-net=localhost:5432,127.0.0.1:5432 \
            --allow-run=pg_dump \
            database_only_breach_proof_integration_test.ts
