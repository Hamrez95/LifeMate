name: edge-api-format-baseline-once

on:
  push:
    branches:
      - ci/edge-api-format-baseline-20260904

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Canonical-format edge API baselines
        run: |
          set -euo pipefail
          deno fmt supabase/functions/lifemate-api supabase/functions/lifemate-care-management
          rm .github/workflows/edge-api-format-baseline-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-api supabase/functions/lifemate-care-management .github/workflows/edge-api-format-baseline-once.yml
          if git diff --cached --quiet; then
            echo 'No formatter drift found.'
            exit 0
          fi
          git commit -m 'style(ci): canonical-format edge API baselines'
          git push origin HEAD:ci/edge-api-format-baseline-20260904
