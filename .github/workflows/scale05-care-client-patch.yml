name: scale05-care-client-patch

on:
  push:
    branches: ['perf/scale-05-idempotency-retry']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-05-idempotency-retry
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Add stable keys and bounded retries
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/lifemate_client/lib/src/lifemate_care_management_api.dart')
          text = path.read_text()

          def once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          once("import 'dart:convert';\n", "import 'dart:convert';\nimport 'dart:math';\n", 'math import')
          once(
              '  final http.Client _http;\n\n  /// Resolves',
              '  final http.Client _http;\n  final Map<String, String> _pendingMutationKeys = <String, String>{};\n\n  /// Resolves',
              'pending keys',
          )
          once(
              '  static const _timeout = Duration(seconds: 20);\n',
              '  static const _timeout = Duration(seconds: 20);\n'
              '  static const _retryBudget = Duration(seconds: 30);\n'
              '  static const _retryBaseDelay = Duration(milliseconds: 250);\n'
              '  static const _retryMaxDelay = Duration(seconds: 2);\n'
              '  static const _transientStatusCodes = <int>{502, 503, 504};\n'
              '  static final Random _retryRandom = Random.secure();\n',
              'retry constants',
          )
          once(
              "        'caregiverReminderMinutesBefore': caregiverReminderMinutesBefore,\n      },\n    ),\n  );\n\n  Future<Map<String, dynamic>> updateCareEvent({",
              "        'caregiverReminderMinutesBefore': caregiverReminderMinutesBefore,\n      },\n      idempotencyKey: clientRequestId,\n    ),\n  );\n\n  Future<Map<String, dynamic>> updateCareEvent({",
              'care event explicit key',
          )

          start = text.index('  Future<dynamic> _request(\n')
          end = text.index('  Uri _resolve(String path)', start)
          replacement = r'''  Future<dynamic> _request(
            String method,
            String path, {
            Map<String, dynamic>? body,
            String? idempotencyKey,
          }) async {
            final token = _accessToken();
            if (token == null || token.isEmpty) {
              throw const LifeMateApiException(
                statusCode: 401,
                code: 'session_missing',
                message: 'Authentication session is missing.',
              );
            }
            final uri = _resolve(path);
            final encodedBody = body == null ? null : jsonEncode(body);
            final isMutation =
                method == 'POST' || method == 'PATCH' || method == 'DELETE';
            final fingerprint = isMutation
                ? '$method ${uri.toString()}\n${encodedBody ?? ''}'
                : null;
            final generatedKey = isMutation && idempotencyKey == null;
            final mutationKey = !isMutation
                ? null
                : idempotencyKey ??
                      _pendingMutationKeys.putIfAbsent(
                        fingerprint!,
                        LifeMateApiClient.createClientRequestId,
                      );
            final headers = <String, String>{
              'Accept': 'application/json',
              'Authorization': 'Bearer $token',
              if (body != null) 'Content-Type': 'application/json',
              if (mutationKey != null) 'Idempotency-Key': mutationKey,
            };
            final budget = Stopwatch()..start();
            const maxAttempts = 3;

            for (var attempt = 1; attempt <= maxAttempts; attempt += 1) {
              final remainingMilliseconds =
                  _retryBudget.inMilliseconds - budget.elapsedMilliseconds;
              if (remainingMilliseconds <= 0) {
                throw const LifeMateApiException(
                  statusCode: 0,
                  code: 'retry_budget_exhausted',
                  message: 'LifeMate care management retry budget was exhausted.',
                );
              }
              final attemptTimeout = Duration(
                milliseconds: min(_timeout.inMilliseconds, remainingMilliseconds),
              );

              late final http.Response response;
              try {
                response = switch (method) {
                  'GET' => await _http.get(uri, headers: headers).timeout(attemptTimeout),
                  'POST' => await _http
                      .post(uri, headers: headers, body: encodedBody)
                      .timeout(attemptTimeout),
                  'PATCH' => await _http
                      .patch(uri, headers: headers, body: encodedBody)
                      .timeout(attemptTimeout),
                  'DELETE' => await _http
                      .delete(uri, headers: headers, body: encodedBody)
                      .timeout(attemptTimeout),
                  _ => throw ArgumentError.value(method, 'method'),
                };
              } on TimeoutException {
                if (attempt < maxAttempts && await _waitBeforeRetry(attempt, budget)) {
                  continue;
                }
                throw const LifeMateApiException(
                  statusCode: 0,
                  code: 'network_timeout',
                  message: 'LifeMate care management request timed out.',
                );
              } on http.ClientException {
                if (attempt < maxAttempts && await _waitBeforeRetry(attempt, budget)) {
                  continue;
                }
                throw const LifeMateApiException(
                  statusCode: 0,
                  code: 'network_unavailable',
                  message: 'LifeMate care management service is unavailable.',
                );
              }

              final retryResponse = _shouldRetryResponse(response);
              if (attempt < maxAttempts &&
                  retryResponse &&
                  await _waitBeforeRetry(attempt, budget, response: response)) {
                continue;
              }

              try {
                final decoded = _decode(response);
                if (generatedKey) _pendingMutationKeys.remove(fingerprint);
                return decoded;
              } on LifeMateApiException {
                if (generatedKey && !retryResponse) {
                  _pendingMutationKeys.remove(fingerprint);
                }
                rethrow;
              }
            }

            throw StateError('LifeMate care management retry loop exited unexpectedly.');
          }

          Future<bool> _waitBeforeRetry(
            int attempt,
            Stopwatch budget, {
            http.Response? response,
          }) async {
            var delay = _retryDelayForAttempt(attempt);
            final retryAfter = response == null
                ? null
                : int.tryParse(response.headers['retry-after'] ?? '');
            if (retryAfter != null && retryAfter > 0) {
              final serverDelay = Duration(seconds: retryAfter);
              if (serverDelay > delay) delay = serverDelay;
            }
            if (budget.elapsedMilliseconds + delay.inMilliseconds >=
                _retryBudget.inMilliseconds) {
              return false;
            }
            await Future<void>.delayed(delay);
            return true;
          }

          Duration _retryDelayForAttempt(int attempt) {
            final exponential =
                _retryBaseDelay.inMilliseconds * (1 << (attempt - 1));
            final jitter = _retryRandom.nextInt(_retryBaseDelay.inMilliseconds + 1);
            return Duration(
              milliseconds: min(
                _retryMaxDelay.inMilliseconds,
                exponential + jitter,
              ),
            );
          }

          bool _shouldRetryResponse(http.Response response) {
            if (_transientStatusCodes.contains(response.statusCode)) return true;
            if (response.statusCode != 409 || response.body.isEmpty) return false;
            try {
              final decoded = jsonDecode(response.body);
              return decoded is Map &&
                  decoded['code']?.toString() == 'idempotency_in_progress';
            } on FormatException {
              return false;
            }
          }

          dynamic _decode(http.Response response) {
            final decoded = response.body.trim().isEmpty
                ? null
                : jsonDecode(response.body);
            if (response.statusCode >= 200 && response.statusCode < 300) {
              return decoded;
            }
            final problem = decoded is Map<String, dynamic>
                ? decoded
                : const <String, dynamic>{};
            throw LifeMateApiException(
              statusCode: response.statusCode,
              code: problem['code']?.toString() ?? 'request_failed',
              message:
                  problem['detail']?.toString() ??
                  problem['message']?.toString() ??
                  'LifeMate care management request failed.',
            );
          }

          void close() {
            _pendingMutationKeys.clear();
            _http.close();
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          test_path = Path('packages/lifemate_client/test/lifemate_care_management_api_test.dart')
          test = test_path.read_text()
          test = test.replace(
              "    expect(request.method, 'PATCH');\n",
              "    expect(request.method, 'PATCH');\n    expect(request.headers['idempotency-key'], isNotEmpty);\n",
              1,
          )
          test = test.replace(
              "      expect(request.method, 'DELETE');\n",
              "      expect(request.method, 'DELETE');\n      expect(request.headers['idempotency-key'], isNotEmpty);\n",
              1,
          )
          marker = "  test('care management base URI preserves candidate environment suffix', () {\n"
          additions = r'''  test('caregiver treatment create retries with one stable idempotency key', () async {
            var attempts = 0;
            final keys = <String?>[];
            final api = LifeMateCareManagementApi(
              baseUri: Uri.parse('https://api.example.test/lifemate-care-management'),
              accessToken: () => 'token',
              httpClient: MockClient((request) async {
                attempts += 1;
                keys.add(request.headers['idempotency-key']);
                if (attempts == 1) {
                  throw http.ClientException('response lost', request.url);
                }
                return http.Response(
                  jsonEncode({'id': 'plan-1', 'version': 1}),
                  201,
                  headers: {'content-type': 'application/json'},
                );
              }),
            );

            final result = await api.createTreatmentPlan(
              patientUserId: '22222222-2222-4222-8222-222222222222',
              medicationName: 'Metformin',
              doseText: '500 mg',
              startDate: DateTime(2026, 8, 14),
              timeZone: 'Asia/Tehran',
              schedules: const [
                {'dayOfWeek': 'friday', 'localTime': '08:00'},
              ],
            );

            expect(attempts, 2);
            expect(keys.first, isNotNull);
            expect(keys[1], keys.first);
            expect(result['id'], 'plan-1');
          });

          test('caregiver care event uses client request id as transport key', () async {
            late http.Request request;
            final api = LifeMateCareManagementApi(
              baseUri: Uri.parse('https://api.example.test/lifemate-care-management'),
              accessToken: () => 'token',
              httpClient: MockClient((incoming) async {
                request = incoming;
                return http.Response(
                  jsonEncode({'id': 'event-1', 'version': 1}),
                  201,
                  headers: {'content-type': 'application/json'},
                );
              }),
            );
            const requestId = '11111111-1111-4111-8111-111111111137';

            await api.createCareEvent(
              patientUserId: '22222222-2222-4222-8222-222222222222',
              clientRequestId: requestId,
              eventType: 'appointment',
              title: 'Checkup',
              scheduledLocalDate: DateTime(2026, 8, 14),
              scheduledLocalTime: '12:00',
              timeZone: 'Asia/Tehran',
            );

            expect(request.headers['idempotency-key'], requestId);
          });

          '''
          if marker not in test:
              raise SystemExit('test insertion marker missing')
          test_path.write_text(test.replace(marker, additions + marker, 1))
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            packages/lifemate_client/lib/src/lifemate_care_management_api.dart \
            packages/lifemate_client/test/lifemate_care_management_api_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_client/lib/src/lifemate_care_management_api.dart \
                  packages/lifemate_client/test/lifemate_care_management_api_test.dart
          git commit -m 'feat(scale): add bounded caregiver-management retries'
          git push origin HEAD:perf/scale-05-idempotency-retry
