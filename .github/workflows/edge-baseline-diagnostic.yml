name: edge-baseline-diagnostic

on:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-admin-api/**'
      - 'supabase/migrations/**'
      - '.github/workflows/edge-baseline-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Capture edge formatter diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== lifemate-api ==='
            (cd supabase/functions/lifemate-api && deno fmt --check)
            echo "lifemate-api-status=$?"
            echo '=== lifemate-care-management ==='
            (cd supabase/functions/lifemate-care-management && deno fmt --check)
            echo "lifemate-care-management-status=$?"
          } > edge-format-output.txt 2>&1
          exit 0
      - name: Capture first failing canonical migration
        shell: bash
        run: |
          set +e
          : > schema-apply-output.txt
          echo '=== bootstrap ===' >> schema-apply-output.txt
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql >> schema-apply-output.txt 2>&1
          bootstrap_status=$?
          echo "bootstrap-status=$bootstrap_status" >> schema-apply-output.txt
          if [ "$bootstrap_status" -eq 0 ]; then
            while IFS= read -r migration; do
              echo "=== APPLY $migration ===" >> schema-apply-output.txt
              psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration" >> schema-apply-output.txt 2>&1
              status=$?
              echo "status=$status" >> schema-apply-output.txt
              if [ "$status" -ne 0 ]; then
                echo "FIRST_FAILING_MIGRATION=$migration" >> schema-apply-output.txt
                break
              fi
            done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          fi
          exit 0
      - name: Upload edge baseline diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-baseline-diagnostics-${{ github.sha }}
          path: |
            edge-format-output.txt
            schema-apply-output.txt
          retention-days: 1
