name: free-local-runtime-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - 'tools/load/**'
      - '.github/workflows/free-local-runtime-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - 'tools/load/**'
      - '.github/workflows/free-local-runtime-smoke.yml'

permissions:
  contents: read

concurrency:
  group: free-local-runtime-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-api-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_local_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_local_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lifemate_local_smoke
      RUNTIME_DATABASE_URL: postgres://lifemate_edge_runtime:ci-local-runtime-password-0123456789abcdef@127.0.0.1:5432/lifemate_local_smoke
      LOCAL_AUTH_TOKEN: lifemate-local-session-token-001
      LOCAL_AUTH_USER_ID: 11111111-1111-4111-8111-111111111111
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Install pinned k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: '2.1.0'

      - name: Apply canonical PostgreSQL 17 schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          runtime_password='ci-local-runtime-password-0123456789abcdef'
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --set=runtime_password="$runtime_password" <<'SQL'
          alter role lifemate_edge_runtime password :'runtime_password';
          do $$
          begin
            if (select rolsuper or rolbypassrls or rolcreaterole or rolcreatedb
                  from pg_roles where rolname='lifemate_edge_runtime') then
              raise exception 'local smoke runtime role regained elevated privileges';
            end if;
          end $$;
          SQL

      - name: Run actual Deno API with local auth and k6 smoke
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            for pid in "${collector_pid:-}" "${api_pid:-}" "${auth_pid:-}"; do
              if [[ -n "$pid" ]]; then
                kill -TERM "$pid" 2>/dev/null || true
              fi
            done
            for pid in "${collector_pid:-}" "${api_pid:-}" "${auth_pid:-}"; do
              if [[ -n "$pid" ]]; then
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT

          python3 - <<'PY' >/tmp/lifemate-local-auth.log 2>&1 &
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          token = os.environ['LOCAL_AUTH_TOKEN']
          user_id = os.environ['LOCAL_AUTH_USER_ID']

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != '/auth/v1/user':
                      self.send_response(404)
                      self.end_headers()
                      return
                  if self.headers.get('Authorization') != f'Bearer {token}':
                      body = b'{"message":"invalid synthetic session"}'
                      self.send_response(401)
                  else:
                      body = json.dumps({
                          'id': user_id,
                          'email': 'local-smoke@example.invalid',
                          'phone': None,
                          'user_metadata': {'display_name': 'Local Smoke'},
                          'identities': [],
                      }).encode()
                      self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_args):
                  return

          ThreadingHTTPServer(('127.0.0.1', 19000), Handler).serve_forever()
          PY
          auth_pid=$!

          auth_ready=0
          for _ in $(seq 1 30); do
            if curl --silent --fail \
              --header "Authorization: Bearer $LOCAL_AUTH_TOKEN" \
              http://127.0.0.1:19000/auth/v1/user \
              | jq -e --arg user "$LOCAL_AUTH_USER_ID" '.id == $user' \
                >/dev/null 2>&1; then
              auth_ready=1
              break
            fi
            sleep 0.2
          done
          if [[ "$auth_ready" != '1' ]]; then
            echo '::error::Synthetic localhost auth provider did not become ready.'
            tail -n 20 /tmp/lifemate-local-auth.log || true
            exit 1
          fi

          (
            cd supabase/functions/lifemate-api
            SUPABASE_DB_URL="$TEST_DATABASE_URL" \
            LIFEMATE_DB_URL="$RUNTIME_DATABASE_URL" \
            SUPABASE_URL='http://127.0.0.1:19000' \
            SUPABASE_ANON_KEY='local-publishable-key' \
            SUPABASE_SERVICE_ROLE_KEY='local-service-role-placeholder-0123456789abcdef' \
            LIFEMATE_CONTACT_HASHING_SECRET='local-contact-hashing-secret-0123456789abcdef' \
            LIFEMATE_RELEASE_VERSION='free-local-runtime-smoke' \
            LIFEMATE_REQUIRE_TRANSACTION_POOLER='false' \
            LIFEMATE_RATE_LIMIT_MODE='local' \
            LIFEMATE_REQUIRE_DISTRIBUTED_RATE_LIMIT='false' \
            deno run --allow-env --allow-net=127.0.0.1:5432,127.0.0.1:19000,0.0.0.0:8000 index.ts
          ) >/tmp/lifemate-local-api.log 2>&1 &
          api_pid=$!

          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/health \
              | jq -e '.status == "ok" and .database == "ready" and .version == "free-local-runtime-smoke"' \
                >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != '1' ]]; then
            echo '::error::Actual local lifemate-api did not become healthy.'
            tail -n 80 /tmp/lifemate-local-api.log || true
            exit 1
          fi

          unauthorized_status="$(curl --silent --output /tmp/unauthorized.json \
            --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/me)"
          if [[ "$unauthorized_status" != '401' ]] || \
             ! jq -e '.code == "authorization_missing" and .status == 401' \
               /tmp/unauthorized.json >/dev/null; then
            echo '::error::Unauthenticated API boundary did not return the expected generic 401.'
            jq -c '{status,code,title}' /tmp/unauthorized.json 2>/dev/null || true
            exit 1
          fi

          bootstrap_body='{"displayName":"Local Smoke User","locale":"fa","timeZone":"Asia/Tehran"}'
          bootstrap_status="$(curl --silent --show-error \
            --request POST \
            --output /tmp/bootstrap.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $LOCAL_AUTH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'Idempotency-Key: 22222222-2222-4222-8222-222222222222' \
            --data "$bootstrap_body" \
            http://127.0.0.1:8000/api/v1/users/bootstrap)"
          if [[ "$bootstrap_status" != '200' ]] || \
             ! jq -e '.user.id != null and .user.authSubject != null' \
               /tmp/bootstrap.json >/dev/null; then
            echo "::error::Synthetic bootstrap failed with HTTP $bootstrap_status."
            jq -c '{status,code,title}' /tmp/bootstrap.json 2>/dev/null || true
            tail -n 40 /tmp/lifemate-local-api.log || true
            exit 1
          fi
          jq -e --arg auth "$LOCAL_AUTH_USER_ID" '.user.authSubject == $auth' \
            /tmp/bootstrap.json >/dev/null

          LIFEMATE_OBSERVABILITY_TARGET=local \
          DATABASE_URL="$TEST_DATABASE_URL" \
          DURATION_SECONDS=45 \
          INTERVAL_SECONDS=2 \
          OUTPUT_FILE=runtime-pressure.ndjson \
          STATUS_FILE=runtime-pressure-status.json \
          bash tools/load/collect-runtime-pressure.sh &
          collector_pid=$!

          sessions="$(jq -cn \
            --arg accessToken "$LOCAL_AUTH_TOKEN" \
            --arg subject "$LOCAL_AUTH_USER_ID" \
            '[{accessToken:$accessToken,subject:$subject}]')"
          set +e
          K6_NO_USAGE_REPORT=true \
          LIFEMATE_LOAD_TARGET=local \
          LOAD_PROFILE=smoke \
          BASE_URL=http://127.0.0.1:8000 \
          AUTH_SESSIONS_JSON="$sessions" \
          RUN_ID=free-local-actual-api \
          k6 run tools/load/lifemate-api-capacity.js
          k6_exit=$?
          set -e

          kill -TERM "$collector_pid" 2>/dev/null || true
          set +e
          wait "$collector_pid"
          collector_exit=$?
          set -e
          collector_pid=''

          test "$k6_exit" = '0'
          test "$collector_exit" = '0'
          jq -e '.schemaVersion == "lifemate.capacity.v1" and .target == "local" and .profile == "smoke" and .identityPoolSize == 1 and .thresholdsPassed == true' \
            capacity-result.json >/dev/null
          jq -e '.schemaVersion == "lifemate.runtime-pressure-collector.v1" and .exitCode == 0 and .coverageSeconds >= 20 and .samples >= 8' \
            runtime-pressure-status.json >/dev/null
          node tools/load/summarize-runtime-pressure.mjs \
            runtime-pressure.ndjson runtime-pressure-summary.json
          jq -e '.schemaVersion == "lifemate.runtime-pressure.v1" and .samples >= 8 and .database.peakLifeMateRuntimeConnections >= 1' \
            runtime-pressure-summary.json >/dev/null

      - name: Upload free local runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: free-local-runtime-smoke-${{ github.sha }}
          path: |
            load-summary.json
            capacity-result.json
            runtime-pressure.ndjson
            runtime-pressure-status.json
            runtime-pressure-summary.json
          if-no-files-found: warn
          retention-days: 7
