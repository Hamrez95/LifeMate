name: round2-recurrence-one-shot

on:
  push:
    branches:
      - fix/wellmate-physical-qa-round-2
    paths:
      - 'tools/hotfix/apply_round2_recurrence.py'
      - '.github/workflows/round2-recurrence-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.4.5

      - name: Make duplicate reminder-label edits sequential
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/hotfix/apply_round2_recurrence.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if count != 1:\n        raise RuntimeError(f"{path}: expected one match, found {count}: {old[:90]!r}")\n    write(path, text.replace(old, new, 1))'''
          new = '''    if count != 1 and not (\n        count == 2 and "LifeMateReminderLeadTimes.label(minutes)" in old\n    ):\n        raise RuntimeError(f"{path}: expected one match, found {count}: {old[:90]!r}")\n    write(path, text.replace(old, new, 1))'''
          if old not in text:
              raise SystemExit('replace_once implementation changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply recurrence changes
        run: python3 tools/hotfix/apply_round2_recurrence.py

      - name: Format touched sources
        run: |
          dart format packages/lifemate_client/lib packages/lifemate_client/test wellmate/lib wellmate/test
          deno fmt supabase/functions/lifemate-api/care_events.ts supabase/functions/lifemate-api/care_events_recurrence_test.ts supabase/functions/lifemate-api/database_integration_test.ts

      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate compile/analyze
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Verify recurrence edge module
        working-directory: supabase/functions/lifemate-api
        run: |
          deno check care_events.ts care_events_recurrence_test.ts
          deno test care_events_recurrence_test.ts

      - name: Commit generated recurrence work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add shared visit and injection recurrence'
          git push origin HEAD:fix/wellmate-physical-qa-round-2
