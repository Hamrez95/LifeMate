name: tmp-women-calendar-fmt-diagnostic

on:
  push:
    branches:
      - 'foundation/p0-person-owned-women-calendar'

permissions:
  contents: write

jobs:
  apply-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply exact formatter output to branch
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-api
          deno fmt \
            person_women_calendar.ts \
            person_women_calendar_integration_test.ts \
            women_calendar.ts
          cd ../../..
          if git diff --quiet -- \
            supabase/functions/lifemate-api/person_women_calendar.ts \
            supabase/functions/lifemate-api/person_women_calendar_integration_test.ts \
            supabase/functions/lifemate-api/women_calendar.ts; then
            echo 'Target files already match Deno formatting.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/lifemate-api/person_women_calendar.ts \
            supabase/functions/lifemate-api/person_women_calendar_integration_test.ts \
            supabase/functions/lifemate-api/women_calendar.ts
          git commit -m 'style(identity): apply exact Deno formatting'
          git push origin HEAD:foundation/p0-person-owned-women-calendar
