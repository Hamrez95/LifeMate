name: home-bootstrap-hotfix

on:
  push:
    branches:
      - fix/home-bootstrap-live-backend

permissions:
  contents: write

concurrency:
  group: home-bootstrap-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/home-bootstrap-live-backend
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Wire resilient schedule loader into home
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('wellmate/lib/screens/home/home_screen_content.dart')
          text = path.read_text()

          import_anchor = "import 'active_treatment_card.dart';\n"
          loader_import = "import 'home_schedule_loader.dart';\n"
          if loader_import not in text:
              text = text.replace(import_anchor, import_anchor + loader_import, 1)

          old = dedent('''\
                final results = await Future.wait<dynamic>([
                  api.getCurrentUser(),
                  api.getTreatmentPlans(),
                  api.getDoseOccurrences(fromDate: today, toDate: lastVisibleDay),
                  api.getCareEvents(fromDate: today, toDate: lastVisibleDay),
                ]);

                final currentUser = results[0] as Map<String, dynamic>;
                final plans = results[1] as List<Map<String, dynamic>>;
                final doses = results[2] as List<Map<String, dynamic>>;
                final careEvents = results[3] as List<Map<String, dynamic>>;
          ''')
          new = dedent('''\
                final snapshot = await const HomeScheduleLoader().load(
                  api: api,
                  fromDate: today,
                  toDate: lastVisibleDay,
                );
                final currentUser = snapshot.currentUser;
                final plans = snapshot.treatmentPlans;
                final doses = snapshot.doseOccurrences;
                final careEvents = snapshot.careEvents;
                for (final failure in snapshot.failures) {
                  debugPrint(
                    'WellMate home partial load (${failure.source}): ${failure.error}',
                  );
                }
          ''')
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('home bootstrap target not found')

          path.write_text(text)
          PY

      - name: Format and persist canonical source
        shell: bash
        run: |
          dart format \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/lib/screens/home/home_schedule_loader.dart \
            wellmate/test/home_schedule_loader_test.dart
          if git diff --quiet; then
            echo 'Source already canonical.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              wellmate/lib/screens/home/home_screen_content.dart \
              wellmate/lib/screens/home/home_schedule_loader.dart \
              wellmate/test/home_schedule_loader_test.dart
            git commit -m 'fix(wellmate): keep home usable during partial API failure'
            git push origin HEAD:fix/home-bootstrap-live-backend
          fi

      - name: Verify deployed production API routes
        shell: bash
        env:
          API_BASE: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
          EXPECTED_RELEASE: 3cdf7344db065b1c8d30f196bc5e4b0eed8bd637
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$API_BASE/health")"
          echo "$health" | jq -e --arg version "$EXPECTED_RELEASE" \
            '.status == "ok" and .database == "ready" and .version == $version' >/dev/null

          assert_auth_route() {
            local path="$1"
            local status
            status="$(curl --silent --show-error --output /tmp/route-body.json --write-out '%{http_code}' "$API_BASE$path")"
            test "$status" = '401'
          }

          assert_auth_route '/api/v1/care-events?fromDate=2026-08-06&toDate=2026-08-13'
          assert_auth_route '/api/v1/women-calendar/profile'
          assert_auth_route '/api/v1/women-calendar/episodes'
          assert_auth_route '/api/v1/women-calendar/daily-logs?fromDate=2026-08-01&toDate=2026-08-13'
          assert_auth_route '/api/v1/me/profile'

      - name: Shared client checks
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: WellMate checks
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter build web --release \
            --dart-define=ENABLE_GOOGLE_AUTH=false \
            --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true
