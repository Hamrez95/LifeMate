name: privacy-safe-telemetry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-telemetry/**'
      - 'supabase/functions/lifemate-api/http.ts'
      - 'supabase/functions/lifemate-api/http_test.ts'
      - 'supabase/config.toml'
      - 'packages/lifemate_client/**'
      - 'wellmate/lib/main.dart'
      - 'caremate/lib/main.dart'
      - 'docs/privacy/PRODUCT_TELEMETRY.md'
      - 'backend-dotnet/src/LifeMate.Api/Middleware/**'
      - 'backend-dotnet/src/LifeMate.Api/Program.cs'
      - 'backend-dotnet/tests/LifeMate.IntegrationTests/PrivacySafeObservabilityTests.cs'
      - '.github/workflows/privacy-safe-telemetry.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/lifemate-telemetry/**'
      - 'supabase/functions/lifemate-api/http.ts'
      - 'supabase/functions/lifemate-api/http_test.ts'
      - 'supabase/config.toml'
      - 'packages/lifemate_client/**'
      - 'wellmate/lib/main.dart'
      - 'caremate/lib/main.dart'
      - 'docs/privacy/PRODUCT_TELEMETRY.md'
      - 'backend-dotnet/src/LifeMate.Api/Middleware/**'
      - 'backend-dotnet/src/LifeMate.Api/Program.cs'
      - 'backend-dotnet/tests/LifeMate.IntegrationTests/PrivacySafeObservabilityTests.cs'
      - '.github/workflows/privacy-safe-telemetry.yml'

permissions:
  contents: read

concurrency:
  group: privacy-safe-telemetry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: supabase/functions/lifemate-telemetry
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format
        run: deno fmt --check
      - name: Type check
        run: deno task check
      - name: Tests
        run: deno task test
      - name: Privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'client_telemetry_field_forbidden' privacy_safe_event.ts
          grep -Fq 'product_telemetry_field_forbidden' privacy_safe_event.ts
          grep -Fq 'Never log the authenticated subject' index.ts
          if grep -R -n -E 'console\.(log|error|warn).*authorization|console\.(log|error|warn).*request\.body|console\.(log|error|warn).*auth_subject' .; then
            echo 'Telemetry source may log sensitive authentication/request data.' >&2
            exit 1
          fi

  edge-api-redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: supabase/functions/lifemate-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Privacy-safe HTTP error test
        run: deno test --no-check http_test.ts

  dotnet-redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Privacy-safe middleware tests
        run: >-
          dotnet test backend-dotnet/tests/LifeMate.IntegrationTests/LifeMate.IntegrationTests.csproj
          --configuration Release
          --filter FullyQualifiedName~PrivacySafeObservabilityTests
        env:
          DOTNET_NOLOGO: 'true'
      - name: Enforce no exception object logging in privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E '_logger\.Log(Error|Critical)\([^;]*exception' \
            backend-dotnet/src/LifeMate.Api/Middleware/PrivacySafeExceptionMiddleware.cs; then
            echo 'Privacy-safe exception middleware must not pass Exception objects to ILogger.' >&2
            exit 1
          fi
