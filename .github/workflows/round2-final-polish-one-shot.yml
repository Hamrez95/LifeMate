name: round2-final-polish-one-shot

on:
  push:
    branches:
      - fix/wellmate-physical-qa-round-2
    paths:
      - 'tools/hotfix/apply_round2_final_polish.py'
      - '.github/workflows/round2-final-polish-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply final physical QA polish
        run: python3 tools/hotfix/apply_round2_final_polish.py

      - name: Format
        run: dart format packages/lifemate_client/lib packages/lifemate_client/test wellmate/lib wellmate/test caremate/lib caremate/test

      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify CareMate
        working-directory: caremate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: close physical QA round 2 regressions'
          git push origin HEAD:fix/wellmate-physical-qa-round-2
