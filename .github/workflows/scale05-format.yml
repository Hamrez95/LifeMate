name: scale05-format

on:
  push:
    branches: ['perf/scale-05-idempotency-retry']

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-05-idempotency-retry
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Format changed sources
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/lifemate-api/index.ts \
            supabase/functions/lifemate-api/http.ts \
            supabase/functions/lifemate-api/idempotency.ts \
            supabase/functions/lifemate-api/idempotency_test.ts \
            supabase/functions/lifemate-api/idempotency_integration_test.ts
          dart format \
            packages/lifemate_client/lib/src/lifemate_api_client.dart \
            packages/lifemate_client/lib/src/health_observations_api.dart \
            packages/lifemate_client/test/lifemate_api_client_test.dart \
            packages/lifemate_client/test/health_observations_api_test.dart
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-api packages/lifemate_client
          git commit -m 'style(scale): format idempotency implementation'
          git push origin HEAD:perf/scale-05-idempotency-retry
