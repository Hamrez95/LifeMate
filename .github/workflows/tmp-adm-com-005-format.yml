name: tmp-adm-com-005-format

on:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-admin-api/commerce_promotions.ts'
      - 'supabase/functions/lifemate-admin-api/commerce_promotions_service.ts'
      - 'supabase/functions/lifemate-admin-api/index.ts'
      - '.github/workflows/tmp-adm-com-005-format.yml'

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format target files
        run: |
          deno fmt \
            supabase/functions/lifemate-admin-api/commerce_promotions.ts \
            supabase/functions/lifemate-admin-api/commerce_promotions_service.ts \
            supabase/functions/lifemate-admin-api/index.ts
          mkdir -p /tmp/adm-com-005-format/supabase/functions/lifemate-admin-api
          cp supabase/functions/lifemate-admin-api/commerce_promotions.ts /tmp/adm-com-005-format/supabase/functions/lifemate-admin-api/
          cp supabase/functions/lifemate-admin-api/commerce_promotions_service.ts /tmp/adm-com-005-format/supabase/functions/lifemate-admin-api/
          cp supabase/functions/lifemate-admin-api/index.ts /tmp/adm-com-005-format/supabase/functions/lifemate-admin-api/
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: adm-com-005-formatted
          path: /tmp/adm-com-005-format
          retention-days: 1
