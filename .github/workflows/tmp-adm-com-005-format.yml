name: tmp-adm-com-005-format

on:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-admin-api/commerce_promotions.ts'
      - 'supabase/functions/lifemate-admin-api/commerce_promotions_service.ts'
      - 'supabase/functions/lifemate-admin-api/index.ts'
      - '.github/workflows/tmp-adm-com-005-format.yml'

permissions:
  contents: write

jobs:
  format-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false
          persist-credentials: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format and commit target files
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/lifemate-admin-api/commerce_promotions.ts \
            supabase/functions/lifemate-admin-api/commerce_promotions_service.ts \
            supabase/functions/lifemate-admin-api/index.ts
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/lifemate-admin-api/commerce_promotions.ts \
            supabase/functions/lifemate-admin-api/commerce_promotions_service.ts \
            supabase/functions/lifemate-admin-api/index.ts
          git commit -m 'style(commerce): apply deno formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
