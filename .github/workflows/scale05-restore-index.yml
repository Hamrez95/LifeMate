name: scale05-restore-index

on:
  push:
    branches: ['perf/scale-05-idempotency-retry']

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-05-idempotency-retry
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Restore main API and apply only Scale-05 boundary changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:supabase/functions/lifemate-api/index.ts > /tmp/index-main.ts
          cp /tmp/index-main.ts supabase/functions/lifemate-api/index.ts
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/lifemate-api/index.ts')
          text = path.read_text()

          import_marker = 'import { createRequestConcurrencyGateFromEnvironment } from "./concurrency.ts";\n'
          import_block = import_marker + '''import {
            createMutationIdempotencyStore,
            requireMutationIdempotencyKey,
            shouldProtectMutation,
          } from "./idempotency.ts";
          '''
          if text.count(import_marker) != 1:
              raise SystemExit('concurrency import marker is not unique')
          text = text.replace(import_marker, import_block, 1)

          constructor_marker = 'const requestConcurrency = createRequestConcurrencyGateFromEnvironment();\n'
          constructor_block = constructor_marker + '''const mutationIdempotency = createMutationIdempotencyStore(
            databaseUrl,
            contactHashingSecret,
          );
          '''
          if text.count(constructor_marker) != 1:
              raise SystemExit('concurrency constructor marker is not unique')
          text = text.replace(constructor_marker, constructor_block, 1)

          route_call = '    return await route(request, path, auth);\n'
          if text.count(route_call) != 1:
              raise SystemExit(f'top-level route call count was {text.count(route_call)}')
          text = text.replace(
              route_call,
              '    return await routeWithIdempotency(request, path, auth);\n',
              1,
          )

          route_marker = 'async function route(\n'
          helper = '''async function routeWithIdempotency(
            request: Request,
            path: string,
            auth: AuthenticatedUser,
          ): Promise<Response> {
            if (!shouldProtectMutation(request.method, path)) {
              return await route(request, path, auth);
            }

            const idempotencyKey = requireMutationIdempotencyKey(request);
            const body = await request.text();
            const replayableRequest = new Request(request.url, {
              method: request.method,
              headers: request.headers,
              body: body.length === 0 ? undefined : body,
            });

            return await mutationIdempotency.execute(
              auth.id,
              `${request.method} ${path}`,
              idempotencyKey,
              body,
              () => route(replayableRequest, path, auth),
            );
          }

          '''
          if text.count(route_marker) != 1:
              raise SystemExit('route function marker is not unique')
          text = text.replace(route_marker, helper + route_marker, 1)
          path.write_text(text)
          PY
          deno fmt supabase/functions/lifemate-api/index.ts
      - name: Commit restored API
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-api/index.ts
          git commit -m 'fix(scale): preserve existing healthcare API behavior'
          git push origin HEAD:perf/scale-05-idempotency-retry
