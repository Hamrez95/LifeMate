name: scale05-admin-format

on:
  push:
    branches: ['perf/scale-05-idempotency-retry']

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-05-idempotency-retry
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format existing admin sources blocking CI
        run: >-
          deno fmt
          supabase/functions/lifemate-admin-api/relationship_ledger_test.ts
          supabase/functions/lifemate-admin-api/relationship_ledger_store.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-admin-api/relationship_ledger_test.ts \
                  supabase/functions/lifemate-admin-api/relationship_ledger_store.ts
          git commit -m 'style(admin): satisfy relationship ledger formatter'
          git push origin HEAD:perf/scale-05-idempotency-retry
