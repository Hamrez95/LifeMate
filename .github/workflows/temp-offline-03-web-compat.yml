name: temp-offline-03-web-compat

on:
  push:
    branches: [platform/offline-03-runtime-adoption]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: platform/offline-03-runtime-adoption
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Reconcile platform boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          native = Path('packages/lifemate_client/lib/src/shared_offline_runtime_native.dart')
          s = native.read_text()
          s = s.replace(
          "  LifeMateLocalNamespace toLocalNamespace() => LifeMateLocalNamespace(\n    environmentId: environmentId,\n    accountId: accountId,\n    personId: personId,\n  );\n\n  static String _required",
          "  LifeMateLocalNamespace toLocalNamespace() => LifeMateLocalNamespace(\n    environmentId: environmentId,\n    accountId: accountId,\n    personId: personId,\n  );\n\n  static LifeMateOfflineNamespace fromLocal(LifeMateLocalNamespace value) =>\n      LifeMateOfflineNamespace(\n        environmentId: value.environmentId,\n        accountId: value.accountId,\n        personId: value.personId,\n      );\n\n  static String _required")
          s = s.replace('    required LifeMateOfflineNamespace namespace,\n    required String timeZone,', '    required Object namespace,\n    required String timeZone,', 1)
          s = s.replace(
          "  }) async {\n    final normalizedTimeZone = timeZone.trim();",
          "  }) async {\n    final offlineNamespace = switch (namespace) {\n      LifeMateOfflineNamespace value => value,\n      LifeMateLocalNamespace value => LifeMateOfflineNamespace.fromLocal(value),\n      _ => throw ArgumentError.value(namespace, 'namespace'),\n    };\n    final localNamespace = offlineNamespace.toLocalNamespace();\n    final normalizedTimeZone = timeZone.trim();")
          s = s.replace('    final localNamespace = namespace.toLocalNamespace();\n\n    final ownsStore', '    final ownsStore')
          s = s.replace('        namespace: namespace,\n        localNamespace: localNamespace,', '        namespace: offlineNamespace,\n        localNamespace: localNamespace,')
          native.write_text(s)

          durable = Path('packages/lifemate_client/lib/src/durable_lifemate_api_client.dart')
          s = durable.read_text().replace("import 'package:lifemate_core/lifemate_core.dart';\n", '')
          s = s.replace('LifeMateLocalNamespace', 'LifeMateOfflineNamespace')
          durable.write_text(s)

          barrel = Path('packages/lifemate_client/lib/lifemate_client.dart')
          s = barrel.read_text().replace("export 'src/mutation_replay_transport.dart';\n", '')
          barrel.write_text(s)

          test = Path('packages/lifemate_client/test/mutation_replay_transport_test.dart')
          s = test.read_text()
          needle = "import 'package:lifemate_client/lifemate_client.dart';\n"
          if "src/mutation_replay_transport.dart" not in s:
              s = s.replace(needle, needle + "import 'package:lifemate_client/src/mutation_replay_transport.dart';\n")
          test.write_text(s)
          PY
          dart format \
            packages/lifemate_client/lib/lifemate_client.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_native.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_web.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/test/mutation_replay_transport_test.dart
      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
      - name: Verify WellMate web compile
        working-directory: wellmate
        run: |
          flutter pub get
          flutter build web --release --dart-define=ENABLE_GOOGLE_AUTH=false
      - name: Verify CareMate web compile
        working-directory: caremate
        run: |
          flutter pub get
          flutter build web --release --dart-define=ENABLE_GOOGLE_AUTH=false
      - name: Commit reconciled source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/lifemate_client
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(offline): isolate native health runtime from web"
          git push origin HEAD:platform/offline-03-runtime-adoption
