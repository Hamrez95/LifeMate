name: temp-apply-phone-sms-frequency

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temp-apply-phone-sms-frequency.yml'

permissions:
  contents: read

concurrency:
  group: temp-phone-sms-frequency-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: beta
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Apply and verify 60-second SMS resend interval
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"sms_max_frequency":60}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          test "$status" = '200'

          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          test "$status" = '200'
          jq -e '.sms_max_frequency == 60' "$response_file" >/dev/null
          echo 'Verified Supabase Auth sms_max_frequency=60.' >> "$GITHUB_STEP_SUMMARY"
