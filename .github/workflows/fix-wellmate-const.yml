name: fix-wellmate-const

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0
      - name: Remove invalid const wrappers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_in_section(source: str, start_marker: str, end_marker: str, old: str, new: str) -> str:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              section = source[start:end]
              if section.count(old) != 1:
                  raise SystemExit(f'{start_marker}: expected one match, got {section.count(old)}')
              section = section.replace(old, new, 1)
              return source[:start] + section + source[end:]

          profile = Path('wellmate/lib/screens/profile/profile_destination_screens.dart')
          text = profile.read_text()
          text = replace_in_section(
              text,
              'class PersonalInformationScreen',
              'class HealthRecordScreen',
              'const SizedBox(\n                width: double.infinity,\n                child: FilledButton.icon(',
              'SizedBox(\n                width: double.infinity,\n                child: FilledButton.icon(',
          )
          text = replace_in_section(
              text,
              'class ReferralScreen',
              'class SupportScreen',
              'return const _WellMateDestinationScaffold(',
              'return _WellMateDestinationScaffold(',
          )
          text = replace_in_section(
              text,
              'class SupportScreen',
              'class SubscriptionScreen',
              'return const _WellMateDestinationScaffold(',
              'return _WellMateDestinationScaffold(',
          )
          profile.write_text(text)

          treatments = Path('wellmate/lib/screens/treatments/treatments_screen.dart')
          treatment_text = treatments.read_text()
          old_treatment = 'const SizedBox(\n                    width: double.infinity,\n                    child: FilledButton.icon('
          new_treatment = 'SizedBox(\n                    width: double.infinity,\n                    child: FilledButton.icon('
          if treatment_text.count(old_treatment) != 1:
              raise SystemExit(f'treatments: expected one match, got {treatment_text.count(old_treatment)}')
          treatments.write_text(treatment_text.replace(old_treatment, new_treatment, 1))
          PY
          rm -f .github/workflows/fix-wellmate-const.yml
          git config user.name 'LifeMate CI Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add wellmate/lib/screens/profile/profile_destination_screens.dart wellmate/lib/screens/treatments/treatments_screen.dart .github/workflows/fix-wellmate-const.yml
          git commit -m 'fix: remove invalid const wrappers from WellMate destinations'
          git push origin HEAD:feat/full-bb287-ui-parity
