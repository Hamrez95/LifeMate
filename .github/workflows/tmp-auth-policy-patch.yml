name: tmp-auth-policy-patch

on:
  push:
    branches:
      - 'foundation/p0-auth-password-policy-hardening'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
      - name: Apply exact auth source replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('packages/lifemate_client/lib/src/experience_auth.dart')
          text = auth.read_text()
          old = '''                    validator: (value) => (value?.length ?? 0) >= 8
                        ? null
                        : LifeMateRuntimeLocale.select(
                            fa: LifeMateRuntimeLocale.select(
                              fa: 'رمز عبور باید حداقل ۸ کاراکتر باشد.',
                              en: "Password must be at least 8 characters long.",
                            ),
                            en: "Password must be at least 8 characters long.",
                          ),'''
          new = '''                    validator: (value) => isSignUp
                        ? LifeMatePasswordPolicy.validationMessage(
                            value,
                            isPersian: LifeMateRuntimeLocale.isPersian,
                          )
                        : (value?.length ?? 0) >= 8
                        ? null
                        : LifeMateRuntimeLocale.select(
                            fa: LifeMateRuntimeLocale.select(
                              fa: 'رمز عبور باید حداقل ۸ کاراکتر باشد.',
                              en: "Password must be at least 8 characters long.",
                            ),
                            en: "Password must be at least 8 characters long.",
                          ),'''
          if old in text:
              text = text.replace(old, new, 1)
              auth.write_text(text)
          elif 'LifeMatePasswordPolicy.validationMessage' not in text:
              raise SystemExit('email auth password validator target not found')

          recovery = Path('packages/lifemate_client/lib/src/experience_recovery.dart')
          text = recovery.read_text()
          old_validator = '''                              validator: (value) => (value?.length ?? 0) >= 8
                                  ? null
                                  : LifeMateRuntimeLocale.select(
                                      fa: LifeMateRuntimeLocale.select(
                                        fa: 'رمز باید حداقل ۸ کاراکتر باشد.',
                                        en: "Password must be at least 8 characters long.",
                                      ),
                                      en: "Password must be at least 8 characters long.",
                                    ),'''
          new_validator = '''                              validator: (value) =>
                                  LifeMatePasswordPolicy.validationMessage(
                                    value,
                                    isPersian: LifeMateRuntimeLocale.isPersian,
                                  ),'''
          if old_validator in text:
              text = text.replace(old_validator, new_validator, 1)
          elif 'LifeMatePasswordPolicy.validationMessage' not in text:
              raise SystemExit('recovery password validator target not found')

          old_error = '''    } on AuthException catch (error) {
      if (mounted) setState(() => _error = error.message);'''
          new_error = '''    } on AuthException catch (error) {
      if (mounted) {
        setState(
          () => _error = safeRecoveryAuthMessage(
            error.message,
            isPersian: LifeMateRuntimeLocale.isPersian,
          ),
        );
      }'''
          if old_error in text:
              text = text.replace(old_error, new_error, 1)
          elif 'safeRecoveryAuthMessage(' not in text:
              raise SystemExit('recovery AuthException target not found')
          recovery.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_client/lib/src/experience_auth.dart packages/lifemate_client/lib/src/experience_recovery.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(auth): enforce shared password policy in auth flows'
          git push origin HEAD:foundation/p0-auth-password-policy-hardening
