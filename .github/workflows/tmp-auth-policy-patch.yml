name: tmp-auth-policy-patch

on:
  push:
    branches:
      - foundation/p0-auth-password-policy-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
      - name: Patch auth source
        run: python3 tmp/auth_policy_patch.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_client/lib/src/experience_auth.dart packages/lifemate_client/lib/src/experience_recovery.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(auth): enforce shared password policy in auth flows'
          git push origin HEAD:foundation/p0-auth-password-policy-hardening
