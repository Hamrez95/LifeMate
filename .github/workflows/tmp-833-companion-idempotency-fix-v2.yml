name: tmp-833-companion-idempotency-fix-v2
on:
  push:
    branches: [feat/offline-833-companion-checkin-fallback-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-833-companion-checkin-fallback-20260906
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Patch and format
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing:{path}')
              p.write_text(s.replace(old,new,1))

          api='packages/lifemate_client/lib/src/women_companion_api.dart'
          r(api,"    required bool shareSummaryWithCompanion,\n    String? clientRequestId,\n","    bool? shareSummaryWithCompanion,\n    String? clientRequestId,\n")
          r(api,"        'privateNotes': _emptyToNull(privateNotes),\n        'shareSummaryWithCompanion': shareSummaryWithCompanion,\n","        'privateNotes': _emptyToNull(privateNotes),\n        if (shareSummaryWithCompanion != null)\n          'shareSummaryWithCompanion': shareSummaryWithCompanion,\n")

          core='packages/lifemate_core/lib/src/local_women_daily_log_mutation.dart'
          old="""    final payload = <String, dynamic>{
      'loggedOn': date,
      'version': version,
      if (normalizedMood != null) 'mood': normalizedMood,
      if (energyLevel != null) 'energyLevel': energyLevel,
      'periodFlow': _emptyToNull(periodFlow),
      'bloodAppearance': _emptyToNull(bloodAppearance),
      'bloodTexture': _emptyToNull(bloodTexture),
      'painLevel': painLevel,
      'symptoms': normalizedSymptoms,
      'privateNotes': _emptyToNull(privateNotes),
    };
"""
          new="""    final ownerCheckIn = normalizedMood != null || energyLevel != null;
    final normalizedPeriodFlow = _emptyToNull(periodFlow);
    final normalizedBloodAppearance = _emptyToNull(bloodAppearance);
    final normalizedBloodTexture = _emptyToNull(bloodTexture);
    if (ownerCheckIn &&
        (normalizedPeriodFlow != null ||
            normalizedBloodAppearance != null ||
            normalizedBloodTexture != null)) {
      throw ArgumentError(
        'Owner check-in and rich period-only fields must be queued separately.',
      );
    }
    final payload = ownerCheckIn
        ? <String, dynamic>{
            'version': version,
            'loggedOn': date,
            if (normalizedMood != null) 'mood': normalizedMood,
            if (energyLevel != null) 'energyLevel': energyLevel,
            'painLevel': painLevel,
            'symptoms': normalizedSymptoms
                .map((value) => value.toLowerCase())
                .toList(growable: false),
            'privateNotes': _emptyToNull(privateNotes),
          }
        : <String, dynamic>{
            'loggedOn': date,
            'version': version,
            'periodFlow': normalizedPeriodFlow,
            'bloodAppearance': normalizedBloodAppearance,
            'bloodTexture': normalizedBloodTexture,
            'painLevel': painLevel,
            'symptoms': normalizedSymptoms,
            'privateNotes': _emptyToNull(privateNotes),
          };
"""
          r(core,old,new)

          screen='wellmate/lib/screens/women_calendar/women_companion_screen.dart'
          r(screen,"    final clientRequestId = LifeMateApiClient.createClientRequestId();\n    try {\n","    final clientRequestId = LifeMateApiClient.createClientRequestId();\n    final currentShare = current?['shareSummaryWithCompanion'] == true;\n    final shareTransition = currentShare == draft.shareWithCompanion\n        ? null\n        : draft.shareWithCompanion;\n    final canonicalSymptoms = draft.symptoms\n        .map((value) => value.trim().toLowerCase())\n        .where((value) => value.isNotEmpty)\n        .toSet()\n        .toList(growable: false)\n      ..sort();\n    try {\n")
          r(screen,"        symptoms: draft.symptoms,\n        privateNotes: draft.privateNotes,\n        shareSummaryWithCompanion: draft.shareWithCompanion,\n","        symptoms: canonicalSymptoms,\n        privateNotes: draft.privateNotes,\n        shareSummaryWithCompanion: shareTransition,\n")
          r(screen,"            symptoms: draft.symptoms.toSet(),\n","            symptoms: canonicalSymptoms.toSet(),\n")
          r(screen,"            'symptoms': draft.symptoms,\n","            'symptoms': canonicalSymptoms,\n")

          exp='wellmate/test/women_companion_experience_test.dart'
          r(exp,"    required bool shareSummaryWithCompanion,\n    String? clientRequestId,\n","    bool? shareSummaryWithCompanion,\n    String? clientRequestId,\n")

          ct='packages/lifemate_core/test/local_women_daily_log_mutation_enqueue_test.dart'
          r(ct,"      expect(mutation.payload['privateNotes'], 'owner only');\n      expect(\n        mutation.payload.containsKey('shareSummaryWithCompanion'),\n        isFalse,\n      );\n","      expect(mutation.payload['privateNotes'], 'owner only');\n      expect(mutation.payload.containsKey('periodFlow'), isFalse);\n      expect(mutation.payload.containsKey('bloodAppearance'), isFalse);\n      expect(mutation.payload.containsKey('bloodTexture'), isFalse);\n      expect(mutation.payload.containsKey('shareSummaryWithCompanion'), isFalse);\n      expect(mutation.payload.keys.toList(growable: false), <String>[\n        'version', 'loggedOn', 'mood', 'energyLevel', 'painLevel', 'symptoms', 'privateNotes',\n      ]);\n")
          PY
          dart format packages/lifemate_client/lib/src/women_companion_api.dart packages/lifemate_core/lib/src/local_women_daily_log_mutation.dart packages/lifemate_core/test/local_women_daily_log_mutation_enqueue_test.dart wellmate/lib/screens/women_calendar/women_companion_screen.dart wellmate/test/women_companion_experience_test.dart
          rm .github/workflows/tmp-833-companion-idempotency-fix-v2.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -e .github/workflows/tmp-833-companion-idempotency-fix-v2.yml
          git add packages/lifemate_client packages/lifemate_core wellmate/lib/screens/women_calendar/women_companion_screen.dart wellmate/test/women_companion_experience_test.dart .github/workflows/tmp-833-companion-idempotency-fix-v2.yml
          git diff --cached --check
          git commit -m 'fix(women): keep private fallback replay contract idempotent'
          git push origin HEAD:feat/offline-833-companion-checkin-fallback-20260906
