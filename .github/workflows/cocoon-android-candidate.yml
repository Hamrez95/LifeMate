name: cocoon-android-candidate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Candidate environment
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production
      build_mode:
        description: Android build mode (release is compact; debug is for diagnostics only)
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  pull_request:
    paths:
      - 'cocoonmate/**'
      - 'packages/cocoonmate_module/**'
      - 'packages/lifemate_client/**'
      - '.github/workflows/cocoon-android-candidate.yml'
  push:
    branches:
      - main
    paths:
      - 'cocoonmate/**'
      - 'packages/cocoonmate_module/**'
      - 'packages/lifemate_client/**'
      - '.github/workflows/cocoon-android-candidate.yml'

permissions:
  contents: read

concurrency:
  group: cocoon-android-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COCOON_ANDROID_KEYSTORE_BASE64: ${{ secrets.COCOON_ANDROID_KEYSTORE_BASE64 }}
      COCOON_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COCOON_ANDROID_KEYSTORE_PASSWORD }}
      COCOON_ANDROID_KEY_ALIAS: ${{ secrets.COCOON_ANDROID_KEY_ALIAS }}
      COCOON_ANDROID_KEY_PASSWORD: ${{ secrets.COCOON_ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
      LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve candidate settings
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          environment='${{ inputs.environment }}'
          build_mode='${{ inputs.build_mode }}'
          if [[ -z "$environment" ]]; then environment=internal; fi
          if [[ -z "$build_mode" ]]; then build_mode=release; fi
          if [[ "$environment" != internal && "$environment" != production ]]; then
            echo 'Unsupported environment' >&2
            exit 1
          fi
          if [[ "$build_mode" != debug && "$build_mode" != release ]]; then
            echo 'Unsupported build mode' >&2
            exit 1
          fi
          if [[ "$environment" == production && "$build_mode" != release ]]; then
            echo 'Production candidates must be release builds.' >&2
            exit 1
          fi
          version="$(awk '/^version:/ {print $2}' cocoonmate/pubspec.yaml | cut -d+ -f1)"
          short_sha="${GITHUB_SHA::12}"
          build_number="${GITHUB_RUN_NUMBER}"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "build_mode=$build_mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Validate public runtime build configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY LIFEMATE_API_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required public runtime configuration is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$SUPABASE_URL" == https://* ]]
          [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]
          [[ "$LIFEMATE_API_BASE_URL" == "$SUPABASE_URL/functions/v1/lifemate-api" ]]

      - name: Resolve and test reusable Cocoon module
        working-directory: packages/cocoonmate_module
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Generate standalone Android platform
        working-directory: cocoonmate
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.mylifemate --project-name cocoonmate .
          rm -f test/widget_test.dart analysis_options.yaml
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="cocoonmate"', 'android:label="CocoonMate"')
          manifest.write_text(text)
          PY

      - name: Verify Android identity
        working-directory: cocoonmate
        shell: bash
        run: |
          set -euo pipefail
          grep -R -Fq 'com.mylifemate.cocoonmate' android/app
          grep -Fq 'android:label="CocoonMate"' android/app/src/main/AndroidManifest.xml
          ! grep -R -n -E 'com\.mylifemate\.(wellmate|caremate)' android/app

      - name: Resolve and test standalone host
        working-directory: cocoonmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Configure production release signing
        if: steps.candidate.outputs.environment == 'production'
        working-directory: cocoonmate
        shell: bash
        run: |
          set -euo pipefail
          for name in COCOON_ANDROID_KEYSTORE_BASE64 COCOON_ANDROID_KEYSTORE_PASSWORD COCOON_ANDROID_KEY_ALIAS COCOON_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release signing secret is missing: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$COCOON_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/cocoon-release.jks
          cat > android/key.properties <<EOF_SIGNING
          storePassword=$COCOON_ANDROID_KEYSTORE_PASSWORD
          keyPassword=$COCOON_ANDROID_KEY_PASSWORD
          keyAlias=$COCOON_ANDROID_KEY_ALIAS
          storeFile=cocoon-release.jks
          EOF_SIGNING
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          if 'val cocoonKeystoreProperties = java.util.Properties()' not in text:
              text = text.replace(
                  'android {',
                  '''val cocoonKeystoreProperties = java.util.Properties()\nval cocoonKeystorePropertiesFile = rootProject.file("key.properties")\nif (cocoonKeystorePropertiesFile.exists()) {\n    cocoonKeystorePropertiesFile.inputStream().use { cocoonKeystoreProperties.load(it) }\n}\n\nandroid {''',
                  1,
              )
          marker = '    buildTypes {'
          signing = '''    signingConfigs {\n        create("release") {\n            keyAlias = cocoonKeystoreProperties["keyAlias"] as String\n            keyPassword = cocoonKeystoreProperties["keyPassword"] as String\n            storeFile = file(cocoonKeystoreProperties["storeFile"] as String)\n            storePassword = cocoonKeystoreProperties["storePassword"] as String\n        }\n    }\n\n'''
          if 'create("release")' not in text:
              text = text.replace(marker, signing + marker, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1,
          )
          path.write_text(text)
          PY

      - name: Build compact Android candidates
        working-directory: cocoonmate
        shell: bash
        run: |
          set -euo pipefail
          mode='${{ steps.candidate.outputs.build_mode }}'
          flutter build apk "--$mode" --split-per-abi \
            --build-name='${{ steps.candidate.outputs.version }}' \
            --build-number='${{ steps.candidate.outputs.build_number }}' \
            --dart-define=LIFEMATE_BUILD_ENV='${{ steps.candidate.outputs.environment }}' \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"

      - name: Create compact provenance bundles
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          environment='${{ steps.candidate.outputs.environment }}'
          mode='${{ steps.candidate.outputs.build_mode }}'
          short_sha='${{ steps.candidate.outputs.short_sha }}'
          mkdir -p candidate

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          mode = '${{ steps.candidate.outputs.build_mode }}'
          environment = '${{ steps.candidate.outputs.environment }}'
          version = '${{ steps.candidate.outputs.version }}'
          build_number = '${{ steps.candidate.outputs.build_number }}'
          short_sha = '${{ steps.candidate.outputs.short_sha }}'
          migration_head = os.popen("find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\\n' | sort | tail -n 1").read().strip()
          source_dir = Path('cocoonmate/build/app/outputs/flutter-apk')
          destination = Path('candidate')
          artifacts = {}
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              source = source_dir / f'app-{abi}-{mode}.apk'
              if not source.is_file():
                  raise SystemExit(f'Missing split APK: {source}')
              bundle_dir = destination / abi
              bundle_dir.mkdir(parents=True, exist_ok=True)
              filename = f'cocoonmate-{environment}-{mode}-{abi}-v{version}+{build_number}-{short_sha}.apk'
              target = bundle_dir / filename
              target.write_bytes(source.read_bytes())
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              (bundle_dir / f'{filename}.sha256').write_text(f'{digest}  {filename}\n')
              artifacts[abi] = {'file': filename, 'sha256': digest, 'size_bytes': target.stat().st_size}

          signing = 'production release signing' if environment == 'production' else ('ephemeral Android debug signing with release optimization' if mode == 'release' else 'ephemeral Android debug signing')
          payload = {
              'app': 'cocoonmate',
              'package_id': 'com.mylifemate.cocoonmate',
              'commit_sha': os.environ['GITHUB_SHA'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'version': version,
              'build_number': build_number,
              'environment': environment,
              'build_mode': mode,
              'distribution': 'split-per-abi',
              'recommended_phone_abi': 'arm64-v8a',
              'signing': signing,
              'migration_head': migration_head,
              'artifacts': artifacts,
              'runtime_config': {
                  'supabase_url': os.environ['SUPABASE_URL'],
                  'api_base_url': os.environ['LIFEMATE_API_BASE_URL'],
                  'publishable_key_embedded': bool(os.environ.get('SUPABASE_PUBLISHABLE_KEY')),
              },
          }
          provenance = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          (destination / 'provenance.json').write_text(provenance)
          for abi in artifacts:
              (destination / abi / 'provenance.json').write_text(provenance)
          PY

          echo "artifact_prefix=cocoonmate-${environment}-${mode}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify compact artifacts and size guard
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate/provenance.json
          jq -e '.runtime_config.publishable_key_embedded == true' candidate/provenance.json >/dev/null
          jq -e '.distribution == "split-per-abi" and .recommended_phone_abi == "arm64-v8a"' candidate/provenance.json >/dev/null
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s candidate/$abi/*.apk
            test -s candidate/$abi/*.sha256
            test -s candidate/$abi/provenance.json
          done
          ! find candidate -type f \( -name '*.jks' -o -name 'key.properties' \) | grep -q .

          arm64_bytes="$(stat -c%s candidate/arm64-v8a/*.apk)"
          if [[ '${{ steps.candidate.outputs.build_mode }}' == release && "$arm64_bytes" -gt $((60 * 1024 * 1024)) ]]; then
            echo "Compact arm64 APK unexpectedly exceeds 60 MiB: $arm64_bytes bytes" >&2
            exit 1
          fi

      - name: Upload compact phone APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.provenance.outputs.artifact_prefix }}-arm64-v8a
          path: candidate/arm64-v8a/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload legacy ARM APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.provenance.outputs.artifact_prefix }}-armeabi-v7a
          path: candidate/armeabi-v7a/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload emulator APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.provenance.outputs.artifact_prefix }}-x86_64
          path: candidate/x86_64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
