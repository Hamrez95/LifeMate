name: offline04-void-enqueue-ack-patch

on:
  push:
    branches:
      - fix/offline-04-hide-web-treatment-mutation-type-20260905
    paths:
      - '.github/workflows/offline04-void-enqueue-ack-patch.yml'
      - 'tools/hotfix/apply_offline04_void_enqueue_ack.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/offline-04-hide-web-treatment-mutation-type-20260905
          fetch-depth: 0
      - name: Apply reviewed deterministic acknowledgement cleanup
        run: python3 tools/hotfix/apply_offline04_void_enqueue_ack.py
      - name: Commit product-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/lifemate_core/lib/lifemate_core_web.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_native.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_web.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart \
            packages/lifemate_client/test/durable_treatment_edit_enqueue_test.dart \
            tools/hotfix/apply_offline04_void_enqueue_ack.py \
            .github/workflows/offline04-void-enqueue-ack-patch.yml
          git commit -m 'fix(client): hide native treatment mutation acknowledgement on web (#832)'
          git push origin HEAD:fix/offline-04-hide-web-treatment-mutation-type-20260905
