name: telemetry-edge-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/lifemate-telemetry/**'
      - 'supabase/config.toml'
      - '.github/workflows/telemetry-edge-release.yml'

permissions:
  contents: read

concurrency:
  group: telemetry-edge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-exact-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: beta
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false

      - name: Require exact-main deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.ref }}" = 'refs/heads/main'
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo '::error::Missing SUPABASE_ACCESS_TOKEN secret.'
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo '::error::Missing SUPABASE_PROJECT_REF secret.'
            exit 1
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Verify telemetry source before deploy
        working-directory: supabase/functions/lifemate-telemetry
        run: |
          deno fmt --check
          deno task check
          deno task test

      - name: Deploy exact-main telemetry Edge function
        shell: bash
        run: >-
          npx --yes supabase@2.63.1 functions deploy lifemate-telemetry
          --project-ref "$SUPABASE_PROJECT_REF"
          --no-verify-jwt=false
