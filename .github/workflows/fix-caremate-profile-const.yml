name: fix-caremate-profile-const

# Triggered maintenance repair for CareMate UI parity.
on:
  push:
    branches: [feat/full-bb287-ui-parity]
    paths: ['.github/workflows/fix-caremate-profile-const.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0
      - name: Remove invalid const and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('caremate/lib/screens/profile_screen.dart')
          text = path.read_text()
          old = """                const SizedBox(
                  width: double.infinity,
                  child: OutlinedButton.icon(
                    onPressed: null,
"""
          new = """                SizedBox(
                  width: double.infinity,
                  child: OutlinedButton.icon(
                    onPressed: null,
"""
          if old not in text:
              raise SystemExit('Expected invalid const block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-caremate-profile-const.yml
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix CareMate profile compile blocker'
          git push origin HEAD:feat/full-bb287-ui-parity
