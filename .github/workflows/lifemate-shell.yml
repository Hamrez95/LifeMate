name: lifemate-shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lifemate/**'
      - 'packages/lifemate_client/**'
      - 'tools/lifemate.ps1'
      - 'tools/lifemate.apps.json'
      - 'tools/release/prepare-lifemate-android.sh'
      - '.github/workflows/lifemate-shell.yml'
      - 'docs/lifemate-shell/NAVIGATION_ARCHITECTURE.md'
  push:
    branches: [ main ]
    paths:
      - 'lifemate/**'
      - 'packages/lifemate_client/**'
      - 'tools/lifemate.ps1'
      - 'tools/lifemate.apps.json'
      - 'tools/release/prepare-lifemate-android.sh'
      - '.github/workflows/lifemate-shell.yml'
      - 'docs/lifemate-shell/NAVIGATION_ARCHITECTURE.md'

permissions:
  contents: read

concurrency:
  group: lifemate-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Enforce parent-shell data boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'supabase_flutter|Supabase\.instance|service_role|SERVICE_ROLE' \
            lifemate/lib --include='*.dart'; then
            echo 'LifeMate parent shell must use reviewed shared clients, not direct Supabase access.' >&2
            exit 1
          fi

      - name: Prepare generated Android host
        shell: bash
        run: bash tools/release/prepare-lifemate-android.sh

      - name: Resolve dependencies
        working-directory: lifemate
        run: flutter pub get

      - name: Generate LifeMate launcher icon
        working-directory: lifemate
        run: dart run flutter_launcher_icons

      - name: Verify formatting
        working-directory: lifemate
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          if ! git diff --exit-code -- lib test; then
            echo '::group::dart format diff'
            git diff -- lib test
            echo '::endgroup::'
            echo 'Run dart format on the changed LifeMate sources.' >&2
            exit 1
          fi

      - name: Analyze
        working-directory: lifemate
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test parent shell
        working-directory: lifemate
        run: flutter test

      - name: Build release web app
        working-directory: lifemate
        env:
          SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
          LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
        run: >-
          flutter build web --release
          --dart-define="SUPABASE_URL=$SUPABASE_URL"
          --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
          --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
          --dart-define=ENABLE_PHONE_OTP=true
          --dart-define=ENABLE_GOOGLE_AUTH=false

      - name: Verify web output and app metadata
        working-directory: lifemate
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/manifest.json
          test -s build/web/icons/Icon-192.png
          test -s build/web/icons/Icon-512.png
          grep -Fq '<title>LifeMate</title>' build/web/index.html

      - name: Build Android APK
        working-directory: lifemate
        env:
          SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
          LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
        run: >-
          flutter build apk --release
          --dart-define="SUPABASE_URL=$SUPABASE_URL"
          --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
          --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
          --dart-define=ENABLE_PHONE_OTP=true
          --dart-define=ENABLE_GOOGLE_AUTH=false

      - name: Verify isolated Android package
        shell: bash
        run: |
          set -euo pipefail
          gradle='lifemate/android/app/build.gradle.kts'
          grep -Fq 'applicationId = "com.mylifemate.lifemate"' "$gradle"
          grep -Fq 'isCoreLibraryDesugaringEnabled = true' "$gradle"
          grep -Fq 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' "$gradle"
          test -s lifemate/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload internal Android verification APK
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-shell-internal-verification-apk
          path: lifemate/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
