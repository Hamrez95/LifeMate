name: lifemate-shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lifemate/**'
      - 'packages/lifemate_client/**'
      - 'tools/release/prepare-lifemate-android.sh'
      - '.github/workflows/lifemate-shell.yml'
      - 'docs/lifemate-shell/NAVIGATION_ARCHITECTURE.md'
  push:
    branches: [ main ]
    paths:
      - 'lifemate/**'
      - 'packages/lifemate_client/**'
      - 'tools/release/prepare-lifemate-android.sh'
      - '.github/workflows/lifemate-shell.yml'
      - 'docs/lifemate-shell/NAVIGATION_ARCHITECTURE.md'

permissions:
  contents: read

concurrency:
  group: lifemate-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Enforce parent-shell data boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'supabase_flutter|Supabase\.instance|service_role|SERVICE_ROLE' \
            lifemate/lib --include='*.dart'; then
            echo 'LifeMate parent shell must use reviewed shared clients, not direct Supabase access.' >&2
            exit 1
          fi

      - name: Prepare generated Android host
        shell: bash
        run: bash tools/release/prepare-lifemate-android.sh

      - name: Resolve dependencies
        working-directory: lifemate
        run: flutter pub get

      - name: Verify formatting
        working-directory: lifemate
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          if ! git diff --exit-code -- lib test; then
            echo '::group::dart format diff'
            git diff -- lib test
            echo '::endgroup::'
            echo 'Run dart format on the changed LifeMate sources.' >&2
            exit 1
          fi

      - name: Analyze
        working-directory: lifemate
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test parent shell
        working-directory: lifemate
        run: flutter test

      - name: Build Android APK
        working-directory: lifemate
        run: flutter build apk --release --dart-define=ENABLE_GOOGLE_AUTH=false

      - name: Verify isolated Android package
        shell: bash
        run: |
          grep -Fq 'applicationId = "com.mylifemate.lifemate"' lifemate/android/app/build.gradle.kts
          test -s lifemate/build/app/outputs/flutter-apk/app-release.apk
