name: lifemate-shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lifemate/**'
      - 'packages/lifemate_client/**'
      - 'tools/release/prepare-lifemate-android.sh'
      - '.github/workflows/lifemate-shell.yml'
      - 'docs/lifemate-shell/NAVIGATION_ARCHITECTURE.md'
  push:
    branches: [ main ]
    paths:
      - 'lifemate/**'
      - 'packages/lifemate_client/**'
      - 'tools/release/prepare-lifemate-android.sh'
      - '.github/workflows/lifemate-shell.yml'
      - 'docs/lifemate-shell/NAVIGATION_ARCHITECTURE.md'

permissions:
  contents: write

concurrency:
  group: lifemate-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Enforce parent-shell data boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'supabase_flutter|Supabase\.instance|service_role|SERVICE_ROLE' \
            lifemate/lib --include='*.dart'; then
            echo 'LifeMate parent shell must use reviewed shared clients, not direct Supabase access.' >&2
            exit 1
          fi

      - name: Prepare generated Android host
        shell: bash
        run: bash tools/release/prepare-lifemate-android.sh

      - name: Resolve dependencies
        working-directory: lifemate
        run: flutter pub get

      - name: Apply canonical Dart formatting
        working-directory: lifemate
        run: dart format lib test

      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lifemate/lib lifemate/test; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lifemate/lib lifemate/test
          git commit -m 'style(living-camp): apply canonical Dart formatter (#1075)'
          git push origin HEAD:"${GITHUB_HEAD_REF}"

      - name: Analyze
        working-directory: lifemate
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test parent shell
        working-directory: lifemate
        run: flutter test

      - name: Build Android APK
        working-directory: lifemate
        run: flutter build apk --release --dart-define=ENABLE_GOOGLE_AUTH=false

      - name: Verify isolated Android package
        shell: bash
        run: |
          set -euo pipefail
          gradle='lifemate/android/app/build.gradle.kts'
          grep -Fq 'applicationId = "com.mylifemate.lifemate"' "$gradle"
          grep -Fq 'isCoreLibraryDesugaringEnabled = true' "$gradle"
          grep -Fq 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' "$gradle"
          test -s lifemate/build/app/outputs/flutter-apk/app-release.apk
