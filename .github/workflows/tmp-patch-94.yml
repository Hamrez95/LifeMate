name: tmp-patch-94
on:
  push:
    branches:
      - "feat/94-smart-history-autofill"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/94-smart-history-autofill
      - run: python .github/scripts/tmp_patch_94.py
      - run: rm .github/workflows/tmp-patch-94.yml .github/scripts/tmp_patch_94.py
      - run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(autofill): connect personal history suggestions to care forms (#94)"
          git push origin HEAD:feat/94-smart-history-autofill
