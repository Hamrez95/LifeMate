name: apply-caremate-alerts-form-hotfix-v2

on:
  push:
    branches:
      - fix/caremate-alerts-and-form-labels
    paths:
      - '.github/workflows/apply-caremate-alerts-form-hotfix-v2.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/caremate-alerts-and-form-labels
          fetch-depth: 0

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Patch CareMate alert semantics and form fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          calendar_path = Path('caremate/lib/screens/calendar/calendar_screen.dart')
          calendar = calendar_path.read_text()
          alert_block = '''  List<EventModel> get _activeAlerts {
            final now = DateTime.now();
            final today = _normalizeDate(now);
            return _events
                .where((event) {
                  if (event.type != EventType.medicine) return false;
                  if (_normalizeDate(event.date) != today) return false;
                  if (event.isCompleted != false) return false;
                  final parts = event.time.split(':');
                  final hour = int.tryParse(parts.first) ?? 0;
                  final minute = parts.length > 1 ? int.tryParse(parts[1]) ?? 0 : 0;
                  final scheduled = DateTime(
                    event.date.year,
                    event.date.month,
                    event.date.day,
                    hour,
                    minute,
                  );
                  return !scheduled.isAfter(now);
                })
                .toList(growable: false);
          }'''
          calendar, count = re.subn(
              r'^  List<EventModel> get _activeAlerts \{.*?^  \}\n\n  void _showAlerts\(\) \{',
              alert_block + '\n\n  void _showAlerts() {',
              calendar,
              count=1,
              flags=re.MULTILINE | re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'expected one calendar alert block, found {count}')
          if "'هشدارهای دارویی'," not in calendar:
              raise SystemExit('calendar alert title was not found')
          calendar = calendar.replace(
              "'هشدارهای دارویی',",
              "'هشدارهای دارویی امروز',",
              1,
          )
          calendar_path.write_text(calendar)

          form_path = Path('caremate/lib/screens/care_event_management_screen.dart')
          form = form_path.read_text()
          form_class = form.index('class _ReadOnlyForm extends StatelessWidget')
          fields_start = form.index('          ...fields.map(', form_class)
          fields_end = form.index('          SizedBox(', fields_start)
          fields_block = '''          ...fields.map(
            (field) => Padding(
              padding: const EdgeInsets.only(bottom: 14),
              child: _ReadOnlyField(
                label: field.$1,
                icon: field.$2,
                multiline:
                    field.$1.contains('آدرس') ||
                    field.$1.contains('یادداشت') ||
                    field.$1.contains('دلیل') ||
                    field.$1.contains('دستور'),
              ),
            ),
          ),
          '''
          form = form[:fields_start] + fields_block + form[fields_end:]

          marker = 'class _LiveEventList extends StatelessWidget {'
          if marker not in form:
              raise SystemExit('live event marker was not found')
          field_widget = '''class _ReadOnlyField extends StatelessWidget {
            const _ReadOnlyField({
              required this.label,
              required this.icon,
              required this.multiline,
            });

            final String label;
            final IconData icon;
            final bool multiline;

            @override
            Widget build(BuildContext context) {
              return Semantics(
                container: true,
                label: label,
                textField: true,
                readOnly: true,
                enabled: false,
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Padding(
                      padding: const EdgeInsetsDirectional.only(start: 4, end: 4),
                      child: Text(
                        label,
                        style: const TextStyle(
                          fontSize: 13,
                          height: 1.35,
                          fontWeight: FontWeight.w800,
                          color: AppColors.primaryText,
                        ),
                      ),
                    ),
                    const SizedBox(height: 7),
                    Container(
                      key: ValueKey<String>('caremate-readonly-field-$label'),
                      width: double.infinity,
                      constraints: BoxConstraints(
                        minHeight: multiline ? 84 : 62,
                      ),
                      padding: const EdgeInsetsDirectional.fromSTEB(13, 11, 13, 11),
                      decoration: BoxDecoration(
                        color: const Color(0xFFF6F9FD),
                        borderRadius: BorderRadius.circular(17),
                        border: Border.all(
                          color: AppColors.primaryBlue.withValues(alpha: 0.08),
                        ),
                      ),
                      child: Row(
                        crossAxisAlignment: multiline
                            ? CrossAxisAlignment.start
                            : CrossAxisAlignment.center,
                        children: [
                          Container(
                            width: 40,
                            height: 40,
                            decoration: BoxDecoration(
                              color: const Color(0xFFEAF4FF),
                              borderRadius: BorderRadius.circular(13),
                            ),
                            child: Icon(
                              icon,
                              size: 21,
                              color: AppColors.primaryBlue,
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Text(
                              'ثبت نشده',
                              style: TextStyle(
                                fontSize: 12,
                                height: 1.4,
                                color: AppColors.secondaryText.withValues(alpha: 0.82),
                              ),
                            ),
                          ),
                          const SizedBox(width: 8),
                          Icon(
                            Icons.lock_outline_rounded,
                            size: 17,
                            color: AppColors.secondaryText.withValues(alpha: 0.62),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          '''
          form = form.replace(marker, field_widget + marker, 1)
          form_path.write_text(form)

          alert_test = Path('caremate/test/calendar_alert_regression_test.dart')
          alert_test.write_text(r'''import 'package:caremate/core/localization/locale_provider.dart';
          import 'package:caremate/main.dart';
          import 'package:caremate/screens/calendar/calendar_screen.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:lifemate_client/lifemate_client.dart';
          import 'package:provider/provider.dart';

          void main() {
            testWidgets(
              'bell ignores yesterday skipped and today scheduled doses',
              (WidgetTester tester) async {
                final now = DateTime.now();
                await _pumpCalendar(
                  tester,
                  doses: [
                    {
                      'id': 'yesterday-skipped',
                      'medicationName': 'سیتریزین دیروز',
                      'doseText': 'یک قرص',
                      'scheduledLocalDate': _date(
                        now.subtract(const Duration(days: 1)),
                      ),
                      'scheduledLocalTime': '21:00',
                      'status': 'skipped',
                    },
                    {
                      'id': 'today-scheduled',
                      'medicationName': 'سیتریزین امشب',
                      'doseText': 'یک قرص',
                      'scheduledLocalDate': _date(now),
                      'scheduledLocalTime': '23:59',
                      'status': 'scheduled',
                    },
                  ],
                );

                await tester.tap(find.byIcon(Icons.notifications_none_rounded));
                await tester.pump();

                expect(
                  find.text('هشدار دارویی فعالی وجود ندارد.'),
                  findsOneWidget,
                );
                expect(find.text('هشدارهای دارویی امروز'), findsNothing);
                expect(tester.takeException(), isNull);
              },
            );

            testWidgets('bell shows only a due missed dose from today', (
              WidgetTester tester,
            ) async {
              final now = DateTime.now();
              await _pumpCalendar(
                tester,
                doses: [
                  {
                    'id': 'today-missed',
                    'medicationName': 'دوز جاافتاده امروز',
                    'doseText': 'یک عدد',
                    'scheduledLocalDate': _date(now),
                    'scheduledLocalTime': '00:00',
                    'status': 'missed',
                  },
                  {
                    'id': 'today-scheduled',
                    'medicationName': 'دوز برنامه‌ریزی‌شده امشب',
                    'doseText': 'یک عدد',
                    'scheduledLocalDate': _date(now),
                    'scheduledLocalTime': '23:59',
                    'status': 'scheduled',
                  },
                ],
              );

              await tester.tap(find.byIcon(Icons.notifications_none_rounded));
              await tester.pumpAndSettle();

              expect(find.text('هشدارهای دارویی امروز'), findsOneWidget);
              expect(find.text('دوز جاافتاده امروز'), findsWidgets);
              expect(find.text('دوز برنامه‌ریزی‌شده امشب'), findsOneWidget);
              expect(tester.takeException(), isNull);
            });
          }

          Future<void> _pumpCalendar(
            WidgetTester tester, {
            required List<Map<String, dynamic>> doses,
          }) async {
            tester.view.physicalSize = const Size(390, 820);
            tester.view.devicePixelRatio = 1;
            addTearDown(tester.view.resetPhysicalSize);
            addTearDown(tester.view.resetDevicePixelRatio);

            await tester.pumpWidget(
              MultiProvider(
                providers: [
                  ChangeNotifierProvider(create: (_) => LocaleProvider()),
                  Provider<LifeMateApiClient>.value(
                    value: _AlertApiClient(doses),
                  ),
                ],
                child: const CareMateApp(home: CalendarScreen()),
              ),
            );
            await tester.pumpAndSettle();
          }

          String _date(DateTime value) =>
              '${value.year.toString().padLeft(4, '0')}-'
              '${value.month.toString().padLeft(2, '0')}-'
              '${value.day.toString().padLeft(2, '0')}';

          class _AlertApiClient extends LifeMateApiClient {
            _AlertApiClient(this.doses)
              : super(
                  baseUri: Uri.parse('https://example.invalid'),
                  accessToken: () => 'test-token',
                );

            final List<Map<String, dynamic>> doses;

            @override
            Future<Map<String, dynamic>> getCurrentUser() async => {
              'user': {'id': 'caregiver-1'},
              'profile': {'displayName': 'مراقب تست'},
            };

            @override
            Future<List<Map<String, dynamic>>> getCareRelationships() async => [
              {
                'id': 'relationship-1',
                'status': 'active',
                'patientUserId': 'patient-1',
                'patientDisplayName': 'حمیدرضا',
                'caregiverUserId': 'caregiver-1',
              },
            ];

            @override
            Future<List<Map<String, dynamic>>> getCareRecipientDoseOccurrences({
              required String patientUserId,
              required DateTime fromDate,
              required DateTime toDate,
            }) async => doses;

            @override
            Future<List<Map<String, dynamic>>> getCareRecipientCareEvents({
              required String patientUserId,
              required DateTime fromDate,
              required DateTime toDate,
            }) async => const [];
          }
          ''')

          accessibility_path = Path(
              'caremate/test/care_event_management_accessibility_test.dart'
          )
          accessibility = accessibility_path.read_text()
          insertion = '''      final visitForm = find.text('فرم ویزیت پزشکی', skipOffstage: false);
                await reveal(visitForm);
                expect(visitForm, findsOneWidget);
          '''
          replacement = insertion + '''
                final doctorLabel = find.text('نام پزشک', skipOffstage: false);
                await reveal(doctorLabel);
                final doctorSurface = find.byKey(
                  const ValueKey<String>('caremate-readonly-field-نام پزشک'),
                  skipOffstage: false,
                );
                expect(doctorSurface, findsOneWidget);
                expect(
                  tester.getBottomLeft(doctorLabel).dy,
                  lessThan(tester.getTopLeft(doctorSurface).dy),
                );
          '''
          if insertion not in accessibility:
              raise SystemExit('accessibility insertion point was not found')
          accessibility_path.write_text(
              accessibility.replace(insertion, replacement, 1)
          )
          PY

          dart format \
            caremate/lib/screens/calendar/calendar_screen.dart \
            caremate/lib/screens/care_event_management_screen.dart \
            caremate/test/calendar_alert_regression_test.dart \
            caremate/test/care_event_management_accessibility_test.dart

      - name: Analyze and test CareMate
        shell: bash
        run: |
          set -euo pipefail
          cd caremate
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/calendar_alert_regression_test.dart
          flutter test test/care_event_management_accessibility_test.dart
          flutter test

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-caremate-alerts-form-hotfix.yml
          rm .github/workflows/apply-caremate-alerts-form-hotfix-v2.yml
          git config user.name 'Hamidreza Pakpour'
          git config user.email '136631329+Hamrez95@users.noreply.github.com'
          git add -A
          git commit -m 'fix(caremate): align current alerts and form labels'
          git push origin HEAD:fix/caremate-alerts-and-form-labels
