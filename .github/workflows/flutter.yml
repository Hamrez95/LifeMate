name: flutter

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android beta APK artifacts
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'wellmate/**'
      - 'caremate/**'
      - 'packages/lifemate_client/**'
      - 'assets/**'
      - '.github/workflows/flutter.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'wellmate/**'
      - 'caremate/**'
      - 'packages/lifemate_client/**'
      - 'assets/**'
      - '.github/workflows/flutter.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot:github_actions

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Verify bb287 visual binaries and mock-free runtime sources
        shell: bash
        run: |
          set -euo pipefail
          reference=bb28701971cb2d43cde5acb5d50ef679dded534f
          git cat-file -e "$reference^{commit}"
          git diff --quiet "$reference" -- \
            caremate/assets \
            caremate/android/app/src/main/res/mipmap-hdpi \
            caremate/android/app/src/main/res/mipmap-mdpi \
            caremate/android/app/src/main/res/mipmap-xhdpi \
            caremate/android/app/src/main/res/mipmap-xxhdpi \
            caremate/android/app/src/main/res/mipmap-xxxhdpi \
            caremate/web/favicon.png \
            caremate/web/icons \
            wellmate/assets \
            wellmate/android/app/src/main/res/mipmap-hdpi \
            wellmate/android/app/src/main/res/mipmap-mdpi \
            wellmate/android/app/src/main/res/mipmap-xhdpi \
            wellmate/android/app/src/main/res/mipmap-xxhdpi \
            wellmate/android/app/src/main/res/mipmap-xxxhdpi \
            wellmate/web/favicon.png \
            wellmate/web/icons
          if grep -R -n -E 'app_mock_data|AppMockData|MockData' \
            caremate/lib wellmate/lib --include='*.dart'; then
            echo 'Mock health data is referenced by runtime UI sources.' >&2
            exit 1
          fi

      - name: Verify shared LifeMate client
        id: shared-client
        continue-on-error: true
        working-directory: packages/lifemate_client
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            flutter analyze --no-fatal-warnings --no-fatal-infos
            flutter test
          } 2>&1 | tee /tmp/lifemate-client-ci.log

      - name: Upload shared-client diagnostics
        if: ${{ always() && steps.shared-client.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-client-ci-log
          path: /tmp/lifemate-client-ci.log
          retention-days: 1

      - name: Verify WellMate
        id: wellmate
        continue-on-error: true
        working-directory: wellmate
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            flutter analyze --no-fatal-warnings --no-fatal-infos
            flutter test
            flutter build web --release
          } 2>&1 | tee /tmp/wellmate-ci.log

      - name: Upload WellMate diagnostics
        if: ${{ always() && steps.wellmate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: wellmate-ci-log
          path: /tmp/wellmate-ci.log
          retention-days: 1

      - name: Verify CareMate
        id: caremate
        if: ${{ always() }}
        continue-on-error: true
        working-directory: caremate
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            flutter analyze --no-fatal-warnings --no-fatal-infos
            flutter test
            flutter build web --release
          } 2>&1 | tee /tmp/caremate-ci.log

      - name: Upload CareMate diagnostics
        if: ${{ always() && steps.caremate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: caremate-ci-log
          path: /tmp/caremate-ci.log
          retention-days: 1

      - name: Enforce Flutter verification results
        if: ${{ always() }}
        shell: bash
        run: |
          test "${{ steps.shared-client.outcome }}" = "success"
          test "${{ steps.wellmate.outcome }}" = "success"
          test "${{ steps.caremate.outcome }}" = "success"

      - name: Decide Android checkpoint build
        id: android-checkpoint
        shell: bash
        run: |
          should_build=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            should_build=true
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_android }}" == "true" ]]; then
            should_build=true
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Build Android beta APKs
        if: ${{ success() && steps.android-checkpoint.outputs.should_build == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
          LIFEMATE_API_BASE_URL: ${{ vars.LIFEMATE_API_BASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api' }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$LIFEMATE_API_BASE_URL"
          health_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | grep -q '"status":"ok"'
          echo "$health_response" | grep -q '"database":"ready"'
          unauthorized_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$unauthorized_status" = "401"
          build_args=(
            --release
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
          )
          (cd wellmate && flutter build apk "${build_args[@]}")
          (cd caremate && flutter build apk "${build_args[@]}")

      - name: Inspect Android APK manifests, signing and packaged assets
        if: ${{ success() && steps.android-checkpoint.outputs.should_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          report_dir=/tmp/lifemate-apk-inspection
          mkdir -p "$report_dir"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          test -x "$apksigner_bin"

          inspect_apk() {
            local app_name="$1"
            local apk="$2"
            local required_logo="$3"
            local report="$report_dir/${app_name}.txt"
            local listing="$report_dir/${app_name}-zip-listing.txt"

            test -s "$apk"
            "$aapt_bin" dump badging "$apk" > "$report"
            "$aapt_bin" dump permissions "$apk" >> "$report"
            grep -Fq 'android.permission.INTERNET' "$report"
            "$apksigner_bin" verify --verbose --print-certs "$apk" >> "$report"
            unzip -Z1 "$apk" > "$listing"
            grep -Fq 'assets/flutter_assets/AssetManifest.bin' "$listing"
            grep -Fq "assets/flutter_assets/$required_logo" "$listing"
            grep -Fq 'assets/flutter_assets/assets/fonts/Vazir.ttf' "$listing"
            grep -Eq '^res/mipmap-.*/ic_launcher\.(png|webp)$' "$listing"
            sha256sum "$apk" >> "$report_dir/apk-sha256.txt"
          }

          inspect_apk \
            wellmate \
            wellmate/build/app/outputs/flutter-apk/app-release.apk \
            assets/images/WellMateWithoutBack.png
          inspect_apk \
            caremate \
            caremate/build/app/outputs/flutter-apk/app-release.apk \
            assets/images/CareMateWithoutBack.png

      - name: Upload Android beta APKs and inspection evidence
        if: ${{ success() && steps.android-checkpoint.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-android-beta-apks
          path: |
            wellmate/build/app/outputs/flutter-apk/app-release*.apk
            caremate/build/app/outputs/flutter-apk/app-release*.apk
            /tmp/lifemate-apk-inspection/**
          if-no-files-found: error
          retention-days: 14
