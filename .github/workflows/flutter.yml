name: flutter

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wellmate/**'
      - 'caremate/**'
      - 'assets/**'
      - '.github/workflows/flutter.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'wellmate/**'
      - 'caremate/**'
      - 'assets/**'
      - '.github/workflows/flutter.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot:github_actions

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      # Pinned to a reviewed commit instead of a mutable version tag.
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Verify WellMate
        id: wellmate
        continue-on-error: true
        working-directory: wellmate
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            flutter analyze
            flutter test
            flutter build web --release
          } 2>&1 | tee /tmp/wellmate-ci.log

      - name: Upload WellMate diagnostics
        if: ${{ always() && steps.wellmate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: wellmate-ci-log
          path: /tmp/wellmate-ci.log
          retention-days: 1

      - name: Verify CareMate
        id: caremate
        if: ${{ always() }}
        continue-on-error: true
        working-directory: caremate
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            flutter analyze
            flutter test
            flutter build web --release
          } 2>&1 | tee /tmp/caremate-ci.log

      - name: Upload CareMate diagnostics
        if: ${{ always() && steps.caremate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: caremate-ci-log
          path: /tmp/caremate-ci.log
          retention-days: 1

      - name: Enforce Flutter verification results
        if: ${{ always() }}
        shell: bash
        run: |
          test "${{ steps.wellmate.outcome }}" = "success"
          test "${{ steps.caremate.outcome }}" = "success"
