name: flutter

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wellmate/**'
      - 'caremate/**'
      - 'packages/lifemate_client/**'
      - 'assets/**'
      - '.github/workflows/flutter.yml'
      - 'AGENTS.md'
  push:
    branches:
      - main
      - feat/v0.5-flutter-integration
    paths:
      - 'wellmate/**'
      - 'caremate/**'
      - 'packages/lifemate_client/**'
      - 'assets/**'
      - '.github/workflows/flutter.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot:github_actions

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      # Both the setup action and SDK are pinned for reproducible CI results.
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version

      - name: Verify shared LifeMate client
        id: shared-client
        if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        continue-on-error: true
        working-directory: packages/lifemate_client
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            flutter analyze --no-fatal-warnings --no-fatal-infos
            flutter test
          } 2>&1 | tee /tmp/lifemate-client-ci.log

      - name: Upload shared-client diagnostics
        if: ${{ always() && steps.shared-client.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-client-ci-log
          path: /tmp/lifemate-client-ci.log
          retention-days: 1

      - name: Verify WellMate
        id: wellmate
        if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        continue-on-error: true
        working-directory: wellmate
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            # Existing warning/info debt is reported but does not hide compile errors.
            flutter analyze --no-fatal-warnings --no-fatal-infos
            flutter test
            flutter build web --release
          } 2>&1 | tee /tmp/wellmate-ci.log

      - name: Upload WellMate diagnostics
        if: ${{ always() && steps.wellmate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: wellmate-ci-log
          path: /tmp/wellmate-ci.log
          retention-days: 1

      - name: Verify CareMate
        id: caremate
        if: ${{ always() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
        continue-on-error: true
        working-directory: caremate
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            # Existing warning/info debt is reported but does not hide compile errors.
            flutter analyze --no-fatal-warnings --no-fatal-infos
            flutter test
            flutter build web --release
          } 2>&1 | tee /tmp/caremate-ci.log

      - name: Upload CareMate diagnostics
        if: ${{ always() && steps.caremate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: caremate-ci-log
          path: /tmp/caremate-ci.log
          retention-days: 1

      - name: Upload resolved Flutter lockfiles
        if: ${{ always() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lockfiles
          path: |
            packages/lifemate_client/pubspec.lock
            wellmate/pubspec.lock
            caremate/pubspec.lock
          retention-days: 1

      - name: Enforce Flutter verification results
        if: ${{ always() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          test "${{ steps.shared-client.outcome }}" = "success"
          test "${{ steps.wellmate.outcome }}" = "success"
          test "${{ steps.caremate.outcome }}" = "success"

      - name: Build Android beta APKs
        if: ${{ success() }}
        shell: bash
        env:
          # Supabase URL and publishable keys are public mobile-client
          # configuration. Repository variables override these beta defaults.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
          # Authenticated MVP API deployed inside the same Supabase project.
          # A repository variable can override it for another environment.
          LIFEMATE_API_BASE_URL: ${{ vars.LIFEMATE_API_BASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api' }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$LIFEMATE_API_BASE_URL"
          health_response="$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | grep -q '"status":"ok"'
          echo "$health_response" | grep -q '"database":"ready"'
          unauthorized_status="$(curl --silent --output /dev/null \
            --write-out '%{http_code}' \
            "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$unauthorized_status" = "401"
          build_args=(
            --release
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
          )
          (cd wellmate && flutter build apk "${build_args[@]}")
          (cd caremate && flutter build apk "${build_args[@]}")
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          for apk in \
            wellmate/build/app/outputs/flutter-apk/app-release.apk \
            caremate/build/app/outputs/flutter-apk/app-release.apk
          do
            "$aapt_bin" dump permissions "$apk" \
              | grep -Fq "android.permission.INTERNET"
          done

      - name: Upload Android beta APKs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-android-beta-apks
          path: |
            wellmate/build/app/outputs/flutter-apk/app-release*.apk
            caremate/build/app/outputs/flutter-apk/app-release*.apk
          if-no-files-found: error
          retention-days: 14
