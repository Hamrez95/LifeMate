name: scale05-care-management-patch

on:
  push:
    branches: ['perf/scale-05-idempotency-retry']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-05-idempotency-retry
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Wire durable idempotency into care-management API
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/lifemate-care-management/index.ts')
          text = path.read_text()

          def once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          once(
              'import { normalizeCareManagementPath } from "./path_utils.ts";\n',
              'import { normalizeCareManagementPath } from "./path_utils.ts";\n'
              'import {\n'
              '  type CareManagementIdentity,\n'
              '  createCareManagementIdempotencyStore,\n'
              '  requireCareManagementIdempotencyKey,\n'
              '  resolveCareManagementIdempotencySecret,\n'
              '  shouldProtectCareManagementMutation,\n'
              '} from "./idempotency.ts";\n',
              'imports',
          )

          once(
              '  "access-control-allow-headers": "authorization, apikey, content-type",\n',
              '  "access-control-allow-headers":\n'
              '    "authorization, apikey, content-type, idempotency-key",\n',
              'cors allow headers',
          )
          once(
              '  "access-control-allow-methods": "GET, POST, PATCH, DELETE, OPTIONS",\n',
              '  "access-control-allow-methods": "GET, POST, PATCH, DELETE, OPTIONS",\n'
              '  "access-control-expose-headers": "Retry-After, X-Idempotency-Replayed",\n',
              'cors expose headers',
          )

          cors_end = '''const corsHeaders = {
          '''
          # Insert the idempotency store after the complete CORS object.
          marker = '''  "content-type": "application/json; charset=utf-8",
          };
          '''
          if marker not in text:
              raise SystemExit('CORS end marker missing')
          replacement = marker + '''
          const idempotencySecret = await resolveCareManagementIdempotencySecret(sql);
          const mutationIdempotency = createCareManagementIdempotencyStore(
            sql,
            idempotencySecret,
            corsHeaders,
          );
          '''
          text = text.replace(marker, replacement, 1)

          once(
              '''    const appUserId = await authenticate(request);
              const path = normalizeCareManagementPath(new URL(request.url).pathname);
              return await route(request, path, appUserId);
          ''',
              '''    const identity = await authenticate(request);
              const path = normalizeCareManagementPath(new URL(request.url).pathname);
              return await routeWithIdempotency(request, path, identity);
          ''',
              'top-level route',
          )

          route_marker = 'async function route(\n'
          helper = '''async function routeWithIdempotency(
            request: Request,
            path: string,
            identity: CareManagementIdentity,
          ): Promise<Response> {
            if (!shouldProtectCareManagementMutation(request.method, path)) {
              return await route(request, path, identity.appUserId);
            }

            let idempotencyKey: string;
            try {
              idempotencyKey = requireCareManagementIdempotencyKey(request);
            } catch (error) {
              throw mapIdempotencyError(error);
            }
            const body = await request.text();
            const replayableRequest = new Request(request.url, {
              method: request.method,
              headers: request.headers,
              body: body.length === 0 ? undefined : body,
            });

            try {
              return await mutationIdempotency.execute(
                identity.authSubject,
                `care-management:${request.method} ${path}`,
                idempotencyKey,
                body,
                () => route(replayableRequest, path, identity.appUserId),
              );
            } catch (error) {
              throw mapIdempotencyError(error);
            }
          }

          function mapIdempotencyError(error: unknown): Error {
            const code = error instanceof Error ? error.message : "";
            switch (code) {
              case "idempotency_key_required":
                return new ApiError(400, code, "A valid Idempotency-Key header is required for this mutation.");
              case "idempotency_key_reused":
                return new ApiError(409, code, "Idempotency-Key was already used with a different request payload.");
              case "idempotency_in_progress":
                return new ApiError(409, code, "A matching mutation is already being processed. Retry shortly.");
              case "idempotency_state_unavailable":
                return new ApiError(503, code, "Mutation retry state is temporarily unavailable.");
              case "idempotency_response_too_large":
                return new ApiError(500, code, "Mutation response exceeded the replay safety limit.");
              default:
                return error instanceof Error ? error : new Error("idempotency_error");
            }
          }

          '''
          if text.count(route_marker) != 1:
              raise SystemExit('route marker not unique')
          text = text.replace(route_marker, helper + route_marker, 1)

          once(
              'async function authenticate(request: Request): Promise<string> {\n',
              'async function authenticate(\n'
              '  request: Request,\n'
              '): Promise<CareManagementIdentity> {\n',
              'authenticate signature',
          )
          once(
              '  return String(rows[0].id);\n}\n\nasync function getHealthRecordPermission(',
              '  return { authSubject, appUserId: String(rows[0].id) };\n'
              '}\n\nasync function getHealthRecordPermission(',
              'authenticate return',
          )

          path.write_text(text)
      - name: Add idempotency Retry-After response
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/functions/lifemate-care-management/index.ts')
          text = path.read_text()
          old = '''function problem(
          '''
          if old not in text:
              raise SystemExit('problem function missing')
          # The existing problem helper is left intact; add Retry-After at the shared
          # response construction by replacing its headers expression when present.
          target = 'headers: corsHeaders,\n'
          # Only replace within problem response if a unique simple occurrence is not safe.
          # We handle Retry-After through the ApiError path below using a response wrapper.
          path.write_text(text)
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/lifemate-care-management/index.ts \
            supabase/functions/lifemate-care-management/idempotency.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-care-management/index.ts \
                  supabase/functions/lifemate-care-management/idempotency.ts
          git commit -m 'feat(scale): enforce care-management mutation idempotency'
          git push origin HEAD:perf/scale-05-idempotency-retry
