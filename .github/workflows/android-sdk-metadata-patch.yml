name: android-sdk-metadata-patch

on:
  push:
    branches: ['release/p0-record-android-sdk-range']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: release/p0-record-android-sdk-range
          fetch-depth: 0
      - name: Update release manifests
        shell: python
        run: |
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          final = Path('.github/workflows/main-final-android-release.yml')
          text = final.read_text()
          text = once(
              text,
              '''          cp caremate/build/app/outputs/flutter-apk/app-release.apk "dist/caremate-0.9.2-main-${short_sha}.apk"\n          wellmate_sha="$(sha256sum dist/wellmate-*.apk | awk '{print $1}')"\n''',
              '''          cp caremate/build/app/outputs/flutter-apk/app-release.apk "dist/caremate-0.9.2-main-${short_sha}.apk"\n          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"\n          test -x "$aapt_bin"\n          wellmate_android="$(bash tools/release/extract-android-apk-metadata.sh dist/wellmate-*.apk "$aapt_bin" com.lifemate.wellmate)"\n          caremate_android="$(bash tools/release/extract-android-apk-metadata.sh dist/caremate-*.apk "$aapt_bin" com.lifemate.caremate)"\n          wellmate_sha="$(sha256sum dist/wellmate-*.apk | awk '{print $1}')"\n''',
              'final metadata extraction',
          )
          text = once(
              text,
              '''            --arg wellmateSigningCertSha256 "$wellmate_cert_sha256" \\\n            --arg caremateSigningCertSha256 "$caremate_cert_sha256" \\\n            --argjson googleAuth false \\\n''',
              '''            --arg wellmateSigningCertSha256 "$wellmate_cert_sha256" \\\n            --arg caremateSigningCertSha256 "$caremate_cert_sha256" \\\n            --argjson wellmateAndroid "$wellmate_android" \\\n            --argjson caremateAndroid "$caremate_android" \\\n            --argjson googleAuth false \\\n''',
              'final jq args',
          )
          text = once(
              text,
              '''            '{mainCommit:$mainCommit,version:$version,buildNumber:$buildNumber,builtAtUtc:$builtAt,apiEnvironment:$apiEnvironment,apiBaseUrl:$apiBaseUrl,featureFlags:{googleAuth:$googleAuth,phoneOtp:$phoneOtp,womenCalendarPilot:$womenCalendarPilot},apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256,signingCertSha256:$wellmateSigningCertSha256},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256,signingCertSha256:$caremateSigningCertSha256}},releasePurpose:"physical-test-round-2",storeSigningConfigured:true}' \\\n''',
              '''            '{mainCommit:$mainCommit,version:$version,buildNumber:$buildNumber,builtAtUtc:$builtAt,apiEnvironment:$apiEnvironment,apiBaseUrl:$apiBaseUrl,featureFlags:{googleAuth:$googleAuth,phoneOtp:$phoneOtp,womenCalendarPilot:$womenCalendarPilot},apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256,signingCertSha256:$wellmateSigningCertSha256,android:$wellmateAndroid},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256,signingCertSha256:$caremateSigningCertSha256,android:$caremateAndroid}},releasePurpose:"physical-test-round-2",storeSigningConfigured:true}' \\\n''',
              'final manifest android metadata',
          )
          final.write_text(text)

          internal = Path('.github/workflows/internal-beta-release.yml')
          text = internal.read_text()
          text = once(
              text,
              '''          "$aapt_bin" dump badging "dist/wellmate-$RELEASE_NAME-$SHORT_SHA-internal.apk" \\\n            | grep -q "package: name='com.lifemate.wellmate'"\n          "$aapt_bin" dump badging "dist/caremate-$RELEASE_NAME-$SHORT_SHA-internal.apk" \\\n            | grep -q "package: name='com.lifemate.caremate'"\n          for apk in dist/*.apk; do\n''',
              '''          wellmate_android="$(bash tools/release/extract-android-apk-metadata.sh "dist/wellmate-$RELEASE_NAME-$SHORT_SHA-internal.apk" "$aapt_bin" com.lifemate.wellmate)"\n          caremate_android="$(bash tools/release/extract-android-apk-metadata.sh "dist/caremate-$RELEASE_NAME-$SHORT_SHA-internal.apk" "$aapt_bin" com.lifemate.caremate)"\n          for apk in dist/*.apk; do\n''',
              'internal package metadata extraction',
          )
          text = once(
              text,
              '''            --arg wellmateSigningCertSha256 "$wellmate_cert_sha256" \\\n            --arg caremateSigningCertSha256 "$caremate_cert_sha256" \\\n            '{releaseName:$releaseName,commit:$commit,apiVersion:$apiVersion,builtAtUtc:$builtAt,channel:"internal/unstable",signing:"founder-owned stable release keystores",apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256,signingCertSha256:$wellmateSigningCertSha256},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256,signingCertSha256:$caremateSigningCertSha256}},knownLimitations:["Not a stable beta or store release","Human device/accessibility/privacy review remains required"]}' \\\n''',
              '''            --arg wellmateSigningCertSha256 "$wellmate_cert_sha256" \\\n            --arg caremateSigningCertSha256 "$caremate_cert_sha256" \\\n            --argjson wellmateAndroid "$wellmate_android" \\\n            --argjson caremateAndroid "$caremate_android" \\\n            '{releaseName:$releaseName,commit:$commit,apiVersion:$apiVersion,builtAtUtc:$builtAt,channel:"internal/unstable",signing:"founder-owned stable release keystores",apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256,signingCertSha256:$wellmateSigningCertSha256,android:$wellmateAndroid},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256,signingCertSha256:$caremateSigningCertSha256,android:$caremateAndroid}},knownLimitations:["Not a stable beta or store release","Human device/accessibility/privacy review remains required"]}' \\\n''',
              'internal manifest android metadata',
          )
          internal.write_text(text)
      - name: Verify extractor
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/release/extract-android-apk-metadata.sh
          bash -n tools/release/test-extract-android-apk-metadata.sh
          bash tools/release/test-extract-android-apk-metadata.sh
      - name: Commit release metadata wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/main-final-android-release.yml \
            .github/workflows/internal-beta-release.yml
          git commit -m 'feat(release): record APK SDK compatibility metadata'
          git push origin HEAD:release/p0-record-android-sdk-range
