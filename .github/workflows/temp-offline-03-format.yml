name: temp-offline-03-format

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/lifemate_core/lib/src/local_mutation_replay.dart'
      - 'packages/lifemate_core/test/local_mutation_replay_test.dart'
      - '.github/workflows/temp-offline-03-format.yml'

permissions:
  contents: write

concurrency:
  group: temp-offline-03-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Format exact offline replay files
        run: |
          dart format \
            packages/lifemate_core/lib/src/local_mutation_replay.dart \
            packages/lifemate_core/test/local_mutation_replay_test.dart
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/lifemate_core/lib/src/local_mutation_replay.dart \
            packages/lifemate_core/test/local_mutation_replay_test.dart
          git commit -m 'chore(offline): apply dart format'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
