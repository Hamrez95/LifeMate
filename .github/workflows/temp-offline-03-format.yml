name: temp-offline-03-format

on:
  pull_request:
    paths:
      - 'packages/lifemate_core/test/offline_conflict_retry_acceptance_test.dart'
      - '.github/workflows/temp-offline-03-format.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Capture canonical formatted source
        working-directory: packages/lifemate_core
        run: |
          mkdir -p /tmp/offline03-format
          cp test/offline_conflict_retry_acceptance_test.dart /tmp/offline03-format/offline_conflict_retry_acceptance_test.dart
          dart format /tmp/offline03-format/offline_conflict_retry_acceptance_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: offline-03-canonical-format
          path: /tmp/offline03-format/offline_conflict_retry_acceptance_test.dart
          if-no-files-found: error
          retention-days: 1
