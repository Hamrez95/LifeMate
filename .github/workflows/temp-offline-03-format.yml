name: temp-offline-03-format

on:
  push:
    branches:
      - platform/offline-03-shared-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: platform/offline-03-shared-runtime
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Canonical format shared runtime slice
        run: |
          dart format packages/lifemate_client/lib/src/shared_offline_runtime.dart packages/lifemate_client/test/shared_offline_runtime_test.dart packages/lifemate_client/lib/lifemate_client.dart
      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/lifemate_client/lib/src/shared_offline_runtime.dart packages/lifemate_client/test/shared_offline_runtime_test.dart packages/lifemate_client/lib/lifemate_client.dart
          git commit -m "style(offline): canonical-format shared runtime"
          git push origin HEAD:platform/offline-03-shared-runtime
