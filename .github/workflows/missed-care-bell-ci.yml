name: missed-care-bell-ci

on:
  push:
    branches:
      - fix/missed-care-events-bell

permissions:
  contents: write

concurrency:
  group: missed-care-bell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Format changed Dart sources
        run: >-
          dart format
          wellmate/lib/core/widgets/wellmate_app_header.dart
          wellmate/lib/providers/medication_provider.dart
          wellmate/lib/screens/home/home_screen_content.dart
          wellmate/test/missed_notification_bell_test.dart

      - name: Persist canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Dart sources are already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            wellmate/lib/core/widgets/wellmate_app_header.dart \
            wellmate/lib/providers/medication_provider.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/test/missed_notification_bell_test.dart
          git commit -m 'style(wellmate): apply canonical Dart formatting'
          git push origin HEAD:fix/missed-care-events-bell

      - name: Analyze and test WellMate
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter build web --release --dart-define=ENABLE_GOOGLE_AUTH=false
