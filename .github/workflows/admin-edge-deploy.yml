name: admin-edge-deploy

on:
  pull_request:
    paths:
      - '.github/workflows/admin-edge-deploy.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/lifemate-admin-api/**'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-edge-deploy.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/lifemate-admin-api/**'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'production-admin-edge-deploy' || format('admin-edge-deploy-{0}', github.ref) }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  ADMIN_API_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-admin-api

jobs:
  verify-admin-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Verify Admin API source
        working-directory: supabase/functions/lifemate-admin-api
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check
          deno task check
          deno task test

      - name: Verify Admin data-model parity contract is part of the gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'admin_data_model_parity_test.ts' supabase/functions/lifemate-admin-api/deno.json
          test -f supabase/functions/lifemate-admin-api/admin_data_model_parity_test.ts

  verify-admin-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_admin_deploy_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_admin_deploy_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_admin_deploy_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Apply canonical portable schema and all migrations
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Require canonical Admin read models
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL'
          do $$
          begin
            if to_regclass('admin.user_directory_v2') is null then
              raise exception 'admin.user_directory_v2 is missing';
            end if;
            if to_regclass('admin.care_relationship_directory_v1') is null then
              raise exception 'admin.care_relationship_directory_v1 is missing';
            end if;
            if to_regclass('admin.support_ticket_queue_v1') is null then
              raise exception 'admin.support_ticket_queue_v1 is missing';
            end if;
          end $$;
          SQL

  deploy-exact-main:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify-admin-source, verify-admin-schema]
    runs-on: ubuntu-24.04
    environment: beta
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact protected main and deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$SUPABASE_ACCESS_TOKEN"

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Verify management credential
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list >/dev/null

      - name: Set immutable Admin API release identity
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          cleanup_secret_file() {
            if command -v shred >/dev/null 2>&1; then
              shred -u "$secret_file"
            else
              rm -f "$secret_file"
            fi
          }
          trap cleanup_secret_file EXIT
          chmod 600 "$secret_file"
          printf 'LIFEMATE_RELEASE_VERSION=%s\n' "$GITHUB_SHA" > "$secret_file"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --env-file "$secret_file"

      - name: Deploy exact-main Admin API
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy lifemate-admin-api \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api

      - name: Verify exact production Admin API source and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$ADMIN_API_URL/health")"
          echo "$health_response" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "ready" and .service == "lifemate-admin-api" and .version == $version' \
            >/dev/null

          unauthorized_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            "$ADMIN_API_URL/api/v1/me")"
          test "$unauthorized_status" = '401'
