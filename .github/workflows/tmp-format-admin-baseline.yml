name: Temporary Admin Baseline Formatter

on:
  push:
    branches:
      - ci/admin-edge-format-baseline-20260904

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/admin-edge-format-baseline-20260904
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Canonical format current main Admin Edge API
        run: |
          deno fmt supabase/functions/lifemate-admin-api
          git diff --check
      - name: Commit formatting-only baseline
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/lifemate-admin-api
          if git diff --cached --quiet; then
            echo "No baseline formatting debt"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ci): canonical-format admin edge API baseline"
          git push origin HEAD:ci/admin-edge-format-baseline-20260904
