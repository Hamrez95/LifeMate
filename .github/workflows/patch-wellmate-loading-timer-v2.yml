name: patch-wellmate-loading-timer-v2

on:
  push:
    branches:
      - feat/full-bb287-ui-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0

      - name: Patch loading state and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('wellmate/lib/screens/home/home_screen_content.dart')
          text = page.read_text(encoding='utf-8')
          old = """          if (isLoading)
            const Expanded(
              child: Center(
                child: CircularProgressIndicator(color: AppColors.primary),
              ),
            )
          else if (loadError != null)
"""
          new = """          if (isLoading) ...[
            Padding(
              padding: const EdgeInsets.symmetric(horizontal: 20),
              child: _TreatmentTimerPlaceholder(
                hasTreatmentPlans: false,
                onAction: widget.onAddTreatment,
                font: font,
              ),
            ),
            const SizedBox(height: 24),
            const Expanded(
              child: Center(
                child: CircularProgressIndicator(color: AppColors.primary),
              ),
            ),
          ] else if (loadError != null)
"""
          if old not in text:
              raise SystemExit('Expected WellMate loading block was not found')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/patch-wellmate-loading-timer-v2.yml').unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wellmate/lib/screens/home/home_screen_content.dart .github/workflows/patch-wellmate-loading-timer-v2.yml
          git commit -m "Keep WellMate timer visible while data loads"
          git push origin HEAD:feat/full-bb287-ui-parity
