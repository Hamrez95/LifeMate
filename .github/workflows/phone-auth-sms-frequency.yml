name: phone-auth-sms-frequency

on:
  pull_request:
    paths:
      - '.github/workflows/phone-auth-sms-frequency.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-auth-sms-frequency-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh
  SMS_MAX_FREQUENCY_SECONDS: '60'

jobs:
  verify-workflow-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Verify fixed production contract
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/phone-auth-sms-frequency.yml'
          grep -Fq "SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh" "$file"
          grep -Fq "SMS_MAX_FREQUENCY_SECONDS: '60'" "$file"
          grep -Fq '"sms_max_frequency":60' "$file"
          grep -Fq '/config/auth' "$file"
          if grep -Eq 'workflow_dispatch:[[:space:]]*$' "$file"; then
            :
          else
            echo '::error::Workflow must remain manually dispatched.'
            exit 1
          fi

  apply-exact-main:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-workflow-contract
    runs-on: ubuntu-24.04
    environment: beta
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact main and management credential
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Set SMS resend minimum interval to 60 seconds
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"sms_max_frequency":60}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"

          if [ "$status" != '200' ]; then
            echo "::error::Supabase Auth config update failed with HTTP $status. Response intentionally suppressed."
            exit 1
          fi

      - name: Verify SMS resend minimum interval without exposing Auth config
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"

          if [ "$status" != '200' ]; then
            echo "::error::Supabase Auth config verification failed with HTTP $status. Response intentionally suppressed."
            exit 1
          fi

          jq -e --argjson expected "$SMS_MAX_FREQUENCY_SECONDS" \
            '.sms_max_frequency == $expected' "$response_file" >/dev/null
          echo 'Supabase Auth SMS resend minimum interval verified at 60 seconds.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does not print the Auth config or management credential.' >> "$GITHUB_STEP_SUMMARY"
