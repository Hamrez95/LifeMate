name: release-live-probe

on:
  pull_request:
    paths:
      - '.github/workflows/release-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect redacted live release evidence
        id: collect
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_VERSION: 1f094deccc6273b11e1db3b31ddd65eb07bcef98
        run: |
          set -euo pipefail
          api_url='https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api'

          health_response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$api_url/health")"
          unauthorized_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$api_url/api/v1/me")"

          jq -n \
            --arg expectedVersion "$EXPECTED_VERSION" \
            --arg status "$(echo "$health_response" | jq -r '.status // "missing"')" \
            --arg database "$(echo "$health_response" | jq -r '.database // "missing"')" \
            --arg service "$(echo "$health_response" | jq -r '.service // "missing"')" \
            --arg version "$(echo "$health_response" | jq -r '.version // "missing"')" \
            --arg unauthorizedStatus "$unauthorized_status" \
            '{expectedVersion:$expectedVersion,live:{status:$status,database:$database,service:$service,version:$version,unauthenticatedStatus:$unauthorizedStatus}}' \
            > release-live-probe.json

      - name: Upload redacted probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-live-probe
          path: release-live-probe.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce promoted release gates
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.collect.outcome }}" = 'success'
          jq -e '
            .live.status == "ok" and
            .live.database == "ready" and
            .live.service == "lifemate-api" and
            .live.version == .expectedVersion and
            .live.unauthenticatedStatus == "401"
          ' release-live-probe.json >/dev/null
