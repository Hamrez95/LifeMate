name: release-live-probe

on:
  pull_request:
    paths:
      - '.github/workflows/release-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect redacted runtime evidence
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          smoke_url='https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-smoke'
          api_url='https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api'

          smoke_response="$(curl --fail --silent --show-error --retry 4 --retry-all-errors "$smoke_url")"
          health_response="$(curl --fail --silent --show-error --retry 4 --retry-all-errors "$api_url/health")"
          unauthorized_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$api_url/api/v1/me")"

          jq -n \
            --argjson dedicatedPresent "$(echo "$smoke_response" | jq '.dedicatedPresent')" \
            --argjson dedicatedLengthOk "$(echo "$smoke_response" | jq '.dedicatedLengthOk')" \
            --argjson defaultPresent "$(echo "$smoke_response" | jq '.defaultPresent')" \
            --argjson defaultLengthOk "$(echo "$smoke_response" | jq '.defaultLengthOk')" \
            --argjson defaultEqualsServiceRole "$(echo "$smoke_response" | jq '.defaultEqualsServiceRole')" \
            --argjson releaseVersionPresent "$(echo "$smoke_response" | jq '.releaseVersionPresent')" \
            --arg health "$(echo "$health_response" | jq -r '.status // "missing"')" \
            --arg database "$(echo "$health_response" | jq -r '.database // "missing"')" \
            --arg unauthorizedStatus "$unauthorized_status" \
            '{dedicatedPresent:$dedicatedPresent,dedicatedLengthOk:$dedicatedLengthOk,defaultPresent:$defaultPresent,defaultLengthOk:$defaultLengthOk,defaultEqualsServiceRole:$defaultEqualsServiceRole,releaseVersionPresent:$releaseVersionPresent,health:$health,database:$database,unauthenticatedStatus:$unauthorizedStatus}' \
            > release-live-probe.json

      - name: Upload redacted probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-live-probe
          path: release-live-probe.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce release gates
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.collect.outcome }}" = 'success'
          jq -e '
            .dedicatedPresent == true and
            .dedicatedLengthOk == true and
            .defaultEqualsServiceRole == false and
            .health == "ok" and
            .database == "ready" and
            .unauthenticatedStatus == "401"
          ' release-live-probe.json >/dev/null
