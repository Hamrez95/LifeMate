name: release-live-probe

on:
  pull_request:
    paths:
      - '.github/workflows/release-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect redacted candidate evidence
        id: collect
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_VERSION: 1f094deccc6273b11e1db3b31ddd65eb07bcef98
        run: |
          set -euo pipefail
          candidate_url='https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api-candidate'
          current_url='https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api'

          candidate_health="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$candidate_url/health")"
          candidate_unauthorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$candidate_url/api/v1/me")"
          current_health="$(curl --fail --silent --show-error --retry 4 --retry-all-errors "$current_url/health")"

          jq -n \
            --arg expectedVersion "$EXPECTED_VERSION" \
            --arg candidateStatus "$(echo "$candidate_health" | jq -r '.status // "missing"')" \
            --arg candidateDatabase "$(echo "$candidate_health" | jq -r '.database // "missing"')" \
            --arg candidateService "$(echo "$candidate_health" | jq -r '.service // "missing"')" \
            --arg candidateVersion "$(echo "$candidate_health" | jq -r '.version // "missing"')" \
            --arg candidateUnauthorized "$candidate_unauthorized" \
            --arg currentStatus "$(echo "$current_health" | jq -r '.status // "missing"')" \
            --arg currentDatabase "$(echo "$current_health" | jq -r '.database // "missing"')" \
            '{expectedVersion:$expectedVersion,candidate:{status:$candidateStatus,database:$candidateDatabase,service:$candidateService,version:$candidateVersion,unauthenticatedStatus:$candidateUnauthorized},current:{status:$currentStatus,database:$currentDatabase}}' \
            > release-live-probe.json

      - name: Upload redacted probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-live-probe
          path: release-live-probe.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce candidate release gates
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.collect.outcome }}" = 'success'
          jq -e '
            .candidate.status == "ok" and
            .candidate.database == "ready" and
            .candidate.service == "lifemate-api" and
            .candidate.version == .expectedVersion and
            .candidate.unauthenticatedStatus == "401" and
            .current.status == "ok" and
            .current.database == "ready"
          ' release-live-probe.json >/dev/null
