name: release-live-probe

on:
  pull_request:
    paths:
      - '.github/workflows/release-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect redacted bootstrap diagnostics
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_url='https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-smoke'
          current_url='https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api'

          diagnostic="$(curl --fail --silent --show-error --retry 4 --retry-all-errors "$diagnostic_url")"
          current_health="$(curl --fail --silent --show-error --retry 4 --retry-all-errors "$current_url/health")"
          current_unauthorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$current_url/api/v1/me")"

          echo "$diagnostic" | jq -e 'type == "object"' > release-live-probe.json
          jq --arg currentStatus "$(echo "$current_health" | jq -r '.status // "missing"')" \
             --arg currentDatabase "$(echo "$current_health" | jq -r '.database // "missing"')" \
             --arg currentUnauthorized "$current_unauthorized" \
             '. + {current:{status:$currentStatus,database:$currentDatabase,unauthenticatedStatus:$currentUnauthorized}}' \
             release-live-probe.json > release-live-probe.tmp
          mv release-live-probe.tmp release-live-probe.json

      - name: Upload redacted probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-live-probe
          path: release-live-probe.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce bootstrap diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.collect.outcome }}" = 'success'
          jq -e '
            .databaseUrlPresent == true and
            .vaultReadable == true and
            .dedicatedSecretLengthOk == true and
            .envSetWorks == true and
            .remoteSourceReachable == true and
            .remoteSourceStatus == 200 and
            .current.status == "ok" and
            .current.database == "ready" and
            .current.unauthenticatedStatus == "401"
          ' release-live-probe.json >/dev/null
