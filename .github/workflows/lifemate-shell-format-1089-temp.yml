name: lifemate-shell-format-1089-temp

on:
  push:
    branches:
      - feat/today-peek-sheet-1089

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/today-peek-sheet-1089
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - name: Apply canonical formatter
        run: dart format lifemate/lib lifemate/test
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lifemate/lib lifemate/test
          git commit -m "style(today): apply canonical Dart formatter (#1089)"
          git push origin HEAD:feat/today-peek-sheet-1089
