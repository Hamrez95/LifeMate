name: temporary-offline-832-reminder-runtime-retry

on:
  push:
    branches:
      - feat/offline-832-pending-treatment-reminder-runtime-20260905
    paths:
      - .github/workflows/temporary-offline-832-reminder-runtime-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-832-pending-treatment-reminder-runtime-20260905
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          cache: true
      - name: Apply patch script from first one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = Path('.github/workflows/temporary-offline-832-reminder-runtime-patch.yml').read_text()
          start = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/offline832_patch.py').write_text(script)
          subprocess.run(['python', '/tmp/offline832_patch.py'], check=True)
          PY
      - name: Format changed Dart files
        shell: bash
        run: |
          dart format \
            wellmate/lib/providers/notification_provider.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/test/pending_treatment_create_reminder_runtime_contract_test.dart
      - name: Remove both one-shot workflows and commit
        shell: bash
        run: |
          git rm \
            .github/workflows/temporary-offline-832-reminder-runtime-patch.yml \
            .github/workflows/temporary-offline-832-reminder-runtime-retry.yml
          git add \
            wellmate/lib/providers/notification_provider.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/test/pending_treatment_create_reminder_runtime_contract_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(wellmate): wire provisional treatment reminders at runtime (#832)"
          git push origin HEAD:feat/offline-832-pending-treatment-reminder-runtime-20260905
