name: apply-wellmate-health-hub

on:
  push:
    branches: ['feat/wellmate-health-hub']

permissions:
  contents: write

concurrency:
  group: apply-wellmate-health-hub
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PUB_ENVIRONMENT: bot:github_actions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply reviewed integration patch
        run: python3 tools/hotfix/run_wellmate_health_hub_patch.py

      - name: Remove one-shot patch machinery
        run: |
          rm tools/hotfix/apply_wellmate_health_hub.py
          rm tools/hotfix/run_wellmate_health_hub_patch.py
          rm .github/workflows/apply-wellmate-health-hub.yml

      - name: Format changed sources
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            packages/lifemate_client/lib/lifemate_client.dart \
            packages/lifemate_client/lib/src/health_observations_api.dart \
            packages/lifemate_client/test/health_observations_api_test.dart \
            wellmate/lib/core/widgets/wellmate_bottom_nav.dart \
            wellmate/lib/screens/calendar/custom_table_calendar.dart \
            wellmate/lib/screens/home/home_screen.dart \
            wellmate/lib/screens/health/health_entry_sheet.dart \
            wellmate/lib/screens/health/health_screen.dart \
            wellmate/test/health_screen_test.dart
          deno fmt \
            supabase/functions/lifemate-api/index.ts \
            supabase/functions/lifemate-api/deno.json \
            supabase/functions/lifemate-api/health_observations.ts \
            supabase/functions/lifemate-api/health_observations_test.ts

      - name: Validate Edge API
        working-directory: supabase/functions/lifemate-api
        run: |
          deno task check
          deno task test

      - name: Validate shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Validate WellMate
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit integrated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: integrate WellMate health hub'
          git push origin HEAD:feat/wellmate-health-hub
