name: provider-handle-key-rotation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run or apply'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      max_handles:
        description: 'Maximum active handles in this bounded batch (1-1000)'
        required: true
        default: '100'
        type: string
      after_account_id:
        description: 'Optional opaque Account UUID cursor from the prior batch'
        required: false
        default: ''
        type: string
      confirmation:
        description: 'Apply only: ROTATE-PROVIDER-HANDLES'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-provider-handle-key-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: beta
    env:
      LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY: ${{ secrets.LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY }}
      LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION }}
      LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY: ${{ secrets.LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY }}
      LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION }}
      LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_MODE: ${{ inputs.mode }}
      LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_MAX_HANDLES: ${{ inputs.max_handles }}
      LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_AFTER_ACCOUNT_ID: ${{ inputs.after_account_id }}
      LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL"
          [[ "$LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION" =~ ^[0-9]+$ ]]
          [[ "$LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION" -ne "$LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION"
          [[ "$LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_MAX_HANDLES" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_MAX_HANDLES" -ge 1
          test "$LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_MAX_HANDLES" -le 1000
          if [ "$LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_MODE" = 'apply' ]; then
            test "$LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_CONFIRM" = 'ROTATE-PROVIDER-HANDLES'
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify provider-handle rotation policy
        run: node tools/security/verify-provider-handle-key-rotation-policy.mjs

      - name: Check bounded rotation source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check tools/security/provider-handle-key-rotation.ts
          deno check tools/security/provider-handle-key-rotation.ts

      - name: Execute bounded provider-handle key rotation
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/provider-handle-key-rotation.json"
          deno run \
            --allow-env=LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL,LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY,LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION,LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY,LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION,LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_MODE,LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_MAX_HANDLES,LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_AFTER_ACCOUNT_ID,LIFEMATE_PROVIDER_HANDLE_KEY_ROTATION_CONFIRM \
            --allow-net \
            tools/security/provider-handle-key-rotation.ts > "$summary_file"
          jq -e '
            (.mode == "dry-run" or .mode == "apply") and
            (.scannedHandles | type == "number") and
            (.activeVersionHandles | type == "number") and
            (.previousVersionHandles | type == "number") and
            (.rotatedHandles | type == "number") and
            (.hasMore | type == "boolean") and
            ((.nextAfterAccountId == null) or (.nextAfterAccountId | type == "string"))
          ' "$summary_file" >/dev/null
          {
            echo '## Provider recovery-handle key rotation'
            echo ''
            echo "- mode: $(jq -r '.mode' "$summary_file")"
            echo "- scanned handles: $(jq -r '.scannedHandles' "$summary_file")"
            echo "- active-version handles: $(jq -r '.activeVersionHandles' "$summary_file")"
            echo "- previous-version handles: $(jq -r '.previousVersionHandles' "$summary_file")"
            echo "- rotated handles: $(jq -r '.rotatedHandles' "$summary_file")"
            echo "- has more: $(jq -r '.hasMore' "$summary_file")"
            echo "- next opaque Account cursor: $(jq -r '.nextAfterAccountId // "none"' "$summary_file")"
            echo '- provider subjects, ciphertext, nonces, DB URL and key material are intentionally omitted'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$summary_file"
