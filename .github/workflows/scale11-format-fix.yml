name: scale11-format-fix

on:
  push:
    branches: ['perf/scale-11-campaign-preflight']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-11-campaign-preflight
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format preflight sources
        run: deno fmt tools/operations/viral_preflight.ts tools/operations/viral_preflight_test.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/operations/viral_preflight.ts tools/operations/viral_preflight_test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(scale): format viral preflight gate'
          git push origin HEAD:perf/scale-11-campaign-preflight
