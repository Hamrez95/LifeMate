name: women-profile-owner-retirement

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'readiness, scrub or rehydrate'
        required: true
        default: readiness
        type: choice
        options:
          - readiness
          - scrub
          - rehydrate
      mode:
        description: 'dry-run or apply; readiness is dry-run only'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      max_profiles:
        description: 'Maximum profiles in a bounded batch (1-1000)'
        required: true
        default: '100'
        type: string
      confirmation:
        description: 'Apply only: SCRUB-WOMEN-PROFILE-OWNERS or REHYDRATE-WOMEN-PROFILE-OWNERS'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-women-profile-owner-retirement
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: beta
    env:
      LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_WOMEN_PROFILE_OWNER_OPERATION: ${{ inputs.operation }}
      LIFEMATE_WOMEN_PROFILE_OWNER_MODE: ${{ inputs.mode }}
      LIFEMATE_WOMEN_PROFILE_OWNER_MAX_PROFILES: ${{ inputs.max_profiles }}
      LIFEMATE_WOMEN_PROFILE_OWNER_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL"
          [[ "$LIFEMATE_WOMEN_PROFILE_OWNER_MAX_PROFILES" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_WOMEN_PROFILE_OWNER_MAX_PROFILES" -ge 1
          test "$LIFEMATE_WOMEN_PROFILE_OWNER_MAX_PROFILES" -le 1000
          if [ "$LIFEMATE_WOMEN_PROFILE_OWNER_OPERATION" = 'readiness' ]; then
            test "$LIFEMATE_WOMEN_PROFILE_OWNER_MODE" = 'dry-run'
          fi
          if [ "$LIFEMATE_WOMEN_PROFILE_OWNER_OPERATION" = 'scrub' ] && [ "$LIFEMATE_WOMEN_PROFILE_OWNER_MODE" = 'apply' ]; then
            test "$LIFEMATE_WOMEN_PROFILE_OWNER_CONFIRM" = 'SCRUB-WOMEN-PROFILE-OWNERS'
          fi
          if [ "$LIFEMATE_WOMEN_PROFILE_OWNER_OPERATION" = 'rehydrate' ] && [ "$LIFEMATE_WOMEN_PROFILE_OWNER_MODE" = 'apply' ]; then
            test "$LIFEMATE_WOMEN_PROFILE_OWNER_CONFIRM" = 'REHYDRATE-WOMEN-PROFILE-OWNERS'
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify Women profile owner retirement policy
        run: node tools/security/verify-women-profile-owner-retirement.mjs

      - name: Check bounded retirement source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check tools/security/women-profile-owner-retirement.ts
          deno check tools/security/women-profile-owner-retirement.ts

      - name: Execute bounded Women profile owner operation
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/women-profile-owner-retirement.json"
          deno run \
            --allow-env=LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL,LIFEMATE_WOMEN_PROFILE_OWNER_OPERATION,LIFEMATE_WOMEN_PROFILE_OWNER_MODE,LIFEMATE_WOMEN_PROFILE_OWNER_MAX_PROFILES,LIFEMATE_WOMEN_PROFILE_OWNER_CONFIRM \
            --allow-net \
            tools/security/women-profile-owner-retirement.ts > "$summary_file"
          jq -e '
            (.operation == "readiness" or .operation == "scrub" or .operation == "rehydrate") and
            (.mode == "dry-run" or .mode == "apply") and
            (.maxProfiles | type == "number") and
            (.readiness.totalProfiles | type == "number") and
            (.readiness.mappedProfiles | type == "number") and
            (.readiness.missingMappings | type == "number") and
            (.readiness.ambiguousMappings | type == "number") and
            (.readiness.linkedProfiles | type == "number") and
            (.readiness.retiredProfiles | type == "number") and
            (.readiness.mismatchedLegacyOwners | type == "number") and
            (.readiness.rehydrateConflicts | type == "number") and
            (.readiness.ready | type == "boolean") and
            (.scannedProfiles | type == "number") and
            (.changedProfiles | type == "number") and
            (.hasMore | type == "boolean")
          ' "$summary_file" >/dev/null
          {
            echo '## Women profile owner retirement'
            echo ''
            echo "- operation: $(jq -r '.operation' "$summary_file")"
            echo "- mode: $(jq -r '.mode' "$summary_file")"
            echo "- total profiles: $(jq -r '.readiness.totalProfiles' "$summary_file")"
            echo "- mapped profiles: $(jq -r '.readiness.mappedProfiles' "$summary_file")"
            echo "- missing mappings: $(jq -r '.readiness.missingMappings' "$summary_file")"
            echo "- ambiguous mappings: $(jq -r '.readiness.ambiguousMappings' "$summary_file")"
            echo "- mismatched legacy owners: $(jq -r '.readiness.mismatchedLegacyOwners' "$summary_file")"
            echo "- rehydrate conflicts: $(jq -r '.readiness.rehydrateConflicts' "$summary_file")"
            echo "- linked profiles: $(jq -r '.readiness.linkedProfiles' "$summary_file")"
            echo "- retired profiles: $(jq -r '.readiness.retiredProfiles' "$summary_file")"
            echo "- scanned profiles: $(jq -r '.scannedProfiles' "$summary_file")"
            echo "- changed profiles: $(jq -r '.changedProfiles' "$summary_file")"
            echo "- has more: $(jq -r '.hasMore' "$summary_file")"
            echo '- AppUser, Account and Person identifiers and the database URL are intentionally omitted'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$summary_file"
