name: admin-edge-api

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-admin-api/**'
      - 'supabase/functions/lifemate-admin-auth/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/admin_security_denial_contract.sql'
      - '.github/workflows/admin-edge-api.yml'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/lifemate-admin-api/**'
      - 'supabase/functions/lifemate-admin-auth/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/admin_security_denial_contract.sql'
      - '.github/workflows/admin-edge-api.yml'
      - 'AGENTS.md'

permissions:
  contents: write

concurrency:
  group: admin-edge-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: supabase/functions/lifemate-admin-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
          ref: ci/admin-edge-format-baseline-20260904
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format
        run: deno fmt --check
      - name: Type check
        run: deno task check
      - name: Unit tests diagnostic
        shell: bash
        run: |
          set +e
          deno task test > ../../../admin-test-diagnostic.log 2>&1
          status=$?
          cd ../../..
          printf '\nEXIT_STATUS=%s\n' "$status" >> admin-test-diagnostic.log
          git add admin-test-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: capture admin edge unit-test diagnostic" || true
          git push origin HEAD:ci/admin-edge-format-baseline-20260904
          exit "$status"
      - name: Security invariants
        shell: bash
        run: |
          set -euo pipefail
          check() { local label="$1"; shift; if "$@"; then echo "PASS: $label"; else echo "::error::$label"; exit 1; fi; }
          check_absent() { local label="$1"; shift; if "$@"; then echo "::error::$label"; exit 1; else echo "PASS: $label"; fi; }
          check_absent 'Admin API must not read Supabase service-role credentials.' grep -R --line-number -E 'SERVICE_ROLE|service.role' .
          check 'Admin API refuses privileged database fallback.' grep -Fq 'Refusing privileged DB fallback' runtime_config.ts
          check 'MFA AAL2 remains the default enforcement.' grep -Fq 'requireAal2' index.ts
          check 'Temporary AAL1 exception is bootstrap-subject bound.' grep -Fq 'LIFEMATE_ADMIN_BOOTSTRAP_AUTH_SUBJECT' auth.ts
          check 'Admin membership is server resolved.' grep -Fq 'getSnapshot(accountId)' index.ts
          check 'Audit access requires server-side permission.' grep -Fq 'security.audit.read' index.ts
          check 'Browser origins are allow-listed.' grep -Fq 'assertAllowedOrigin' index.ts
          check_absent 'Admin API must never query medication tables.' grep -R --line-number -E 'lifemate\.(medications|treatment_plans|dose_occurrences|women_calendar)' .

  workforce-auth-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/lifemate-admin-auth
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format
        run: deno fmt --check
      - name: Type check
        run: deno task check
      - name: Unit tests
        run: deno task test
      - name: Security invariants
        shell: bash
        run: |
          set -euo pipefail
          check() { local label="$1"; shift; if "$@"; then echo "PASS: $label"; else echo "::error::$label"; exit 1; fi; }
          check_absent() { local label="$1"; shift; if "$@"; then echo "::error::$label"; exit 1; else echo "PASS: $label"; fi; }
          check 'Username auth uses Supabase password verification.' grep -Fq 'signInWithPassword' index.ts
          check 'Self-registration remains pending role assignment.' grep -Fq 'pending_role_assignment' index.ts
          check 'Origin allow-list is mandatory.' grep -Fq 'config.allowedOrigins.has(origin)' index.ts
          check 'Login/signup are rate limited.' grep -Fq 'consume_workforce_auth_attempt' index.ts
          check 'Service-role credential is server-side only.' grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' runtime_config.ts
          check_absent 'Workforce auth must not write Auth password hashes directly.' grep -R --line-number -E 'encrypted_password|insert into auth\.users' .
          check_absent 'Workforce auth must not grant roles during signup.' grep -R --line-number -E 'insert into admin\.member_roles' .
