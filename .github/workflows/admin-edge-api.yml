name: admin-edge-api

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-admin-api/**'
      - 'supabase/functions/lifemate-admin-auth/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/admin_security_denial_contract.sql'
      - '.github/workflows/admin-edge-api.yml'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/lifemate-admin-api/**'
      - 'supabase/functions/lifemate-admin-auth/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/admin_security_denial_contract.sql'
      - '.github/workflows/admin-edge-api.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: admin-edge-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: supabase/functions/lifemate-admin-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format
        run: deno fmt --check
      - name: Type check
        run: deno task check
      - name: Diagnostic tests — auth/users/analytics
        continue-on-error: true
        run: deno test --no-check --allow-read=. auth_test.ts authorization_test.ts runtime_config_test.ts identity_resolution_test.ts validation_test.ts directory_test.ts user_detail_test.ts user_detail_permissions_test.ts analytics_catalog_test.ts analytics_kpis_test.ts growth_analytics_test.ts advisor_test.ts relationships_test.ts relationship_ledger_test.ts user_actions_test.ts
      - name: Diagnostic tests — support/commerce
        continue-on-error: true
        run: deno test --no-check --allow-read=. support_test.ts support_detail_test.ts support_conversation_contract_test.ts commerce_test.ts commerce_detail_test.ts commerce_transactions_test.ts commerce_transaction_detail_test.ts commerce_promotions_test.ts commerce_catalog_test.ts commerce_catalog_v2_mutations_test.ts commerce_catalog_v2_source_test.ts manual_entitlement_adjustments_test.ts manual_entitlement_schedule_hardening_test.ts manual_entitlement_execution_hardening_test.ts payment_operations_test.ts payment_operations_contract_test.ts payment_operations_security_test.ts
      - name: Diagnostic tests — growth/marketing/product
        continue-on-error: true
        run: deno test --no-check --allow-read=. growth_reward_admin_test.ts global_search_test.ts notifications_test.ts performance_guardrails_test.ts marketing_campaigns_test.ts marketing_campaign_detail_test.ts marketing_content_calendar_test.ts campaign_orchestrator_test.ts campaign_orchestrator_audit_semantics_test.ts campaign_orchestrator_read_contract_test.ts product_version_analytics_test.ts product_update_policy_mutation_test.ts experiments_test.ts feedback_admin_test.ts feedback_admin_privacy_test.ts
      - name: Diagnostic tests — privacy/finance/security
        continue-on-error: true
        run: deno test --no-check --allow-read=. privacy_consent_test.ts finance_test.ts finance_budget_test.ts finance_cash_test.ts security_rbac_test.ts security_role_detail_test.ts audience_segments_test.ts audience_segments_source_test.ts custom_roles_test.ts approval_requests_test.ts retention_routes_test.ts abuse_rules_test.ts
      - name: Diagnostic tests — platform/research
        continue-on-error: true
        run: deno test --no-check --allow-read=. platform_controls_test.ts platform_controls_admin_test.ts platform_controls_concurrency_test.ts research_dataset_policy_test.ts research_dataset_filters_test.ts research_dataset_routes_test.ts admin_data_model_parity_test.ts
      - name: Unit tests
        run: deno task test
      - name: Security invariants
        shell: bash
        run: |
          set -euo pipefail
          check() { local label="$1"; shift; if "$@"; then echo "PASS: $label"; else echo "::error::$label"; exit 1; fi; }
          check_absent() { local label="$1"; shift; if "$@"; then echo "::error::$label"; exit 1; else echo "PASS: $label"; fi; }
          check_absent 'Admin API must not read Supabase service-role credentials.' grep -R --line-number -E 'SERVICE_ROLE|service.role' .
          check 'Admin API refuses privileged database fallback.' grep -Fq 'Refusing privileged DB fallback' runtime_config.ts
          check 'MFA AAL2 remains the default enforcement.' grep -Fq 'requireAal2' index.ts
          check 'Temporary AAL1 exception is bootstrap-subject bound.' grep -Fq 'LIFEMATE_ADMIN_BOOTSTRAP_AUTH_SUBJECT' auth.ts
          check 'Admin membership is server resolved.' grep -Fq 'getSnapshot(accountId)' index.ts
          check 'Audit access requires server-side permission.' grep -Fq 'security.audit.read' index.ts
          check 'Browser origins are allow-listed.' grep -Fq 'assertAllowedOrigin' index.ts
          check_absent 'Admin API must never query medication tables.' grep -R --line-number -E 'lifemate\.(medications|treatment_plans|dose_occurrences|women_calendar)' .

  workforce-auth-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/lifemate-admin-auth
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format
        run: deno fmt --check
      - name: Type check
        run: deno task check
      - name: Unit tests
        run: deno task test
      - name: Security invariants
        shell: bash
        run: |
          set -euo pipefail
          check() { local label="$1"; shift; if "$@"; then echo "PASS: $label"; else echo "::error::$label"; exit 1; fi; }
          check_absent() { local label="$1"; shift; if "$@"; then echo "::error::$label"; exit 1; else echo "PASS: $label"; fi; }
          check 'Username auth uses Supabase password verification.' grep -Fq 'signInWithPassword' index.ts
          check 'Self-registration remains pending role assignment.' grep -Fq 'pending_role_assignment' index.ts
          check 'Origin allow-list is mandatory.' grep -Fq 'config.allowedOrigins.has(origin)' index.ts
          check 'Login/signup are rate limited.' grep -Fq 'consume_workforce_auth_attempt' index.ts
          check 'Service-role credential is server-side only.' grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' runtime_config.ts
          check_absent 'Workforce auth must not write Auth password hashes directly.' grep -R --line-number -E 'encrypted_password|insert into auth\.users' .
          check_absent 'Workforce auth must not grant roles during signup.' grep -R --line-number -E 'insert into admin\.member_roles' .
