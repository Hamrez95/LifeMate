name: tmp-offline-833-contract-fix

on:
  push:
    branches:
      - feat/offline-833-private-daily-checkin-contract-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-833-private-daily-checkin-contract-20260906
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.5
      - name: Fix contract and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/lifemate-api/person_women_calendar.ts')
          text = path.read_text()
          old = '''              private_notes = ${privateNotes},
              share_summary_with_companion = ${shareSummaryWithCompanion},
              version = version + 1, updated_at_utc = ${now}'''
          new = '''              private_notes = ${privateNotes},
              share_summary_with_companion = case
                when ${shareSummaryProvided}
                  then ${shareSummaryWithCompanion}
                else share_summary_with_companion
              end,
              version = version + 1, updated_at_utc = ${now}'''
          if old not in text:
              raise SystemExit('daily-log update sharing seam changed')
          path.write_text(text.replace(old, new, 1))

          path = Path('supabase/functions/lifemate-api/women_calendar_integration_test.ts')
          text = path.read_text()
          old = '''      const privateReplay = await women.upsertOwnerDailyLog(
        patient.appUserId,
        {
          version: privateReplay.version,'''
          new = '''      const privateReplay = await women.upsertOwnerDailyLog(
        patient.appUserId,
        {
          version: privateDailyLog.version,'''
          if old not in text:
              raise SystemExit('private replay version seam changed')
          path.write_text(text.replace(old, new, 1))
          PY

          deno fmt \
            supabase/functions/lifemate-api/person_women_calendar.ts \
            supabase/functions/lifemate-api/women_calendar_integration_test.ts
          deno test --allow-env \
            supabase/functions/lifemate-api/women_calendar_rich_period_test.ts
          rm -f .github/workflows/tmp-offline-833-contract-fix.yml
          git config user.name 'lifemate-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            supabase/functions/lifemate-api/person_women_calendar.ts \
            supabase/functions/lifemate-api/women_calendar_integration_test.ts \
            .github/workflows/tmp-offline-833-contract-fix.yml
          git diff --cached --check
          git commit -m 'fix(women): preserve omitted sharing on replay'
          git push origin HEAD:feat/offline-833-private-daily-checkin-contract-20260906
