name: round2-foundation-one-shot

on:
  push:
    branches:
      - fix/wellmate-physical-qa-round-2
    paths:
      - 'tools/hotfix/apply_round2_foundation.py'
      - '.github/workflows/round2-foundation-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: round2-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply focused round-2 foundation changes
        run: python3 tools/hotfix/apply_round2_foundation.py

      - name: Format touched Dart sources
        shell: bash
        run: |
          dart format \
            packages/lifemate_client/lib \
            packages/lifemate_client/test \
            wellmate/lib/core \
            wellmate/lib/main.dart \
            wellmate/lib/screens/treatments \
            wellmate/lib/screens/calendar/custom_table_calendar.dart \
            caremate/lib/core \
            caremate/lib/main.dart

      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate compile/analyze
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Verify CareMate compile/analyze
        working-directory: caremate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit generated foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: unify care presentation foundations'
          git push origin HEAD:fix/wellmate-physical-qa-round-2
