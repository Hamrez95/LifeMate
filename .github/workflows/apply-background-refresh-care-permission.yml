name: apply-background-refresh-care-permission

on:
  push:
    branches:
      - fix/background-refresh-care-permission
    paths:
      - .github/workflows/apply-background-refresh-care-permission.yml

permissions:
  contents: write

env:
  PUB_ENVIRONMENT: bot:github_actions

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/background-refresh-care-permission
          fetch-depth: 0

      - name: Apply deterministic source patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_patch.py
          python3 /tmp/apply_patch.py

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Format changed Dart files
        shell: bash
        run: |
          dart format packages/lifemate_client/lib/src/lifemate_care_management_api.dart packages/lifemate_client/test/lifemate_care_management_api_test.dart caremate/lib/main.dart caremate/lib/widgets/caremate_bottom_nav.dart caremate/lib/screens/caremate_root_shell.dart caremate/lib/screens/dashboard_screen.dart caremate/lib/screens/calendar/calendar_screen.dart caremate/lib/screens/feature_preview_screen.dart caremate/lib/screens/care_event_management_screen.dart wellmate/lib/screens/home/home_screen.dart wellmate/lib/screens/home/home_screen_content.dart wellmate/lib/screens/calendar/calendar_screen.dart wellmate/lib/screens/treatments/treatments_screen.dart wellmate/lib/screens/women_calendar/women_companion_screen.dart

      - name: Verify shared client
        run: |
          cd packages/lifemate_client
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        run: |
          cd wellmate
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify CareMate
        run: |
          cd caremate
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit' >&2; exit 1; }
          git commit -m 'perf: keep LifeMate screens warm with background refresh'
          git push origin HEAD:fix/background-refresh-care-permission
