name: apply-background-refresh-care-permission

on:
  push:
    branches:
      - fix/background-refresh-care-permission
    paths:
      - .github/workflows/apply-background-refresh-care-permission.yml

permissions:
  contents: write

env:
  PUB_ENVIRONMENT: bot:github_actions

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/background-refresh-care-permission
          fetch-depth: 0

      - name: Apply deterministic source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          # Candidate-aware care-management endpoint mapping.
          replace(
              'packages/lifemate_client/lib/src/lifemate_care_management_api.dart',
              """  factory LifeMateCareManagementApi.fromEnvironment({http.Client? httpClient}) {
    final config = AppConfig.fromEnvironment();
    final apiBase = config.apiBaseUri;
    final segments = apiBase.pathSegments.toList(growable: true);
    if (segments.isNotEmpty && segments.last == 'lifemate-api') {
      segments[segments.length - 1] = 'lifemate-care-management';
    } else {
      segments.add('lifemate-care-management');
    }
    final baseUri = apiBase.replace(path: '/${segments.join('/')}');
    return LifeMateCareManagementApi(
      baseUri: baseUri,
""",
              """  factory LifeMateCareManagementApi.fromEnvironment({http.Client? httpClient}) {
    final config = AppConfig.fromEnvironment();
    return LifeMateCareManagementApi(
      baseUri: managementBaseUriFor(config.apiBaseUri),
""",
          )
          replace(
