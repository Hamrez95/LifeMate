name: privacy-retention-patch

on:
  push:
    branches: ['privacy/p0-retention-v2-account-deletion']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: privacy/p0-retention-v2-account-deletion
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Wire worker integration coverage and deletion wording
        shell: python
        run: |
          import json
          from pathlib import Path

          deno = Path('supabase/functions/lifemate-worker/deno.json')
          data = json.loads(deno.read_text())
          data['tasks']['check'] = (
              'deno check index.ts policy_test.ts account_deletion_storage_test.ts '
              'queue_integration_test.ts account_deletion_integration_test.ts'
          )
          data['tasks']['test'] = (
              'deno test --no-check policy_test.ts account_deletion_storage_test.ts'
          )
          data['tasks']['test:integration'] = (
              'deno test --no-check --allow-env '
              '--allow-net=localhost:5432,127.0.0.1:5432 '
              'queue_integration_test.ts account_deletion_integration_test.ts'
          )
          deno.write_text(json.dumps(data, indent=2) + '\n')

          path = Path('packages/lifemate_client/lib/src/account_deletion_action.dart')
          text = path.read_text()
          old_fa = 'با ادامه، دسترسی حساب بلافاصله غیرفعال می‌شود، ارتباط‌های اشتراک‌گذاری و دسترسی‌های فعال لغو می‌شوند و پردازش حذف/ناشناس‌سازی طبق سیاست نگهداری داده آغاز می‌شود. اطلاعاتی که نگهداری آن‌ها الزام قانونی یا ایمنی دارد فوراً پاک نمی‌شوند.'
          new_fa = 'با ادامه، حساب بلافاصله غیرفعال و دسترسی‌ها لغو می‌شوند. پردازش حذف، داده‌های سلامت و تقویم بانوان متعلق به شما، شناسه‌های ورود و فایل‌های پروفایل را پاک می‌کند و اطلاعات هویتی باقیمانده را ناشناس می‌کند. فقط حداقل سوابق ناشناس لازم برای امنیت، رضایت، یکپارچگی داده مشترک یا الزامات قانونی نگه داشته می‌شود.'
          old_en = 'Upon proceeding, account access will be immediately disabled, sharing connections and active accesses will be revoked, and deletion/anonymization processing will begin in accordance with the data retention policy. Information whose retention is required by law or safety is not immediately deleted.'
          new_en = 'Continuing immediately disables the account and revokes access. Deletion processing removes your owned health and women-calendar data, sign-in identifiers and profile files, then anonymizes the remaining identity record. Only the minimum pseudonymous records required for security, consent, shared-data integrity or legal retention are kept.'
          if old_fa not in text or old_en not in text:
              raise SystemExit('account deletion wording anchor changed')
          path.write_text(text.replace(old_fa, new_fa).replace(old_en, new_en))
      - name: Canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/lifemate-worker/index.ts \
            supabase/functions/lifemate-worker/account_deletion_storage.ts \
            supabase/functions/lifemate-worker/account_deletion_storage_test.ts \
            supabase/functions/lifemate-worker/account_deletion_integration_test.ts
          dart format packages/lifemate_client/lib/src/account_deletion_action.dart
      - name: Commit wired retention-v2 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/lifemate-worker \
            packages/lifemate_client/lib/src/account_deletion_action.dart
          git commit -m 'feat(privacy): wire retention-v2 deletion runtime and tests'
          git push origin HEAD:privacy/p0-retention-v2-account-deletion
