name: identity-link-retirement-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-identity-link-retirement-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: beta
    env:
      LIFEMATE_IDENTITY_RETIREMENT_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_IDENTITY_LINK_KEY: ${{ secrets.LIFEMATE_IDENTITY_LINK_KEY }}
      LIFEMATE_IDENTITY_LINK_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_LINK_KEY_VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main read-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$LIFEMATE_IDENTITY_RETIREMENT_DATABASE_URL"
          test "${#LIFEMATE_IDENTITY_LINK_KEY}" -ge 32
          [[ "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" -ge 1
          test "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" -le 65535

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify raw-link source boundary
        run: node tools/security/verify-identity-raw-link-boundary.mjs

      - name: Check read-only readiness source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check tools/security/identity-link-retirement-readiness.ts
          deno check tools/security/identity-link-retirement-readiness.ts

      - name: Audit canonical token coverage
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/identity-link-retirement-readiness.json"
          error_file="$RUNNER_TEMP/identity-link-retirement-readiness.err"
          set +e
          deno run \
            --allow-env=LIFEMATE_IDENTITY_RETIREMENT_DATABASE_URL,LIFEMATE_IDENTITY_LINK_KEY,LIFEMATE_IDENTITY_LINK_KEY_VERSION \
            --allow-net \
            tools/security/identity-link-retirement-readiness.ts \
            > "$summary_file" 2> "$error_file"
          audit_status=$?
          set -e

          if ! jq -e '
            (.keyVersion | type == "number") and
            (.activeAccounts | type == "number") and
            (.tokenizedAccounts | type == "number") and
            (.missingCanonicalTokens | type == "number") and
            (.conflictingCanonicalTokens | type == "number") and
            (.activeRawAuthSubjects | type == "number") and
            (.activeRawProviderIdentities | type == "number") and
            (.unmappedActiveAccounts | type == "number") and
            (.readyForTokenOnly | type == "boolean")
          ' "$summary_file" >/dev/null 2>&1; then
            rm -f "$summary_file" "$error_file"
            echo '::error::Identity retirement readiness audit failed without a valid count-only summary.'
            exit 1
          fi

          {
            echo '## Identity-link retirement readiness'
            echo ''
            echo "- key version: $(jq -r '.keyVersion' "$summary_file")"
            echo "- active Accounts: $(jq -r '.activeAccounts' "$summary_file")"
            echo "- tokenized Accounts: $(jq -r '.tokenizedAccounts' "$summary_file")"
            echo "- missing canonical tokens: $(jq -r '.missingCanonicalTokens' "$summary_file")"
            echo "- conflicting canonical tokens: $(jq -r '.conflictingCanonicalTokens' "$summary_file")"
            echo "- unmapped active Accounts: $(jq -r '.unmappedActiveAccounts' "$summary_file")"
            echo "- active raw AppUser subjects retained for migration: $(jq -r '.activeRawAuthSubjects' "$summary_file")"
            echo "- active raw provider identities retained for migration: $(jq -r '.activeRawProviderIdentities' "$summary_file")"
            echo "- data ready for token-only lookup: $(jq -r '.readyForTokenOnly' "$summary_file")"
            echo '- raw subjects, tokens, database URLs and key material are intentionally omitted'
          } >> "$GITHUB_STEP_SUMMARY"

          ready="$(jq -r '.readyForTokenOnly' "$summary_file")"
          rm -f "$summary_file" "$error_file"
          if [ "$audit_status" -ne 0 ] || [ "$ready" != 'true' ]; then
            echo '::error::Canonical token coverage is not ready for token-only activation.'
            exit 1
          fi
