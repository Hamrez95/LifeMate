name: provider-handle-key-rotation-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-provider-handle-key-rotation-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: beta
    env:
      LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION }}
      LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main read-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL"
          [[ "$LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION" =~ ^[0-9]+$ ]]
          [[ "$LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION" -ne "$LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify provider-handle rotation policy
        run: node tools/security/verify-provider-handle-key-rotation-policy.mjs

      - name: Check read-only readiness source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check tools/security/provider-handle-key-rotation-readiness.ts
          deno check tools/security/provider-handle-key-rotation-readiness.ts

      - name: Audit active-version provider-handle coverage
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/provider-handle-key-rotation-readiness.json"
          error_file="$RUNNER_TEMP/provider-handle-key-rotation-readiness.err"
          set +e
          deno run \
            --allow-env=LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL,LIFEMATE_IDENTITY_PROVIDER_HANDLE_KEY_VERSION,LIFEMATE_IDENTITY_PROVIDER_HANDLE_PREVIOUS_KEY_VERSION \
            --allow-net \
            tools/security/provider-handle-key-rotation-readiness.ts \
            > "$summary_file" 2> "$error_file"
          audit_status=$?
          set -e
          if ! jq -e '
            (.activeVersion | type == "number") and
            (.previousVersion | type == "number") and
            (.currentHandles | type == "number") and
            (.activeVersionReadyHandles | type == "number") and
            (.previousVersionHandles | type == "number") and
            (.unknownVersionHandles | type == "number") and
            (.invalidEnvelopeHandles | type == "number") and
            (.readyForPreviousKeyRemoval | type == "boolean")
          ' "$summary_file" >/dev/null 2>&1; then
            rm -f "$summary_file" "$error_file"
            echo '::error::Provider-handle readiness failed without a valid count-only summary.'
            exit 1
          fi
          {
            echo '## Provider recovery-handle key rotation readiness'
            echo ''
            echo "- active key version: $(jq -r '.activeVersion' "$summary_file")"
            echo "- previous key version: $(jq -r '.previousVersion' "$summary_file")"
            echo "- current active handles: $(jq -r '.currentHandles' "$summary_file")"
            echo "- active-version ready handles: $(jq -r '.activeVersionReadyHandles' "$summary_file")"
            echo "- previous-version handles: $(jq -r '.previousVersionHandles' "$summary_file")"
            echo "- unknown-version handles: $(jq -r '.unknownVersionHandles' "$summary_file")"
            echo "- invalid envelopes: $(jq -r '.invalidEnvelopeHandles' "$summary_file")"
            echo "- safe to remove previous runtime key: $(jq -r '.readyForPreviousKeyRemoval' "$summary_file")"
            echo '- provider subjects, ciphertext, nonces, DB URL and encryption key material are intentionally omitted'
          } >> "$GITHUB_STEP_SUMMARY"
          ready="$(jq -r '.readyForPreviousKeyRemoval' "$summary_file")"
          rm -f "$summary_file" "$error_file"
          if [ "$audit_status" -ne 0 ] || [ "$ready" != 'true' ]; then
            echo '::error::Provider-handle active-version coverage is not ready for previous-key removal.'
            exit 1
          fi
