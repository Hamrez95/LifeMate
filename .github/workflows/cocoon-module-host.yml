name: cocoon-module-host

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cocoonmate/**'
      - 'packages/cocoonmate_module/**'
      - 'packages/lifemate_client/lib/src/lifemate_auth.dart'
      - 'supabase/functions/lifemate-api/client_remote_config.ts'
      - 'supabase/functions/lifemate-api/client_remote_config_test.ts'
      - '.github/workflows/cocoon-module-host.yml'

permissions:
  contents: read

jobs:
  runtime-config-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format runtime config contract
        working-directory: supabase/functions/lifemate-api
        run: deno fmt --check client_remote_config.ts client_remote_config_test.ts
      - name: Check runtime config contract
        working-directory: supabase/functions/lifemate-api
        run: deno check client_remote_config.ts client_remote_config_test.ts
      - name: Test runtime config contract
        working-directory: supabase/functions/lifemate-api
        run: deno test client_remote_config_test.ts

  module-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve module
        working-directory: packages/cocoonmate_module
        run: flutter pub get
      - name: Format owned Cocoon bootstrap sources
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            packages/cocoonmate_module/lib \
            packages/cocoonmate_module/test \
            packages/lifemate_client/lib/src/lifemate_auth.dart \
            cocoonmate/lib \
            cocoonmate/test
          git diff --exit-code -- \
            packages/cocoonmate_module/lib \
            packages/cocoonmate_module/test \
            packages/lifemate_client/lib/src/lifemate_auth.dart \
            cocoonmate/lib \
            cocoonmate/test
      - name: Analyze module
        working-directory: packages/cocoonmate_module
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test module
        working-directory: packages/cocoonmate_module
        run: flutter test
      - name: Generate standalone Android platform
        working-directory: cocoonmate
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.mylifemate --project-name cocoonmate .
          rm -f test/widget_test.dart analysis_options.yaml
      - name: Resolve standalone host
        working-directory: cocoonmate
        run: flutter pub get
      - name: Analyze standalone host
        working-directory: cocoonmate
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test standalone host
        working-directory: cocoonmate
        run: flutter test
      - name: Build standalone Android APK
        working-directory: cocoonmate
        run: flutter build apk --debug
      - name: Enforce module boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/cocoonmate_module/lib/cocoonmate_module.dart
          test -f cocoonmate/lib/main.dart
          ! grep -R -n -E 'supabase\.from|SupabaseClient|service_role|pregnancy\.episodes' packages/cocoonmate_module/lib cocoonmate/lib
          test "$(find cocoonmate/lib -type f | wc -l)" -le 3
          grep -Fq "LifeMateBootstrap.initialize" cocoonmate/lib/main.dart
          grep -Fq "LifeMateExperienceGate" cocoonmate/lib/app/cocoon_standalone_app.dart
          grep -Fq "CocoonPregnancyApiClient" cocoonmate/lib/app/cocoon_standalone_app.dart
          grep -Fq "LifeMateRemoteConfigClient" cocoonmate/lib/app/cocoon_standalone_app.dart
      - uses: actions/upload-artifact@v4
        with:
          name: cocoonmate-debug-apk
          path: cocoonmate/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
