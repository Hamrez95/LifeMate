name: lifemate-device-qa-artifact

on:
  pull_request:
    branches:
      - feat/v0.9.0-internal.3-localization
    paths:
      - 'wellmate/**'
      - 'caremate/**'
      - 'packages/lifemate_client/**'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/migrations/**'
      - '.github/workflows/lifemate-device-qa-artifact.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: lifemate-device-qa-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-build-report:
    if: ${{ github.head_ref == 'feat/women-calendar-care-access-notifications' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lifemate_device_qa_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_device_qa_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__LifeMateDb: Host=localhost;Port=5432;Database=lifemate_device_qa_tests;Username=postgres;Password=postgres
      Security__Invitations__ContactPepper: integration-only-invitation-contact-pepper-32-bytes-minimum
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_device_qa_tests

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/women-calendar-care-access-notifications
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Verify Flutter packages and UI contracts
        shell: bash
        run: |
          set -euo pipefail
          for project in packages/lifemate_client wellmate caremate; do
            (
              cd "$project"
              flutter pub get
              flutter analyze --no-fatal-infos --no-fatal-warnings
              flutter test
            )
          done
          grep -q '^version: 0.9.0-internal.5+16$' wellmate/pubspec.yaml
          grep -q '^version: 0.9.0-internal.5+16$' caremate/pubspec.yaml
          grep -q "defaultValue: false" packages/lifemate_client/lib/src/feature_flags.dart
          grep -q "LifeMateAvatarPicker" wellmate/lib/screens/profile/editable_profile_screen.dart
          grep -q "LifeMateAvatarPicker" caremate/lib/screens/editable_profile_screen.dart
          grep -q "تاریخ‌ها تخمینی هستند و جایگزین نظر پزشک نیستند" wellmate/lib/screens/women_calendar/women_calendar_screen.dart

      - name: Verify Edge unit contract
        working-directory: supabase/functions/lifemate-api
        shell: bash
        run: |
          set -euo pipefail
          deno task check
          deno task test

      - name: Build isolated schema and run access journeys
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend-dotnet/LifeMate.sln --verbosity minimal
          dotnet tool restore
          dotnet build backend-dotnet/LifeMate.sln --configuration Release --no-restore
          dotnet ef database update \
            --configuration Release \
            --no-build \
            --project backend-dotnet/src/LifeMate.Infrastructure \
            --startup-project backend-dotnet/src/LifeMate.Api
          for migration in \
            supabase/migrations/20260803173000_add_consent_scoped_care_events.sql \
            supabase/migrations/20260804002000_lock_down_public_health_status.sql \
            supabase/migrations/20260804003000_add_user_profile_version.sql \
            supabase/migrations/20260804130000_add_women_calendar_pilot.sql \
            supabase/migrations/20260804213000_add_profile_avatar_key.sql
          do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done
          (
            cd supabase/functions/lifemate-api
            deno task test:integration
          )

      - name: Enforce privacy and access invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"privateNotes" in episodes\[0\], false' supabase/functions/lifemate-api/women_calendar_integration_test.ts
          grep -q "cleanupWomenCalendarRun" supabase/functions/lifemate-api/women_calendar_integration_test.ts
          grep -q "women_calendar_feature_disabled" supabase/functions/lifemate-api/index.ts
          grep -q "invalid_avatar_key" supabase/functions/lifemate-api/profile.ts
          grep -q "metadata_json, null" supabase/functions/lifemate-api/profile.ts
          grep -q "visibility: NotificationVisibility.private" wellmate/lib/providers/notification_provider.dart
          grep -q "visibility: NotificationVisibility.private" caremate/lib/providers/care_notification_provider.dart
          ! grep -q "cancelAll" caremate/lib/providers/care_notification_provider.dart
          ! grep -q "mother_avatar.png" wellmate/lib/screens/profile/profile_screen.dart
          ! grep -q "assets/images/Caregiver.png" caremate/lib/screens/profile_screen.dart
          if grep -R --line-number -E "تخمک‌گذاری قطعی|افزایش باروری|روش پیشگیری از بارداری|fertility window|ovulation day|contraception method" \
            wellmate/lib/screens/women_calendar \
            caremate/lib/screens/women_calendar \
            supabase/functions/lifemate-api/women_calendar.ts; then
            exit 1
          fi

      - name: Verify non-production candidate API
        shell: bash
        env:
          LIFEMATE_API_BASE_URL: ${{ vars.LIFEMATE_CANDIDATE_API_BASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api-candidate' }}
        run: |
          set -euo pipefail
          case "$LIFEMATE_API_BASE_URL" in
            https://*/lifemate-api-candidate) ;;
            *) echo 'Device-QA build must target the non-production candidate API.' >&2; exit 1 ;;
          esac
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors "$LIFEMATE_API_BASE_URL/health")"
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"database":"ready"'
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$status" = "401"

      - name: Build internal Device-QA APKs
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
          LIFEMATE_API_BASE_URL: ${{ vars.LIFEMATE_CANDIDATE_API_BASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api-candidate' }}
        run: |
          set -euo pipefail
          build_args=(
            --release
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_GOOGLE_AUTH=false"
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=true"
          )
          (cd wellmate && flutter build apk "${build_args[@]}")
          (cd caremate && flutter build apk "${build_args[@]}")
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk \
            wellmate/build/app/outputs/flutter-apk/WellMate-0.9.0-internal.5-device-qa.apk
          cp caremate/build/app/outputs/flutter-apk/app-release.apk \
            caremate/build/app/outputs/flutter-apk/CareMate-0.9.0-internal.5-device-qa.apk

      - name: Inspect APKs and write evidence
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/lifemate-device-qa-inspection
          mkdir -p "$report"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          test -x "$apksigner_bin"

          inspect() {
            local app="$1"
            local apk="$2"
            local package="$3"
            local logo="$4"
            "$aapt_bin" dump badging "$apk" > "$report/$app-badging.txt"
            "$aapt_bin" dump permissions "$apk" >> "$report/$app-badging.txt"
            grep -Fq "package: name='$package'" "$report/$app-badging.txt"
            grep -Fq 'android.permission.INTERNET' "$report/$app-badging.txt"
            "$apksigner_bin" verify --verbose --print-certs "$apk" > "$report/$app-signing.txt"
            unzip -Z1 "$apk" > "$report/$app-files.txt"
            grep -Fq "assets/flutter_assets/$logo" "$report/$app-files.txt"
            grep -Fq 'assets/flutter_assets/assets/fonts/Vazir.ttf' "$report/$app-files.txt"
            sha256sum "$apk" >> "$report/SHA256SUMS.txt"
          }

          inspect wellmate \
            wellmate/build/app/outputs/flutter-apk/WellMate-0.9.0-internal.5-device-qa.apk \
            com.lifemate.wellmate \
            assets/images/WellMateWithoutBack.png
          inspect caremate \
            caremate/build/app/outputs/flutter-apk/CareMate-0.9.0-internal.5-device-qa.apk \
            com.lifemate.caremate \
            assets/images/CareMateWithoutBack.png

          cat > "$report/DEVICE-QA-NOTICE.txt" <<'EOF'
LifeMate 0.9.0-internal.5+16
Internal Device-QA only. Not Stable. Not RC. Not for public distribution.
Candidate API only. Google authentication disabled. Women calendar pilot enabled.
Physical QA is still required for notification permission, exact alarms,
lock-screen privacy, reboot, timezone change and app-update resynchronization.
EOF

      - name: Upload internal Device-QA APKs
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-0.9.0-internal.5-device-qa-apks
          path: |
            wellmate/build/app/outputs/flutter-apk/WellMate-0.9.0-internal.5-device-qa.apk
            caremate/build/app/outputs/flutter-apk/CareMate-0.9.0-internal.5-device-qa.apk
            /tmp/lifemate-device-qa-inspection/**
          if-no-files-found: error
          retention-days: 14

      - name: Report Device-QA evidence on PR
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          marker='<!-- lifemate-device-qa-artifact -->'
          body=$(cat <<EOF
$marker
## LifeMate internal Device-QA artifact

- Head SHA: \`$GITHUB_SHA\`
- Workflow Run ID: \`$GITHUB_RUN_ID\`
- Result: **$JOB_STATUS**
- Artifact: \`lifemate-0.9.0-internal.5-device-qa-apks\`
- Version: \`0.9.0-internal.5+16\`
- Scope: Internal Device-QA only; not Stable, not RC, and not for public distribution.
- Remaining gate: physical notification/access QA.
EOF
          )
          existing=$(gh api \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
            | tail -n 1)
          if [[ -n "$existing" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -f body="$body" >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
          fi
