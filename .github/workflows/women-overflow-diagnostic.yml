name: women-overflow-diagnostic

on:
  push:
    branches:
      - feat/women-companion-experience

permissions:
  contents: read

concurrency:
  group: women-overflow-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/women-companion-experience
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Add overflow checkpoint diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wellmate/test/women_companion_experience_test.dart')
          text = path.read_text()
          old = """        expect(find.text(title), findsOneWidget);
          expect(tester.takeException(), isNull);
        }
"""
          new = """        expect(find.text(title), findsOneWidget);
          final exception = tester.takeException();
          print('WOMEN_OVERFLOW_CHECKPOINT: $title => $exception');
          expect(exception, isNull, reason: 'overflow after $title');
        }
"""
          if old not in text:
              raise SystemExit('diagnostic target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run active women dashboard test
        working-directory: wellmate
        run: |
          flutter pub get
          flutter test --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true test/women_companion_experience_test.dart --reporter expanded
