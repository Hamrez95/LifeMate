name: lifemate-internal-device-qa-build

on:
  pull_request:
    branches:
      - feat/v0.9.0-internal.3-localization
    paths:
      - 'wellmate/**'
      - 'caremate/**'
      - 'packages/lifemate_client/**'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/migrations/**'
      - '.github/workflows/lifemate-internal-device-qa-build.yml'

permissions:
  contents: read

concurrency:
  group: lifemate-internal-device-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-internal-device-qa:
    if: ${{ github.head_ref == 'feat/women-calendar-care-access-notifications' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/women-calendar-care-access-notifications
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Verify internal candidate identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 0.9.0-internal.5+16$' wellmate/pubspec.yaml
          grep -q '^version: 0.9.0-internal.5+16$' caremate/pubspec.yaml
          grep -q "defaultValue: false" packages/lifemate_client/lib/src/feature_flags.dart
          grep -q "LifeMateAvatarPicker" wellmate/lib/screens/profile/editable_profile_screen.dart
          grep -q "LifeMateAvatarPicker" caremate/lib/screens/editable_profile_screen.dart
          grep -q "تاریخ‌ها تخمینی هستند و جایگزین نظر پزشک نیستند" wellmate/lib/screens/women_calendar/women_calendar_screen.dart

      - name: Verify candidate API boundary
        shell: bash
        env:
          LIFEMATE_API_BASE_URL: ${{ vars.LIFEMATE_CANDIDATE_API_BASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api-candidate' }}
        run: |
          set -euo pipefail
          case "$LIFEMATE_API_BASE_URL" in
            https://*/lifemate-api-candidate) ;;
            *) echo 'Internal device-QA must target the non-production candidate API.' >&2; exit 1 ;;
          esac
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors "$LIFEMATE_API_BASE_URL/health")"
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"database":"ready"'
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$status" = "401"

      - name: Build WellMate and CareMate internal device-QA APKs
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
          LIFEMATE_API_BASE_URL: ${{ vars.LIFEMATE_CANDIDATE_API_BASE_URL || 'https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api-candidate' }}
        run: |
          set -euo pipefail
          build_args=(
            --release
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_GOOGLE_AUTH=false"
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=true"
          )
          (cd wellmate && flutter pub get && flutter build apk "${build_args[@]}")
          (cd caremate && flutter pub get && flutter build apk "${build_args[@]}")
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk \
            wellmate/build/app/outputs/flutter-apk/WellMate-0.9.0-internal.5-device-qa.apk
          cp caremate/build/app/outputs/flutter-apk/app-release.apk \
            caremate/build/app/outputs/flutter-apk/CareMate-0.9.0-internal.5-device-qa.apk

      - name: Inspect APK manifests signatures and privacy assets
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/lifemate-device-qa-inspection
          mkdir -p "$report"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          test -x "$apksigner_bin"

          inspect() {
            local app="$1"
            local apk="$2"
            local package="$3"
            local logo="$4"
            "$aapt_bin" dump badging "$apk" > "$report/$app-badging.txt"
            "$aapt_bin" dump permissions "$apk" >> "$report/$app-badging.txt"
            grep -Fq "package: name='$package'" "$report/$app-badging.txt"
            grep -Fq 'android.permission.INTERNET' "$report/$app-badging.txt"
            "$apksigner_bin" verify --verbose --print-certs "$apk" > "$report/$app-signing.txt"
            unzip -Z1 "$apk" > "$report/$app-files.txt"
            grep -Fq "assets/flutter_assets/$logo" "$report/$app-files.txt"
            grep -Fq 'assets/flutter_assets/assets/fonts/Vazir.ttf' "$report/$app-files.txt"
            sha256sum "$apk" >> "$report/SHA256SUMS.txt"
          }

          inspect wellmate \
            wellmate/build/app/outputs/flutter-apk/WellMate-0.9.0-internal.5-device-qa.apk \
            com.lifemate.wellmate \
            assets/images/WellMateWithoutBack.png
          inspect caremate \
            caremate/build/app/outputs/flutter-apk/CareMate-0.9.0-internal.5-device-qa.apk \
            com.lifemate.caremate \
            assets/images/CareMateWithoutBack.png

          cat > "$report/DEVICE-QA-NOTICE.txt" <<'EOF'
LifeMate 0.9.0-internal.5+16
Internal Device-QA only. Not Stable. Not RC. Not for public distribution.
Candidate API only. Google authentication disabled. Women calendar pilot enabled.
Physical QA still required for notification permission, exact alarm behavior,
lock-screen privacy, reboot, timezone change and app update resynchronization.
EOF

      - name: Upload internal device-QA APKs
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-0.9.0-internal.5-device-qa-apks
          path: |
            wellmate/build/app/outputs/flutter-apk/WellMate-0.9.0-internal.5-device-qa.apk
            caremate/build/app/outputs/flutter-apk/CareMate-0.9.0-internal.5-device-qa.apk
            /tmp/lifemate-device-qa-inspection/**
          if-no-files-found: error
          retention-days: 14
