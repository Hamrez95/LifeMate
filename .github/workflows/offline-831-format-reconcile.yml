name: offline-831-format-reconcile

on:
  push:
    branches:
      - feat/offline-831-treatment-conflict-summary-20260905
    paths:
      - 'packages/lifemate_core/test/offline_conflict_retry_acceptance_test.dart'
      - '.github/workflows/offline-831-format-reconcile.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Canonical Dart format
        run: dart format packages/lifemate_core/test/offline_conflict_retry_acceptance_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-831-formatted-test
          path: packages/lifemate_core/test/offline_conflict_retry_acceptance_test.dart
          if-no-files-found: error
          retention-days: 1
