name: apply-qa-fixes-v2

on:
  push:
    branches:
      - fix/profile-photo-reminder-state
    paths:
      - '.github/workflows/apply-qa-fixes-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          show-progress: false
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          source = Path('.github/workflows/apply-qa-fixes.yml').read_text()
          marker = "printf '%s' '"
          start = source.index(marker) + len(marker)
          end = source.index("' | base64 --decode", start)
          payload = base64.b64decode(source[start:end])
          Path('/tmp/lifemate-qa.patch').write_bytes(gzip.decompress(payload))
          PY
          patch --batch --forward -p1 < /tmp/lifemate-qa.patch
          python3 - <<'PY'
          from pathlib import Path

          for name in ('wellmate/lib/main.dart', 'caremate/lib/main.dart'):
              path = Path(name)
              path.write_text(path.read_text().rstrip() + '\n')
          PY
          git checkout -- .github/workflows/internal-device-qa-apks.yml
          git diff --check
          git config user.name 'Hamidreza Pakpour'
          git config user.email '136631329+Hamrez95@users.noreply.github.com'
          git add caremate packages supabase wellmate
          git commit -m 'fix: complete physical QA feedback for navigation profile and calendar'
          git push origin HEAD:fix/profile-photo-reminder-state
