name: tmp-main-edge-invariant-patch

on:
  push:
    branches:
      - 'foundation/p0-person-owned-women-calendar'

permissions:
  contents: read

jobs:
  emit-patched-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - name: Emit patched main-edge workflow as base64 annotations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/main-edge-deploy.yml')
          text = path.read_text()
          old = "check 'Daily companion sharing is explicit per entry.' grep -Fq 'share_summary_with_companion = true' women_calendar.ts"
          new = "check 'Daily companion sharing is explicit per entry.' grep -Fq 'share_summary_with_companion = true' women_calendar_legacy.ts"
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy guard reference')
          path.write_text(text.replace(old, new))
          PY
          index=0
          while IFS= read -r chunk; do
            printf '::error title=MAINEDGE_%03d::%s\n' "$index" "$chunk"
            index=$((index + 1))
          done < <(base64 -w0 .github/workflows/main-edge-deploy.yml | fold -w 6000)
          exit 1
