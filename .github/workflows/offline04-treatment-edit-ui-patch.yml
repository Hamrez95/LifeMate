name: offline04-treatment-edit-ui-patch

on:
  push:
    branches:
      - feat/offline-04-wellmate-treatment-edit-fallback-20260905-v2
    paths:
      - '.github/workflows/offline04-treatment-edit-ui-patch.yml'
      - 'tools/hotfix/apply_offline04_treatment_edit_ui.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-04-wellmate-treatment-edit-fallback-20260905-v2
          fetch-depth: 0
      - name: Apply reviewed deterministic patch
        run: python3 tools/hotfix/apply_offline04_treatment_edit_ui.py
      - name: Commit product-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            wellmate/lib/screens/treatments/edit_treatment_screen.dart \
            tools/hotfix/apply_offline04_treatment_edit_ui.py \
            .github/workflows/offline04-treatment-edit-ui-patch.yml
          git commit -m 'feat(wellmate): queue transient treatment edits offline (#832)'
          git push origin HEAD:feat/offline-04-wellmate-treatment-edit-fallback-20260905-v2
