name: tmp-offline-833-episode-ui-fallback

on:
  push:
    branches:
      - feat/offline-833-episode-ui-fallback-20260906

permissions:
  contents: write

jobs:
  apply-verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply exact scoped patch
        run: |
          set -euo pipefail
          python tools/hotfix/apply_offline_833_episode_bridge_hardening.py
          python tools/hotfix/apply_offline_833_episode_ui_fallback.py
          python - <<'PY'
          from pathlib import Path
          path = Path('wellmate/lib/screens/women_calendar/women_calendar_screen.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace('_dateKey(', '_episodeDateKey(')
          marker = '  void _replaceEpisodeLocally(\n'
          helper = """  String _episodeDateKey(DateTime value) =>
              '${value.year.toString().padLeft(4, '0')}-'
              '${value.month.toString().padLeft(2, '0')}-'
              '${value.day.toString().padLeft(2, '0')}';

"""
          if helper not in text:
              if marker not in text:
                  raise SystemExit('episode local helper marker missing')
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          dart format \
            packages/lifemate_client/lib/src/lifemate_api_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart \
            packages/lifemate_client/lib/src/women_episode_offline_outbox.dart \
            packages/lifemate_client/lib/src/women_episode_offline_outbox_web.dart \
            packages/lifemate_client/test/women_calendar_api_client_test.dart \
            packages/lifemate_client/test/women_episode_offline_outbox_test.dart \
            wellmate/lib/screens/women_calendar/women_calendar_screen.dart \
            wellmate/lib/screens/women_calendar/women_episode_dashboard_loader.dart \
            wellmate/lib/screens/women_calendar/women_episode_offline_bridge.dart \
            wellmate/lib/screens/women_calendar/women_episode_offline_bridge_native.dart \
            wellmate/lib/screens/women_calendar/women_episode_offline_bridge_web.dart \
            wellmate/lib/screens/women_calendar/women_episode_offline_policy.dart

      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed \
            lib/src/lifemate_api_client.dart \
            lib/src/durable_lifemate_api_client.dart \
            lib/src/durable_lifemate_api_client_web.dart \
            lib/src/women_episode_offline_outbox.dart \
            lib/src/women_episode_offline_outbox_web.dart \
            test/women_calendar_api_client_test.dart \
            test/women_episode_offline_outbox_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/women_calendar_api_client_test.dart test/women_episode_offline_outbox_test.dart

      - name: Verify WellMate episode slice
        working-directory: wellmate
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/screens/women_calendar/women_calendar_screen.dart \
            lib/screens/women_calendar/women_episode_dashboard_loader.dart \
            lib/screens/women_calendar/women_episode_offline_bridge.dart \
            lib/screens/women_calendar/women_episode_offline_bridge_native.dart \
            lib/screens/women_calendar/women_episode_offline_bridge_web.dart \
            lib/screens/women_calendar/women_episode_offline_policy.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/women_health_activation_v3_contract_test.dart test/women_companion_experience_test.dart

      - name: Remove temporary write helper and publish source only
        run: |
          set -euo pipefail
          rm -f tools/hotfix/apply_offline_833_episode_bridge_hardening.py
          rm -f tools/hotfix/apply_offline_833_episode_ui_fallback.py
          rm -f .github/workflows/tmp-offline-833-episode-ui-fallback.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No staged source changes.'
            exit 1
          fi
          git commit -m 'feat(women): wire offline period episode UI (#833)'
          git push origin HEAD:feat/offline-833-episode-ui-fallback-20260906
