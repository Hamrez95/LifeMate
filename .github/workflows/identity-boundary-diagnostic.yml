name: identity-boundary-diagnostic

on:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-api/**'
      - 'tools/security/verify-identity-raw-link-boundary.mjs'
      - '.github/workflows/identity-boundary-diagnostic.yml'

permissions:
  contents: read

jobs:
  raw-link-boundary-output:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - name: Capture verifier output
        shell: bash
        run: |
          set +e
          node tools/security/verify-identity-raw-link-boundary.mjs > identity-boundary.txt 2>&1
          code=$?
          printf '%s\n' "$code" > identity-boundary-exit-code.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-boundary-diagnostic-${{ github.sha }}
          path: |
            identity-boundary.txt
            identity-boundary-exit-code.txt
          retention-days: 1
