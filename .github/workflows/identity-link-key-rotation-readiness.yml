name: identity-link-key-rotation-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-identity-link-key-rotation-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: beta
    env:
      LIFEMATE_IDENTITY_ROTATION_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_IDENTITY_LINK_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_LINK_KEY_VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main read-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$LIFEMATE_IDENTITY_ROTATION_DATABASE_URL"
          [[ "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" -ge 1
          test "$LIFEMATE_IDENTITY_LINK_KEY_VERSION" -le 65535

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify identity boundaries
        shell: bash
        run: |
          set -euo pipefail
          node tools/security/verify-identity-raw-link-boundary.mjs
          node tools/security/verify-identity-link-rotation-policy.mjs

      - name: Check read-only rotation readiness source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check tools/security/identity-link-key-rotation-readiness.ts
          deno check tools/security/identity-link-key-rotation-readiness.ts

      - name: Audit active-version token coverage
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/identity-link-key-rotation-readiness.json"
          error_file="$RUNNER_TEMP/identity-link-key-rotation-readiness.err"
          set +e
          deno run \
            --allow-env=LIFEMATE_IDENTITY_ROTATION_DATABASE_URL,LIFEMATE_IDENTITY_LINK_KEY_VERSION \
            --allow-net \
            tools/security/identity-link-key-rotation-readiness.ts \
            > "$summary_file" 2> "$error_file"
          audit_status=$?
          set -e

          if ! jq -e '
            (.activeVersion | type == "number") and
            (.activeAccounts | type == "number") and
            (.currentVersionReadyAccounts | type == "number") and
            (.missingActiveVersionTokens | type == "number") and
            (.multipleActiveVersionTokens | type == "number") and
            (.unmappedActiveAccounts | type == "number") and
            (.readyForPreviousKeyRemoval | type == "boolean")
          ' "$summary_file" >/dev/null 2>&1; then
            rm -f "$summary_file" "$error_file"
            echo '::error::Identity-link rotation readiness failed without a valid count-only summary.'
            exit 1
          fi

          {
            echo '## Identity-link key rotation readiness'
            echo ''
            echo "- active key version: $(jq -r '.activeVersion' "$summary_file")"
            echo "- active Accounts: $(jq -r '.activeAccounts' "$summary_file")"
            echo "- current-version ready Accounts: $(jq -r '.currentVersionReadyAccounts' "$summary_file")"
            echo "- missing active-version tokens: $(jq -r '.missingActiveVersionTokens' "$summary_file")"
            echo "- Accounts with multiple active-version tokens: $(jq -r '.multipleActiveVersionTokens' "$summary_file")"
            echo "- unmapped active Accounts: $(jq -r '.unmappedActiveAccounts' "$summary_file")"
            echo "- safe to remove previous runtime key: $(jq -r '.readyForPreviousKeyRemoval' "$summary_file")"
            echo '- subjects, token digests, database URLs and key material are intentionally omitted'
          } >> "$GITHUB_STEP_SUMMARY"

          ready="$(jq -r '.readyForPreviousKeyRemoval' "$summary_file")"
          rm -f "$summary_file" "$error_file"
          if [ "$audit_status" -ne 0 ] || [ "$ready" != 'true' ]; then
            echo '::error::Active-version token coverage is not ready for previous-key removal.'
            exit 1
          fi
