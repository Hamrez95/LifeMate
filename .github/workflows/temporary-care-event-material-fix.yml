name: temporary-care-event-material-fix

on:
  push:
    branches:
      - feat/offline-832-care-event-form-fallback-20260905
    paths:
      - .github/workflows/temporary-care-event-material-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-832-care-event-form-fallback-20260905
      - name: Patch SwitchListTile Material boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('wellmate/lib/screens/treatments/care_event_form.dart')
          text = path.read_text()
          start = "              SwitchListTile.adaptive(\n"
          replacement_start = (
              "              Material(\n"
              "                color: Colors.transparent,\n"
              "                child: SwitchListTile.adaptive(\n"
          )
          if text.count(start) != 1:
              raise SystemExit(f'expected exactly one SwitchListTile start, found {text.count(start)}')
          text = text.replace(start, replacement_start, 1)
          end = (
              "                    : (value) => setState(() => _repeatEnabled = value),\n"
              "              ),\n"
              "              if (_repeatEnabled) ...[\n"
          )
          replacement_end = (
              "                    : (value) => setState(() => _repeatEnabled = value),\n"
              "                ),\n"
              "              ),\n"
              "              if (_repeatEnabled) ...[\n"
          )
          if text.count(end) != 1:
              raise SystemExit(f'expected exactly one SwitchListTile end, found {text.count(end)}')
          path.write_text(text.replace(end, replacement_end, 1))
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/temporary-care-event-material-fix.yml
          git add wellmate/lib/screens/treatments/care_event_form.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wellmate): give repeat ListTile a Material boundary (#832)"
          git push origin HEAD:feat/offline-832-care-event-form-fallback-20260905
