name: tmp-admin-format-diff

on:
  push:
    branches:
      - feat/769-canonical-active-users-rebased-20260905
    paths:
      - '.github/workflows/tmp-admin-format-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Capture exact full-directory formatter output
        run: |
          cd supabase/functions/lifemate-admin-api
          deno fmt
          cd ../../..
          git diff --name-only > /tmp/admin-format-files.txt
          git diff > /tmp/admin-format.patch
          mkdir -p /tmp/admin-formatted/supabase/functions
          cp -R supabase/functions/lifemate-admin-api /tmp/admin-formatted/supabase/functions/
      - uses: actions/upload-artifact@v4
        with:
          name: admin-deno-format-baseline
          path: |
            /tmp/admin-format-files.txt
            /tmp/admin-format.patch
            /tmp/admin-formatted
          if-no-files-found: error
          retention-days: 1
