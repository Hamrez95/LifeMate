name: lifemate-profile-testdiag-temp

on:
  push:
    branches:
      - feat/profile-you-1080

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-you-1080
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Run focused profile tests and capture output
        shell: bash
        run: |
          cd lifemate
          flutter pub get
          set +e
          flutter test test/profile_you_screen_test.dart > profile_test_failure.txt 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Focused tests are green." > profile_test_failure.txt
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lifemate/profile_test_failure.txt
          git commit -m "test(profile): capture focused CI output (#1080)"
          git push origin HEAD:feat/profile-you-1080
