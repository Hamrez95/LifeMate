name: temp-offline-03-client-diagnostics

on:
  pull_request:
    paths:
      - 'packages/lifemate_client/**'
      - '.github/workflows/temp-offline-03-client-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Capture shared client verification
        id: verify
        continue-on-error: true
        working-directory: packages/lifemate_client
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            flutter analyze --no-fatal-warnings --no-fatal-infos
            flutter test
          } 2>&1 | tee /tmp/offline-03-client.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-03-client-diagnostics
          path: /tmp/offline-03-client.log
          retention-days: 1
      - name: Enforce result
        if: always()
        run: test '${{ steps.verify.outcome }}' = 'success'
