name: temporary-format-edge-api

on:
  push:
    branches:
      - fix/wellmate-injection-actions-companion-avatar
    paths:
      - .github/workflows/tmp-format-edge-api.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format Edge API and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          deno fmt supabase/functions/lifemate-api/index.ts
          git rm .github/workflows/tmp-format-edge-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/lifemate-api/index.ts
          git commit -m "chore: format edge api"
          git push origin HEAD:fix/wellmate-injection-actions-companion-avatar
