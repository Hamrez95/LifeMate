name: tmp-fix-94-nullable
on:
  push:
    branches: ["feat/94-smart-history-autofill"]
    paths: [".github/workflows/tmp-fix-94-nullable.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/94-smart-history-autofill
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('wellmate/lib/screens/treatments/care_event_form.dart')
          s=p.read_text()
          old="'history-suggestion-${historyKind.name}-${suggestion.value}'"
          new="'history-suggestion-${historyKind!.name}-${suggestion.value}'"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - run: rm .github/workflows/tmp-fix-94-nullable.yml
      - run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(autofill): satisfy nullable history kind analysis (#94)"
          git push origin HEAD:feat/94-smart-history-autofill