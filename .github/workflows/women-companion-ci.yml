name: women-companion-ci

on:
  push:
    branches:
      - feat/women-companion-experience
  pull_request:
    branches:
      - feat/women-calendar-care-access-notifications

permissions:
  contents: write

concurrency:
  group: women-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/women-companion-experience
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Make 14-day phase cards large-text safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wellmate/lib/screens/women_calendar/women_companion_screen.dart')
          text = path.read_text()
          text = text.replace('            height: 108,', '            height: 142,')
          path.write_text(text)
          PY
          dart format wellmate/lib/screens/women_calendar/women_companion_screen.dart

      - name: Persist source correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source correction required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wellmate/lib/screens/women_calendar/women_companion_screen.dart
          git commit -m 'fix(wellmate): make cycle outlook large-text safe'
          git push origin HEAD:feat/women-companion-experience

      - name: Shared client checks
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: WellMate checks
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter test --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true test/women_companion_experience_test.dart
          flutter build web --release --dart-define=ENABLE_GOOGLE_AUTH=false --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true

      - name: CareMate checks
        working-directory: caremate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter build web --release --dart-define=ENABLE_GOOGLE_AUTH=false --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true

      - name: Edge checks
        working-directory: supabase/functions/lifemate-api
        run: |
          deno fmt --check
          deno task check
          deno task test
