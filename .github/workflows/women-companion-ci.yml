name: women-companion-ci

on:
  push:
    branches:
      - feat/women-companion-experience
  pull_request:
    branches:
      - main
      - feat/women-calendar-care-access-notifications

permissions:
  contents: write

concurrency:
  group: women-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/women-companion-experience
          fetch-depth: 0
          show-progress: false

      - name: Integrate current main and normalize stacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before="$(git rev-parse HEAD)"
          git fetch origin main
          git merge -X ours --no-edit origin/main

          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/lifemate-api/women_calendar.ts')
          text = path.read_text()
          needle = '''    const profile = mapProfile(profiles[0]);
    const patientProfile = patientProfiles[0];
    return {
'''
          replacement = '''    const profile = mapProfile(profiles[0]);
    const dailyCheckIn = profile.dailyCheckIn as Record<string, unknown> | null;
    const sharedDailySummary = dailyCheckIn?.shareSummary === true
      ? {
        date: dailyCheckIn.date,
        mood: dailyCheckIn.mood,
        energy: dailyCheckIn.energy,
        supportNeed: dailyCheckIn.supportNeed,
      }
      : null;
    const patientProfile = patientProfiles[0];
    return {
'''
          if needle in text:
              path.write_text(text.replace(needle, replacement, 1))
          elif 'const sharedDailySummary =' not in text:
              raise SystemExit('Unable to normalize sharedDailySummary after stacked merge')
          PY

          duplicate_versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | cut -c1-14 | sort | uniq -d)"
          test -z "$duplicate_versions"

          if ! git diff --quiet; then
            deno fmt supabase/functions/lifemate-api/women_calendar.ts
            git add supabase/functions/lifemate-api/women_calendar.ts
            git commit -m 'fix(edge): preserve consent-scoped daily summary after stack merge'
          fi
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then
            git push origin HEAD:feat/women-companion-experience
          fi

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Shared client checks
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: WellMate checks
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter test --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true test/women_companion_experience_test.dart
          flutter build web --release --dart-define=ENABLE_GOOGLE_AUTH=false --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true

      - name: CareMate checks
        working-directory: caremate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter build web --release --dart-define=ENABLE_GOOGLE_AUTH=false --dart-define=ENABLE_WOMEN_CALENDAR_PILOT=true

      - name: Edge checks
        working-directory: supabase/functions/lifemate-api
        run: |
          deno fmt --check
          deno task check
          deno task test
