name: tmp-admin-final-type-repair

on:
  push:
    branches:
      - ci/admin-deno-2.9.4-format-baseline-20260905
    paths:
      - '.github/workflows/tmp-admin-final-type-repair.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply candidate fixes and capture checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('supabase/functions/lifemate-admin-api')
          for name in ('finance_test.ts', 'finance_budget_test.ts', 'finance_cash_test.ts'):
              p = root / name
              text = p.read_text()
              old = 'admin: { accountId: crypto.randomUUID(), roles: [], permissions: [] },\n        origin: null,'
              new = 'accountId: crypto.randomUUID(),\n        admin: { accountId: crypto.randomUUID(), roles: [], permissions: [] },\n        correlationId: crypto.randomUUID(),\n        origin: null,'
              if old not in text:
                  raise SystemExit(f'missing finance context marker in {name}')
              p.write_text(text.replace(old, new, 1))
          p = root / 'research_dataset_policy_test.ts'
          text = p.read_text()
          old = '''  assertEquals(\n    error.message,\n    "Pseudonymous row-level research export is not available yet.",\n  );'''
          new = '''  if (!(error instanceof Error)) throw error;\n  assertEquals(\n    error.message,\n    "Pseudonymous row-level research export is not available yet.",\n  );'''
          if old not in text:
              raise SystemExit('missing research error marker')
          p.write_text(text.replace(old, new, 1))
          PY
          deno fmt supabase/functions/lifemate-admin-api
          cd supabase/functions/lifemate-admin-api
          set +e
          deno task check > /tmp/check.txt 2>&1
          echo $? > /tmp/check.code
          deno task test > /tmp/test.txt 2>&1
          echo $? > /tmp/test.code
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: admin-final-repair-diagnostic
          path: |
            /tmp/check.txt
            /tmp/check.code
            /tmp/test.txt
            /tmp/test.code
          if-no-files-found: error
          retention-days: 1
