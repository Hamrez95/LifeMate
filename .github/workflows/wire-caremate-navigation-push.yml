name: wire-caremate-navigation-push

on:
  push:
    branches: [feat/full-bb287-ui-parity]
    paths:
      - '.github/workflows/wire-caremate-navigation-push.yml'

permissions:
  contents: write

jobs:
  wire-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0

      - name: Patch dashboard navigation
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin feat/full-bb287-ui-parity
          python3 - <<'PY'
          from pathlib import Path

          path = Path('caremate/lib/screens/dashboard_screen.dart')
          text = path.read_text()
          anchor = "import '../widgets/custom_app_header.dart';\n"
          if "import 'feature_preview_screen.dart';" not in text:
              text = text.replace(
                  anchor,
                  anchor + "import 'calendar/calendar_screen.dart';\nimport 'feature_preview_screen.dart';\n",
                  1,
              )

          old = """  void _onNavigationTap(int index) {
            if (index == 4) return;
            const labels = ['تقویم مراقبت', 'تغییر پروفایل', 'مدیریت درمان', 'مراقبت خانواده'];
            _showComingSoon(labels[index]);
          }
          """
          new = """  void _onNavigationTap(int index) {
            if (index == 4) return;
            final Widget destination = index == 0
                ? const CalendarScreen()
                : CareMateFeaturePreviewScreen(initialIndex: index);
            Navigator.of(context).pushReplacement(
              PageRouteBuilder<void>(
                pageBuilder: (_, __, ___) => destination,
                transitionDuration: Duration.zero,
                reverseTransitionDuration: Duration.zero,
              ),
            );
          }
          """
          if old in text:
              text = text.replace(old, new, 1)
          elif 'CareMateFeaturePreviewScreen(initialIndex: index)' not in text:
              raise SystemExit('Expected dashboard navigation block was not found')
          path.write_text(text)
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add caremate/lib/screens/dashboard_screen.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Wire all CareMate navigation destinations'
          git push origin HEAD:feat/full-bb287-ui-parity
