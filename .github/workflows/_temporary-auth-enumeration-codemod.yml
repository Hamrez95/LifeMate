name: temporary-auth-enumeration-codemod

on:
  push:
    branches:
      - foundation/p0-auth-enumeration-fix
    paths:
      - '.github/workflows/_temporary-auth-enumeration-codemod.yml'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: foundation/p0-auth-enumeration-fix
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact account-enumeration hardening edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('packages/lifemate_client/lib/src/experience_auth.dart')
          source = auth_path.read_text()

          old_success = '''            _success = LifeMateRuntimeLocale.select(
              fa: LifeMateRuntimeLocale.select(
                fa: 'حساب ساخته شد. اکنون می‌توانید وارد شوید.',
                en: "Account created. You can now login.",
              ),
              en: "Account created. You can now login.",
            );'''
          new_success = '''            _success = _genericSignupMessage();'''
          if source.count(old_success) != 1:
              raise SystemExit('expected exactly one non-session signup success block')
          source = source.replace(old_success, new_success, 1)

          old_catch = '''    } on AuthException catch (error) {
      if (mounted) setState(() => _error = _friendlyAuthError(error));
    } catch (_) {'''
          new_catch = '''    } on AuthException catch (error) {
      if (!mounted) return;
      if (
        _mode == _AuthMode.signUp &&
        error.message.toLowerCase().contains('user already registered')
      ) {
        setState(() {
          _error = null;
          _success = _genericSignupMessage();
          _mode = _AuthMode.signIn;
          _password.clear();
          _confirmPassword.clear();
        });
      } else {
        setState(() => _error = _friendlyAuthError(error));
      }
    } catch (_) {'''
          if source.count(old_catch) < 1:
              raise SystemExit('signup AuthException catch block not found')
          source = source.replace(old_catch, new_catch, 1)

          old_enumeration = '''    if (message.contains('user already registered')) {
      return LifeMateRuntimeLocale.select(
        fa: LifeMateRuntimeLocale.select(
          fa: 'این ایمیل قبلاً ثبت شده است؛ وارد حساب شوید.',
          en: "This email has already been registered; Log in to the account.",
        ),
        en: "This email has already been registered; Log in to the account.",
      );
    }
'''
          if source.count(old_enumeration) != 1:
              raise SystemExit('account enumeration error mapping not found exactly once')
          source = source.replace(old_enumeration, '', 1)

          helper_anchor = '''  static bool _looksLikeEmail(String value) {'''
          helper = '''  static String _genericSignupMessage() {
    return LifeMateRuntimeLocale.select(
      fa: LifeMateRuntimeLocale.select(
        fa: 'اگر ثبت‌نام این ایمیل قابل انجام باشد، راهنمای ادامه برایتان ارسال می‌شود.',
        en: "If registration can proceed for this email, we'll send the next steps.",
      ),
      en: "If registration can proceed for this email, we'll send the next steps.",
    );
  }

'''
          if source.count(helper_anchor) != 1:
              raise SystemExit('signup helper insertion anchor not found exactly once')
          source = source.replace(helper_anchor, helper + helper_anchor, 1)
          auth_path.write_text(source)

          policy_path = Path('tools/security/verify-auth-security-contract.mjs')
          policy = policy_path.read_text()
          policy_anchor = '''// Raw provider messages must not become a generic last-resort UI error.
'''
          policy_addition = r'''// Signup must not disclose whether an email already belongs to an account.
          requireMatch(
            authUi,
            /response\.session\s*==\s*null[\s\S]{0,500}_genericSignupMessage\(\)/,
            'non-session signup must use existence-neutral confirmation copy',
          );
          requireMatch(
            authUi,
            /_mode\s*==\s*_AuthMode\.signUp[\s\S]{0,240}user already registered[\s\S]{0,500}_genericSignupMessage\(\)/,
            'provider duplicate-signup response must be converted to the same generic confirmation',
          );
          rejectMatch(
            authUi,
            /این ایمیل قبلاً ثبت شده|email has already been registered/i,
            'signup UI must not reveal that an account already exists',
          );

          '''
          if source.count('_genericSignupMessage()') < 3:
              raise SystemExit('generic signup message is not wired to both neutral outcomes')
          if policy.count(policy_anchor) != 1:
              raise SystemExit('auth policy insertion anchor not found exactly once')
          policy = policy.replace(policy_anchor, policy_addition + policy_anchor, 1)
          policy_path.write_text(policy)
          PY

      - name: Verify exact source policy
        shell: bash
        run: |
          set -euo pipefail
          node tools/security/verify-auth-security-contract.mjs
          git diff --check
          git diff --exit-code -- .github/workflows/_temporary-auth-enumeration-codemod.yml
          test -n "$(git status --short packages/lifemate_client/lib/src/experience_auth.dart tools/security/verify-auth-security-contract.mjs)"

      - name: Commit hardened Auth source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_client/lib/src/experience_auth.dart tools/security/verify-auth-security-contract.mjs
          git commit -m 'fix(auth): remove signup account enumeration'
          git push origin HEAD:foundation/p0-auth-enumeration-fix
