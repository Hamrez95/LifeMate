name: privacy-lifecycle-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/privacy/**'
      - 'packages/lifemate_client/lib/src/account_deletion_action.dart'
      - 'packages/lifemate_ui/lib/src/shared_profile_screen.dart'
      - 'supabase/functions/lifemate-api/account_lifecycle.ts'
      - 'supabase/functions/lifemate-api/data_export.ts'
      - 'supabase/functions/lifemate-worker/**'
      - 'supabase/migrations/**account_deletion**'
      - 'tools/operations/privacy_lifecycle_contract_test.ts'
      - '.github/workflows/privacy-lifecycle-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/privacy/**'
      - 'packages/lifemate_client/lib/src/account_deletion_action.dart'
      - 'packages/lifemate_ui/lib/src/shared_profile_screen.dart'
      - 'supabase/functions/lifemate-api/account_lifecycle.ts'
      - 'supabase/functions/lifemate-api/data_export.ts'
      - 'supabase/functions/lifemate-worker/**'
      - 'supabase/migrations/**account_deletion**'
      - 'tools/operations/privacy_lifecycle_contract_test.ts'
      - '.github/workflows/privacy-lifecycle-contract.yml'

permissions:
  contents: read

concurrency:
  group: privacy-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Verify privacy lifecycle runtime and product wording stay aligned
        run: |
          deno fmt --check tools/operations/privacy_lifecycle_contract_test.ts
          deno test --allow-read tools/operations/privacy_lifecycle_contract_test.ts
