name: lifemate-shell-analyze-1089-temp

on:
  push:
    branches:
      - feat/today-peek-sheet-1089

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/today-peek-sheet-1089
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: lifemate
        run: flutter pub get
      - name: Capture analyzer output
        working-directory: lifemate
        run: flutter analyze --no-fatal-warnings --no-fatal-infos > ../docs/lifemate-shell/ANALYZE_1089_TEMP.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lifemate-shell/ANALYZE_1089_TEMP.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(today): capture analyzer output (#1089)"
          git push origin HEAD:feat/today-peek-sheet-1089
