name: finalize-caremate-navigation-parity

on:
  push:
    branches:
      - feat/full-bb287-ui-parity
    paths:
      - '.github/workflows/bootstrap-full-bb287-parity.yml'

permissions:
  contents: write

jobs:
  finalize-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0

      - name: Wire every CareMate navigation destination
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin feat/full-bb287-ui-parity
          python3 - <<'PY'
          from pathlib import Path

          path = Path('caremate/lib/screens/dashboard_screen.dart')
          text = path.read_text()

          import_anchor = "import '../widgets/custom_app_header.dart';\n"
          if "import 'feature_preview_screen.dart';" not in text:
              if import_anchor not in text:
                  raise SystemExit('Dashboard import anchor not found')
              text = text.replace(
                  import_anchor,
                  import_anchor
                  + "import 'calendar/calendar_screen.dart';\n"
                  + "import 'feature_preview_screen.dart';\n",
                  1,
              )

          start_marker = "  void _onNavigationTap(int index) {"
          end_marker = "  void _showDoseAlerts()"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Dashboard navigation markers not found')

          replacement = """  void _onNavigationTap(int index) {
            if (index == 4) return;
            final Widget destination = index == 0
                ? const CalendarScreen()
                : CareMateFeaturePreviewScreen(initialIndex: index);
            Navigator.of(context).pushReplacement(
              PageRouteBuilder<void>(
                pageBuilder: (_, __, ___) => destination,
                transitionDuration: Duration.zero,
                reverseTransitionDuration: Duration.zero,
              ),
            );
          }

          """
          path.write_text(text[:start] + replacement + text[end:])

          ledger = Path('docs/ui/BB287_FULL_PARITY_LEDGER.md')
          if ledger.exists():
              content = ledger.read_text()
              additions = """

## Completed parity checkpoints
- [x] Exact Android launcher and Web icon binaries restored from bb287 for both apps.
- [x] CareMate original calendar composition retained and connected to live care relationships and dose occurrences.
- [x] CareMate family selector now uses live relationships rather than mock family health data.
- [x] All CareMate bottom-navigation destinations are navigable.
- [x] Unsupported CareMate destinations remain visible with disabled controls and «در دست توسعه» states.
- [x] CareMate profile composition retained with live identity, working language selection, and real sign-out.
"""
              if '## Completed parity checkpoints' not in content:
                  ledger.write_text(content.rstrip() + additions + '\n')
          PY

      - name: Remove temporary bootstrap workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/bootstrap-full-bb287-parity.yml \
            .github/workflows/wire-caremate-navigation-once.yml \
            .github/workflows/wire-caremate-navigation-push.yml

      - name: Commit final navigation wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize CareMate navigation and clean parity bootstrap'
          git push origin HEAD:feat/full-bb287-ui-parity
