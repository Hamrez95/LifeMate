name: apply-cycle-review-feedback

on:
  push:
    branches:
      - fix/cycle-confidence-current-main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/cycle-confidence-current-main
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
      - name: Apply review feedback
        run: python3 tools/hotfix/apply_cycle_review_feedback.py
      - name: Format touched source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt supabase/functions/lifemate-api/women_calendar.ts
          dart format \
            wellmate/lib/screens/women_calendar/women_companion_screen.dart \
            wellmate/lib/screens/women_calendar/women_calendar_month_card.dart \
            wellmate/test/women_calendar_month_card_test.dart
      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            wellmate/lib/screens/women_calendar/women_companion_screen.dart \
            wellmate/lib/screens/women_calendar/women_calendar_month_card.dart \
            wellmate/test/women_calendar_month_card_test.dart \
            supabase/functions/lifemate-api/women_calendar.ts
          git commit -m 'fix(safety): address cycle confidence review feedback'
          git push origin HEAD:fix/cycle-confidence-current-main
