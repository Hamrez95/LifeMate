name: add-account-deletion-ui

on:
  push:
    branches: ['feat/ecosystem-data-foundation']
    paths:
      - 'tools/refactor/add_account_deletion_ui.py'
      - '.github/workflows/add-account-deletion-ui.yml'

permissions:
  contents: write

concurrency:
  group: add-account-deletion-ui
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply exact profile UI codemod
        run: python3 tools/refactor/add_account_deletion_ui.py
      - name: Format profile and shared privacy UI
        run: dart format wellmate/lib/screens/profile/profile_screen.dart caremate/lib/screens/profile_screen.dart packages/lifemate_client/lib/src/account_deletion_action.dart
      - name: Validate shared client and both apps
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/lifemate_client && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd wellmate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd caremate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
      - name: Commit validated deletion UX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wellmate/lib/screens/profile/profile_screen.dart caremate/lib/screens/profile_screen.dart packages/lifemate_client/lib/src/account_deletion_action.dart
          git commit -m 'feat(privacy): expose self-service account deletion in both apps'
          git pull --rebase origin feat/ecosystem-data-foundation
          git push origin HEAD:feat/ecosystem-data-foundation
