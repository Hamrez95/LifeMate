name: contact-point-key-rotation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Envelope key rotation mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      max_contacts:
        description: 'Maximum current ContactPoints in this batch (1-1000)'
        required: true
        default: '100'
        type: string
      after_contact_point_id:
        description: 'Optional opaque ContactPoint UUID cursor from the previous batch'
        required: false
        default: ''
        type: string
      confirm_apply:
        description: 'For apply mode type ROTATE-CONTACT-ENVELOPES'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-contact-point-key-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: beta
    env:
      LIFEMATE_CONTACT_MIGRATION_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_CONTACT_HASHING_SECRET: ${{ secrets.LIFEMATE_CONTACT_HASHING_SECRET }}
      LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY: ${{ secrets.LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY }}
      LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION }}
      LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY: ${{ secrets.LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY }}
      LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION }}
      LIFEMATE_CONTACT_KEY_ROTATION_MODE: ${{ inputs.mode }}
      LIFEMATE_CONTACT_KEY_ROTATION_MAX_CONTACTS: ${{ inputs.max_contacts }}
      LIFEMATE_CONTACT_KEY_ROTATION_AFTER_CONTACT_POINT_ID: ${{ inputs.after_contact_point_id }}
      LIFEMATE_CONTACT_KEY_ROTATION_CONFIRM: ${{ inputs.confirm_apply }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main bounded execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$LIFEMATE_CONTACT_MIGRATION_DATABASE_URL"
          test "${#LIFEMATE_CONTACT_HASHING_SECRET}" -ge 32
          test "${#LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY}" -ge 32
          test "${#LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY}" -ge 32
          [[ "$LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION" =~ ^[0-9]+$ ]]
          [[ "$LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION" -ge 1
          test "$LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION" -le 32767
          test "$LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION" -ge 1
          test "$LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION" -le 32767
          test "$LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION" -ne "$LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION"
          [[ "$LIFEMATE_CONTACT_KEY_ROTATION_MAX_CONTACTS" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_CONTACT_KEY_ROTATION_MAX_CONTACTS" -ge 1
          test "$LIFEMATE_CONTACT_KEY_ROTATION_MAX_CONTACTS" -le 1000
          if [ -n "$LIFEMATE_CONTACT_KEY_ROTATION_AFTER_CONTACT_POINT_ID" ]; then
            [[ "$LIFEMATE_CONTACT_KEY_ROTATION_AFTER_CONTACT_POINT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          fi
          if [ "$LIFEMATE_CONTACT_KEY_ROTATION_MODE" = 'apply' ]; then
            test "$LIFEMATE_CONTACT_KEY_ROTATION_CONFIRM" = 'ROTATE-CONTACT-ENVELOPES'
          else
            test "$LIFEMATE_CONTACT_KEY_ROTATION_MODE" = 'dry-run'
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify ContactPoint key rotation policy
        run: node tools/security/verify-contact-point-key-rotation-policy.mjs

      - name: Check bounded rotation source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check \
            tools/security/contact-point-key-rotation.ts \
            supabase/functions/lifemate-api/contact_point_envelope_rotation.ts
          deno check --config supabase/functions/lifemate-api/deno.json \
            tools/security/contact-point-key-rotation.ts

      - name: Execute bounded ContactPoint envelope rotation
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/contact-point-key-rotation.json"
          error_file="$RUNNER_TEMP/contact-point-key-rotation.err"
          deno run \
            --allow-env=LIFEMATE_CONTACT_MIGRATION_DATABASE_URL,LIFEMATE_CONTACT_HASHING_SECRET,LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY,LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION,LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY,LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION,LIFEMATE_CONTACT_KEY_ROTATION_MODE,LIFEMATE_CONTACT_KEY_ROTATION_MAX_CONTACTS,LIFEMATE_CONTACT_KEY_ROTATION_AFTER_CONTACT_POINT_ID,LIFEMATE_CONTACT_KEY_ROTATION_CONFIRM \
            --allow-net \
            tools/security/contact-point-key-rotation.ts \
            > "$summary_file" 2> "$error_file"

          if ! jq -e '
            (.mode == "dry-run" or .mode == "apply") and
            (.scannedContacts | type == "number") and
            (.activeVersionContacts | type == "number") and
            (.previousVersionContacts | type == "number") and
            (.rotatedContacts | type == "number") and
            (.hasMore | type == "boolean") and
            ((.nextAfterContactPointId == null) or (.nextAfterContactPointId | type == "string"))
          ' "$summary_file" >/dev/null 2>&1; then
            rm -f "$summary_file" "$error_file"
            echo '::error::ContactPoint key rotation failed without a valid count-only summary.'
            exit 1
          fi

          {
            echo '## ContactPoint bounded envelope-key rotation'
            echo ''
            echo "- mode: $(jq -r '.mode' "$summary_file")"
            echo "- scanned contacts: $(jq -r '.scannedContacts' "$summary_file")"
            echo "- active-version contacts: $(jq -r '.activeVersionContacts' "$summary_file")"
            echo "- previous-version contacts: $(jq -r '.previousVersionContacts' "$summary_file")"
            echo "- rotated contacts: $(jq -r '.rotatedContacts' "$summary_file")"
            echo "- more batches remain: $(jq -r '.hasMore' "$summary_file")"
            echo "- next opaque ContactPoint cursor: $(jq -r '.nextAfterContactPointId // "none"' "$summary_file")"
            echo '- plaintext contacts, hashes, ciphertext, nonces, DB URLs and key material are intentionally omitted'
            echo '- run contact-point-key-rotation-readiness after the final apply batch before removing the previous runtime key'
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f "$summary_file" "$error_file"
