name: tmp-833-projection-preserve-server-v1
on:
  push:
    branches: [feat/offline-833-companion-checkin-fallback-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-833-companion-checkin-fallback-20260906
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Restore canonical server-row preservation assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/lifemate_client/test/shared_offline_runtime_women_health_test.dart')
          s = p.read_text()
          old = "      expect(projected.rows.single['periodFlow'], isNull);"
          new = "      expect(projected.rows.single['periodFlow'], 'light');"
          if old not in s:
              raise SystemExit('expected contract-local assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
          dart format packages/lifemate_client/test/shared_offline_runtime_women_health_test.dart
      - name: Targeted verification
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/lifemate_core && flutter test test/local_women_daily_log_projection_test.dart)
          (cd packages/lifemate_client && flutter test test/shared_offline_runtime_women_health_test.dart)
      - name: Self-delete and push safely
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-833-projection-preserve-server-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/lifemate_client/test/shared_offline_runtime_women_health_test.dart .github/workflows/tmp-833-projection-preserve-server-v1.yml
          git diff --cached --check
          git commit -m 'test(women): preserve canonical server fields under owner overlay'
          git reset --hard HEAD
          git fetch origin feat/offline-833-companion-checkin-fallback-20260906
          git rebase origin/feat/offline-833-companion-checkin-fallback-20260906
          git push origin HEAD:feat/offline-833-companion-checkin-fallback-20260906
