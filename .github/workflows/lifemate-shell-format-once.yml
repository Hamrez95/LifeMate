name: lifemate-shell-format-once

on:
  push:
    branches:
      - feat/module-registry-1081
    paths:
      - 'lifemate/lib/modules/**'
      - 'lifemate/test/module_registry_test.dart'
      - '.github/workflows/lifemate-shell-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/module-registry-1081
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format lifemate/lib/modules lifemate/test/module_registry_test.dart
          rm .github/workflows/lifemate-shell-format-once.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lifemate/lib/modules lifemate/test/module_registry_test.dart .github/workflows/lifemate-shell-format-once.yml
          git commit -m 'style(shell): apply Dart formatter (#1081)'
          git push origin HEAD:feat/module-registry-1081
