name: complete-ecosystem-client-codemod

on:
  push:
    branches: ['feat/ecosystem-data-foundation']
    paths:
      - 'tools/refactor/complete_ecosystem_client.py'
      - '.github/workflows/complete-ecosystem-client-codemod.yml'

permissions:
  contents: write

concurrency:
  group: complete-ecosystem-client-codemod
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          fetch-depth: 0
      - uses: subosito/flutter-action@e938fdf56512cc96ef3f93601a5a40bde3801046
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true
      - name: Apply exact client codemod
        run: python3 tools/refactor/complete_ecosystem_client.py
      - name: Format patched client
        run: dart format packages/lifemate_client/lib/src/lifemate_api_client.dart packages/lifemate_client/lib/src/capabilities.dart packages/lifemate_client/lib/src/lifemate_auth.dart
      - name: Validate shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit validated client
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/lifemate_client/lib/src/lifemate_api_client.dart packages/lifemate_client/lib/src/capabilities.dart packages/lifemate_client/lib/src/lifemate_auth.dart; then
            echo 'No client changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_client/lib/src/lifemate_api_client.dart packages/lifemate_client/lib/src/capabilities.dart packages/lifemate_client/lib/src/lifemate_auth.dart
          git commit -m 'feat(client): consume server-authoritative ecosystem capabilities'
          git push origin HEAD:feat/ecosystem-data-foundation
