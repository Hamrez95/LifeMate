name: round2-women-calendar-one-shot

on:
  push:
    branches:
      - fix/wellmate-physical-qa-round-2
    paths:
      - 'tools/hotfix/apply_round2_women_calendar.py'
      - '.github/workflows/round2-women-calendar-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.4.5

      - name: Patch applicator after compile finding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/hotfix/apply_round2_women_calendar.py')
          text = path.read_text(encoding='utf-8')
          old = """    return _PastelCard(\n      key: const ValueKey('women-calendar-selected-day-summary'),\n      child: Column(\n        crossAxisAlignment: CrossAxisAlignment.start,"""
          new = """    return _PastelCard(\n      child: Column(\n        key: const ValueKey('women-calendar-selected-day-summary'),\n        crossAxisAlignment: CrossAxisAlignment.start,"""
          if old not in text:
              raise SystemExit('selected-day summary source changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply women calendar refactor
        run: python3 tools/hotfix/apply_round2_women_calendar.py

      - name: Preserve unified treatment resilience and existing details flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wellmate/lib/screens/treatments/treatments_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = """      final api = context.read<LifeMateApiClient>();
              final now = DateTime.now();
              final results = await Future.wait<dynamic>([
                api.getTreatmentPlans(),
                // The care-event endpoint is intentionally bounded. A one-month window
                // keeps this hub fast while recurrence series are represented by the
                // occurrence returned inside the window.
                api.getCareEvents(
                  fromDate: now.subtract(const Duration(days: 31)),
                  toDate: now,
                ),
                api.getCareEvents(
                  fromDate: now.add(const Duration(days: 1)),
                  toDate: now.add(const Duration(days: 31)),
                ),
              ]);
              final plans = results[0] as List<Map<String, dynamic>>;
              final pastEvents = results[1] as List<Map<String, dynamic>>;
              final futureEvents = results[2] as List<Map<String, dynamic>>;"""
          new = """      final api = context.read<LifeMateApiClient>();
              final now = DateTime.now();
              var failedSources = 0;
              Future<List<Map<String, dynamic>>> safeLoad(
                Future<List<Map<String, dynamic>>> request,
                String label,
              ) async {
                try {
                  return await request;
                } catch (error) {
                  failedSources += 1;
                  debugPrint('WellMate care hub $label load failed: $error');
                  return const <Map<String, dynamic>>[];
                }
              }

              final results = await Future.wait<List<Map<String, dynamic>>>([
                safeLoad(api.getTreatmentPlans(), 'treatments'),
                // The care-event endpoint is intentionally bounded. A one-month window
                // keeps this hub fast while recurrence series are represented by the
                // occurrence returned inside the window.
                safeLoad(
                  api.getCareEvents(
                    fromDate: now.subtract(const Duration(days: 31)),
                    toDate: now,
                  ),
                  'past care events',
                ),
                safeLoad(
                  api.getCareEvents(
                    fromDate: now.add(const Duration(days: 1)),
                    toDate: now.add(const Duration(days: 31)),
                  ),
                  'future care events',
                ),
              ]);
              final plans = results[0];
              final pastEvents = results[1];
              final futureEvents = results[2];
              if (failedSources == 3) {
                throw const LifeMateApiException(
                  503,
                  'care_hub_unavailable',
                  'All treatment sources are unavailable.',
                );
              }"""
          if old not in text:
              raise SystemExit('treatment load block changed unexpectedly')
          text = text.replace(old, new, 1)

          old = """    return RefreshIndicator(
              onRefresh: _load,
              child: ListView("""
          new = """    return Material(
              color: Colors.transparent,
              child: RefreshIndicator(
                onRefresh: _load,
                child: ListView("""
          if old not in text:
              raise SystemExit('treatment root changed unexpectedly')
          text = text.replace(old, new, 1)
          old = """        ],
              ),
            );
          }
        }

        class _TypeChip"""
          new = """        ],
                ),
              ),
            );
          }
        }

        class _TypeChip"""
          if old not in text:
              raise SystemExit('treatment root close changed unexpectedly')
          text = text.replace(old, new, 1)

          old = """          else
                for (final item in visible) _CareHubCard(item: item),"""
          new = """          else
                for (final item in visible)
                  _CareHubCard(
                    item: item,
                    onTap: item.type == CareItemType.medication
                        ? () => Navigator.of(context).push(
                              MaterialPageRoute<void>(
                                builder: (_) => _TreatmentDetailsScreen(plan: item.raw),
                              ),
                            )
                        : null,
                  ),"""
          if old not in text:
              raise SystemExit('care hub card loop changed unexpectedly')
          text = text.replace(old, new, 1)

          old = """class _CareHubCard extends StatelessWidget {
          const _CareHubCard({required this.item});
          final CareItem item;"""
          new = """class _CareHubCard extends StatelessWidget {
          const _CareHubCard({required this.item, this.onTap});
          final CareItem item;
          final VoidCallback? onTap;"""
          if old not in text:
              raise SystemExit('care hub constructor changed unexpectedly')
          text = text.replace(old, new, 1)

          old = """    return Card(
              elevation: 0,"""
          new = """    final card = Card(
              elevation: 0,"""
          if old not in text:
              raise SystemExit('care hub return card changed unexpectedly')
          text = text.replace(old, new, 1)
          old = """      ),
            );
          }
        }

        class AddTreatmentScreen"""
          new = """      ),
            );
            if (onTap == null) return card;
            return Semantics(
              button: true,
              label: 'جزئیات ${item.title}',
              child: Material(
                color: Colors.transparent,
                child: InkWell(
                  borderRadius: BorderRadius.circular(22),
                  onTap: onTap,
                  child: card,
                ),
              ),
            );
          }
        }

        class AddTreatmentScreen"""
          if old not in text:
              raise SystemExit('care hub card close changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('wellmate/test/women_calendar_selected_day_test.dart')
          content = test.read_text(encoding='utf-8')
          old = """          body: SizedBox(
                    width: 320,
                    child: WomenCalendarMonthCard("""
          new = """          body: SingleChildScrollView(
                    child: SizedBox(
                      width: 320,
                      child: WomenCalendarMonthCard("""
          if old not in content:
              raise SystemExit('selected-day test body changed unexpectedly')
          content = content.replace(old, new, 1)
          old = """              onDateSelected: (value) => selected = value,
                    ),
                  ),
                ),"""
          new = """              onDateSelected: (value) => selected = value,
                      ),
                    ),
                  ),
                ),"""
          if old not in content:
              raise SystemExit('selected-day test close changed unexpectedly')
          test.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format touched sources
        run: |
          dart format packages/lifemate_client/lib packages/lifemate_client/test wellmate/lib wellmate/test
          deno fmt supabase/functions/lifemate-api/women_calendar.ts supabase/functions/lifemate-api/women_calendar_source_of_truth_test.ts

      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify women calendar edge module
        working-directory: supabase/functions/lifemate-api
        run: |
          deno check women_calendar.ts women_calendar_source_of_truth_test.ts
          deno test women_calendar_source_of_truth_test.ts

      - name: Commit women calendar refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: make women daily logging single-source'
          git push origin HEAD:fix/wellmate-physical-qa-round-2
