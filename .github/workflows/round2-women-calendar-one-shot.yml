name: round2-women-calendar-one-shot

on:
  push:
    branches:
      - fix/wellmate-physical-qa-round-2
    paths:
      - 'tools/hotfix/apply_round2_women_calendar.py'
      - 'tools/hotfix/fix_round2_regressions.py'
      - '.github/workflows/round2-women-calendar-one-shot.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.4.5

      - name: Fix selected-day summary key in applicator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/hotfix/apply_round2_women_calendar.py')
          text = path.read_text(encoding='utf-8')
          old = """    return _PastelCard(\n      key: const ValueKey('women-calendar-selected-day-summary'),\n      child: Column(\n        crossAxisAlignment: CrossAxisAlignment.start,"""
          new = """    return _PastelCard(\n      child: Column(\n        key: const ValueKey('women-calendar-selected-day-summary'),\n        crossAxisAlignment: CrossAxisAlignment.start,"""
          if old not in text:
              raise SystemExit('selected-day summary source changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply women calendar refactor
        run: python3 tools/hotfix/apply_round2_women_calendar.py

      - name: Apply discovered regression fixes
        run: python3 tools/hotfix/fix_round2_regressions.py

      - name: Format touched sources
        run: |
          dart format packages/lifemate_client/lib packages/lifemate_client/test wellmate/lib wellmate/test
          deno fmt supabase/functions/lifemate-api/women_calendar.ts supabase/functions/lifemate-api/women_calendar_source_of_truth_test.ts

      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify women calendar edge module
        working-directory: supabase/functions/lifemate-api
        run: |
          deno check women_calendar.ts women_calendar_source_of_truth_test.ts
          deno test women_calendar_source_of_truth_test.ts

      - name: Commit women calendar refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/round2-women-calendar-one-shot.yml
          git add -A
          git diff --cached --check
          git commit -m 'refactor: make women daily logging single-source'
          git push origin HEAD:fix/wellmate-physical-qa-round-2
