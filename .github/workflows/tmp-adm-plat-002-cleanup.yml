name: tmp-adm-plat-002-cleanup

on:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-admin-api/**'
      - '.github/workflows/tmp-adm-plat-002-cleanup.yml'
      - '.github/workflows/tmp-adm-plat-002-wire.yml'

permissions:
  contents: write

jobs:
  finalize-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          show-progress: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format search sources and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/lifemate-admin-api/global_search.ts \
            supabase/functions/lifemate-admin-api/global_search_service.ts \
            supabase/functions/lifemate-admin-api/global_search_test.ts \
            supabase/functions/lifemate-admin-api/index.ts
          rm -f .github/workflows/tmp-adm-plat-002-wire.yml
          git rm .github/workflows/tmp-adm-plat-002-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(admin): finalize secure global search branch'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
