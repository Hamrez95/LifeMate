name: db-pool-startup-resilience

on:
  push:
    branches:
      - fix/db-pool-startup-resilience

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/db-pool-startup-resilience
          show-progress: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply canonical patch
        run: python3 tools/hotfix/apply_db_pool_startup_resilience.py

      - name: Format changed source
        shell: bash
        run: |
          set -euo pipefail
          dart format packages/lifemate_client/lib/src/lifemate_api_client.dart \
            packages/lifemate_client/test/lifemate_api_client_test.dart \
            wellmate/lib/screens/home/home_screen.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/lib/screens/home/home_schedule_loader.dart \
            wellmate/lib/screens/women_calendar/women_companion_screen.dart \
            wellmate/lib/screens/women_calendar/women_calendar_screen.dart \
            wellmate/test/home_schedule_loader_test.dart \
            wellmate/test/women_companion_experience_test.dart \
            wellmate/test/ui_regression_test.dart
          deno fmt supabase/functions/lifemate-api

      - name: Verify Edge and apps
        shell: bash
        run: |
          set -euo pipefail
          (cd supabase/functions/lifemate-api && deno fmt --check && deno task check && deno task test)
          (cd packages/lifemate_client && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd wellmate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd caremate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          git diff --check

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hamidreza Pakpour'
          git config user.email '136631329+Hamrez95@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound database connections and collapse startup fan-out'
          git push origin HEAD:fix/db-pool-startup-resilience
