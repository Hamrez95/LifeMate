name: restore-caremate-caregiver-asset

on:
  push:
    branches:
      - feat/full-bb287-ui-parity
    paths:
      - '.github/workflows/restore-caremate-caregiver-asset.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0

      - name: Restore exact bb287 caregiver artwork
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin bb28701971cb2d43cde5acb5d50ef679dded534f
          git checkout bb28701971cb2d43cde5acb5d50ef679dded534f -- caremate/assets/images/Caregiver.png
          test -s caremate/assets/images/Caregiver.png
          actual="$(git hash-object caremate/assets/images/Caregiver.png)"
          test "$actual" = "faf717eda6099c8d2c50f270153aa02b413d7722"
          rm -f .github/workflows/restore-caremate-caregiver-asset.yml

      - name: Commit restored binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add caremate/assets/images/Caregiver.png .github/workflows/restore-caremate-caregiver-asset.yml
          git commit -m 'Restore exact CareMate caregiver artwork from bb287'
          git push origin HEAD:feat/full-bb287-ui-parity
