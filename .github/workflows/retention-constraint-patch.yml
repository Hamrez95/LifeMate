name: retention-constraint-patch

on:
  push:
    branches: ['privacy/p0-retention-v2-account-deletion']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: privacy/p0-retention-v2-account-deletion
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Patch schema-valid anonymization and fixtures
        shell: python
        run: |
          from pathlib import Path

          migration = Path('supabase/migrations/20260814215000_account_deletion_retention_v2.sql')
          text = migration.read_text()
          old = "           avatar_key = '',\n           profile_photo_path = null,"
          new = "           avatar_key = null,\n           profile_photo_path = null,"
          if text.count(old) != 1:
              raise SystemExit(f'finalizer avatar anchor count={text.count(old)}')
          migration.write_text(text.replace(old, new, 1))

          deletion = Path('supabase/functions/lifemate-worker/account_deletion_integration_test.ts')
          text = deletion.read_text()
          if "'Asia/Tehran','custom'," not in text:
              raise SystemExit('deletion fixture avatar anchor changed')
          deletion.write_text(text.replace("'Asia/Tehran','custom',", "'Asia/Tehran','person_green',", 1))

          bridge = Path('supabase/functions/lifemate-worker/identity_bridge_integration_test.ts')
          text = bridge.read_text()
          if "'fa','Asia/Tehran','',now(),now()" not in text:
              raise SystemExit('bridge fixture avatar anchor changed')
          bridge.write_text(text.replace(
              "'fa','Asia/Tehran','',now(),now()",
              "'fa','Asia/Tehran','person_blue',now(),now()",
              1,
          ))
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/lifemate-worker/account_deletion_integration_test.ts \
            supabase/functions/lifemate-worker/identity_bridge_integration_test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/migrations/20260814215000_account_deletion_retention_v2.sql \
            supabase/functions/lifemate-worker/account_deletion_integration_test.ts \
            supabase/functions/lifemate-worker/identity_bridge_integration_test.ts
          git commit -m 'fix(privacy): satisfy profile avatar constraints during deletion'
          git push origin HEAD:privacy/p0-retention-v2-account-deletion
