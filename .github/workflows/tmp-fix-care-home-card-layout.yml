name: temporary-fix-care-home-card-layout

on:
  push:
    branches:
      - fix/wellmate-injection-actions-companion-avatar
    paths:
      - .github/workflows/tmp-fix-care-home-card-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Make status cards respect text scaling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('caremate/lib/widgets/care_home_cards.dart')
          text = path.read_text()
          old = '            height: 194,'
          new = '            height: 194 * math.max(1.0, MediaQuery.textScalerOf(context).scale(1)),'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 fixed-height cards, found {count}')
          path.write_text(text.replace(old, new))
          PY
          dart format caremate/lib/widgets/care_home_cards.dart || true
          git rm .github/workflows/tmp-fix-care-home-card-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caremate/lib/widgets/care_home_cards.dart
          git commit -m "fix: scale CareMate status cards with text"
          git push origin HEAD:fix/wellmate-injection-actions-companion-avatar
