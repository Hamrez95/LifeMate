name: internal-device-qa-apks

on:
  push:
    branches:
      - fix/profile-photo-reminder-state

permissions:
  contents: read

concurrency:
  group: internal-device-qa-apks-${{ github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_NAME: 0.9.0-internal.6
  RELEASE_BUILD: '17'
  EXPECTED_API_VERSION: ed00f5c999c42930e4ab1b70da87bad30ecfea8d
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api-candidate

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Verify source and tests
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 0.9.0-internal.6+17$' wellmate/pubspec.yaml
          grep -q '^version: 0.9.0-internal.6+17$' caremate/pubspec.yaml
          for project in packages/lifemate_client wellmate caremate; do
            (
              cd "$project"
              flutter pub get
              flutter analyze --no-fatal-infos --no-fatal-warnings
              flutter test
            )
          done

      - name: Verify candidate API
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | jq -e --arg version "$EXPECTED_API_VERSION" '.status == "ok" and .database == "ready" and .version == $version' >/dev/null
          unauthorized_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$unauthorized_status" = '401'

      - name: Build Android APKs
        shell: bash
        run: |
          set -euo pipefail
          build_args=(
            --release
            --build-name="$RELEASE_NAME"
            --build-number="$RELEASE_BUILD"
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_GOOGLE_AUTH=false"
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=true"
          )
          (cd wellmate && flutter build apk "${build_args[@]}")
          (cd caremate && flutter build apk "${build_args[@]}")

      - name: Inspect and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/inspection
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          test -x "$apksigner_bin"
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk "dist/WellMate-${RELEASE_NAME}-device-qa.apk"
          cp caremate/build/app/outputs/flutter-apk/app-release.apk "dist/CareMate-${RELEASE_NAME}-device-qa.apk"
          "$aapt_bin" dump badging "dist/WellMate-${RELEASE_NAME}-device-qa.apk" > dist/inspection/wellmate.txt
          "$aapt_bin" dump permissions "dist/WellMate-${RELEASE_NAME}-device-qa.apk" >> dist/inspection/wellmate.txt
          "$aapt_bin" dump badging "dist/CareMate-${RELEASE_NAME}-device-qa.apk" > dist/inspection/caremate.txt
          "$aapt_bin" dump permissions "dist/CareMate-${RELEASE_NAME}-device-qa.apk" >> dist/inspection/caremate.txt
          "$apksigner_bin" verify --verbose --print-certs "dist/WellMate-${RELEASE_NAME}-device-qa.apk" > dist/inspection/wellmate-signing.txt
          "$apksigner_bin" verify --verbose --print-certs "dist/CareMate-${RELEASE_NAME}-device-qa.apk" > dist/inspection/caremate-signing.txt
          grep -Fq "package: name='com.lifemate.wellmate'" dist/inspection/wellmate.txt
          grep -Fq "package: name='com.lifemate.caremate'" dist/inspection/caremate.txt
          grep -Fq 'android.permission.INTERNET' dist/inspection/wellmate.txt
          grep -Fq 'android.permission.INTERNET' dist/inspection/caremate.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          printf '%s\n' \
            'LifeMate 0.9.0-internal.6+17' \
            'Internal Device-QA only; women calendar pilot enabled.' \
            'Candidate backend only; Google authentication disabled.' \
            'Do not use real patient health data.' \
            > dist/DEVICE-QA-NOTICE.txt

      - name: Upload APK bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemate-0.9.0-internal.6-device-qa-apks
          path: dist
          if-no-files-found: error
          retention-days: 30
