name: postgres-restore-drill

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - '.github/workflows/postgres-restore-drill.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - '.github/workflows/postgres-restore-drill.yml'

permissions:
  contents: read

jobs:
  logical-backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      source_postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_source
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      restore_postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_restore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOURCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_source
      RESTORE_ADMIN_URL: postgres://postgres:postgres@localhost:5433/postgres
      RESTORE_DATABASE_URL: postgres://postgres:postgres@localhost:5433/lifemate_restore
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false

      - name: Provision provider compatibility roles in vanilla PostgreSQL clusters
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          psql "$RESTORE_ADMIN_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql

      - name: Build canonical source database
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Add synthetic restore sentinel
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          create table public.restore_drill_fixture(
            id uuid primary key,
            marker text not null,
            created_at_utc timestamptz not null default now()
          );
          insert into public.restore_drill_fixture(id, marker)
          values ('123e4567-e89b-42d3-a456-426614174777', 'lifemate-restore-drill');
          SQL

      - name: Create database backup and cluster-role manifest
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:17.6-alpine \
            pg_dump \
              --host=localhost \
              --port=5432 \
              --username=postgres \
              --dbname=lifemate_source \
              --format=custom \
              --no-owner \
            > "$RUNNER_TEMP/lifemate.restore-drill.dump"
          test -s "$RUNNER_TEMP/lifemate.restore-drill.dump"

          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL' > "$RUNNER_TEMP/lifemate.runtime-roles.sql"
          select format(
            'create role %I %s %s %s %s %s %s %s connection limit %s;',
            rolname,
            case when rolcanlogin then 'LOGIN' else 'NOLOGIN' end,
            case when rolsuper then 'SUPERUSER' else 'NOSUPERUSER' end,
            case when rolinherit then 'INHERIT' else 'NOINHERIT' end,
            case when rolcreaterole then 'CREATEROLE' else 'NOCREATEROLE' end,
            case when rolcreatedb then 'CREATEDB' else 'NOCREATEDB' end,
            case when rolreplication then 'REPLICATION' else 'NOREPLICATION' end,
            case when rolbypassrls then 'BYPASSRLS' else 'NOBYPASSRLS' end,
            rolconnlimit
          )
          from pg_roles
          where rolname in (
            'lifemate_edge_runtime',
            'lifemate_worker_runtime',
            'lifemate_admin_runtime',
            'lifemate_backup_reader'
          )
          order by rolname;
          SQL
          test "$(grep -c '^create role lifemate_.*_runtime' "$RUNNER_TEMP/lifemate.runtime-roles.sql")" -eq 3
          test "$(grep -c '^create role lifemate_backup_reader ' "$RUNNER_TEMP/lifemate.runtime-roles.sql")" -eq 1
          grep -q '^create role lifemate_backup_reader NOLOGIN NOSUPERUSER INHERIT NOCREATEROLE NOCREATEDB NOREPLICATION BYPASSRLS ' \
            "$RUNNER_TEMP/lifemate.runtime-roles.sql"

      - name: Restore into an independent clean PostgreSQL cluster
        shell: bash
        run: |
          set -euo pipefail
          psql "$RESTORE_ADMIN_URL" --set=ON_ERROR_STOP=1 \
            --file="$RUNNER_TEMP/lifemate.runtime-roles.sql"
          cat "$RUNNER_TEMP/lifemate.restore-drill.dump" | \
            docker run --rm -i --network host \
              -e PGPASSWORD=postgres \
              postgres:17.6-alpine \
              pg_restore \
                --host=localhost \
                --port=5433 \
                --username=postgres \
                --dbname=lifemate_restore \
                --no-owner \
                --exit-on-error

      - name: Seed synthetic healthcare row in restored target
        shell: bash
        run: |
          set -euo pipefail
          psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          insert into lifemate.app_users(id, auth_subject, status, created_at_utc, updated_at_utc)
          values (
            '5b2500d0-2209-4b6f-9e41-1f9ff3a84c11'::uuid,
            'restore-health-contract-subject',
            'Active', now(), now()
          );
          insert into lifemate.user_profiles(
            id, user_id, display_name, phone_number, email, locale, time_zone,
            avatar_key, version, created_at_utc, updated_at_utc
          ) values (
            '5b2500d0-2209-4b6f-9e41-1f9ff3a84c12'::uuid,
            '5b2500d0-2209-4b6f-9e41-1f9ff3a84c11'::uuid,
            'Restore Health Contract', null, 'restore-health@example.test',
            'fa', 'Asia/Tehran', 'person_blue', 1, now(), now()
          );

          with self_person as (
            select person_id
            from core.account_person_links
            where account_id='5b2500d0-2209-4b6f-9e41-1f9ff3a84c11'::uuid
              and link_type='Self'
              and status='Active'
            limit 1
          ), wellmate_app as (
            select id
            from ecosystem.applications
            where code='wellmate' and status='Active'
            limit 1
          )
          insert into lifemate.health_observations(
            id, owner_user_id, person_id, recorded_by_account_id,
            source_application_id, client_request_id,
            observation_type, value_primary, value_secondary,
            unit_primary, unit_secondary, note,
            observed_at_utc, observed_local_date, time_zone,
            source_category, source_provider, metadata_json,
            version, created_at_utc, updated_at_utc
          )
          select
            '123e4567-e89b-42d3-a456-426614174889'::uuid,
            '5b2500d0-2209-4b6f-9e41-1f9ff3a84c11'::uuid,
            self_person.person_id,
            '5b2500d0-2209-4b6f-9e41-1f9ff3a84c11'::uuid,
            wellmate_app.id,
            '123e4567-e89b-42d3-a456-426614174890'::uuid,
            'weight', 72.5, null, 'kg', null, null,
            now(), current_date, 'Asia/Tehran',
            'FirstPartyUserInput', 'wellmate', '{}'::jsonb,
            1, now(), now()
          from self_person cross join wellmate_app;
          SQL

      - name: Verify restored data, role attributes, ACL and RLS contracts
        shell: bash
        run: |
          set -euo pipefail
          psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_marker_count integer;
            v_health_rls boolean;
            v_health_force_rls boolean;
          begin
            select count(*) into v_marker_count
            from public.restore_drill_fixture
            where id='123e4567-e89b-42d3-a456-426614174777'::uuid
              and marker='lifemate-restore-drill';
            if v_marker_count <> 1 then
              raise exception 'restore sentinel missing after pg_restore';
            end if;

            if to_regclass('lifemate.health_observations') is null
               or to_regclass('lifemate.dose_occurrences') is null
               or to_regclass('identity.accounts') is null
               or to_regclass('integration.outbox_messages') is null
               or to_regclass('admin.audit_events') is null
               or to_regclass('security.runtime_readiness_probe') is null then
              raise exception 'critical LifeMate relation missing after restore';
            end if;

            select relrowsecurity, relforcerowsecurity
              into v_health_rls, v_health_force_rls
            from pg_class c
            join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='lifemate' and c.relname='health_observations';
            if coalesce(v_health_rls,false) is not true
               or coalesce(v_health_force_rls,false) is not true then
              raise exception 'health_observations RLS/FORCE RLS was not restored';
            end if;

            if not exists (
              select 1 from pg_policies
              where schemaname='lifemate'
                and tablename='health_observations'
                and policyname='lifemate_edge_runtime_access'
                and cmd='ALL'
                and 'lifemate_edge_runtime'=any(roles)
                and coalesce(qual,'')='true'
                and coalesce(with_check,'')='true'
            ) then
              raise exception 'expected restricted Edge health RLS policy missing';
            end if;

            if not exists (
              select 1 from pg_proc p
              join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='identity'
                and p.proname='finalize_account_deletion'
            ) then
              raise exception 'account deletion function missing after restore';
            end if;

            if not exists (
              select 1 from pg_roles
              where rolname='lifemate_edge_runtime'
                and rolbypassrls=false
                and rolsuper=false
                and rolcreaterole=false
                and rolcreatedb=false
                and rolconnlimit=20
            ) then
              raise exception 'Edge runtime security attributes/connection limit not restored';
            end if;
            if not exists (
              select 1 from pg_roles
              where rolname='lifemate_worker_runtime'
                and rolbypassrls=false
                and rolsuper=false
                and rolcreaterole=false
                and rolcreatedb=false
                and rolconnlimit=5
            ) then
              raise exception 'worker runtime security attributes/connection limit not restored';
            end if;
            if not exists (
              select 1 from pg_roles
              where rolname='lifemate_admin_runtime'
                and rolbypassrls=false
                and rolsuper=false
                and rolcreaterole=false
                and rolcreatedb=false
                and rolconnlimit=10
            ) then
              raise exception 'Admin runtime security attributes/connection limit not restored';
            end if;
            if not exists (
              select 1 from pg_roles
              where rolname='lifemate_backup_reader'
                and rolcanlogin=false
                and rolbypassrls=true
                and rolsuper=false
                and rolcreaterole=false
                and rolcreatedb=false
                and rolreplication=false
            ) then
              raise exception 'portable backup reader attributes not restored';
            end if;
          end
          $$;
          SQL

          psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          set role lifemate_edge_runtime;
          do $$
          begin
            if not exists (
              select 1
              from lifemate.health_observations
              where id='123e4567-e89b-42d3-a456-426614174889'::uuid
                and observation_type='weight'
                and value_primary=72.5
            ) then
              raise exception 'restricted Edge role could not read restored synthetic health row through RLS';
            end if;
          end
          $$;
          select count(*) from ecosystem.applications;
          reset role;

          set role lifemate_worker_runtime;
          select count(*) from integration.outbox_messages;
          reset role;

          set role lifemate_admin_runtime;
          select count(*) from admin.permissions;
          select count(*) from identity.accounts;
          reset role;
          SQL

          if psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            -c 'set role lifemate_admin_runtime; select count(*) from lifemate.health_observations;'; then
            echo 'Admin runtime unexpectedly read restored healthcare data.' >&2
            exit 1
          fi

          psql "$RESTORE_ADMIN_URL" --set=ON_ERROR_STOP=1 \
            -c 'create role restore_probe_unrelated nologin;'
          if psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            -c 'set role restore_probe_unrelated; select count(*) from lifemate.health_observations;'; then
            echo 'Unrelated role unexpectedly read restored healthcare data.' >&2
            exit 1
          fi

      - name: Record drill evidence
        shell: bash
        run: |
          {
            echo '## PostgreSQL restore drill'
            echo ''
            echo '- source and restore: independent PostgreSQL 17.6 clusters'
            echo '- canonical baseline + every forward migration: source applied'
            echo '- PostgreSQL 17.6 pg_dump/pg_restore tools: used'
            echo '- database ACLs + password-free runtime/backup role manifest: restored'
            echo '- Edge/worker/admin role security attributes + connection limits: verified'
            echo '- read-only backup reader NOLOGIN/NOSUPERUSER/BYPASSRLS contract: verified'
            echo '- synthetic data sentinel: restored'
            echo '- synthetic health row: visible to restricted Edge role through restored RLS'
            echo '- Admin runtime health-table read: denied'
            echo '- Health RLS + FORCE RLS + expected policy expression: verified'
            echo '- worker representative ACL probe: passed'
            echo '- unrelated healthcare read: denied'
          } >> "$GITHUB_STEP_SUMMARY"
