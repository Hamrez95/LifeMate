name: postgres-restore-drill

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - '.github/workflows/postgres-restore-drill.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - '.github/workflows/postgres-restore-drill.yml'

permissions:
  contents: read

jobs:
  logical-backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      source_postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_source
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      restore_postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_restore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOURCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_source
      RESTORE_ADMIN_URL: postgres://postgres:postgres@localhost:5433/postgres
      RESTORE_DATABASE_URL: postgres://postgres:postgres@localhost:5433/lifemate_restore
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false

      - name: Build canonical source database
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Add synthetic restore sentinel
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          create table public.restore_drill_fixture(
            id uuid primary key,
            marker text not null,
            created_at_utc timestamptz not null default now()
          );
          insert into public.restore_drill_fixture(id, marker)
          values ('123e4567-e89b-42d3-a456-426614174777', 'lifemate-restore-drill');
          SQL

      - name: Create database backup and cluster-role manifest
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's host client may lag PostgreSQL 17. Use the exact reviewed
          # PostgreSQL 17.6 image for pg_dump so server/client majors match.
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:17.6-alpine \
            pg_dump \
              --host=localhost \
              --port=5432 \
              --username=postgres \
              --dbname=lifemate_source \
              --format=custom \
              --no-owner \
            > "$RUNNER_TEMP/lifemate.restore-drill.dump"
          test -s "$RUNNER_TEMP/lifemate.restore-drill.dump"

          psql "$SOURCE_DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL' > "$RUNNER_TEMP/lifemate.runtime-roles.sql"
          select format(
            'create role %I %s %s %s %s %s %s %s;',
            rolname,
            case when rolcanlogin then 'LOGIN' else 'NOLOGIN' end,
            case when rolsuper then 'SUPERUSER' else 'NOSUPERUSER' end,
            case when rolinherit then 'INHERIT' else 'NOINHERIT' end,
            case when rolcreaterole then 'CREATEROLE' else 'NOCREATEROLE' end,
            case when rolcreatedb then 'CREATEDB' else 'NOCREATEDB' end,
            case when rolreplication then 'REPLICATION' else 'NOREPLICATION' end,
            case when rolbypassrls then 'BYPASSRLS' else 'NOBYPASSRLS' end
          )
          from pg_roles
          where rolname in ('lifemate_edge_runtime','lifemate_worker_runtime')
          order by rolname;
          SQL
          test "$(grep -c '^create role lifemate_.*_runtime' "$RUNNER_TEMP/lifemate.runtime-roles.sql")" -eq 2

      - name: Restore into an independent clean PostgreSQL cluster
        shell: bash
        run: |
          set -euo pipefail
          psql "$RESTORE_ADMIN_URL" --set=ON_ERROR_STOP=1 \
            --file="$RUNNER_TEMP/lifemate.runtime-roles.sql"
          cat "$RUNNER_TEMP/lifemate.restore-drill.dump" | \
            docker run --rm -i --network host \
              -e PGPASSWORD=postgres \
              postgres:17.6-alpine \
              pg_restore \
                --host=localhost \
                --port=5433 \
                --username=postgres \
                --dbname=lifemate_restore \
                --no-owner \
                --exit-on-error

      - name: Verify restored data, ACL and RLS contracts
        shell: bash
        run: |
          set -euo pipefail
          psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_marker_count integer;
            v_health_rls boolean;
            v_health_force_rls boolean;
            v_runtime_bypass boolean;
          begin
            select count(*) into v_marker_count
            from public.restore_drill_fixture
            where id='123e4567-e89b-42d3-a456-426614174777'::uuid
              and marker='lifemate-restore-drill';
            if v_marker_count <> 1 then
              raise exception 'restore sentinel missing after pg_restore';
            end if;

            if to_regclass('lifemate.health_observations') is null
               or to_regclass('lifemate.dose_occurrences') is null
               or to_regclass('identity.accounts') is null
               or to_regclass('integration.outbox_messages') is null then
              raise exception 'critical LifeMate relation missing after restore';
            end if;

            select relrowsecurity, relforcerowsecurity
              into v_health_rls, v_health_force_rls
            from pg_class c
            join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='lifemate' and c.relname='health_observations';
            if coalesce(v_health_rls,false) is not true
               or coalesce(v_health_force_rls,false) is not true then
              raise exception 'health_observations RLS/FORCE RLS was not restored';
            end if;

            if not exists (
              select 1
              from pg_policies
              where schemaname='lifemate'
                and tablename='health_observations'
                and policyname='lifemate_edge_runtime_access'
                and cmd='ALL'
                and 'lifemate_edge_runtime'=any(roles)
            ) then
              raise exception 'expected restricted Edge RLS policy missing';
            end if;

            if not exists (
              select 1 from pg_proc p
              join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='identity'
                and p.proname='finalize_account_deletion'
            ) then
              raise exception 'account deletion function missing after restore';
            end if;

            select rolbypassrls into v_runtime_bypass
            from pg_roles where rolname='lifemate_edge_runtime';
            if coalesce(v_runtime_bypass,true) is true then
              raise exception 'restricted Edge role restored with BYPASSRLS';
            end if;
          end
          $$;
          SQL

          psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          set role lifemate_edge_runtime;
          select count(*) from ecosystem.applications;
          select count(*) from lifemate.health_observations;
          reset role;
          set role lifemate_worker_runtime;
          select count(*) from integration.outbox_messages;
          reset role;
          SQL

          psql "$RESTORE_ADMIN_URL" --set=ON_ERROR_STOP=1 \
            -c 'create role restore_probe_unrelated nologin;'
          if psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            -c 'set role restore_probe_unrelated; select count(*) from lifemate.health_observations;'; then
            echo 'Unrelated role unexpectedly read restored healthcare data.' >&2
            exit 1
          fi

      - name: Record drill evidence
        shell: bash
        run: |
          {
            echo '## PostgreSQL restore drill'
            echo ''
            echo '- source and restore: independent PostgreSQL 17.6 clusters'
            echo '- canonical baseline + every forward migration: source applied'
            echo '- PostgreSQL 17.6 pg_dump/pg_restore tools: used'
            echo '- custom database dump with ACLs: restored'
            echo '- restricted runtime role attributes: restored from separate password-free manifest'
            echo '- synthetic data sentinel: restored'
            echo '- critical schemas/functions: restored'
            echo '- Health RLS + FORCE RLS + expected Edge policy: verified'
            echo '- Edge and worker representative ACL probes: passed'
            echo '- unrelated healthcare read: denied'
          } >> "$GITHUB_STEP_SUMMARY"
