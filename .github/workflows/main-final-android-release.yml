name: main-final-android-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-final-android-release.yml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/functions/lifemate-telemetry/**'
      - 'supabase/functions/lifemate-readiness/**'
  workflow_dispatch:
    inputs:
      confirm_foundation_release:
        description: Type RELEASE-FOUNDATION-CLOSED after all executable foundation gates are complete
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: main-final-android-release-${{ github.sha }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
  LIFEMATE_TELEMETRY_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-telemetry
  LIFEMATE_READINESS_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-readiness
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
  ENABLE_GOOGLE_AUTH: 'false'
  ENABLE_PHONE_OTP: 'false'
  ENABLE_WOMEN_CALENDAR_PILOT: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  Security__Invitations__ContactPepper: ci-only-invitation-contact-pepper-32-bytes-minimum

jobs:
  deployment-credential-preflight:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require Supabase deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::SUPABASE_ACCESS_TOKEN is required for exact-main Edge deployment.'
            exit 1
          fi

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Verify Supabase access token is accepted
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list >/dev/null

  verify-and-build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: beta
    timeout-minutes: 50
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TELEMETRY_SMOKE_EMAIL: ${{ secrets.BETA_PATIENT_EMAIL }}
      TELEMETRY_SMOKE_PASSWORD: ${{ secrets.BETA_PATIENT_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
          fetch-depth: 2

      - name: Require main source and explicit foundation closure
        shell: bash
        env:
          CONFIRM_FOUNDATION_RELEASE: ${{ inputs.confirm_foundation_release }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRM_FOUNDATION_RELEASE" = 'RELEASE-FOUNDATION-CLOSED'

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Verify Edge API telemetry readiness and workers
        shell: bash
        run: |
          set -euo pipefail
          (cd supabase/functions/lifemate-api && deno fmt --check && deno task check && deno task test)
          (cd supabase/functions/lifemate-telemetry && deno fmt --check && deno task check && deno task test)
          (cd supabase/functions/lifemate-readiness && deno fmt --check && deno task check && deno task test)
          (cd supabase/functions/lifemate-worker && deno fmt --check && deno task check)
          (cd supabase/functions/lifemate-kavenegar-sms-hook && deno fmt --check && deno task check)

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'

      - name: Verify backend .NET
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend-dotnet/LifeMate.sln
          dotnet build backend-dotnet/LifeMate.sln --configuration Release --no-restore
          dotnet test backend-dotnet/tests/LifeMate.UnitTests/LifeMate.UnitTests.csproj --configuration Release --no-build

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Verify Flutter source
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/lifemate_client && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd wellmate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd caremate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)

      - name: Require exact-main deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::SUPABASE_ACCESS_TOKEN is required for every exact-main release deployment.'
            exit 1
          fi
          if [ -z "$TELEMETRY_SMOKE_EMAIL" ] || [ -z "$TELEMETRY_SMOKE_PASSWORD" ]; then
            echo '::error::Authenticated telemetry smoke credentials are required before final Android artifacts.'
            exit 1
          fi

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Deploy exact main Edge source
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          cleanup_secret_file() {
            if command -v shred >/dev/null 2>&1; then
              shred -u "$secret_file"
            else
              rm -f "$secret_file"
            fi
          }
          trap cleanup_secret_file EXIT
          chmod 600 "$secret_file"
          printf 'LIFEMATE_RELEASE_VERSION=%s\n' "$GITHUB_SHA" > "$secret_file"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --env-file "$secret_file"
          supabase functions deploy lifemate-api \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api
          supabase functions deploy lifemate-telemetry \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api
          supabase functions deploy lifemate-readiness \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Require exact production API version
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "ready" and .service == "lifemate-api" and .version == $version' \
            >/dev/null
          unauthorized_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$unauthorized_status" = '401'

      - name: Require restricted readiness role on transaction pooler
        shell: bash
        run: |
          set -euo pipefail
          readiness_response="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$LIFEMATE_READINESS_URL")"
          echo "$readiness_response" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "application_ready" and .role == "lifemate_edge_runtime" and .service == "lifemate-readiness" and .version == $version and .databaseTransport == "transaction_pooler" and .transactionPoolerRequired == true' \
            >/dev/null

      - name: Require authenticated production telemetry
        shell: bash
        run: |
          set -euo pipefail
          auth_payload="$(jq -cn \
            --arg email "$TELEMETRY_SMOKE_EMAIL" \
            --arg password "$TELEMETRY_SMOKE_PASSWORD" \
            '{email:$email,password:$password}')"
          access_token="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$auth_payload" \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" | jq -er '.access_token')"
          test -n "$access_token"

          event_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          event_payload="$(jq -cn \
            --arg eventId "$event_id" \
            --arg releaseVersion "$GITHUB_SHA" \
            '{eventId:$eventId,application:"wellmate",releaseVersion:$releaseVersion,platform:"android",source:"zone",errorType:"FinalReleaseSmokeError",stackFingerprint:"0123456789abcdef",fatal:false}')"
          telemetry_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data "$event_payload" \
            "$LIFEMATE_TELEMETRY_URL")"
          test "$telemetry_status" = '202'

          unauthorized_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$event_payload" \
            "$LIFEMATE_TELEMETRY_URL")"
          test "$unauthorized_status" = '401'

      - name: Prepare founder-owned Android signing
        shell: bash
        env:
          WELLMATE_KEYSTORE_BASE64: ${{ secrets.WELLMATE_KEYSTORE_BASE64 }}
          WELLMATE_STORE_PASSWORD: ${{ secrets.WELLMATE_STORE_PASSWORD }}
          WELLMATE_KEY_PASSWORD: ${{ secrets.WELLMATE_KEY_PASSWORD }}
          WELLMATE_KEY_ALIAS: ${{ secrets.WELLMATE_KEY_ALIAS }}
          CAREMATE_KEYSTORE_BASE64: ${{ secrets.CAREMATE_KEYSTORE_BASE64 }}
          CAREMATE_STORE_PASSWORD: ${{ secrets.CAREMATE_STORE_PASSWORD }}
          CAREMATE_KEY_PASSWORD: ${{ secrets.CAREMATE_KEY_PASSWORD }}
          CAREMATE_KEY_ALIAS: ${{ secrets.CAREMATE_KEY_ALIAS }}
        run: bash tools/release/prepare-android-signing.sh

      - name: Build exact-main release APKs
        shell: bash
        env:
          LIFEMATE_REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          set -euo pipefail
          build_name="0.9.2"
          build_number="$GITHUB_RUN_NUMBER"
          build_args=(
            --release
            --build-name="$build_name"
            --build-number="$build_number"
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_GOOGLE_AUTH=$ENABLE_GOOGLE_AUTH"
            --dart-define="ENABLE_PHONE_OTP=$ENABLE_PHONE_OTP"
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=$ENABLE_WOMEN_CALENDAR_PILOT"
          )
          (cd wellmate && flutter build apk "${build_args[@]}")
          (cd caremate && flutter build apk "${build_args[@]}")

      - name: Verify stable Android signatures
        shell: bash
        run: >-
          bash tools/release/verify-android-signing.sh
          wellmate/build/app/outputs/flutter-apk/app-release.apk
          caremate/build/app/outputs/flutter-apk/app-release.apk

      - name: Package and manifest
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          mkdir -p dist
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk "dist/wellmate-0.9.2-main-${short_sha}.apk"
          cp caremate/build/app/outputs/flutter-apk/app-release.apk "dist/caremate-0.9.2-main-${short_sha}.apk"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          wellmate_android="$(bash tools/release/extract-android-apk-metadata.sh dist/wellmate-*.apk "$aapt_bin" com.lifemate.wellmate)"
          caremate_android="$(bash tools/release/extract-android-apk-metadata.sh dist/caremate-*.apk "$aapt_bin" com.lifemate.caremate)"
          wellmate_sha="$(sha256sum dist/wellmate-*.apk | awk '{print $1}')"
          caremate_sha="$(sha256sum dist/caremate-*.apk | awk '{print $1}')"
          wellmate_cert_sha256="$(cat "$LIFEMATE_ANDROID_SIGNING_DIR/wellmate-cert-sha256.txt")"
          caremate_cert_sha256="$(cat "$LIFEMATE_ANDROID_SIGNING_DIR/caremate-cert-sha256.txt")"
          jq -n \
            --arg mainCommit "$GITHUB_SHA" \
            --arg buildNumber "$GITHUB_RUN_NUMBER" \
            --arg version "0.9.2" \
            --arg apiEnvironment "production" \
            --arg apiBaseUrl "$LIFEMATE_API_BASE_URL" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wellmateSha256 "$wellmate_sha" \
            --arg caremateSha256 "$caremate_sha" \
            --arg wellmateSigningCertSha256 "$wellmate_cert_sha256" \
            --arg caremateSigningCertSha256 "$caremate_cert_sha256" \
            --argjson wellmateAndroid "$wellmate_android" \
            --argjson caremateAndroid "$caremate_android" \
            --argjson googleAuth false \
            --argjson phoneOtp false \
            --argjson womenCalendarPilot true \
            '{mainCommit:$mainCommit,version:$version,buildNumber:$buildNumber,builtAtUtc:$builtAt,apiEnvironment:$apiEnvironment,apiBaseUrl:$apiBaseUrl,featureFlags:{googleAuth:$googleAuth,phoneOtp:$phoneOtp,womenCalendarPilot:$womenCalendarPilot},apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256,signingCertSha256:$wellmateSigningCertSha256,android:$wellmateAndroid},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256,signingCertSha256:$caremateSigningCertSha256,android:$caremateAndroid}},releasePurpose:"foundation-closed-stable",databaseTransport:"transaction_pooler",transactionPoolerRequired:true,storeSigningConfigured:true}' \
            > dist/manifest.json

      - name: Upload final exact-main Android bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemate-main-final-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f wellmate/android/key.properties caremate/android/key.properties
          if [[ -n "${LIFEMATE_ANDROID_SIGNING_DIR:-}" ]]; then
            rm -rf "$LIFEMATE_ANDROID_SIGNING_DIR"
          fi
