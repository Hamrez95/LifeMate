name: profile-photo-invariant-debug

on:
  push:
    branches:
      - fix/profile-photo-reminder-state

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/profile-photo-reminder-state
          show-progress: false

      - name: Materialize generated sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hotfix/apply_reminder_state_and_lead_times.py
          python3 tools/hotfix/apply_reminder_due_now_fix.py
          python3 tools/hotfix/apply_profile_photo_backend.py
          python3 tools/hotfix/apply_profile_photo_flutter.py
          python3 tools/hotfix/apply_profile_photo_safety_fix.py
          python3 tools/hotfix/apply_profile_avatar_analyzer_fix.py
          python3 tools/hotfix/apply_profile_photo_deno_body_fix.py

      - name: Diagnose every invariant
        shell: bash
        run: |
          set -u
          failed=0
          check() {
            local label="$1"
            shift
            if "$@"; then
              echo "PASS: $label"
            else
              echo "FAIL: $label" >&2
              failed=1
            fi
          }

          check bell-callback grep -q 'onMissedMedicationTaken' wellmate/lib/core/widgets/wellmate_app_header.dart
          check bell-api grep -q 'reportDose' wellmate/lib/screens/home/home_screen.dart
          check home-missed grep -q "final missed = item.status == 'missed'" wellmate/lib/screens/home/home_screen_content.dart
          check calendar-missed grep -q "final isMissed = item.status == 'missed'" wellmate/lib/screens/calendar/calendar_screen.dart
          check edge-effective-status grep -q 'effective_status' supabase/functions/lifemate-api/care_events.ts
          check patient-lead-ui grep -q 'patientReminderMinutesBefore' wellmate/lib/screens/treatments/add_treatment_screen.dart
          check caregiver-lead-ui grep -q 'caregiverReminderMinutesBefore' wellmate/lib/screens/treatments/care_plan_hub_screen.dart
          check reminder-migration grep -q 'patient_reminder_minutes_before' supabase/migrations/20260805013000_add_reminder_lead_times.sql
          check care-trigger grep -q 'triggerAtUtc' caremate/lib/models/care_recipient_reminder.dart
          check care-events grep -q 'getCareRecipientCareEvents' caremate/lib/screens/dashboard_screen.dart
          if grep -q 'cancelAll' caremate/lib/providers/care_notification_provider.dart; then
            echo 'FAIL: CareMate cancelAll present' >&2
            failed=1
          else
            echo 'PASS: CareMate has no cancelAll'
          fi
          check wellmate-private grep -q 'visibility: NotificationVisibility.private' wellmate/lib/providers/notification_provider.dart
          check caremate-private grep -q 'visibility: NotificationVisibility.private' caremate/lib/providers/care_notification_provider.dart

          check photo-migration grep -q 'profile_photo_path character varying(512)' supabase/migrations/20260805023000_add_profile_photo_path.sql
          check private-bucket grep -q 'public: false' supabase/functions/lifemate-api/profile_photo.ts
          check photo-validation grep -q 'validateProfilePhoto' supabase/functions/lifemate-api/profile_photo.ts
          check photo-size-limit grep -q 'profilePhotoMaximumBytes' supabase/functions/lifemate-api/profile_photo.ts
          check redacted-audit grep -q 'metadata_json, null' supabase/functions/lifemate-api/profile.ts
          check photo-rendering grep -q 'profilePhotoUrl' packages/lifemate_client/lib/src/profile_avatar.dart
          check photo-client grep -q 'uploadCurrentProfilePhoto' packages/lifemate_client/lib/src/lifemate_api_client.dart
          check wellmate-camera grep -q 'ImageSource.camera' wellmate/lib/screens/profile/editable_profile_screen.dart
          check wellmate-gallery grep -q 'ImageSource.gallery' wellmate/lib/screens/profile/editable_profile_screen.dart
          check caremate-camera grep -q 'ImageSource.camera' caremate/lib/screens/editable_profile_screen.dart
          check caremate-gallery grep -q 'ImageSource.gallery' caremate/lib/screens/editable_profile_screen.dart
          check wellmate-camera-permission grep -q 'android.permission.CAMERA' wellmate/android/app/src/main/AndroidManifest.xml
          check caremate-camera-permission grep -q 'android.permission.CAMERA' caremate/android/app/src/main/AndroidManifest.xml

          if grep -R --line-number 'profile-photo.*public.*true' supabase/functions/lifemate-api supabase/migrations; then
            echo 'FAIL: public profile-photo marker present' >&2
            failed=1
          else
            echo 'PASS: no public profile-photo marker'
          fi
          if grep -R --line-number 'profilePhotoPath.*metadata' supabase/functions/lifemate-api; then
            echo 'FAIL: photo path appears in metadata context' >&2
            failed=1
          else
            echo 'PASS: photo path absent from metadata context'
          fi

          exit "$failed"
