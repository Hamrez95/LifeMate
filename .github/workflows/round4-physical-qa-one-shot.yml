name: round4-physical-qa-one-shot

on:
  push:
    branches:
      - fix/wellmate-physical-qa-round-4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/wellmate-physical-qa-round-4
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply Round 4 patch
        run: |
          python3 tools/hotfix/apply_round4_physical_qa.py
          python3 tools/hotfix/diagnose_round4_status_test.py

      - name: Format changed Dart files
        run: |
          dart format \
            packages/lifemate_client/lib/src/lifemate_edit_api.dart \
            packages/lifemate_client/test/lifemate_edit_api_test.dart \
            wellmate/lib/core/widgets/wellmate_app_header.dart \
            wellmate/lib/providers/medication_provider.dart \
            wellmate/lib/screens/home/home_screen.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/lib/screens/home/soft_schedule_card.dart \
            wellmate/lib/screens/women_calendar/women_companion_screen.dart \
            wellmate/test/home_injection_timeline_test.dart \
            wellmate/test/home_visit_action_semantics_test.dart \
            wellmate/test/missed_notification_bell_test.dart \
            wellmate/test/women_companion_experience_test.dart

      - name: Verify shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify CareMate regression
        working-directory: caremate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/lifemate_client/lib/src/lifemate_edit_api.dart \
            packages/lifemate_client/test/lifemate_edit_api_test.dart \
            wellmate/lib/core/widgets/wellmate_app_header.dart \
            wellmate/lib/providers/medication_provider.dart \
            wellmate/lib/screens/home/home_screen.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/lib/screens/home/soft_schedule_card.dart \
            wellmate/lib/screens/women_calendar/women_companion_screen.dart \
            wellmate/test/home_injection_timeline_test.dart \
            wellmate/test/home_visit_action_semantics_test.dart \
            wellmate/test/missed_notification_bell_test.dart \
            wellmate/test/women_companion_experience_test.dart
          git diff --cached --check
          git commit -m 'fix: restore compact home care actions and women cycle layout'
          git push origin HEAD:fix/wellmate-physical-qa-round-4
