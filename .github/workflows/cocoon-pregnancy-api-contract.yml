name: cocoon-pregnancy-api-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/lifemate-api/pregnancy_routes.ts'
      - 'supabase/functions/lifemate-api/pregnancy_routes_test.ts'
      - 'supabase/functions/lifemate-api/pregnancy_store.ts'
      - 'supabase/functions/lifemate-api/pregnancy_dating.ts'
      - 'supabase/functions/lifemate-api/pregnancy_authorization.ts'
      - 'supabase/functions/lifemate-api/subscription_routes.ts'
      - 'packages/lifemate_client/lib/src/cocoon_pregnancy.dart'
      - 'packages/lifemate_client/lib/src/cocoon_pregnancy_api.dart'
      - 'packages/lifemate_client/lib/lifemate_client.dart'
      - 'packages/lifemate_client/test/cocoon_pregnancy_contract_test.dart'
      - 'docs/architecture/cocoonmate-pregnancy-api-contract.md'
      - '.github/workflows/cocoon-pregnancy-api-contract.yml'

permissions:
  contents: read

jobs:
  server-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: supabase/functions/lifemate-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Format new contract tests
        run: deno fmt --check pregnancy_routes_test.ts
      - name: Type check pregnancy contract sources
        run: >-
          deno check
          pregnancy_routes.ts
          pregnancy_routes_test.ts
          subscription_routes.ts
      - name: Unit pregnancy contract tests
        run: deno test --no-check pregnancy_routes_test.ts
      - name: Contract invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'enrollmentState' pregnancy_routes.ts
          grep -Fq 'entitlementState' pregnancy_routes.ts
          grep -Fq 'pregnancy.owner.manage' pregnancy_routes.ts
          grep -Fq 'path.startsWith("/api/v1/cocoon/")' subscription_routes.ts
          grep -Fq 'createPregnancyRouteHandler' subscription_routes.ts
          ! grep -Fq 'currentWeek' pregnancy_routes.ts

  client-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve shared client
        working-directory: packages/lifemate_client
        run: flutter pub get
      - name: Format typed Cocoon client
        run: dart format --output=none --set-exit-if-changed packages/lifemate_client/lib/src/cocoon_pregnancy.dart packages/lifemate_client/lib/src/cocoon_pregnancy_api.dart packages/lifemate_client/test/cocoon_pregnancy_contract_test.dart
      - name: Analyze shared client
        working-directory: packages/lifemate_client
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test Cocoon client contract
        working-directory: packages/lifemate_client
        run: flutter test test/cocoon_pregnancy_contract_test.dart
