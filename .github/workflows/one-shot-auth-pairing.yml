name: one-shot-auth-pairing

on:
  push:
    branches:
      - feat/bb287-parity-completion
    paths:
      - '.github/workflows/one-shot-auth-pairing.yml'
  pull_request:
    paths:
      - '.github/workflows/one-shot-auth-pairing.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-auth-pairing
  cancel-in-progress: false

