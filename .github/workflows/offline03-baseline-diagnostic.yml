name: offline03-baseline-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/offline03-baseline-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Capture formatter and type-check baseline
        shell: bash
        run: |
          set +e
          {
            echo '=== lifemate-api fmt check ==='
            (cd supabase/functions/lifemate-api && deno fmt --check)
            echo "api_exit=$?"
            echo '=== care-management fmt check ==='
            (cd supabase/functions/lifemate-care-management && deno fmt --check)
            echo "care_exit=$?"
          } > formatter-check.txt 2>&1
          deno fmt supabase/functions/lifemate-api supabase/functions/lifemate-care-management >/dev/null 2>&1
          git diff -- supabase/functions/lifemate-api supabase/functions/lifemate-care-management > formatter.patch
          {
            echo '=== lifemate-api type check after canonical formatting ==='
            (cd supabase/functions/lifemate-api && deno task check)
            echo "api_check_exit=$?"
            echo '=== care-management type check after canonical formatting ==='
            (cd supabase/functions/lifemate-care-management && deno task check)
            echo "care_check_exit=$?"
          } > type-check.txt 2>&1
          mkdir -p formatted/supabase/functions
          cp -R supabase/functions/lifemate-api formatted/supabase/functions/
          cp -R supabase/functions/lifemate-care-management formatted/supabase/functions/
          git checkout -- supabase/functions/lifemate-api supabase/functions/lifemate-care-management
          exit 0
      - name: Capture portable schema and account lifecycle baseline
        shell: bash
        run: |
          set +e
          schema_ok=1
          {
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql || schema_ok=0
            if [ "$schema_ok" -eq 1 ]; then
              psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql || schema_ok=0
            fi
            if [ "$schema_ok" -eq 1 ]; then
              while IFS= read -r migration; do
                echo "=== applying $migration ==="
                if ! psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"; then
                  echo "failed_migration=$migration"
                  schema_ok=0
                  break
                fi
              done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
            fi
            echo "schema_ok=$schema_ok"
          } > schema-check.txt 2>&1
          if [ "$schema_ok" -eq 1 ]; then
            (cd supabase/functions/lifemate-api && deno task test:account-lifecycle-integration) > account-lifecycle-check.txt 2>&1
            echo "account_lifecycle_exit=$?" >> account-lifecycle-check.txt
          else
            echo 'account lifecycle skipped because schema setup failed' > account-lifecycle-check.txt
          fi
          exit 0
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline03-baseline-diagnostic-${{ github.sha }}
          path: |
            formatter-check.txt
            formatter.patch
            type-check.txt
            schema-check.txt
            account-lifecycle-check.txt
            formatted
          if-no-files-found: error
