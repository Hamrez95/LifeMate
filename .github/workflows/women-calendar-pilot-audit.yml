name: women-calendar-pilot-audit

on:
  push:
    branches:
      - feat/women-calendar-care-access-notifications
  pull_request:
    branches:
      - feat/v0.9.0-internal.3-localization

permissions:
  contents: write

concurrency:
  group: women-calendar-pilot-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lifemate_women_calendar_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_women_calendar_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__LifeMateDb: Host=localhost;Port=5432;Database=lifemate_women_calendar_tests;Username=postgres;Password=postgres
      Security__Invitations__ContactPepper: integration-only-invitation-contact-pepper-32-bytes-minimum
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_women_calendar_tests

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/women-calendar-care-access-notifications
          fetch-depth: 0
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Apply pending product patches idempotently
        shell: bash
        run: |
          set -euo pipefail

          women_core_ready=false
          if [[ -f supabase/migrations/20260804130000_add_women_calendar_pilot.sql ]] \
            && grep -q "class SubscriptionScreen extends StatefulWidget" wellmate/lib/screens/profile/profile_destination_screens.dart \
            && grep -q "selectEarliestReminderPerPatient" caremate/lib/providers/care_notification_provider.dart \
            && grep -q "cleanupWomenCalendarRun" supabase/functions/lifemate-api/women_calendar_integration_test.ts \
            && grep -q "visibility: NotificationVisibility.private" wellmate/lib/providers/notification_provider.dart \
            && grep -q "visibility: NotificationVisibility.private" caremate/lib/providers/care_notification_provider.dart \
            && grep -q "تاریخ‌ها تخمینی هستند و جایگزین نظر پزشک نیستند" wellmate/lib/screens/women_calendar/women_calendar_screen.dart; then
            women_core_ready=true
          fi

          if [[ "$women_core_ready" != 'true' ]]; then
            python3 tools/hotfix/apply_women_calendar_backend.py
            python3 tools/hotfix/apply_women_calendar_frontend.py
            python3 tools/hotfix/apply_caremate_notifications_and_women_view.py
            python3 tools/hotfix/apply_women_calendar_integration.py
            python3 tools/hotfix/apply_women_calendar_cleanup_fix.py
            python3 tools/hotfix/apply_women_calendar_medical_copy_fix.py
            python3 tools/hotfix/apply_women_calendar_log_redaction.py
            python3 tools/hotfix/apply_notification_privacy_and_resync.py
          else
            echo 'Core women-calendar product patches are already materialized.'
          fi

          python3 tools/hotfix/apply_caremate_log_redaction.py

          if ! grep -q "corrected owner-only note" \
            supabase/functions/lifemate-api/women_calendar_integration_test.ts \
            || ! grep -q "women_calendar.episode_updated" \
              supabase/functions/lifemate-api/women_calendar.ts \
            || ! grep -q "updateWomenCalendarEpisode" \
              packages/lifemate_client/lib/src/lifemate_api_client.dart; then
            python3 tools/hotfix/apply_women_calendar_episode_editor.py
          else
            echo 'Women-calendar episode editor is already materialized.'
          fi

          if ! grep -q "profileAfterDelete" \
            supabase/functions/lifemate-api/women_calendar_integration_test.ts; then
            python3 tools/hotfix/apply_women_calendar_delete_profile_fix.py
          else
            echo 'Women-calendar delete/profile reconciliation is already materialized.'
          fi

          avatar_ready=false
          if [[ -f supabase/migrations/20260804213000_add_profile_avatar_key.sql ]] \
            && [[ -f packages/lifemate_client/lib/src/profile_avatar.dart ]] \
            && grep -q "LifeMateAvatarPicker" wellmate/lib/screens/profile/editable_profile_screen.dart \
            && grep -q "LifeMateAvatarPicker" caremate/lib/screens/editable_profile_screen.dart \
            && grep -q "avatarKey" supabase/functions/lifemate-api/profile.ts; then
            avatar_ready=true
          fi

          if [[ "$avatar_ready" != 'true' ]]; then
            python3 tools/hotfix/apply_profile_avatar_selection.py
            python3 tools/hotfix/apply_profile_avatar_selection_fix.py
          else
            echo 'Persisted profile-avatar selection is already materialized.'
          fi

      - name: Format generated and modified sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dart_files < <(git diff --name-only --diff-filter=ACM | grep -E '\.dart$' || true)
          if (( ${#dart_files[@]} > 0 )); then
            dart format "${dart_files[@]}"
          fi
          mapfile -t deno_files < <(
            git diff --name-only --diff-filter=ACM \
              | grep -E '^supabase/functions/lifemate-api/.*\.ts$' || true
          )
          if (( ${#deno_files[@]} > 0 )); then
            deno fmt "${deno_files[@]}"
          fi

      - name: Verify shared package
        shell: bash
        run: |
          set -euo pipefail
          cd packages/lifemate_client
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Verify WellMate
        shell: bash
        run: |
          set -euo pipefail
          cd wellmate
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Verify CareMate
        shell: bash
        run: |
          set -euo pipefail
          cd caremate
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Verify Edge unit contract
        working-directory: supabase/functions/lifemate-api
        shell: bash
        run: |
          set -euo pipefail
          deno task check
          deno task test

      - name: Build canonical database schema
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend-dotnet/LifeMate.sln --verbosity minimal
          dotnet tool restore
          dotnet build backend-dotnet/LifeMate.sln --configuration Release --no-restore
          dotnet ef database update \
            --configuration Release \
            --no-build \
            --project backend-dotnet/src/LifeMate.Infrastructure \
            --startup-project backend-dotnet/src/LifeMate.Api
          for migration in \
            supabase/migrations/20260803173000_add_consent_scoped_care_events.sql \
            supabase/migrations/20260804002000_lock_down_public_health_status.sql \
            supabase/migrations/20260804003000_add_user_profile_version.sql \
            supabase/migrations/20260804130000_add_women_calendar_pilot.sql \
            supabase/migrations/20260804213000_add_profile_avatar_key.sql
          do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done

      - name: Verify database isolation journeys
        working-directory: supabase/functions/lifemate-api
        shell: bash
        run: |
          set -euo pipefail
          deno task test:integration

      - name: Enforce feature privacy profile and notification invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "defaultValue: false" packages/lifemate_client/lib/src/feature_flags.dart
          grep -q "ENABLE_WOMEN_CALENDAR_PILOT" packages/lifemate_client/lib/src/feature_flags.dart
          grep -q "women_calendar_feature_disabled" supabase/functions/lifemate-api/index.ts
          grep -q "can_view_women_calendar boolean not null default false" supabase/migrations/20260804130000_add_women_calendar_pilot.sql
          grep -q '"privateNotes" in episodes\[0\], false' supabase/functions/lifemate-api/women_calendar_integration_test.ts
          grep -q "women_calendar.episode_updated" supabase/functions/lifemate-api/women_calendar.ts
          grep -q "updateWomenCalendarEpisode" packages/lifemate_client/lib/src/lifemate_api_client.dart
          grep -q "WomenCalendarMonthCard" wellmate/lib/screens/women_calendar/women_calendar_screen.dart
          grep -q "یادداشت خصوصی" wellmate/lib/screens/women_calendar/women_calendar_screen.dart
          grep -q "selectEarliestReminderPerPatient" caremate/lib/providers/care_notification_provider.dart
          grep -q "pendingNotificationRequests" caremate/lib/providers/care_notification_provider.dart
          grep -q "pendingNotificationRequests" wellmate/lib/providers/notification_provider.dart
          grep -q "visibility: NotificationVisibility.private" caremate/lib/providers/care_notification_provider.dart
          grep -q "visibility: NotificationVisibility.private" wellmate/lib/providers/notification_provider.dart
          grep -q "medicineReminderWindow" wellmate/lib/screens/home/home_screen_content.dart
          grep -q "مراقبان فعال.*toPersianDigit" wellmate/lib/screens/profile/care_access_screen.dart
          grep -q "تقویم بانوان" wellmate/lib/core/widgets/wellmate_bottom_nav.dart
          grep -q "حمایت‌های غیرپزشکی" caremate/lib/screens/women_calendar/care_women_calendar_screen.dart
          grep -q "تاریخ‌ها تخمینی هستند و جایگزین نظر پزشک نیستند" wellmate/lib/screens/women_calendar/women_calendar_screen.dart

          grep -q "avatar_key character varying(32)" supabase/migrations/20260804213000_add_profile_avatar_key.sql
          grep -q "default 'person_blue'" supabase/migrations/20260804213000_add_profile_avatar_key.sql
          grep -q "invalid_avatar_key" supabase/functions/lifemate-api/profile.ts
          grep -q "avatarKey" packages/lifemate_client/lib/src/lifemate_api_client.dart
          grep -q "LifeMateAvatarPicker" wellmate/lib/screens/profile/editable_profile_screen.dart
          grep -q "LifeMateAvatarPicker" caremate/lib/screens/editable_profile_screen.dart
          grep -q "metadata_json, null" supabase/functions/lifemate-api/profile.ts
          ! grep -q "mother_avatar.png" wellmate/lib/screens/profile/profile_screen.dart
          ! grep -q "mother_avatar.png" wellmate/lib/core/widgets/wellmate_app_header.dart
          ! grep -q "assets/images/Caregiver.png" caremate/lib/screens/profile_screen.dart
          ! grep -q "assets/images/Caregiver.png" caremate/lib/widgets/custom_ui_components.dart

          if grep -q "cancelAll" caremate/lib/providers/care_notification_provider.dart; then
            echo '::error::CareMate reminder resync must not cancel unrelated notifications.'
            exit 1
          fi

          if grep -R --line-number -F ': $error' \
            wellmate/lib/screens/women_calendar \
            wellmate/lib/screens/profile/care_access_settings_screen.dart \
            wellmate/lib/screens/home/home_screen.dart \
            wellmate/lib/screens/profile/profile_destination_screens.dart \
            caremate/lib/main.dart \
            caremate/lib/screens/dashboard_screen.dart; then
            echo '::error::Sensitive exception details must not be logged from calendar or patient flows.'
            exit 1
          fi

          if grep -R --line-number -F '$stackTrace' \
            caremate/lib/main.dart \
            caremate/lib/screens/dashboard_screen.dart; then
            echo '::error::Stack traces must not be logged from CareMate patient flows.'
            exit 1
          fi

          if grep -R --line-number -E "تخمک‌گذاری قطعی|روز قطعی تخمک|افزایش باروری|درمان ناباروری|روش پیشگیری از بارداری|ابزار پیشگیری از بارداری|fertility window|ovulation day|contraception method" \
            wellmate/lib/screens/women_calendar \
            caremate/lib/screens/women_calendar \
            supabase/functions/lifemate-api/women_calendar.ts; then
            echo '::error::Women calendar must remain a non-medical estimate tool.'
            exit 1
          fi

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            packages/lifemate_client \
            wellmate \
            caremate \
            supabase/functions/lifemate-api \
            supabase/migrations/20260804130000_add_women_calendar_pilot.sql \
            supabase/migrations/20260804213000_add_profile_avatar_key.sql
          if git diff --cached --quiet; then
            echo 'No verified product changes to commit.'
            exit 0
          fi
          echo 'Verified product files staged:'
          git diff --cached --name-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add profile avatars and complete women calendar pilot'
          git push origin HEAD:feat/women-calendar-care-access-notifications
