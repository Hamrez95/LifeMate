name: cycle-safety-patch-runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cycle-safety-patch-runner.yml'

permissions:
  contents: write

jobs:
  patch-cycle-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: stabilization/cycle-uncertainty
          fetch-depth: 0
      - name: Prepare companion-specific estimator patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          companion = Path('wellmate/lib/screens/women_calendar/women_companion_screen.dart')
          text = companion.read_text(encoding='utf-8')
          old = '''    return WomenCalendarEstimate.calculate(
                lastPeriodStart: start,
                cycleLength: _profile['cycleLength'] is int
                    ? _profile['cycleLength'] as int
                    : 28,
                periodLength: _profile['periodLength'] is int
                    ? _profile['periodLength'] as int
                    : 5,
              );'''
          new = '''    final periodStarts = _episodes
                .map((episode) => DateTime.tryParse(episode['startedOn']?.toString() ?? ''))
                .whereType<DateTime>()
                .toList(growable: false);
              return WomenCalendarEstimate.calculateFromEpisodes(
                lastPeriodStart: start,
                configuredCycleLength: _profile['cycleLength'] is int
                    ? _profile['cycleLength'] as int
                    : 28,
                periodLength: _profile['periodLength'] is int
                    ? _profile['periodLength'] as int
                    : 5,
                periodStarts: periodStarts,
              );'''
          if old not in text:
              # Keep this idempotent if the source has already been patched.
              if 'return WomenCalendarEstimate.calculateFromEpisodes(' not in text:
                  raise SystemExit('Companion cycle estimator shape changed unexpectedly.')
          else:
              companion.write_text(text.replace(old, new, 1), encoding='utf-8')

          patcher = Path('tools/hotfix/apply_cycle_uncertainty_final.py')
          script = patcher.read_text(encoding='utf-8')
          generic_companion = '''replace_once(
              "wellmate/lib/screens/women_calendar/women_companion_screen.dart",
              old_getter,
              new_getter,
          )
          '''
          if generic_companion in script:
              patcher.write_text(script.replace(generic_companion, '', 1), encoding='utf-8')
          PY
      - name: Apply reviewed deterministic patch
        run: python3 tools/hotfix/apply_cycle_uncertainty_final.py
      - name: Push only the cycle PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Cycle safety branch already contains the patch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            wellmate/lib/screens/women_calendar/women_calendar_screen.dart \
            wellmate/lib/screens/women_calendar/women_companion_screen.dart \
            wellmate/lib/screens/women_calendar/women_calendar_experience_widgets.dart \
            wellmate/lib/screens/women_calendar/women_calendar_month_card.dart \
            caremate/lib/screens/women_calendar/care_women_calendar_screen.dart \
            supabase/functions/lifemate-api/women_calendar.ts \
            supabase/functions/lifemate-api/women_calendar_test.ts
          git commit -m 'fix(safety): wire cycle uncertainty through production surfaces'
          git push origin HEAD:stabilization/cycle-uncertainty
