name: cycle-safety-patch-runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cycle-safety-patch-runner.yml'

permissions:
  contents: write

jobs:
  patch-cycle-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: stabilization/cycle-uncertainty
          fetch-depth: 0
      - name: Apply reviewed deterministic patch
        run: python3 tools/hotfix/apply_cycle_uncertainty_v3.py
      - name: Push only the cycle PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Cycle safety branch already contains the patch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            wellmate/lib/screens/women_calendar/women_calendar_screen.dart \
            wellmate/lib/screens/women_calendar/women_companion_screen.dart \
            wellmate/lib/screens/women_calendar/women_calendar_experience_widgets.dart \
            wellmate/lib/screens/women_calendar/women_calendar_month_card.dart \
            caremate/lib/screens/women_calendar/care_women_calendar_screen.dart \
            supabase/functions/lifemate-api/women_calendar.ts \
            supabase/functions/lifemate-api/women_calendar_test.ts
          git commit -m 'fix(safety): wire cycle uncertainty through production surfaces'
          git push origin HEAD:stabilization/cycle-uncertainty
