name: scale08-observability-patch

on:
  push:
    branches: ['perf/scale-08-observability-slos']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-08-observability-slos
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Wire observability into API runtime
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          http = Path('supabase/functions/lifemate-api/http.ts')
          text = http.read_text()
          text = replace_once(
              text,
              '  "Access-Control-Expose-Headers": "Retry-After, X-Idempotency-Replayed",\n',
              '  "Access-Control-Expose-Headers":\n'
              '    "Retry-After, X-Idempotency-Replayed, X-Correlation-Id",\n',
              'CORS correlation expose',
          )
          http.write_text(text)

          rate = Path('supabase/functions/lifemate-api/rate_limit.ts')
          text = rate.read_text()
          text = replace_once(
              text,
              '''type FetchLike = (\n  input: string | URL | Request,\n  init?: RequestInit,\n) => Promise<Response>;\n''',
              '''type FetchLike = (\n  input: string | URL | Request,\n  init?: RequestInit,\n) => Promise<Response>;\n\nexport type RateLimiterSnapshot = {\n  source: "local" | "redis";\n  state: "healthy" | "degraded";\n  lastFailureCode: string | null;\n  lastFailureAgeMs: number | null;\n};\n''',
              'rate snapshot type',
          )
          text = replace_once(
              text,
              '''  private readonly fallback: InMemoryCounterStore;\n  private lastDegradedWarningAt = 0;\n''',
              '''  private readonly fallback: InMemoryCounterStore;\n  private lastDegradedWarningAt = 0;\n  private primaryHealthy = true;\n  private lastPrimaryFailureAt = 0;\n  private lastPrimaryFailureCode: string | null = null;\n''',
              'rate state fields',
          )
          text = replace_once(
              text,
              '''    try {\n      result = await this.primary.consume(key, policy);\n    } catch (error) {\n''',
              '''    try {\n      result = await this.primary.consume(key, policy);\n      this.primaryHealthy = true;\n    } catch (error) {\n      this.primaryHealthy = false;\n      this.lastPrimaryFailureAt = Date.now();\n      this.lastPrimaryFailureCode = safeRateLimitError(error);\n''',
              'rate primary health',
          )
          text = replace_once(
              text,
              '''          code: safeRateLimitError(error),\n''',
              '''          code: this.lastPrimaryFailureCode,\n''',
              'rate warning code',
          )
          method_marker = '''    if (result.count > effectiveLimit) {\n      throw new ApiError(\n        429,\n        "rate_limit_exceeded",\n        "Too many requests. Try again later.",\n      );\n    }\n  }\n}\n'''
          method_replacement = '''    if (result.count > effectiveLimit) {\n      throw new ApiError(\n        429,\n        "rate_limit_exceeded",\n        "Too many requests. Try again later.",\n      );\n    }\n  }\n\n  snapshot(now = Date.now()): RateLimiterSnapshot {\n    return {\n      source: this.source,\n      state: this.primaryHealthy ? "healthy" : "degraded",\n      lastFailureCode: this.lastPrimaryFailureCode,\n      lastFailureAgeMs: this.lastPrimaryFailureAt > 0\n        ? Math.max(0, now - this.lastPrimaryFailureAt)\n        : null,\n    };\n  }\n}\n'''
          text = replace_once(text, method_marker, method_replacement, 'rate snapshot method')
          rate.write_text(text)

          index = Path('supabase/functions/lifemate-api/index.ts')
          text = index.read_text()
          text = replace_once(
              text,
              'import { corsHeaders, json, problem, safeError } from "./http.ts";\n',
              'import { corsHeaders, json, problem, safeError } from "./http.ts";\n'
              'import {\n'
              '  ApiObservability,\n'
              '  inferTelemetrySubsystem,\n'
              '  type TelemetrySubsystem,\n'
              '  withCorrelationId,\n'
              '} from "./observability.ts";\n',
              'observability imports',
          )
          text = replace_once(
              text,
              '''const mutationIdempotency = createMutationIdempotencyStore(\n  databaseUrl,\n  contactHashingSecret,\n);\n''',
              '''const mutationIdempotency = createMutationIdempotencyStore(\n  databaseUrl,\n  contactHashingSecret,\n);\nconst apiObservability = new ApiObservability("lifemate-api", releaseVersion);\n''',
              'observability instance',
          )
          text = replace_once(
              text,
              '''Deno.serve(async (request: Request) => {\n  const correlationId = crypto.randomUUID();\n  const path = normalizePath(new URL(request.url).pathname);\n\n  if (request.method === "OPTIONS") {\n    return new Response("ok", { headers: corsHeaders });\n  }\n''',
              '''Deno.serve(async (request: Request) => {\n  const correlationId = crypto.randomUUID();\n  const path = normalizePath(new URL(request.url).pathname);\n  const startedAt = performance.now();\n  let responseStatus = 500;\n  let telemetrySubsystem: TelemetrySubsystem = "application";\n  const finish = (\n    response: Response,\n    subsystem: TelemetrySubsystem = telemetrySubsystem,\n  ): Response => {\n    responseStatus = response.status;\n    telemetrySubsystem = subsystem;\n    return withCorrelationId(response, correlationId);\n  };\n\n  if (request.method === "OPTIONS") {\n    return finish(new Response("ok", { headers: corsHeaders }));\n  }\n''',
              'handler setup',
          )
          text = replace_once(
              text,
              '''      return json({\n        status: "ok",\n        database: "ready",\n        service: "lifemate-api",\n        version: releaseVersion,\n      });\n''',
              '''      return finish(json({\n        status: "ok",\n        database: "ready",\n        service: "lifemate-api",\n        version: releaseVersion,\n      }));\n''',
              'health success finish',
          )
          text = replace_once(
              text,
              '''      return problem(\n        503,\n        "database_unavailable",\n        "Database is not ready.",\n        correlationId,\n      );\n''',
              '''      return finish(problem(\n        503,\n        "database_unavailable",\n        "Database is not ready.",\n        correlationId,\n      ), "database");\n''',
              'health failure finish',
          )
          text = replace_once(
              text,
              '''    return await routeWithIdempotency(request, path, auth);\n''',
              '''    return finish(await routeWithIdempotency(request, path, auth));\n''',
              'route finish',
          )
          text = replace_once(
              text,
              '''    if (error instanceof ApiError) {\n      return problem(error.status, error.code, error.message, correlationId);\n    }\n''',
              '''    if (error instanceof ApiError) {\n      return finish(\n        problem(error.status, error.code, error.message, correlationId),\n        inferTelemetrySubsystem(error.status, error.code),\n      );\n    }\n''',
              'api error finish',
          )
          text = replace_once(
              text,
              '''      return problem(\n        503,\n        "database_busy",\n        "Database is temporarily busy. Please retry.",\n        correlationId,\n      );\n''',
              '''      return finish(problem(\n        503,\n        "database_busy",\n        "Database is temporarily busy. Please retry.",\n        correlationId,\n      ), "database");\n''',
              'database unavailable finish',
          )
          text = replace_once(
              text,
              '''      return problem(\n        409,\n        "database_conflict",\n        "The request conflicts with the current state.",\n        correlationId,\n      );\n''',
              '''      return finish(problem(\n        409,\n        "database_conflict",\n        "The request conflicts with the current state.",\n        correlationId,\n      ), "database");\n''',
              'database conflict finish',
          )
          text = replace_once(
              text,
              '''    return problem(\n      500,\n      "internal_error",\n      "The request could not be completed.",\n      correlationId,\n    );\n  } finally {\n    concurrencyLease?.release();\n  }\n});\n''',
              '''    return finish(problem(\n      500,\n      "internal_error",\n      "The request could not be completed.",\n      correlationId,\n    ));\n  } finally {\n    const concurrencySnapshot = requestConcurrency.snapshot();\n    concurrencyLease?.release();\n    const telemetryWindow = apiObservability.record({\n      method: request.method,\n      path,\n      status: responseStatus,\n      durationMs: performance.now() - startedAt,\n      subsystem: telemetrySubsystem,\n      concurrency: concurrencySnapshot,\n      rateLimiter: requestRateLimiter.snapshot(),\n    });\n    if (telemetryWindow) {\n      console.info("LifeMate telemetry window", telemetryWindow);\n    }\n  }\n});\n''',
              'telemetry finally',
          )
          index.write_text(text)

          config = Path('supabase/functions/lifemate-api/deno.json')
          text = config.read_text()
          text = text.replace(
              'concurrency_test.ts runtime_config_test.ts',
              'concurrency_test.ts observability_test.ts runtime_config_test.ts',
          )
          text = text.replace(
              'concurrency_test.ts runtime_config_test.ts',
              'concurrency_test.ts observability_test.ts runtime_config_test.ts',
          )
          config.write_text(text)
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/lifemate-api/http.ts \
            supabase/functions/lifemate-api/rate_limit.ts \
            supabase/functions/lifemate-api/index.ts \
            supabase/functions/lifemate-api/observability.ts \
            supabase/functions/lifemate-api/observability_test.ts
          cd supabase/functions/lifemate-api
          deno task check
          deno task test
      - name: Commit instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/lifemate-api/http.ts \
            supabase/functions/lifemate-api/rate_limit.ts \
            supabase/functions/lifemate-api/index.ts \
            supabase/functions/lifemate-api/deno.json \
            supabase/functions/lifemate-api/observability.ts \
            supabase/functions/lifemate-api/observability_test.ts
          git commit -m 'feat(scale): instrument API reliability telemetry'
          git push origin HEAD:perf/scale-08-observability-slos
