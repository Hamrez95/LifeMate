name: scale06-signature-fix

on:
  push:
    branches: ['perf/scale-06-outbox-safety']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: perf/scale-06-outbox-safety
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Keep claim function ABI stable and enrich in worker query
        shell: python
        run: |
          from pathlib import Path
          import re

          migration = Path('supabase/migrations/20260814170000_harden_outbox_queue_safety.sql')
          text = migration.read_text()

          text, removed = re.subn(
              r'-- PostgreSQL cannot CREATE OR REPLACE a function when its OUT/RETURNS TABLE\n'
              r'-- row shape changes\. Drop the previous signature inside this migration and\n'
              r'-- recreate it immediately below; worker EXECUTE grants are restored later\.\n'
              r'drop function if exists integration\.claim_outbox_messages_for_events\(\n'
              r'\s*character varying, integer, character varying\[\]\n'
              r'\);\n\n',
              '',
              text,
              count=1,
          )
          if removed != 1:
              raise SystemExit(f'claim drop block: expected 1, got {removed}')

          text, returns_changed = re.subn(
              r'(\s+payload_json jsonb,\n\s+attempt_count integer),\n'
              r'\s+priority smallint,\n'
              r'\s+max_attempts smallint,\n'
              r'\s+max_age_seconds integer,\n'
              r'\s+created_at_utc timestamp with time zone\n',
              r'\1\n',
              text,
              count=1,
          )
          if returns_changed != 1:
              raise SystemExit(f'claim return shape: expected 1, got {returns_changed}')

          text, returning_changed = re.subn(
              r'(returning\s+m\.id,m\.aggregate_type,m\.aggregate_id,m\.event_type,m\.payload_json,\s*\n\s*m\.attempt_count)'
              r',m\.priority,m\.max_attempts,m\.max_age_seconds,m\.created_at_utc;',
              r'\1;',
              text,
              count=1,
          )
          if returning_changed != 1:
              raise SystemExit(f'claim returning list: expected 1, got {returning_changed}')
          migration.write_text(text)

          index = Path('supabase/functions/lifemate-worker/index.ts')
          text = index.read_text()
          old_claim = '''  const claimed = await sql<OutboxMessage[]>`
              select *
              from integration.claim_outbox_messages_for_events(
                ${workerId}::character varying,
                ${workerBatchSize},
                ${supportedEvents}::character varying[]
              )
            `;
          '''
          new_claim = '''  const claimed = await sql<OutboxMessage[]>`
              with claimed as (
                select *
                from integration.claim_outbox_messages_for_events(
                  ${workerId}::character varying,
                  ${workerBatchSize},
                  ${supportedEvents}::character varying[]
                )
              )
              select c.id,c.aggregate_type,c.aggregate_id,c.event_type,c.payload_json,
                     c.attempt_count,m.priority,m.max_attempts,m.max_age_seconds,m.created_at_utc
              from claimed c
              join integration.outbox_messages m on m.id=c.id
              order by m.priority,m.created_at_utc,m.id
            `;
          '''
          if old_claim not in text:
              raise SystemExit('worker claim query not found')
          index.write_text(text.replace(old_claim, new_claim, 1))

          test = Path('supabase/functions/lifemate-worker/queue_integration_test.ts')
          text = test.read_text()
          old_assert = '      assertEquals(Number(firstClaim[0].priority), 5);\n'
          new_assert = '''      const firstClaimPolicy = await sql`
                select priority
                from integration.outbox_messages
                where id=${firstClaim[0].id}::uuid
              `;
              assertEquals(Number(firstClaimPolicy[0].priority), 5);
          '''
          if old_assert not in text:
              raise SystemExit('priority assertion not found')
          test.write_text(text.replace(old_assert, new_assert, 1))
      - name: Format modified Deno files
        run: |
          deno fmt \
            supabase/functions/lifemate-worker/index.ts \
            supabase/functions/lifemate-worker/queue_integration_test.ts
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/migrations/20260814170000_harden_outbox_queue_safety.sql \
            supabase/functions/lifemate-worker/index.ts \
            supabase/functions/lifemate-worker/queue_integration_test.ts
          git commit -m 'fix(scale): preserve outbox claim function contract'
          git push origin HEAD:perf/scale-06-outbox-safety
