name: fix-profile-material-once

on:
  push:
    branches:
      - feat/full-bb287-ui-parity
    paths:
      - .github/workflows/fix-profile-material-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0

      - name: Wrap profile tiles in Material and remove workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              (Path('wellmate/lib/screens/profile/profile_screen.dart'), '\nclass _SettingsDialog'),
              (Path('caremate/lib/screens/profile_screen.dart'), '\nclass _LanguageDialog'),
          ]

          for path, next_marker in targets:
              text = path.read_text(encoding='utf-8')
              start = text.index('class _ProfileMenuTile')
              end = text.index(next_marker, start)
              section = text[start:end]
              if 'return Material(' in section:
                  continue
              section = section.replace(
                  '    return ListTile(',
                  '    return Material(\n      color: Colors.transparent,\n      child: ListTile(',
                  1,
              )
              old_tail = '      onTap: onTap,\n    );\n  }\n}'
              new_tail = '        onTap: onTap,\n      ),\n    );\n  }\n}'
              if old_tail not in section:
                  raise SystemExit(f'Profile tile tail not found in {path}')
              section = section.replace(old_tail, new_tail, 1)
              path.write_text(text[:start] + section + text[end:], encoding='utf-8')

          Path('.github/workflows/fix-profile-material-once.yml').unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wellmate/lib/screens/profile/profile_screen.dart caremate/lib/screens/profile_screen.dart .github/workflows/fix-profile-material-once.yml
          git commit -m "Fix profile tile Material surfaces"
          git push origin HEAD:feat/full-bb287-ui-parity
