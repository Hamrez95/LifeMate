name: localization-contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'wellmate/lib/**'
      - 'caremate/lib/**'
      - 'packages/lifemate_client/lib/**'
      - 'packages/lifemate_ui/lib/**'
      - 'wellmate/android/app/src/main/**'
      - 'tools/localization/**'
      - '.github/workflows/localization-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'wellmate/lib/**'
      - 'caremate/lib/**'
      - 'packages/lifemate_client/lib/**'
      - 'packages/lifemate_ui/lib/**'
      - 'wellmate/android/app/src/main/**'
      - 'tools/localization/**'
      - '.github/workflows/localization-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify English localization contract
        shell: bash
        run: |
          set +e
          python3 tools/localization/verify_english_contract.py 2>&1 | tee localization-contract.log
          status=${PIPESTATUS[0]}
          echo "$status" > localization-contract.status
          exit "$status"
      - name: Upload localization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-contract-log
          path: |
            localization-contract.log
            localization-contract.status
          if-no-files-found: error
          retention-days: 1
