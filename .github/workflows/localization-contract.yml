name: localization-contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'wellmate/lib/**'
      - 'caremate/lib/**'
      - 'packages/lifemate_client/lib/**'
      - 'packages/lifemate_ui/lib/**'
      - 'wellmate/android/app/src/main/**'
      - 'tools/localization/**'
      - '.github/workflows/localization-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'wellmate/lib/**'
      - 'caremate/lib/**'
      - 'packages/lifemate_client/lib/**'
      - 'packages/lifemate_ui/lib/**'
      - 'wellmate/android/app/src/main/**'
      - 'tools/localization/**'
      - '.github/workflows/localization-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify English localization contract
        run: python3 tools/localization/verify_english_contract.py
