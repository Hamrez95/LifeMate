name: tmp-offline04-home-occurrence-apply

on:
  push:
    branches:
      - feat/offline-04-pending-treatment-home-occurrence-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply focused Home wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wellmate/lib/screens/home/home_screen_content.dart')
          s = p.read_text()
          replacements = [
            ("import 'home_schedule_loader.dart';\nimport 'soft_schedule_card.dart';", "import 'home_schedule_loader.dart';\nimport 'pending_treatment_create_presentation.dart';\nimport 'soft_schedule_card.dart';"),
            ("  bool _hasTreatmentPlans = false;\n  final Set<String> _submitting = <String>{};", "  bool _hasTreatmentPlans = false;\n  List<PendingTreatmentCreateOccurrence> _pendingTreatmentCreates = const [];\n  final Set<String> _submitting = <String>{};"),
            ("      final careEvents = snapshot.careEvents;\n      for (final failure in snapshot.failures) {", "      final careEvents = snapshot.careEvents;\n      final pendingTreatmentCreates = projectPendingTreatmentCreates(\n        pendingCreates: snapshot.pendingTreatmentCreates,\n        fromDate: today,\n        toDate: lastVisibleDay,\n      );\n      for (final failure in snapshot.failures) {"),
            ("        _countdownOccurrences = countdownOccurrences;\n        _hasTreatmentPlans = plans.isNotEmpty;", "        _countdownOccurrences = countdownOccurrences;\n        _pendingTreatmentCreates = pendingTreatmentCreates;\n        _hasTreatmentPlans = plans.isNotEmpty || pendingTreatmentCreates.isNotEmpty;"),
            ("                    ),\n            ),\n            SizedBox(height: 14),\n            Padding(\n              padding: EdgeInsets.symmetric(horizontal: 20),\n              child: _HomeHealthCard(onTap: widget.onOpenHealth),", "                    ),\n            ),\n            if (_pendingTreatmentCreates.isNotEmpty) ...[\n              SizedBox(height: 12),\n              Padding(\n                padding: EdgeInsets.symmetric(horizontal: 20),\n                child: PendingTreatmentCreateCard(\n                  occurrence: _pendingTreatmentCreates.first,\n                  pendingCount: _pendingTreatmentCreates.length,\n                  font: font,\n                  isPersian: isPersian,\n                ),\n              ),\n            ],\n            SizedBox(height: 14),\n            Padding(\n              padding: EdgeInsets.symmetric(horizontal: 20),\n              child: _HomeHealthCard(onTap: widget.onOpenHealth),"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'anchor not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          dart format wellmate/lib/screens/home/home_screen_content.dart wellmate/lib/screens/home/pending_treatment_create_presentation.dart wellmate/test/pending_treatment_create_presentation_test.dart
      - name: Verify focused slice
        working-directory: wellmate
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/pending_treatment_create_presentation_test.dart test/home_schedule_loader_test.dart test/home_offline_status_banner_test.dart
      - name: Commit product diff and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-offline04-home-occurrence-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wellmate/lib/screens/home/home_screen_content.dart wellmate/lib/screens/home/pending_treatment_create_presentation.dart wellmate/test/pending_treatment_create_presentation_test.dart
          git commit -m 'feat(wellmate): present pending treatment occurrences locally (#832)'
          git push
