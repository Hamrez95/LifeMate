name: women-dashboard-history-range-2
on:
  push:
    branches: [fix/women-dashboard-history-range]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/women-dashboard-history-range
          show-progress: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Patch and format
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
          deno fmt supabase/functions/lifemate-api/validation.ts supabase/functions/lifemate-api/validation_test.ts supabase/functions/lifemate-api/women_calendar.ts
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          (cd supabase/functions/lifemate-api && deno fmt --check && deno task check && deno task test)
          (cd packages/lifemate_client && flutter pub get && flutter test)
          (cd wellmate && flutter pub get && flutter test)
          (cd caremate && flutter pub get && flutter test)
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Hamidreza Pakpour'
          git config user.email '136631329+Hamrez95@users.noreply.github.com'
          git add -A
          git commit -m 'fix: allow bounded women dashboard history queries'
          git push origin HEAD:fix/women-dashboard-history-range
