name: one-shot-caremate-calendar-layout

on:
  pull_request:
    paths:
      - '.github/workflows/one-shot-caremate-calendar-layout.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-caremate-calendar-layout
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/bb287-parity-completion
          fetch-depth: 0

      - name: Make schedule heading responsive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('caremate/lib/screens/calendar/calendar_screen.dart')
          text = path.read_text()
          old = """                child: Row(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Text(
                      loc['cal_schedule'],
                      style: font.copyWith(
                        fontSize: 18,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    Text(
                      '${_selectedDate.day} $monthName, ${_selectedDate.year}'
                          .toPersianDigit(isPersian),
                      style: font.copyWith(
                        fontSize: 16,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                  ],
                ),
"""
          new = """                child: Row(
                  children: [
                    Expanded(
                      child: Text(
                        loc['cal_schedule'],
                        maxLines: 2,
                        overflow: TextOverflow.ellipsis,
                        style: font.copyWith(
                          fontSize: 18,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ),
                    const SizedBox(width: 12),
                    Flexible(
                      child: Text(
                        '${_selectedDate.day} $monthName, ${_selectedDate.year}'
                            .toPersianDigit(isPersian),
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        textAlign: TextAlign.end,
                        style: font.copyWith(
                          fontSize: 16,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ),
                  ],
                ),
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one calendar heading target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -q 'overflow: TextOverflow.ellipsis' \
            caremate/lib/screens/calendar/calendar_screen.dart

      - name: Commit responsive heading
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add caremate/lib/screens/calendar/calendar_screen.dart
          git commit -m 'fix(caremate): prevent calendar heading overflow'
          git push origin HEAD:feat/bb287-parity-completion
