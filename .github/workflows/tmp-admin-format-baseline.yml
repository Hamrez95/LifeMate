name: tmp-admin-format-baseline

on:
  push:
    branches:
      - ci/admin-deno-2.9.4-format-baseline-20260905
    paths:
      - '.github/workflows/tmp-admin-format-baseline.yml'

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply exact pinned formatting
        working-directory: supabase/functions/lifemate-admin-api
        run: deno fmt
      - name: Commit baseline formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-admin-api
          git commit -m 'style(admin): apply Deno 2.9.4 baseline formatting'
          git push origin "HEAD:${GITHUB_REF_NAME}"
