name: apply-profile-caregiver-empty-home-ux

on:
  push:
    branches:
      - fix/care-profiles-first-run-ux
    paths:
      - .github/workflows/apply-profile-caregiver-empty-home-ux.yml

permissions:
  contents: write

env:
  PUB_ENVIRONMENT: bot:github_actions

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/care-profiles-first-run-ux
          fetch-depth: 0

      - name: Apply reviewed UX patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_ux.py
          python3 /tmp/apply_ux.py

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Format changed Dart files
        shell: bash
        run: |
          dart format \
            packages/lifemate_client/lib/src/lifemate_api_client.dart \
            packages/lifemate_client/test/lifemate_api_client_test.dart \
            wellmate/lib/screens/profile/care_access_screen.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/test/ui_regression_test.dart \
            wellmate/test/care_access_visual_contract_test.dart \
            caremate/lib/screens/feature_preview_screen.dart \
            caremate/lib/widgets/care_profile_mask_selector.dart \
            caremate/test/care_profile_mask_selector_test.dart

      - name: Verify shared client
        run: |
          cd packages/lifemate_client
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        run: |
          cd wellmate
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify CareMate
        run: |
          cd caremate
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit verified UX changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit' >&2; exit 1; }
          git commit -m 'feat: polish caregiver, first-run and profile role UX'
          git push origin HEAD:fix/care-profiles-first-run-ux
