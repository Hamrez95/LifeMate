name: tmp-offline-833-private-checkin-apply
on:
  push:
    branches:
      - feat/offline-833-private-daily-checkin-contract-20260906
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-833-private-daily-checkin-contract-20260906
          fetch-depth: 0
      - name: Apply scoped patch and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hotfix/tmp_offline_833_private_checkin.py
          rm -f \
            tools/hotfix/tmp_offline_833_private_checkin.py \
            .github/workflows/tmp-offline-833-private-checkin-contract.yml \
            .github/workflows/tmp-offline-833-private-checkin-apply.yml
          git config user.name 'lifemate-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            supabase/functions/lifemate-api/person_women_calendar.ts \
            supabase/functions/lifemate-api/women_calendar_rich_period.ts \
            supabase/functions/lifemate-api/women_calendar_rich_period_test.ts \
            supabase/functions/lifemate-api/women_calendar_integration_test.ts \
            tools/hotfix/tmp_offline_833_private_checkin.py \
            .github/workflows/tmp-offline-833-private-checkin-contract.yml \
            .github/workflows/tmp-offline-833-private-checkin-apply.yml
          git diff --cached --check
          git commit -m 'fix(women): preserve sharing across private offline check-ins'
          git push origin HEAD:feat/offline-833-private-daily-checkin-contract-20260906
