name: add-phone-otp-experience

on:
  push:
    branches: ['feat/ecosystem-data-foundation']
    paths:
      - 'tools/refactor/add_phone_otp_experience.py'
      - '.github/workflows/add-phone-otp-experience.yml'

permissions:
  contents: write

concurrency:
  group: add-phone-otp-experience
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply exact auth UI codemod
        run: python3 tools/refactor/add_phone_otp_experience.py
      - name: Format auth experience
        run: dart format packages/lifemate_client/lib/src/experience_auth.dart packages/lifemate_client/lib/src/experience_phone_auth.dart
      - name: Validate shared client
        working-directory: packages/lifemate_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
      - name: Commit validated auth experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_client/lib/src/experience_auth.dart packages/lifemate_client/lib/src/experience_phone_auth.dart
          git commit -m 'feat(auth): expose secure feature-gated phone OTP flow'
          git pull --rebase origin feat/ecosystem-data-foundation
          git push origin HEAD:feat/ecosystem-data-foundation
