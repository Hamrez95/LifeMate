name: wellmate-health-hub-build

on:
  push:
    branches: ['feat/wellmate-health-hub']
    paths:
      - '.github/workflows/wellmate-health-hub-build.yml'

permissions:
  contents: write

concurrency:
  group: wellmate-health-hub-build
  cancel-in-progress: false

env:
  SOURCE_COMMIT: c253fbdd6c836fd616c97c0acc9718904e6a502e
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  CANDIDATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api-candidate
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PUB_ENVIRONMENT: bot:github_actions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Validate Edge API and WellMate
        shell: bash
        run: |
          set -euo pipefail
          (cd supabase/functions/lifemate-api && deno fmt --check && deno task check && deno task test)
          (cd packages/lifemate_client && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd wellmate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)

      - name: Verify exact isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "$CANDIDATE_API_BASE_URL/health")"
          echo "$health" | jq -e --arg expected "$SOURCE_COMMIT" '.status == "ok" and .database == "ready" and .service == "lifemate-api" and .version == $expected' >/dev/null
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$CANDIDATE_API_BASE_URL/api/v1/health/observations?fromDate=2026-08-01&toDate=2026-08-10")"
          test "$status" = '401'

      - name: Build WellMate candidate APK
        shell: bash
        run: |
          set -euo pipefail
          version="0.9.0-health.${GITHUB_RUN_NUMBER}"
          (cd wellmate && flutter pub get && flutter build apk \
            --release \
            --build-name="$version" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="LIFEMATE_API_BASE_URL=$CANDIDATE_API_BASE_URL" \
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=true" \
            --dart-define="ENABLE_GOOGLE_AUTH=false" \
            --dart-define="ENABLE_PHONE_OTP=false")
          mkdir -p dist
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk dist/wellmate-health-hub-candidate.apk
          jq -n \
            --arg commit "$SOURCE_COMMIT" \
            --arg api "$CANDIDATE_API_BASE_URL" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha256 "$(sha256sum dist/wellmate-health-hub-candidate.apk | awk '{print $1}')" \
            '{commit:$commit,apiBase:$api,builtAtUtc:$builtAt,channel:"wellmate-health-hub-candidate",sha256:$sha256,auth:{google:false,phoneOtp:false},notes:["Health observations persist in canonical person-owned storage","Health gadget integrations are intentionally disabled and shown as coming soon"]}' \
            > dist/manifest.json

      - name: Upload WellMate candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wellmate-health-hub-candidate-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot build workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wellmate-health-hub-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove health hub build workflow'
          git push origin HEAD:feat/wellmate-health-hub
