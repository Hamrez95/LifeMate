name: one-time-deploy-v0.9.0-internal.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-deploy-v0.9.0-internal.9.yml'

permissions:
  contents: read

concurrency:
  group: one-time-deploy-v0.9.0-internal.9
  cancel-in-progress: false

env:
  RELEASE_COMMIT: 3cdf7344db065b1c8d30f196bc5e4b0eed8bd637
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api

jobs:
  deploy-beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: beta
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CONTACT_HASHING_SECRET: ${{ secrets.LIFEMATE_CONTACT_HASHING_SECRET }}
      PATIENT_EMAIL: ${{ secrets.BETA_PATIENT_EMAIL }}
      PATIENT_PASSWORD: ${{ secrets.BETA_PATIENT_PASSWORD }}
      CAREGIVER_EMAIL: ${{ secrets.BETA_CAREGIVER_EMAIL }}
      CAREGIVER_PASSWORD: ${{ secrets.BETA_CAREGIVER_PASSWORD }}
      UNRELATED_EMAIL: ${{ secrets.BETA_UNRELATED_EMAIL }}
      UNRELATED_PASSWORD: ${{ secrets.BETA_UNRELATED_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Validate source and protected configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::SUPABASE_ACCESS_TOKEN is not configured for beta/main.'; exit 1; }
          test "${#CONTACT_HASHING_SECRET}" -ge 32 || { echo '::error::LIFEMATE_CONTACT_HASHING_SECRET is missing or too short.'; exit 1; }
          (cd supabase/functions/lifemate-api && deno fmt --check && deno task check && deno task test)

      - name: Apply reviewed additive migrations
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          run_sql_file() {
            local file="$1"
            jq -Rs '{query: ., read_only: false}' "$file" >/tmp/sql-payload.json
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --request POST "$api" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data @/tmp/sql-payload.json >/tmp/sql-response.json
          }
          run_sql_file supabase/migrations/20260805224500_add_women_calendar_daily_checkin.sql
          run_sql_file supabase/migrations/20260805230000_add_women_daily_companion_logs.sql

          verification_sql="$(cat <<'SQL'
          do $verify$
          begin
            if to_regclass('lifemate.women_calendar_daily_logs') is null then
              raise exception 'women_calendar_daily_logs is missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'lifemate'
                and table_name = 'women_calendar_profiles'
                and column_name = 'daily_check_in_date'
            ) then
              raise exception 'daily_check_in_date is missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'lifemate'
                and table_name = 'women_calendar_daily_logs'
                and column_name = 'share_summary_with_companion'
            ) then
              raise exception 'share_summary_with_companion is missing';
            end if;
          end
          $verify$;
          SQL
          )"
          jq -n --arg query "$verification_sql" '{query:$query,read_only:false}' >/tmp/verify-payload.json
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --request POST "$api" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data @/tmp/verify-payload.json >/tmp/verify-response.json

      - name: Configure immutable Edge release secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'shred -u "$secret_file" 2>/dev/null || rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"
          printf 'LIFEMATE_CONTACT_HASHING_SECRET=%s\n' "$CONTACT_HASHING_SECRET" > "$secret_file"
          printf 'LIFEMATE_RELEASE_VERSION=%s\n' "$RELEASE_COMMIT" >> "$secret_file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secret_file"

      - name: Deploy reviewed Edge source
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy lifemate-api \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify deployed health and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error \
            --retry 6 --retry-delay 3 --retry-all-errors \
            "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | jq -e \
            --arg version "$RELEASE_COMMIT" \
            '.status == "ok" and .database == "ready" and .service == "lifemate-api" and .version == $version' >/dev/null
          unauthorized_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$unauthorized_status" = '401'

      - name: Run live three-role privacy smoke when credentials exist
        shell: bash
        env:
          EXPECTED_RELEASE_VERSION: ${{ env.RELEASE_COMMIT }}
        run: |
          set -euo pipefail
          if [[ -z "$PATIENT_EMAIL" || -z "$PATIENT_PASSWORD" || -z "$CAREGIVER_EMAIL" || -z "$CAREGIVER_PASSWORD" || -z "$UNRELATED_EMAIL" || -z "$UNRELATED_PASSWORD" ]]; then
            echo '::notice::Beta role credentials are not configured; deployment health/auth verification passed, live role smoke skipped.'
            exit 0
          fi
          bash tools/release/live-beta-smoke.sh | tee /tmp/lifemate-live-role-smoke.json
          jq -e '.status == "passed" and .release == env.EXPECTED_RELEASE_VERSION' /tmp/lifemate-live-role-smoke.json >/dev/null
