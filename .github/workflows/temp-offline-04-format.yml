name: temp-offline-04-format

on:
  push:
    branches:
      - feat/offline-04-versioned-treatment-mutation-20260905

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Print exact formatted treatment test
        shell: bash
        run: dart format --output=show packages/lifemate_core/test/local_treatment_mutation_test.dart
