name: admin-edge-test-isolation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    defaults:
      run:
        working-directory: supabase/functions/lifemate-admin-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - id: tests
        name: Discover canonical test files
        shell: bash
        run: |
          set -euo pipefail
          tests=$(python - <<'PY'
          import json
          data=json.load(open('deno.json'))
          items=[x for x in data['tasks']['test'].split() if x.endswith('_test.ts')]
          print(json.dumps(items,separators=(',',':')))
          PY
          )
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  isolated:
    needs: discover
    name: isolated-${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    defaults:
      run:
        working-directory: supabase/functions/lifemate-admin-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Run isolated test file
        run: deno test --no-check --allow-read=. "${{ matrix.test }}"
