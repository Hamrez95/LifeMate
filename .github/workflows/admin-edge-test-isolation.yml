name: admin-edge-test-isolation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair-isolation:
    name: pair-${{ matrix.pair }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pair: ["01", "02", "03", "12", "13", "23"]
    defaults:
      run:
        working-directory: supabase/functions/lifemate-admin-api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Run ordered pair subset
        shell: bash
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          set -euo pipefail
          mapfile -t tests < <(deno eval --allow-read=. 'const j=JSON.parse(await Deno.readTextFile("deno.json")); console.log(j.tasks.test.split(/\s+/).filter((x)=>x.endsWith("_test.ts")).join("\n"));')
          count=${#tests[@]}
          q=$(( (count + 3) / 4 ))
          selected=()
          for ((p=0; p<2; p++)); do
            g=${PAIR:p:1}
            start=$((10#$g * q))
            end=$((start + q))
            if (( end > count )); then end=$count; fi
            for ((i=start; i<end; i++)); do selected+=("${tests[i]}"); done
          done
          printf 'Running %s tests for groups %s\n' "${#selected[@]}" "$PAIR"
          deno test --no-check --allow-read=. "${selected[@]}"
