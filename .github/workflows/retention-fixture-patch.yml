name: retention-fixture-patch
on:
  push:
    branches: ['privacy/p0-retention-v2-account-deletion']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: privacy/p0-retention-v2-account-deletion
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Re-home compatibility bootstrap rows for the deletion fixture
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/lifemate-worker/account_deletion_integration_test.ts')
          text = path.read_text()
          anchor = """      await sql`\n        insert into identity.accounts(id,status,home_region,legacy_app_user_id)\n"""
          replacement = """      // Bootstrap initially creates same-ID legacy ecosystem rows. Remove that\n      // projection so the test can remap AppUser -> a different Account/Person.\n      await sql`\n        delete from commerce.entitlements\n        where grantee_account_id in (\n          ${appUserId}::uuid, ${survivorUserId}::uuid\n        ) or beneficiary_person_id in (\n          ${appUserId}::uuid, ${survivorUserId}::uuid\n        )\n      `;\n      await sql`\n        delete from ecosystem.app_enrollments\n        where account_id in (${appUserId}::uuid, ${survivorUserId}::uuid)\n      `;\n      await sql`\n        delete from identity.external_identities\n        where account_id in (${appUserId}::uuid, ${survivorUserId}::uuid)\n      `;\n      await sql`\n        delete from core.account_person_links\n        where account_id in (${appUserId}::uuid, ${survivorUserId}::uuid)\n      `;\n      await sql`\n        delete from identity.accounts\n        where id in (${appUserId}::uuid, ${survivorUserId}::uuid)\n      `;\n      await sql`\n        delete from core.persons\n        where id in (${appUserId}::uuid, ${survivorUserId}::uuid)\n      `;\n\n      await sql`\n        insert into identity.accounts(id,status,home_region,legacy_app_user_id)\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'account fixture anchor count={text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1))
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          deno fmt supabase/functions/lifemate-worker/account_deletion_integration_test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-worker/account_deletion_integration_test.ts
          git commit -m 'test(privacy): decouple account and app-user deletion fixture'
          git push origin HEAD:privacy/p0-retention-v2-account-deletion
