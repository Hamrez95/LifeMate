name: edge-api-diagnostic-once

on:
  push:
    branches:
      - ci/edge-api-format-baseline-20260904

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Capture exact failures
        shell: bash
        run: |
          set +e
          {
            echo '=== lifemate-api deno task check ==='
            (cd supabase/functions/lifemate-api && deno task check)
            echo "CHECK_EXIT=$?"
            echo '=== portable schema ==='
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
            bootstrap_exit=$?
            echo "BOOTSTRAP_EXIT=$bootstrap_exit"
            if [ "$bootstrap_exit" -eq 0 ]; then
              while IFS= read -r migration; do
                echo "--- $migration"
                psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
                status=$?
                if [ "$status" -ne 0 ]; then
                  echo "MIGRATION_FAILED=$migration EXIT=$status"
                  break
                fi
              done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
            fi
          } > ci_edge_api_diagnostic.txt 2>&1
          rm .github/workflows/edge-api-diagnostic-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci_edge_api_diagnostic.txt .github/workflows/edge-api-diagnostic-once.yml
          git commit -m 'ci: capture edge API baseline diagnostics'
          git push origin HEAD:ci/edge-api-format-baseline-20260904
