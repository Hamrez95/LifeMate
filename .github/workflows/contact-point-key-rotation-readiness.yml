name: contact-point-key-rotation-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-contact-point-key-rotation-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: beta
    env:
      LIFEMATE_CONTACT_MIGRATION_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION }}
      LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION: ${{ secrets.LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main read-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$LIFEMATE_CONTACT_MIGRATION_DATABASE_URL"
          [[ "$LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION" =~ ^[0-9]+$ ]]
          [[ "$LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION" -ge 1
          test "$LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION" -le 32767
          test "$LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION" -ge 1
          test "$LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION" -le 32767
          test "$LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION" -ne "$LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify ContactPoint key rotation policy
        run: node tools/security/verify-contact-point-key-rotation-policy.mjs

      - name: Check read-only readiness source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check tools/security/contact-point-key-rotation-readiness.ts
          deno check tools/security/contact-point-key-rotation-readiness.ts

      - name: Audit active-version envelope coverage
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/contact-point-key-rotation-readiness.json"
          error_file="$RUNNER_TEMP/contact-point-key-rotation-readiness.err"
          set +e
          deno run \
            --allow-env=LIFEMATE_CONTACT_MIGRATION_DATABASE_URL,LIFEMATE_IDENTITY_CONTACT_ENCRYPTION_KEY_VERSION,LIFEMATE_IDENTITY_CONTACT_PREVIOUS_ENCRYPTION_KEY_VERSION \
            --allow-net \
            tools/security/contact-point-key-rotation-readiness.ts \
            > "$summary_file" 2> "$error_file"
          audit_status=$?
          set -e

          if ! jq -e '
            (.activeVersion | type == "number") and
            (.previousVersion | type == "number") and
            (.currentContacts | type == "number") and
            (.activeVersionReadyContacts | type == "number") and
            (.previousVersionContacts | type == "number") and
            (.unknownVersionContacts | type == "number") and
            (.invalidEnvelopeContacts | type == "number") and
            (.readyForPreviousKeyRemoval | type == "boolean")
          ' "$summary_file" >/dev/null 2>&1; then
            rm -f "$summary_file" "$error_file"
            echo '::error::ContactPoint key rotation readiness failed without a valid count-only summary.'
            exit 1
          fi

          {
            echo '## ContactPoint envelope-key rotation readiness'
            echo ''
            echo "- active key version: $(jq -r '.activeVersion' "$summary_file")"
            echo "- previous key version: $(jq -r '.previousVersion' "$summary_file")"
            echo "- current contacts: $(jq -r '.currentContacts' "$summary_file")"
            echo "- active-version ready contacts: $(jq -r '.activeVersionReadyContacts' "$summary_file")"
            echo "- previous-version contacts: $(jq -r '.previousVersionContacts' "$summary_file")"
            echo "- unknown-version contacts: $(jq -r '.unknownVersionContacts' "$summary_file")"
            echo "- invalid envelopes: $(jq -r '.invalidEnvelopeContacts' "$summary_file")"
            echo "- safe to remove previous runtime key: $(jq -r '.readyForPreviousKeyRemoval' "$summary_file")"
            echo '- plaintext contacts, hashes, ciphertext, nonces, DB URLs and key material are intentionally omitted'
          } >> "$GITHUB_STEP_SUMMARY"

          ready="$(jq -r '.readyForPreviousKeyRemoval' "$summary_file")"
          rm -f "$summary_file" "$error_file"
          if [ "$audit_status" -ne 0 ] || [ "$ready" != 'true' ]; then
            echo '::error::ContactPoint active-version envelope coverage is not ready for previous-key removal.'
            exit 1
          fi
