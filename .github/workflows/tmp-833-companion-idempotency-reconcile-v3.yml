name: tmp-833-companion-idempotency-reconcile-v3
on:
  push:
    branches: [feat/offline-833-companion-checkin-fallback-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-833-companion-checkin-fallback-20260906
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Patch request/replay parity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected snippet in {path}')
              p.write_text(text.replace(old, new, 1))

          api = 'packages/lifemate_client/lib/src/women_companion_api.dart'
          replace_once(
              api,
              "    required bool shareSummaryWithCompanion,\n    String? clientRequestId,\n",
              "    bool? shareSummaryWithCompanion,\n    String? clientRequestId,\n",
          )
          replace_once(
              api,
              "        'privateNotes': _emptyToNull(privateNotes),\n        'shareSummaryWithCompanion': shareSummaryWithCompanion,\n",
              "        'privateNotes': _emptyToNull(privateNotes),\n        if (shareSummaryWithCompanion != null)\n          'shareSummaryWithCompanion': shareSummaryWithCompanion,\n",
          )

          screen = 'wellmate/lib/screens/women_calendar/women_companion_screen.dart'
          replace_once(
              screen,
              "    final clientRequestId = LifeMateApiClient.createClientRequestId();\n    try {\n",
              "    final clientRequestId = LifeMateApiClient.createClientRequestId();\n    final currentShare = current?['shareSummaryWithCompanion'] == true;\n    final shareTransition = currentShare == draft.shareWithCompanion\n        ? null\n        : draft.shareWithCompanion;\n    final canonicalSymptoms = draft.symptoms\n        .map((value) => value.trim().toLowerCase())\n        .where((value) => value.isNotEmpty)\n        .toSet()\n        .toList(growable: false)\n      ..sort();\n    try {\n",
          )
          replace_once(
              screen,
              "        symptoms: draft.symptoms,\n        privateNotes: draft.privateNotes,\n        shareSummaryWithCompanion: draft.shareWithCompanion,\n",
              "        symptoms: canonicalSymptoms,\n        privateNotes: draft.privateNotes,\n        shareSummaryWithCompanion: shareTransition,\n",
          )
          replace_once(
              screen,
              "            symptoms: draft.symptoms.toSet(),\n",
              "            symptoms: canonicalSymptoms.toSet(),\n",
          )
          replace_once(
              screen,
              "            'symptoms': draft.symptoms,\n",
              "            'symptoms': canonicalSymptoms,\n",
          )

          experience = 'wellmate/test/women_companion_experience_test.dart'
          replace_once(
              experience,
              "    required bool shareSummaryWithCompanion,\n    String? clientRequestId,\n",
              "    bool? shareSummaryWithCompanion,\n    String? clientRequestId,\n",
          )
          PY
          dart format packages/lifemate_client/lib/src/women_companion_api.dart wellmate/lib/screens/women_calendar/women_companion_screen.dart wellmate/test/women_companion_experience_test.dart
      - name: Targeted verification
        shell: bash
        run: |
          set -euo pipefail
          cd wellmate
          flutter test test/women_companion_daily_log_offline_policy_test.dart test/women_companion_experience_test.dart
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-833-companion-idempotency-reconcile-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/lifemate_client/lib/src/women_companion_api.dart wellmate/lib/screens/women_calendar/women_companion_screen.dart wellmate/test/women_companion_experience_test.dart .github/workflows/tmp-833-companion-idempotency-reconcile-v3.yml
          git diff --cached --check
          git commit -m 'fix(women): keep companion offline replay idempotent'
          git push origin HEAD:feat/offline-833-companion-checkin-fallback-20260906
