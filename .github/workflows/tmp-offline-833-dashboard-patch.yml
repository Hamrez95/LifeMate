name: tmp-offline-833-dashboard-patch

on:
  push:
    branches:
      - feat/offline-833-women-owner-dashboard-fallback-20260906
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Hamrez95/LifeMate' && (github.ref_name == 'feat/offline-833-women-owner-dashboard-fallback-20260906' || github.head_ref == 'feat/offline-833-women-owner-dashboard-fallback-20260906')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-833-women-owner-dashboard-fallback-20260906
          fetch-depth: 0
      - name: Apply exact scoped patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wellmate/lib/screens/women_calendar/women_companion_screen.dart')
          text = path.read_text()

          old = "import 'women_calendar_screen.dart';\nimport 'women_companion_people_hero.dart';"
          new = "import 'women_calendar_screen.dart';\nimport 'women_companion_dashboard_loader.dart';\nimport 'women_companion_people_hero.dart';"
          if old not in text:
              raise SystemExit('import seam changed')
          text = text.replace(old, new, 1)

          old = "  bool _saving = false;\n  String? _error;"
          new = "  bool _saving = false;\n  bool _offlineCached = false;\n  String? _error;"
          if old not in text:
              raise SystemExit('state seam changed')
          text = text.replace(old, new, 1)

          start = text.index('  Future<void> _load({bool background = false}) async {')
          end = text.index('\n\n  Future<void> _openAdvancedManagement()', start)
          replacement = '''  Future<void> _load({bool background = false}) async {
            if (background && _profile.isEmpty) {
              background = false;
            }
            if (!LifeMateFeatureFlags.womenCalendarPilotEnabled) {
              if (mounted) setState(() => _loading = false);
              return;
            }
            setState(() {
              if (_profile.isEmpty) {
                _loading = true;
              }
              _error = null;
            });
            try {
              final api = context.read<LifeMateApiClient>();
              final now = DateTime.now();
              final fromDate = now.subtract(const Duration(days: 89));
              final loader = WomenCompanionDashboardLoader.forApi(api);
              final loaded = await loader.load(fromDate: fromDate, toDate: now);
              final dashboard = loaded.dashboard;
              if (!mounted) return;
              final currentUser =
                  dashboard['currentUser'] as Map<String, dynamic>? ?? const {};
              final user = currentUser['user'] as Map<String, dynamic>? ?? const {};
              setState(() {
                _profile =
                    dashboard['profile'] as Map<String, dynamic>? ?? const {};
                _episodes = (dashboard['episodes'] as List<dynamic>? ?? const [])
                    .cast<Map<String, dynamic>>();
                _dailyLogs =
                    (dashboard['dailyLogs'] as List<dynamic>? ?? const [])
                        .cast<Map<String, dynamic>>();
                _offlineCached = loaded.offlineCached;
                if (loaded.offlineCached) {
                  _currentUserId = null;
                  _currentProfile = const {};
                  _relationships = const [];
                } else {
                  _currentUserId = user['id']?.toString();
                  _currentProfile =
                      dashboard['currentProfile'] as Map<String, dynamic>? ??
                      const {};
                  _relationships =
                      (dashboard['relationships'] as List<dynamic>? ?? const [])
                          .cast<Map<String, dynamic>>();
                }
              });
            } on LifeMateApiException catch (error) {
              if (!mounted) return;
              setState(() {
                _error = error.code == 'women_calendar_feature_disabled'
                    ? LifeMateRuntimeLocale.select(
                        fa: 'تقویم بانوان در این نسخه فعال نیست.',
                        en: "The women's calendar is not active in this version.",
                      )
                    : LifeMateRuntimeLocale.select(
                        fa: 'اطلاعات چرخه دریافت نشد. دوباره تلاش کنید.',
                        en: 'Cycle information not received. Try again.',
                      );
              });
            } catch (error) {
              debugPrint('Women companion dashboard load failed: $error');
              if (mounted) {
                setState(
                  () => _error = LifeMateRuntimeLocale.select(
                    fa: 'اطلاعات چرخه دریافت نشد. دوباره تلاش کنید.',
                    en: 'Cycle information not received. Try again.',
                  ),
                );
              }
            } finally {
              if (mounted) setState(() => _loading = false);
            }
          }'''
          text = text[:start] + replacement + text[end:]

          hero_token = 'WomenCompanionPeopleHero('
          hero_pos = text.index(hero_token)
          hero_start = text.rfind('\n', 0, hero_pos) + 1
          spacer_token = 'const SizedBox(height: 14),'
          spacer_pos = text.index(spacer_token, hero_pos)
          hero_end = text.index('\n', spacer_pos)
          new = '''            if (_offlineCached) ...[
              Container(
                key: const ValueKey('women-companion-offline-owner-banner'),
                padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                decoration: BoxDecoration(
                  color: const Color(0xFFFFF1F6),
                  borderRadius: BorderRadius.circular(18),
                ),
                child: Row(
                  children: [
                    const Icon(Icons.cloud_off_rounded, color: Color(0xFFD75C8D)),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Text(
                        LifeMateRuntimeLocale.select(
                          fa: 'اطلاعات خصوصی ذخیره‌شده روی این دستگاه نمایش داده می‌شود. اشتراک‌گذاری و همدم تا اتصال دوباره آنلاین می‌مانند.',
                          en: 'Showing private data saved on this device. Sharing and companion access stay online-only until reconnection.',
                        ),
                        style: const TextStyle(
                          fontSize: 11,
                          height: 1.5,
                          color: AppColors.textSecondary,
                        ),
                      ),
                    ),
                  ],
                ),
              ),
              const SizedBox(height: 14),
            ] else ...[
              WomenCompanionPeopleHero(
                currentProfile: _currentProfile,
                relationships: _companionRelationships,
              ),
              const SizedBox(height: 14),
            ],'''
          text = text[:hero_start] + new + text[hero_end:]

          path.write_text(text)
          PY

          rm -f .github/workflows/tmp-offline-833-dashboard-patch.yml

          git config user.name 'lifemate-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add wellmate/lib/screens/women_calendar/women_companion_screen.dart .github/workflows/tmp-offline-833-dashboard-patch.yml
          git diff --cached --check
          git commit -m 'feat(women): adopt protected owner dashboard fallback'
          git push origin HEAD:feat/offline-833-women-owner-dashboard-fallback-20260906
