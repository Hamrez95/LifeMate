name: edge-integration-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/edge-integration-diagnostic.yml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        group: [identity, care, health, women, pregnancy, export]
    name: integration-${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply canonical portable schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration" >/dev/null
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Run integration family
        shell: bash
        working-directory: supabase/functions/lifemate-api
        run: |
          set -euo pipefail
          common=(deno test --no-check --allow-env --allow-net=localhost:5432,127.0.0.1:5432)
          case '${{ matrix.group }}' in
            identity)
              files=(database_integration_test.ts idempotency_integration_test.ts identity_link_token_integration_test.ts identity_resolver_integration_test.ts identity_link_rotation_integration_test.ts token_only_bootstrap_integration_test.ts provider_identity_handle_integration_test.ts provider_identity_handle_key_rotation_integration_test.ts raw_identity_retirement_integration_test.ts contact_point_conflict_integration_test.ts contact_point_read_mode_integration_test.ts contact_point_data_export_integration_test.ts contact_point_key_rotation_integration_test.ts raw_contact_retirement_integration_test.ts)
              ;;
            care)
              files=(qr_invitation_integration_test.ts phone_invitation_integration_test.ts phone_invitation_delivery_integration_test.ts care_relationship_person_identity_integration_test.ts person_care_request_invitation_integration_test.ts phone_care_request_integration_test.ts person_caremate_care_event_authorization_integration_test.ts person_care_relationship_management_integration_test.ts care_completion_notifications_integration_test.ts)
              ;;
            health)
              files=(person_medications_integration_test.ts person_treatment_plans_integration_test.ts person_dose_occurrences_integration_test.ts person_care_events_integration_test.ts person_edit_store_integration_test.ts person_health_observations_integration_test.ts person_healthcare_export_integration_test.ts person_care_event_export_integration_test.ts person_care_relationship_export_integration_test.ts profile_integration_test.ts profile_projection_integration_test.ts)
              ;;
            women)
              files=(women_calendar_integration_test.ts person_women_calendar_integration_test.ts person_women_calendar_caregiver_integration_test.ts)
              ;;
            pregnancy)
              files=(pregnancy_store_integration_test.ts pregnancy_authorization_integration_test.ts cocoon_application_integration_test.ts)
              ;;
            export)
              files=(data_export_integration_test.ts growth_integration_test.ts)
              ;;
          esac
          "${common[@]}" "${files[@]}"
