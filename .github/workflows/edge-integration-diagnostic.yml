name: edge-integration-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/edge-integration-diagnostic.yml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply canonical portable schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration" >/dev/null
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Run integration suite and surface failure
        shell: bash
        working-directory: supabase/functions/lifemate-api
        run: |
          set +e
          deno task test:integration > "$RUNNER_TEMP/integration.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo 'Integration suite failed. Tail follows:'
            tail -n 140 "$RUNNER_TEMP/integration.log"
            while IFS= read -r line; do
              printf '::error::%s\n' "${line//'%'/'%25'}"
            done < <(tail -n 80 "$RUNNER_TEMP/integration.log")
            exit "$status"
          fi
          cat "$RUNNER_TEMP/integration.log"
