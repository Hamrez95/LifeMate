name: apply-final-ui-batch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          cat .github/ui-batch/part_* > /tmp/ui.patch.gz.b64
          base64 -d /tmp/ui.patch.gz.b64 | gunzip > /tmp/ui.patch
          test "$(sha256sum /tmp/ui.patch | cut -d' ' -f1)" = "08453dee28da9e80493b2b3bd60d4ea48d4e1c52bcd1f6fc66b507866c93dd11"
          git apply --check /tmp/ui.patch
          git apply /tmp/ui.patch
          rm -rf .github/ui-batch
          rm -f .github/workflows/apply-final-ui-batch.yml
          git config user.name 'LifeMate UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add caremate wellmate .github/ui-batch .github/workflows/apply-final-ui-batch.yml
          git commit -m 'feat: complete remaining bb287 UI destinations and live care flows'
          git push origin HEAD:feat/full-bb287-ui-parity
