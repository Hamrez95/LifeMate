name: temp-offline-04-void-return

on:
  push:
    branches:
      - feat/offline-04-treatment-enqueue-seam-20260905

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          show-progress: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply web-safe acknowledgement contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
            Path('packages/lifemate_client/lib/src/durable_lifemate_api_client.dart'),
            Path('packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart'),
            Path('packages/lifemate_client/lib/src/shared_offline_runtime_native.dart'),
            Path('packages/lifemate_client/lib/src/shared_offline_runtime_web.dart'),
          ]
          for path in files:
            text = path.read_text()
            text = text.replace(
              'Future<LifeMateDurableMutation> queueTreatmentEdit({',
              'Future<void> queueTreatmentEdit({',
            )
            text = text.replace(
              'Future<LifeMateDurableMutation> enqueueTreatmentEdit({',
              'Future<void> enqueueTreatmentEdit({',
            )
            text = text.replace(
              'Future<LifeMateDurableMutation>.error(',
              'Future<void>.error(',
            )
            if path.name == 'durable_lifemate_api_client.dart':
              text = text.replace(
                '    return runtime.enqueueTreatmentEdit(\n',
                '    await runtime.enqueueTreatmentEdit(\n',
                1,
              )
            if path.name == 'shared_offline_runtime_native.dart':
              text = text.replace(
                '    return _outbox.enqueue(namespace: _localNamespace, mutation: mutation);',
                '    await _outbox.enqueue(namespace: _localNamespace, mutation: mutation);',
                1,
              )
            path.write_text(text)
          PY
          dart format packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_native.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_web.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_native.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_web.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(client): keep treatment enqueue web-safe'
          git push origin HEAD:feat/offline-04-treatment-enqueue-seam-20260905
