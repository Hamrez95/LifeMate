name: tmp-patch-94-treatment
on:
  push:
    branches: ["feat/94-smart-history-autofill"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/94-smart-history-autofill
      - shell: python
        run: |
          from pathlib import Path
          p = Path('wellmate/lib/screens/treatments/add_treatment_screen.dart')
          s = p.read_text()
          s = s.replace("  String? _error;\n", "  String? _error;\n  List<LifeMateHistoryUsage> _medicationHistory = const [];\n  bool _historyLoading = false;\n", 1)
          s = s.replace("  @override\n  void didChangeDependencies() {\n", "  @override\n  void initState() {\n    super.initState();\n    _name.addListener(_onMedicationQueryChanged);\n    _loadMedicationHistory();\n  }\n\n  void _onMedicationQueryChanged() {\n    if (mounted) setState(() {});\n  }\n\n  Future<void> _loadMedicationHistory() async {\n    if (_historyLoading) return;\n    setState(() => _historyLoading = true);\n    try {\n      final plans = await context.read<LifeMateApiClient>().getTreatmentPlans();\n      final values = <LifeMateHistoryUsage>[];\n      for (final plan in plans) {\n        final medication = plan['medication'];\n        if (medication is! Map) continue;\n        final name = medication['name']?.toString().trim() ?? '';\n        if (name.isEmpty) continue;\n        values.add(LifeMateHistoryUsage(\n          kind: LifeMateHistorySuggestionKind.medication,\n          value: name,\n          usedAt: DateTime.tryParse(plan['updatedAtUtc']?.toString() ?? '') ??\n              DateTime.tryParse(plan['startDate']?.toString() ?? '') ??\n              DateTime.fromMillisecondsSinceEpoch(0),\n          context: plan['doseText']?.toString(),\n        ));\n      }\n      if (mounted) setState(() => _medicationHistory = List.unmodifiable(values));\n    } catch (error) {\n      debugPrint('WellMate medication history unavailable: $error');\n    } finally {\n      if (mounted) setState(() => _historyLoading = false);\n    }\n  }\n\n  @override\n  void didChangeDependencies() {\n", 1)
          s = s.replace("  void dispose() {\n    _name.dispose();\n", "  void dispose() {\n    _name.removeListener(_onMedicationQueryChanged);\n    _name.dispose();\n", 1)
          old = '''              _textField(\n                controller: _name,\n                label: LifeMateRuntimeLocale.select(\n                  fa: LifeMateRuntimeLocale.select(\n                    fa: 'نام دارو',\n                    en: \"name of the drug\",\n                  ),\n                  en: \"name of the drug\",\n                ),\n                hint: LifeMateRuntimeLocale.select(\n                  fa: LifeMateRuntimeLocale.select(\n                    fa: 'مثلاً سیتریزین',\n                    en: \"For example, cetirizine\",\n                  ),\n                  en: \"For example, cetirizine\",\n                ),\n                icon: Icons.medication_rounded,\n                required: true,\n              ),\n'''
          new = old + '''              if (_historyLoading) ...[\n                LinearProgressIndicator(minHeight: 2),\n                SizedBox(height: 8),\n              ] else ...[\n                Builder(\n                  builder: (context) {\n                    final suggestions = rankLifeMateHistorySuggestions(\n                      history: _medicationHistory,\n                      query: _name.text,\n                      kind: LifeMateHistorySuggestionKind.medication,\n                    );\n                    if (suggestions.isEmpty) return const SizedBox.shrink();\n                    return Padding(\n                      padding: const EdgeInsets.only(bottom: 10),\n                      child: Wrap(\n                        spacing: 6,\n                        runSpacing: 6,\n                        children: [\n                          for (final suggestion in suggestions)\n                            ActionChip(\n                              key: ValueKey('medication-history-${suggestion.value}'),\n                              label: Text('${suggestion.value} · ${suggestion.usageCount}×'),\n                              onPressed: _busy\n                                  ? null\n                                  : () {\n                                      _name.value = TextEditingValue(\n                                        text: suggestion.value,\n                                        selection: TextSelection.collapsed(\n                                          offset: suggestion.value.length,\n                                        ),\n                                      );\n                                    },\n                            ),\n                        ],\n                      ),\n                    );\n                  },\n                ),\n              ],\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
      - run: rm .github/workflows/tmp-patch-94-treatment.yml
      - run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(autofill): surface medication history suggestions (#94)"
          git push origin HEAD:feat/94-smart-history-autofill
