name: temp-offline-03-adoption-format

on:
  push:
    branches:
      - platform/offline-03-runtime-adoption
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: platform/offline-03-runtime-adoption
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Canonical format
        run: |
          dart format \
            packages/lifemate_client/lib/src/durable_http_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/lib/src/legacy_mutation_importer.dart \
            packages/lifemate_client/lib/src/offline_mutation_queue.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime.dart \
            packages/lifemate_client/test/shared_runtime_adoption_test.dart
      - name: Verify and capture result
        working-directory: packages/lifemate_client
        shell: bash
        run: |
          set +e
          flutter pub get > /tmp/offline-result.txt 2>&1
          pub_status=$?
          flutter analyze --no-fatal-warnings --no-fatal-infos >> /tmp/offline-result.txt 2>&1
          analyze_status=$?
          flutter test test/shared_runtime_adoption_test.dart >> /tmp/offline-result.txt 2>&1
          test_status=$?
          tail -n 160 /tmp/offline-result.txt > ../../.tmp-offline-result.txt
          printf '\npub=%s analyze=%s test=%s\n' "$pub_status" "$analyze_status" "$test_status" >> ../../.tmp-offline-result.txt
      - name: Commit formatter and diagnostic result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/lifemate_client/lib/src/durable_http_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/lib/src/legacy_mutation_importer.dart \
            packages/lifemate_client/lib/src/offline_mutation_queue.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime.dart \
            packages/lifemate_client/test/shared_runtime_adoption_test.dart \
            .tmp-offline-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): capture runtime adoption validation"
          git push origin HEAD:platform/offline-03-runtime-adoption
