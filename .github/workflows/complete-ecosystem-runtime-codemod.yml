name: complete-ecosystem-runtime-codemod

on:
  push:
    branches: ['feat/ecosystem-data-foundation']
    paths:
      - 'tools/refactor/complete_ecosystem_runtime.py'
      - '.github/workflows/complete-ecosystem-runtime-codemod.yml'

permissions:
  contents: write

concurrency:
  group: complete-ecosystem-runtime-codemod
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Apply exact runtime codemod
        run: python3 tools/refactor/complete_ecosystem_runtime.py
      - name: Format patched router
        run: deno fmt supabase/functions/lifemate-api/index.ts
      - name: Validate patched Edge API
        working-directory: supabase/functions/lifemate-api
        run: |
          deno task check
          deno task test
      - name: Commit validated router
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/lifemate-api/index.ts; then
            echo 'No router changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/lifemate-api/index.ts
          git commit -m 'feat(api): enforce central ecosystem authorization at runtime'
          git push origin HEAD:feat/ecosystem-data-foundation
