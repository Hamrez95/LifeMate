name: temp-offline-04-enqueue

on:
  push:
    branches:
      - feat/offline-04-treatment-enqueue-seam-20260905

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          show-progress: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply bounded runtime/client seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          params = '''    required String mutationId,
              required String treatmentPlanId,
              required int version,
              required int medicationVersion,
              required String medicationName,
              String? strengthText,
              String? form,
              required String doseText,
              String? instructions,
              required DateTime startDate,
              DateTime? endDate,
              required String timeZone,
              required List<Map<String, String>> schedules,
              required int patientReminderMinutesBefore,
              required int caregiverReminderMinutesBefore,
              required String status,'''

          native_runtime = Path('packages/lifemate_client/lib/src/shared_offline_runtime_native.dart')
          text = native_runtime.read_text()
          marker = '  Future<int> pendingMutationCount() async {'
          if 'Future<LifeMateDurableMutation> enqueueTreatmentEdit({' not in text:
              method = '''  /// Accepts only a fully validated treatment edit into the existing protected
            /// Account + Person outbox. Arbitrary mutation paths/domains are never exposed.
            Future<LifeMateDurableMutation> enqueueTreatmentEdit({
          ''' + params + '''
            }) async {
              _requireOpen();
              final mutation = LifeMateOfflineTreatmentMutation.buildEdit(
                mutationId: mutationId,
                treatmentPlanId: treatmentPlanId,
                version: version,
                medicationVersion: medicationVersion,
                medicationName: medicationName,
                strengthText: strengthText,
                form: form,
                doseText: doseText,
                instructions: instructions,
                startDate: startDate,
                endDate: endDate,
                timeZone: timeZone,
                schedules: schedules,
                patientReminderMinutesBefore: patientReminderMinutesBefore,
                caregiverReminderMinutesBefore: caregiverReminderMinutesBefore,
                status: status,
              );
              return _outbox.enqueue(namespace: _localNamespace, mutation: mutation);
            }

          '''
              if marker not in text: raise SystemExit('native runtime marker missing')
              native_runtime.write_text(text.replace(marker, method + marker, 1))

          web_runtime = Path('packages/lifemate_client/lib/src/shared_offline_runtime_web.dart')
          text = web_runtime.read_text()
          marker = '  Future<int> pendingMutationCount() => Future<int>.value(0);'
          if 'Future<LifeMateDurableMutation> enqueueTreatmentEdit({' not in text:
              method = '''  Future<LifeMateDurableMutation> enqueueTreatmentEdit({
          ''' + params + '''
            }) => Future<LifeMateDurableMutation>.error(_unsupported());

          '''
              if marker not in text: raise SystemExit('web runtime marker missing')
              web_runtime.write_text(text.replace(marker, method + marker, 1))

          native_client = Path('packages/lifemate_client/lib/src/durable_lifemate_api_client.dart')
          text = native_client.read_text()
          marker = '  Future<int> pendingMutationCount() async {'
          if 'Future<LifeMateDurableMutation> queueTreatmentEdit({' not in text:
              method = '''  /// Queues a locally validated treatment edit only after canonical Account +
            /// Person runtime adoption. There is intentionally no account-only fallback.
            Future<LifeMateDurableMutation> queueTreatmentEdit({
          ''' + params + '''
            }) async {
              final runtime = _activeSharedRuntime();
              if (runtime == null) {
                throw StateError(
                  'Canonical shared offline runtime must be adopted before queuing a treatment edit.',
                );
              }
              return runtime.enqueueTreatmentEdit(
                mutationId: mutationId,
                treatmentPlanId: treatmentPlanId,
                version: version,
                medicationVersion: medicationVersion,
                medicationName: medicationName,
                strengthText: strengthText,
                form: form,
                doseText: doseText,
                instructions: instructions,
                startDate: startDate,
                endDate: endDate,
                timeZone: timeZone,
                schedules: schedules,
                patientReminderMinutesBefore: patientReminderMinutesBefore,
                caregiverReminderMinutesBefore: caregiverReminderMinutesBefore,
                status: status,
              );
            }

          '''
              if marker not in text: raise SystemExit('native client marker missing')
              native_client.write_text(text.replace(marker, method + marker, 1))

          web_client = Path('packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart')
          text = web_client.read_text()
          marker = '  Future<int> flushPendingMutations() async => 0;'
          if 'Future<LifeMateDurableMutation> queueTreatmentEdit({' not in text:
              method = '''  Future<LifeMateDurableMutation> queueTreatmentEdit({
          ''' + params + '''
            }) => Future<LifeMateDurableMutation>.error(
              UnsupportedError('Protected offline health execution is unavailable on web.'),
            );

          '''
              if marker not in text: raise SystemExit('web client marker missing')
              web_client.write_text(text.replace(marker, method + marker, 1))
          PY
          dart format packages/lifemate_client/lib/src/shared_offline_runtime_native.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_web.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/lifemate_client/lib/src/shared_offline_runtime_native.dart \
            packages/lifemate_client/lib/src/shared_offline_runtime_web.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client.dart \
            packages/lifemate_client/lib/src/durable_lifemate_api_client_web.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(client): add protected treatment enqueue seam'
          git push origin HEAD:feat/offline-04-treatment-enqueue-seam-20260905
