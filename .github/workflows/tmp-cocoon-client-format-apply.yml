name: tmp-cocoon-client-format-apply

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-cocoon-client-format-apply.yml'
  push:
    branches:
      - fix/cocoon-client-format-baseline-20260906
    paths:
      - '.github/workflows/tmp-cocoon-client-format-apply.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/cocoon-client-format-baseline-20260906
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply canonical format
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/lifemate_client/lib/src/cocoon_pregnancy.dart
            packages/lifemate_client/lib/src/cocoon_pregnancy_api.dart
            packages/lifemate_client/test/cocoon_pregnancy_contract_test.dart
          )
          dart format "${files[@]}"
          git diff --check -- "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo 'No formatting delta.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'style(cocoon): apply canonical dart format'
          git push origin HEAD:fix/cocoon-client-format-baseline-20260906
