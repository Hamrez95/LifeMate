name: internal-beta-release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Internal release name, for example 0.8.0-internal.1
        required: true
        default: 0.8.0-internal.1
        type: string
      confirm_release:
        description: Type DEPLOY-INTERNAL-BETA to confirm a live Edge deployment
        required: true
        type: string
      run_live_role_smoke:
        description: Run the three-account live patient/caregiver/unrelated-user journey
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/internal-beta-release.yml'
      - 'tools/release/**'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/functions/lifemate-telemetry/**'
      - 'packages/lifemate_client/**'
      - 'wellmate/**'
      - 'caremate/**'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'production-edge-deploy' || format('internal-beta-release-{0}', github.ref) }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
  LIFEMATE_TELEMETRY_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-telemetry
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}

jobs:
  validate-release-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Validate release scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/release/live-beta-smoke.sh
          shellcheck tools/release/live-beta-smoke.sh
          bash -n tools/release/prepare-android-signing.sh
          bash -n tools/release/verify-android-signing.sh
          ! grep -R --line-number 'SUPABASE_SERVICE_ROLE_KEY' \
            supabase/functions/lifemate-api \
            supabase/functions/lifemate-telemetry \
            tools/release/*.sh

      - name: Verify Edge source
        shell: bash
        run: |
          set -euo pipefail
          (cd supabase/functions/lifemate-api && deno task test --allow-read=..)
          (cd supabase/functions/lifemate-telemetry && deno task test)

      - name: Validate dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM_RELEASE" = 'DEPLOY-INTERNAL-BETA'
          [[ "$RELEASE_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-internal\.[0-9]+$ ]]

  deploy-edge:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-release-source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: beta
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CONTACT_HASHING_SECRET: ${{ secrets.LIFEMATE_CONTACT_HASHING_SECRET }}
      TELEMETRY_SMOKE_EMAIL: ${{ secrets.BETA_PATIENT_EMAIL }}
      TELEMETRY_SMOKE_PASSWORD: ${{ secrets.BETA_PATIENT_PASSWORD }}
    outputs:
      release_version: ${{ steps.release-meta.outputs.release_version }}
      short_sha: ${{ steps.release-meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "${#CONTACT_HASHING_SECRET}" -ge 32
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$TELEMETRY_SMOKE_EMAIL"
          test -n "$TELEMETRY_SMOKE_PASSWORD"

      - name: Compute immutable release metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "release_version=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Configure dedicated Edge secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          cleanup_secret_file() {
            if command -v shred >/dev/null 2>&1; then
              shred -u "$secret_file"
            else
              rm -f "$secret_file"
            fi
          }
          trap cleanup_secret_file EXIT
          chmod 600 "$secret_file"
          printf 'LIFEMATE_CONTACT_HASHING_SECRET=%s\n' "$CONTACT_HASHING_SECRET" > "$secret_file"
          printf 'LIFEMATE_RELEASE_VERSION=%s\n' "$GITHUB_SHA" >> "$secret_file"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --env-file "$secret_file"

      - name: Deploy reviewed Edge source
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy lifemate-api \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api
          supabase functions deploy lifemate-telemetry \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api

      - name: Verify deployed API version and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "ready" and .service == "lifemate-api" and .version == $version' \
            >/dev/null
          unauthorized_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$unauthorized_status" = '401'

      - name: Verify authenticated telemetry ingress
        shell: bash
        run: |
          set -euo pipefail
          auth_payload="$(jq -cn \
            --arg email "$TELEMETRY_SMOKE_EMAIL" \
            --arg password "$TELEMETRY_SMOKE_PASSWORD" \
            '{email:$email,password:$password}')"
          access_token="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$auth_payload" \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" | jq -er '.access_token')"
          test -n "$access_token"

          event_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          event_payload="$(jq -cn \
            --arg eventId "$event_id" \
            --arg releaseVersion "$GITHUB_SHA" \
            '{eventId:$eventId,application:"wellmate",releaseVersion:$releaseVersion,platform:"android",source:"zone",errorType:"ReleaseSmokeError",stackFingerprint:"0123456789abcdef",fatal:false}')"
          telemetry_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data "$event_payload" \
            "$LIFEMATE_TELEMETRY_URL")"
          test "$telemetry_status" = '202'

          unauthorized_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$event_payload" \
            "$LIFEMATE_TELEMETRY_URL")"
          test "$unauthorized_status" = '401'

  live-role-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_role_smoke }}
    needs: deploy-edge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: beta
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.deploy-edge.outputs.release_version }}
      PATIENT_EMAIL: ${{ secrets.BETA_PATIENT_EMAIL }}
      PATIENT_PASSWORD: ${{ secrets.BETA_PATIENT_PASSWORD }}
      CAREGIVER_EMAIL: ${{ secrets.BETA_CAREGIVER_EMAIL }}
      CAREGIVER_PASSWORD: ${{ secrets.BETA_CAREGIVER_PASSWORD }}
      UNRELATED_EMAIL: ${{ secrets.BETA_UNRELATED_EMAIL }}
      UNRELATED_PASSWORD: ${{ secrets.BETA_UNRELATED_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Execute live three-role journey
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release/live-beta-smoke.sh | tee /tmp/lifemate-live-role-smoke.json
          jq -e '.status == "passed" and .release == env.EXPECTED_RELEASE_VERSION' \
            /tmp/lifemate-live-role-smoke.json >/dev/null

      - name: Upload redacted smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-role-smoke-${{ needs.deploy-edge.outputs.short_sha }}
          path: /tmp/lifemate-live-role-smoke.json
          if-no-files-found: error
          retention-days: 14

  build-android-internal:
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        needs.deploy-edge.result == 'success' &&
        (needs.live-role-smoke.result == 'success' || needs.live-role-smoke.result == 'skipped')
      }}
    needs: [deploy-edge, live-role-smoke]
    runs-on: ubuntu-24.04
    environment: beta
    timeout-minutes: 35
    env:
      RELEASE_NAME: ${{ inputs.release_name }}
      RELEASE_VERSION: ${{ needs.deploy-edge.outputs.release_version }}
      SHORT_SHA: ${{ needs.deploy-edge.outputs.short_sha }}
      PUB_ENVIRONMENT: bot:github_actions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Re-verify exact Flutter source
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/lifemate_client && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd wellmate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)
          (cd caremate && flutter pub get && flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test)

      - name: Re-verify deployed API version
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | jq -e \
            --arg version "$RELEASE_VERSION" \
            '.status == "ok" and .database == "ready" and .version == $version' >/dev/null

      - name: Prepare founder-owned Android signing
        shell: bash
        env:
          WELLMATE_KEYSTORE_BASE64: ${{ secrets.WELLMATE_KEYSTORE_BASE64 }}
          WELLMATE_STORE_PASSWORD: ${{ secrets.WELLMATE_STORE_PASSWORD }}
          WELLMATE_KEY_PASSWORD: ${{ secrets.WELLMATE_KEY_PASSWORD }}
          WELLMATE_KEY_ALIAS: ${{ secrets.WELLMATE_KEY_ALIAS }}
          CAREMATE_KEYSTORE_BASE64: ${{ secrets.CAREMATE_KEYSTORE_BASE64 }}
          CAREMATE_STORE_PASSWORD: ${{ secrets.CAREMATE_STORE_PASSWORD }}
          CAREMATE_KEY_PASSWORD: ${{ secrets.CAREMATE_KEY_PASSWORD }}
          CAREMATE_KEY_ALIAS: ${{ secrets.CAREMATE_KEY_ALIAS }}
        run: bash tools/release/prepare-android-signing.sh

      - name: Build installable internal APKs
        shell: bash
        run: |
          set -euo pipefail
          build_number="$GITHUB_RUN_NUMBER"
          build_args=(
            --release
            --build-name="$RELEASE_NAME"
            --build-number="$build_number"
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
          )
          (cd wellmate && flutter build apk "${build_args[@]}")
          (cd caremate && flutter build apk "${build_args[@]}")

      - name: Verify stable Android signatures
        shell: bash
        run: >-
          bash tools/release/verify-android-signing.sh
          wellmate/build/app/outputs/flutter-apk/app-release.apk
          caremate/build/app/outputs/flutter-apk/app-release.apk

      - name: Verify packages and create release manifest
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          mkdir -p dist
          cp wellmate/build/app/outputs/flutter-apk/app-release.apk \
            "dist/wellmate-$RELEASE_NAME-$SHORT_SHA-internal.apk"
          cp caremate/build/app/outputs/flutter-apk/app-release.apk \
            "dist/caremate-$RELEASE_NAME-$SHORT_SHA-internal.apk"

          "$aapt_bin" dump badging "dist/wellmate-$RELEASE_NAME-$SHORT_SHA-internal.apk" \
            | grep -q "package: name='com.lifemate.wellmate'"
          "$aapt_bin" dump badging "dist/caremate-$RELEASE_NAME-$SHORT_SHA-internal.apk" \
            | grep -q "package: name='com.lifemate.caremate'"
          for apk in dist/*.apk; do
            "$aapt_bin" dump permissions "$apk" | grep -Fq 'android.permission.INTERNET'
          done

          wellmate_sha="$(sha256sum dist/wellmate-*.apk | awk '{print $1}')"
          caremate_sha="$(sha256sum dist/caremate-*.apk | awk '{print $1}')"
          wellmate_cert_sha256="$(cat "$LIFEMATE_ANDROID_SIGNING_DIR/wellmate-cert-sha256.txt")"
          caremate_cert_sha256="$(cat "$LIFEMATE_ANDROID_SIGNING_DIR/caremate-cert-sha256.txt")"
          jq -n \
            --arg releaseName "$RELEASE_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg apiVersion "$RELEASE_VERSION" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wellmateSha256 "$wellmate_sha" \
            --arg caremateSha256 "$caremate_sha" \
            --arg wellmateSigningCertSha256 "$wellmate_cert_sha256" \
            --arg caremateSigningCertSha256 "$caremate_cert_sha256" \
            '{releaseName:$releaseName,commit:$commit,apiVersion:$apiVersion,builtAtUtc:$builtAt,channel:"internal/unstable",signing:"founder-owned stable release keystores",apps:{wellmate:{packageId:"com.lifemate.wellmate",sha256:$wellmateSha256,signingCertSha256:$wellmateSigningCertSha256},caremate:{packageId:"com.lifemate.caremate",sha256:$caremateSha256,signingCertSha256:$caremateSigningCertSha256}},knownLimitations:["Not a stable beta or store release","Human device/accessibility/privacy review remains required"]}' \
            > dist/release-manifest.json

      - name: Upload versioned internal release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemate-${{ inputs.release_name }}-${{ needs.deploy-edge.outputs.short_sha }}-android-internal
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f wellmate/android/key.properties caremate/android/key.properties
          if [[ -n "${LIFEMATE_ANDROID_SIGNING_DIR:-}" ]]; then
            rm -rf "$LIFEMATE_ANDROID_SIGNING_DIR"
          fi
