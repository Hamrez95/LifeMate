name: round2-audit-contract-one-shot

on:
  push:
    branches:
      - fix/wellmate-physical-qa-round-2
    paths:
      - .github/workflows/round2-audit-contract-one-shot.yml

permissions:
  contents: write

jobs:
  patch-audit-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/wellmate-physical-qa-round-2
          fetch-depth: 0

      - name: Align care event audit insert with canonical schema
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/lifemate-api/care_events.ts')
          text = path.read_text()
          old = '''async function insertAudit(
            sql: any,
            actorUserId: string,
            action: string,
            entityType: string,
            entityId: string,
            metadata: Record<string, unknown>,
          ): Promise<void> {
            const metadataJson = JSON.stringify(metadata);
            await sql`
              insert into lifemate.audit_logs
                (id, actor_user_id, action, entity_type, entity_id, metadata_json,
                 occurred_at_utc)
              values
                (${crypto.randomUUID()}, ${actorUserId}, ${action}, ${entityType},
                 ${entityId}, ${metadataJson}, now())
            `;
          }
          '''
          new = '''async function insertAudit(
            sql: any,
            actorUserId: string,
            action: string,
            resourceType: string,
            resourceId: string,
            metadata: Record<string, unknown>,
          ): Promise<void> {
            const metadataJson = JSON.stringify(metadata);
            await sql`
              insert into lifemate.audit_logs
                (id, actor_user_id, action, resource_type, resource_id, metadata_json,
                 created_at_utc)
              values
                (${crypto.randomUUID()}, ${actorUserId}, ${action}, ${resourceType},
                 ${resourceId}, ${metadataJson}, now())
            `;
          }
          '''
          if old not in text:
              if new in text:
                  print('Canonical audit contract already applied.')
                  raise SystemExit(0)
              raise SystemExit('Expected care_events insertAudit block was not found; refusing broad edit.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          git diff -- supabase/functions/lifemate-api/care_events.ts
          grep -q 'resource_type, resource_id, metadata_json' supabase/functions/lifemate-api/care_events.ts
          grep -q 'created_at_utc' supabase/functions/lifemate-api/care_events.ts
          ! grep -q 'entity_type, entity_id, metadata_json' supabase/functions/lifemate-api/care_events.ts

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Format check
        run: deno fmt --check supabase/functions/lifemate-api/care_events.ts

      - name: Commit focused fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No change to commit.'
            exit 0
          fi
          git config user.name 'Hamidreza Pakpour'
          git config user.email '136631329+Hamrez95@users.noreply.github.com'
          git add supabase/functions/lifemate-api/care_events.ts
          git commit -m 'fix(edge): align care event audit with canonical schema'
          git push origin HEAD:fix/wellmate-physical-qa-round-2
