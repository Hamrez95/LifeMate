name: profile-photo-reminder-state

on:
  push:
    branches:
      - fix/profile-photo-reminder-state

permissions:
  contents: write

concurrency:
  group: profile-photo-reminder-state-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: lifemate_reminder_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_reminder_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__LifeMateDb: Host=localhost;Port=5432;Database=lifemate_reminder_tests;Username=postgres;Password=postgres
      Security__Invitations__ContactPepper: integration-only-invitation-contact-pepper-32-bytes-minimum
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_reminder_tests

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/profile-photo-reminder-state
          fetch-depth: 0
          show-progress: false

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Materialize reminder-state fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hotfix/apply_reminder_state_and_lead_times.py
          python3 tools/hotfix/apply_reminder_due_now_fix.py
          mapfile -t dart_files < <(git diff --name-only --diff-filter=ACM | grep -E '\.dart$' || true)
          if (( ${#dart_files[@]} > 0 )); then
            dart format "${dart_files[@]}"
          fi
          mapfile -t deno_files < <(
            git diff --name-only --diff-filter=ACM \
              | grep -E '^supabase/functions/lifemate-api/.*\.ts$' || true
          )
          if (( ${#deno_files[@]} > 0 )); then
            deno fmt "${deno_files[@]}"
          fi

      - name: Verify Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          for project in packages/lifemate_client wellmate caremate; do
            (
              cd "$project"
              flutter pub get
              flutter analyze --no-fatal-infos --no-fatal-warnings
              flutter test
            )
          done

      - name: Verify Edge contracts
        working-directory: supabase/functions/lifemate-api
        shell: bash
        run: |
          set -euo pipefail
          deno task check
          deno task test

      - name: Build isolated schema and run integration journeys
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend-dotnet/LifeMate.sln --verbosity minimal
          dotnet tool restore
          dotnet build backend-dotnet/LifeMate.sln --configuration Release --no-restore
          dotnet ef database update \
            --configuration Release \
            --no-build \
            --project backend-dotnet/src/LifeMate.Infrastructure \
            --startup-project backend-dotnet/src/LifeMate.Api
          for migration in \
            supabase/migrations/20260803173000_add_consent_scoped_care_events.sql \
            supabase/migrations/20260804002000_lock_down_public_health_status.sql \
            supabase/migrations/20260804003000_add_user_profile_version.sql \
            supabase/migrations/20260804130000_add_women_calendar_pilot.sql \
            supabase/migrations/20260804213000_add_profile_avatar_key.sql \
            supabase/migrations/20260805013000_add_reminder_lead_times.sql
          do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done
          (
            cd supabase/functions/lifemate-api
            deno task test:integration
          )

      - name: Enforce physical-QA regression invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'onMissedMedicationTaken' wellmate/lib/core/widgets/wellmate_app_header.dart
          grep -q 'reportDose' wellmate/lib/screens/home/home_screen.dart
          grep -q "final missed = item.status == 'missed'" wellmate/lib/screens/home/home_screen_content.dart
          grep -q "final isMissed = item.status == 'missed'" wellmate/lib/screens/calendar/calendar_screen.dart
          grep -q 'effective_status' supabase/functions/lifemate-api/care_events.ts
          grep -q 'patientReminderMinutesBefore' wellmate/lib/screens/treatments/add_treatment_screen.dart
          grep -q 'caregiverReminderMinutesBefore' wellmate/lib/screens/treatments/care_plan_hub_screen.dart
          grep -q 'patient_reminder_minutes_before' supabase/migrations/20260805013000_add_reminder_lead_times.sql
          grep -q 'triggerAtUtc' caremate/lib/models/care_recipient_reminder.dart
          grep -q 'getCareRecipientCareEvents' caremate/lib/screens/dashboard_screen.dart
          ! grep -q 'cancelAll' caremate/lib/providers/care_notification_provider.dart
          grep -q 'visibility: NotificationVisibility.private' wellmate/lib/providers/notification_provider.dart
          grep -q 'visibility: NotificationVisibility.private' caremate/lib/providers/care_notification_provider.dart

      - name: Commit verified materialized changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            packages/lifemate_client \
            wellmate \
            caremate \
            supabase/functions/lifemate-api \
            supabase/migrations/20260805013000_add_reminder_lead_times.sql \
            .github/workflows/edge-api.yml \
            .github/workflows/women-calendar-pilot-audit.yml
          if git diff --cached --quiet; then
            echo 'No reminder-state changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: persist missed actions and configurable reminders'
          git push origin HEAD:fix/profile-photo-reminder-state
