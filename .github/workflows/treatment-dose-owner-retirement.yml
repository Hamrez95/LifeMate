name: treatment-dose-owner-retirement

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'readiness, scrub or rehydrate'
        required: true
        default: readiness
        type: choice
        options:
          - readiness
          - scrub
          - rehydrate
      mode:
        description: 'dry-run or apply; readiness is dry-run only'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      max_rows:
        description: 'Maximum rows in one bounded batch (1-2000)'
        required: true
        default: '250'
        type: string
      confirmation:
        description: 'Apply only: SCRUB-TREATMENT-DOSE-OWNERS or REHYDRATE-TREATMENT-DOSE-OWNERS'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-treatment-dose-owner-retirement
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: beta
    env:
      LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL: ${{ secrets.LIFEMATE_IDENTITY_BACKFILL_DATABASE_URL }}
      LIFEMATE_TREATMENT_DOSE_OWNER_OPERATION: ${{ inputs.operation }}
      LIFEMATE_TREATMENT_DOSE_OWNER_MODE: ${{ inputs.mode }}
      LIFEMATE_TREATMENT_DOSE_OWNER_MAX_ROWS: ${{ inputs.max_rows }}
      LIFEMATE_TREATMENT_DOSE_OWNER_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require protected exact-main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.repository.private }}" = 'true'
          test "${{ github.ref_protected }}" = 'true'
          test -n "$LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL"
          [[ "$LIFEMATE_TREATMENT_DOSE_OWNER_MAX_ROWS" =~ ^[0-9]+$ ]]
          test "$LIFEMATE_TREATMENT_DOSE_OWNER_MAX_ROWS" -ge 1
          test "$LIFEMATE_TREATMENT_DOSE_OWNER_MAX_ROWS" -le 2000
          if [ "$LIFEMATE_TREATMENT_DOSE_OWNER_OPERATION" = 'readiness' ]; then
            test "$LIFEMATE_TREATMENT_DOSE_OWNER_MODE" = 'dry-run'
          fi
          if [ "$LIFEMATE_TREATMENT_DOSE_OWNER_OPERATION" = 'scrub' ] && [ "$LIFEMATE_TREATMENT_DOSE_OWNER_MODE" = 'apply' ]; then
            test "$LIFEMATE_TREATMENT_DOSE_OWNER_CONFIRM" = 'SCRUB-TREATMENT-DOSE-OWNERS'
          fi
          if [ "$LIFEMATE_TREATMENT_DOSE_OWNER_OPERATION" = 'rehydrate' ] && [ "$LIFEMATE_TREATMENT_DOSE_OWNER_MODE" = 'apply' ]; then
            test "$LIFEMATE_TREATMENT_DOSE_OWNER_CONFIRM" = 'REHYDRATE-TREATMENT-DOSE-OWNERS'
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Re-verify Treatment/Dose retirement policy
        run: node tools/security/verify-treatment-dose-owner-retirement.mjs

      - name: Check bounded retirement source
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check tools/security/treatment-dose-owner-retirement.ts
          deno check tools/security/treatment-dose-owner-retirement.ts

      - name: Execute bounded Treatment/Dose owner operation
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/treatment-dose-owner-retirement.json"
          deno run \
            --allow-env=LIFEMATE_IDENTITY_MIGRATION_DATABASE_URL,LIFEMATE_TREATMENT_DOSE_OWNER_OPERATION,LIFEMATE_TREATMENT_DOSE_OWNER_MODE,LIFEMATE_TREATMENT_DOSE_OWNER_MAX_ROWS,LIFEMATE_TREATMENT_DOSE_OWNER_CONFIRM \
            --allow-net \
            tools/security/treatment-dose-owner-retirement.ts > "$summary_file"
          jq -e '
            (.operation == "readiness" or .operation == "scrub" or .operation == "rehydrate") and
            (.mode == "dry-run" or .mode == "apply") and
            (.maxRows | type == "number") and
            (.readiness.treatmentPlans | type == "number") and
            (.readiness.doseOccurrences | type == "number") and
            (.readiness.totalRows | type == "number") and
            (.readiness.mappedRows | type == "number") and
            (.readiness.missingMappings | type == "number") and
            (.readiness.ambiguousMappings | type == "number") and
            (.readiness.linkedRows | type == "number") and
            (.readiness.retiredRows | type == "number") and
            (.readiness.mismatchedLegacyOwners | type == "number") and
            (.readiness.dosePlanPersonMismatches | type == "number") and
            (.readiness.ready | type == "boolean") and
            (.scannedRows | type == "number") and
            (.changedRows | type == "number") and
            (.hasMore | type == "boolean")
          ' "$summary_file" >/dev/null
          {
            echo '## Treatment/Dose owner retirement'
            echo ''
            echo "- operation: $(jq -r '.operation' "$summary_file")"
            echo "- mode: $(jq -r '.mode' "$summary_file")"
            echo "- treatment plans: $(jq -r '.readiness.treatmentPlans' "$summary_file")"
            echo "- dose occurrences: $(jq -r '.readiness.doseOccurrences' "$summary_file")"
            echo "- linked rows: $(jq -r '.readiness.linkedRows' "$summary_file")"
            echo "- retired rows: $(jq -r '.readiness.retiredRows' "$summary_file")"
            echo "- missing mappings: $(jq -r '.readiness.missingMappings' "$summary_file")"
            echo "- ambiguous mappings: $(jq -r '.readiness.ambiguousMappings' "$summary_file")"
            echo "- mismatched legacy owners: $(jq -r '.readiness.mismatchedLegacyOwners' "$summary_file")"
            echo "- Dose/Treatment Person mismatches: $(jq -r '.readiness.dosePlanPersonMismatches' "$summary_file")"
            echo "- scanned rows: $(jq -r '.scannedRows' "$summary_file")"
            echo "- changed rows: $(jq -r '.changedRows' "$summary_file")"
            echo "- has more: $(jq -r '.hasMore' "$summary_file")"
            echo '- AppUser, Account, Person, treatment, dose identifiers and healthcare payloads are intentionally omitted'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$summary_file"
