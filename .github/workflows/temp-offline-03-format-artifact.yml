name: temp-offline-03-format-reconcile

on:
  pull_request:
    paths:
      - 'packages/lifemate_core/**'
      - '.github/workflows/temp-offline-03-format-artifact.yml'

permissions:
  contents: write

jobs:
  format-reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Format and reconcile branch
        working-directory: packages/lifemate_core
        run: |
          set -euo pipefail
          dart format lib/src/local_mutation_outbox.dart test/local_mutation_outbox_test.dart
          if git diff --quiet -- lib/src/local_mutation_outbox.dart test/local_mutation_outbox_test.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/local_mutation_outbox.dart test/local_mutation_outbox_test.dart
          git commit -m 'style(offline): format mutation outbox sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
