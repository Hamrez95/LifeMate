name: runtime-onboarding-control-policy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runtime-onboarding-control-policy.yml'
      - 'docs/operations/beta-onboarding-control.md'
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/lifemate-api/database_client.ts'
      - 'supabase/functions/lifemate-api/database_legacy.ts'
      - 'supabase/functions/lifemate-api/runtime_onboarding_control_integration_test.ts'
      - 'tools/operations/verify-runtime-onboarding-control.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-onboarding-control-policy.yml'
      - 'docs/operations/beta-onboarding-control.md'
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/lifemate-api/database_client.ts'
      - 'supabase/functions/lifemate-api/database_legacy.ts'
      - 'supabase/functions/lifemate-api/runtime_onboarding_control_integration_test.ts'
      - 'tools/operations/verify-runtime-onboarding-control.mjs'

permissions:
  contents: read

concurrency:
  group: runtime-onboarding-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Verify provider-independent onboarding pause contract
        run: node tools/operations/verify-runtime-onboarding-control.mjs

  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_runtime_control
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_runtime_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_runtime_control
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Apply canonical PostgreSQL schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Prove pause, existing-user continuity, resume and read-only Edge access
        working-directory: supabase/functions/lifemate-api
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check runtime_onboarding_control_integration_test.ts
          deno test --no-check --allow-env --allow-net=localhost:5432,127.0.0.1:5432 \
            runtime_onboarding_control_integration_test.ts
