name: fix-persistent-timer-once

on:
  push:
    branches:
      - feat/full-bb287-ui-parity
    paths:
      - .github/workflows/fix-persistent-timer-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-bb287-ui-parity
          fetch-depth: 0

      - name: Keep timer card visible while loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wellmate/lib/screens/home/home_screen_content.dart')
          text = path.read_text(encoding='utf-8')
          old = """          if (isLoading)
            const Expanded(
              child: Center(
                child: CircularProgressIndicator(color: AppColors.primary),
              ),
            )
          else if (loadError != null)
"""
          new = """          if (isLoading) ...[
            Padding(
              padding: const EdgeInsets.symmetric(horizontal: 20),
              child: _TreatmentTimerPlaceholder(
                hasTreatmentPlans: false,
                onAction: widget.onAddTreatment,
                font: font,
              ),
            ),
            const SizedBox(height: 24),
            const Expanded(
              child: Center(
                child: CircularProgressIndicator(color: AppColors.primary),
              ),
            ),
          ] else if (loadError != null)
"""
          if old not in text:
              raise SystemExit('WellMate loading timer block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-persistent-timer-once.yml').unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wellmate/lib/screens/home/home_screen_content.dart .github/workflows/fix-persistent-timer-once.yml
          git commit -m "Keep WellMate timer visible during loading"
          git push origin HEAD:feat/full-bb287-ui-parity
