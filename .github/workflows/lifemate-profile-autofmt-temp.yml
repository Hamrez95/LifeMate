name: lifemate-profile-autofmt-temp

on:
  push:
    branches:
      - feat/profile-you-1080

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-you-1080
          fetch-depth: 0
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Format changed Dart sources
        run: dart format lifemate/lib lifemate/test
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lifemate/lib lifemate/test
          git commit -m "style(profile): apply Dart formatter output (#1080)"
          git push origin HEAD:feat/profile-you-1080
