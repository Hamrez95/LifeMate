name: main-edge-deploy

on:
  pull_request:
    paths:
      - '.github/workflows/main-edge-deploy.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/functions/lifemate-telemetry/**'
      - 'supabase/functions/lifemate-readiness/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-edge-deploy.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/functions/lifemate-telemetry/**'
      - 'supabase/functions/lifemate-readiness/**'

permissions:
  contents: read

concurrency:
  group: main-edge-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
  LIFEMATE_TELEMETRY_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-telemetry
  LIFEMATE_READINESS_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-readiness
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}

jobs:
  verify-edge-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Verify API source
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-api
          deno fmt --check
          deno task check
          deno task test

      - name: Verify telemetry source
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-telemetry
          deno fmt --check
          deno task check
          deno task test

      - name: Verify readiness source
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-readiness
          deno fmt --check
          deno task check
          deno task test

  deploy-exact-main:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify-edge-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TELEMETRY_SMOKE_EMAIL: ${{ secrets.BETA_PATIENT_EMAIL }}
      TELEMETRY_SMOKE_PASSWORD: ${{ secrets.BETA_PATIENT_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact main and protected deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Verify management credential
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list >/dev/null

      - name: Set immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          cleanup_secret_file() {
            if command -v shred >/dev/null 2>&1; then
              shred -u "$secret_file"
            else
              rm -f "$secret_file"
            fi
          }
          trap cleanup_secret_file EXIT
          chmod 600 "$secret_file"
          printf 'LIFEMATE_RELEASE_VERSION=%s\n' "$GITHUB_SHA" > "$secret_file"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --env-file "$secret_file"

      - name: Deploy exact-main API telemetry and readiness
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy lifemate-api \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api
          supabase functions deploy lifemate-telemetry \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api
          supabase functions deploy lifemate-readiness \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify exact production API source and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "ready" and .service == "lifemate-api" and .version == $version and (.databaseTransport == "transaction_pooler" or .databaseTransport == "direct_or_other") and (.transactionPoolerRequired | type == "boolean")' \
            >/dev/null

          unauthorized_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$unauthorized_status" = '401'

      - name: Verify restricted production readiness identity and transport evidence
        shell: bash
        run: |
          set -euo pipefail
          readiness_response="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$LIFEMATE_READINESS_URL")"
          echo "$readiness_response" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "application_ready" and .role == "lifemate_edge_runtime" and .service == "lifemate-readiness" and .version == $version and (.databaseTransport == "transaction_pooler" or .databaseTransport == "direct_or_other") and (.transactionPoolerRequired | type == "boolean")' \
            >/dev/null
          transport="$(echo "$readiness_response" | jq -r '.databaseTransport')"
          required="$(echo "$readiness_response" | jq -r '.transactionPoolerRequired')"
          echo "Database transport: $transport" >> "$GITHUB_STEP_SUMMARY"
          echo "Transaction pooler required: $required" >> "$GITHUB_STEP_SUMMARY"
          if [ "$transport" != 'transaction_pooler' ] || [ "$required" != 'true' ]; then
            echo '::warning::Production Edge database transport is not yet enforced as Supabase transaction pooling. Scale-04 remains open.'
          fi

      - name: Verify telemetry rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          event_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          event_payload="$(jq -cn \
            --arg eventId "$event_id" \
            --arg releaseVersion "$GITHUB_SHA" \
            '{eventId:$eventId,application:"wellmate",releaseVersion:$releaseVersion,platform:"android",source:"zone",errorType:"MainDeployUnauthorizedSmoke",stackFingerprint:"0123456789abcdef",fatal:false}')"
          unauthorized_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$event_payload" \
            "$LIFEMATE_TELEMETRY_URL")"
          test "$unauthorized_status" = '401'

      - name: Verify authenticated telemetry when smoke identity is configured
        if: ${{ env.TELEMETRY_SMOKE_EMAIL != '' && env.TELEMETRY_SMOKE_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          auth_payload="$(jq -cn \
            --arg email "$TELEMETRY_SMOKE_EMAIL" \
            --arg password "$TELEMETRY_SMOKE_PASSWORD" \
            '{email:$email,password:$password}')"
          access_token="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$auth_payload" \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" | jq -er '.access_token')"
          test -n "$access_token"

          event_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          event_payload="$(jq -cn \
            --arg eventId "$event_id" \
            --arg releaseVersion "$GITHUB_SHA" \
            '{eventId:$eventId,application:"wellmate",releaseVersion:$releaseVersion,platform:"android",source:"zone",errorType:"MainDeploySmokeError",stackFingerprint:"0123456789abcdef",fatal:false}')"
          telemetry_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data "$event_payload" \
            "$LIFEMATE_TELEMETRY_URL")"
          test "$telemetry_status" = '202'

      - name: Record missing authenticated telemetry evidence
        if: ${{ env.TELEMETRY_SMOKE_EMAIL == '' || env.TELEMETRY_SMOKE_PASSWORD == '' }}
        shell: bash
        run: |
          echo '::warning::Authenticated telemetry smoke was not run because BETA_PATIENT_EMAIL/BETA_PATIENT_PASSWORD are not configured as repository secrets.'
          echo 'Authenticated telemetry smoke: NOT EVIDENCED (missing synthetic smoke identity credentials).' >> "$GITHUB_STEP_SUMMARY"
