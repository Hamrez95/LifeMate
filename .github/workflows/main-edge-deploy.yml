name: main-edge-deploy

on:
  pull_request:
    paths:
      - '.github/workflows/main-edge-deploy.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/functions/lifemate-telemetry/**'
      - 'supabase/functions/lifemate-readiness/**'
      - 'supabase/functions/lifemate-worker/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-edge-deploy.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/lifemate-api/**'
      - 'supabase/functions/lifemate-telemetry/**'
      - 'supabase/functions/lifemate-readiness/**'
      - 'supabase/functions/lifemate-worker/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'production-edge-deploy' || format('main-edge-deploy-{0}', github.ref) }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
  LIFEMATE_TELEMETRY_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-telemetry
  LIFEMATE_READINESS_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-readiness
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}

jobs:
  verify-edge-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Verify API source
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-api
          deno fmt --check
          deno task check
          deno task test

      - name: Verify API security and privacy invariants
        working-directory: supabase/functions/lifemate-api
        shell: bash
        run: |
          set -euo pipefail
          check() { local label="$1"; shift; if "$@"; then echo "PASS: $label"; else echo "::error::$label"; exit 1; fi; }
          check_absent() { local label="$1"; shift; if "$@"; then echo "::error::$label"; exit 1; else echo "PASS: $label"; fi; }
          check_absent 'Service-role environment access is forbidden.' grep -R --line-number -F 'SUPABASE_SERVICE_ROLE_KEY' .
          check 'Runtime configuration reads secrets from Vault.' grep -Fq 'vault.decrypted_secrets' runtime_config.ts
          check 'Contact secret length is validated.' grep -Fq 'value.length >= 32' runtime_config.ts
          check 'Contact secret cannot reuse the service-role value.' grep -Fq 'value !== serviceRole' runtime_config.ts
          check_absent 'Generic default secrets must not be selected.' grep -Fq 'sources.defaultSecret' runtime_config.ts
          check 'Care-event access fails closed.' grep -Fq 'care_access_denied' care_events.ts
          check 'Profile avatar keys remain allow-listed.' grep -Fq 'invalid_avatar_key' profile.ts
          check 'Profile-photo bucket is private.' grep -Fq 'public: false' profile_photo.ts
          check 'Profile-photo file signatures are validated.' grep -Fq 'validateProfilePhoto' profile_photo.ts
          check 'Profile-photo size is bounded.' grep -Fq 'profilePhotoMaximumBytes' profile_photo.ts
          check 'Caregiver calendar responses exclude private notes.' grep -Fq 'privateNotes' women_calendar_integration_test.ts
          check 'Daily companion sharing is explicit per entry.' grep -Fq 'share_summary_with_companion = true' women_calendar_legacy.ts
          check_absent 'Profile photos must never use a public bucket.' grep -R --line-number -E 'profile-photo.*public.*true' . ../../migrations
          check_absent 'Profile-photo paths must not enter audit metadata.' grep -R --line-number -E 'profilePhotoPath.*metadata' .

      - name: Verify telemetry source
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-telemetry
          deno fmt --check
          deno task check
          deno task test

      - name: Verify readiness source
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-readiness
          deno fmt --check
          deno task check
          deno task test

      - name: Verify worker source
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions/lifemate-worker
          deno task check
          deno task test

  postgres-role-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: lifemate_edge_deploy_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_edge_deploy_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifemate_edge_deploy_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Apply canonical portable schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/legacy_lifemate_baseline.sql
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/bootstrap/test_provider_compatibility_roles.sql
          while IFS= read -r migration; do
            psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Prove account lifecycle maps AppUser to Account
        working-directory: supabase/functions/lifemate-api
        run: deno task test:account-lifecycle-integration

      - name: Prove restricted API role preserves account lifecycle invariants
        shell: bash
        run: |
          set -euo pipefail
          runtime_password='ci-restricted-runtime-password-0123456789abcdef'
          psql "$TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --set=runtime_password="$runtime_password" <<'SQL'
          alter role lifemate_edge_runtime password :'runtime_password';
          do $$
          begin
            if (select rolsuper or rolbypassrls or rolcreaterole or rolcreatedb
                  from pg_roles where rolname='lifemate_edge_runtime') then
              raise exception 'restricted role regained elevated privileges';
            end if;
          end $$;
          SQL
          restricted_url="postgres://lifemate_edge_runtime:${runtime_password}@localhost:5432/lifemate_edge_deploy_tests"
          (cd supabase/functions/lifemate-api && TEST_DATABASE_URL="$restricted_url" deno task test:account-lifecycle-integration)

      - name: Exercise outbox worker safety and recovery
        working-directory: supabase/functions/lifemate-worker
        run: deno task test:integration

  deploy-exact-main:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify-edge-source, postgres-role-journey]
    runs-on: ubuntu-24.04
    environment: beta
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TELEMETRY_SMOKE_EMAIL: ${{ secrets.BETA_PATIENT_EMAIL }}
      TELEMETRY_SMOKE_PASSWORD: ${{ secrets.BETA_PATIENT_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          show-progress: false
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact main deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'Hamrez95/LifeMate'
          test "$SUPABASE_PROJECT_REF" = 'bwdvmniywyyijjauipnh'
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Verify management credential
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list >/dev/null

      - name: Set immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          cleanup_secret_file() {
            if command -v shred >/dev/null 2>&1; then
              shred -u "$secret_file"
            else
              rm -f "$secret_file"
            fi
          }
          trap cleanup_secret_file EXIT
          chmod 600 "$secret_file"
          printf 'LIFEMATE_RELEASE_VERSION=%s\n' "$GITHUB_SHA" > "$secret_file"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --env-file "$secret_file"

      - name: Deploy exact-main API telemetry readiness and worker
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy lifemate-api \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api
          supabase functions deploy lifemate-telemetry \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api
          supabase functions deploy lifemate-readiness \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api
          supabase functions deploy lifemate-worker \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify exact production API source and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$LIFEMATE_API_BASE_URL/health")"
          echo "$health_response" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "ready" and .service == "lifemate-api" and .version == $version' \
            >/dev/null

          unauthorized_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            "$LIFEMATE_API_BASE_URL/api/v1/me")"
          test "$unauthorized_status" = '401'

      - name: Verify restricted production readiness identity and transport evidence
        shell: bash
        run: |
          set -euo pipefail
          readiness_response="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$LIFEMATE_READINESS_URL")"
          echo "$readiness_response" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "application_ready" and .role == "lifemate_edge_runtime" and .service == "lifemate-readiness" and .version == $version and (.databaseTransport == "transaction_pooler" or .databaseTransport == "direct_or_other") and (.transactionPoolerRequired | type == "boolean")' \
            >/dev/null
          transport="$(echo "$readiness_response" | jq -r '.databaseTransport')"
          required="$(echo "$readiness_response" | jq -r '.transactionPoolerRequired')"
          echo "Database transport: $transport" >> "$GITHUB_STEP_SUMMARY"
          echo "Transaction pooler required: $required" >> "$GITHUB_STEP_SUMMARY"
          if [ "$transport" != 'transaction_pooler' ] || [ "$required" != 'true' ]; then
            echo '::warning::Production Edge database transport is not yet enforced as Supabase transaction pooling. Scale-04 remains open.'
          fi

      - name: Verify telemetry rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          event_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          event_payload="$(jq -cn \
            --arg eventId "$event_id" \
            --arg releaseVersion "$GITHUB_SHA" \
            '{eventId:$eventId,application:"wellmate",releaseVersion:$releaseVersion,platform:"android",source:"zone",errorType:"MainDeployUnauthorizedSmoke",stackFingerprint:"0123456789abcdef",fatal:false}')"
          unauthorized_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$event_payload" \
            "$LIFEMATE_TELEMETRY_URL")"
          test "$unauthorized_status" = '401'

      - name: Verify authenticated telemetry when smoke identity is configured
        if: ${{ env.TELEMETRY_SMOKE_EMAIL != '' && env.TELEMETRY_SMOKE_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          auth_payload="$(jq -cn \
            --arg email "$TELEMETRY_SMOKE_EMAIL" \
            --arg password "$TELEMETRY_SMOKE_PASSWORD" \
            '{email:$email,password:$password}')"
          access_token="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$auth_payload" \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" | jq -er '.access_token')"
          test -n "$access_token"

          event_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          event_payload="$(jq -cn \
            --arg eventId "$event_id" \
            --arg releaseVersion "$GITHUB_SHA" \
            '{eventId:$eventId,application:"wellmate",releaseVersion:$releaseVersion,platform:"android",source:"zone",errorType:"MainDeploySmokeError",stackFingerprint:"0123456789abcdef",fatal:false}')"
          telemetry_status="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data "$event_payload" \
            "$LIFEMATE_TELEMETRY_URL")"
          test "$telemetry_status" = '202'

      - name: Record missing authenticated telemetry evidence
        if: ${{ env.TELEMETRY_SMOKE_EMAIL == '' || env.TELEMETRY_SMOKE_PASSWORD == '' }}
        shell: bash
        run: |
          echo '::warning::Authenticated telemetry smoke was not run because BETA_PATIENT_EMAIL/BETA_PATIENT_PASSWORD are not configured as repository secrets.'
          echo 'Authenticated telemetry smoke: NOT EVIDENCED (missing synthetic smoke identity credentials).' >> "$GITHUB_STEP_SUMMARY"
