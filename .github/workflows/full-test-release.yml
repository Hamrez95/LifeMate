name: Full Test Release

on:
  pull_request:
    paths:
      - '.github/workflows/full-test-release.yml'
      - 'tools/release/verify-full-test-release.mjs'
      - 'tools/release/verify-production-db-contract.mjs'
      - 'tools/release/prepare-android-signing.sh'
      - 'tools/release/verify-android-signing.sh'
      - 'packages/lifemate_client/**'
      - 'packages/lifemate_ui/**'
      - 'supabase/functions/lifemate-api/**'
      - 'wellmate/**'
      - 'caremate/**'
  workflow_dispatch:
    inputs:
      release_name:
        description: Full-test candidate name, for example 0.9.0-fulltest.2
        required: true
        default: 0.9.0-fulltest.2
        type: string
      confirm_release:
        description: Type BUILD-FULL-TEST-RELEASE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: full-test-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: bwdvmniywyyijjauipnh
  SUPABASE_URL: https://bwdvmniywyyijjauipnh.supabase.co
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6YpBDD0gAPcenbYGukOeWg_fZXxUb27' }}
  LIFEMATE_API_BASE_URL: https://bwdvmniywyyijjauipnh.supabase.co/functions/v1/lifemate-api
  ENABLE_PHONE_OTP: 'true'
  ENABLE_WOMEN_CALENDAR_PILOT: 'true'
  ENABLE_GOOGLE_AUTH: 'false'
  PUB_ENVIRONMENT: bot:github_actions

jobs:
  verify-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Verify full-test release contract
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/verify-full-test-release.mjs
          node tools/security/verify-auth-security-contract.mjs

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Verify production API source
        shell: bash
        run: |
          set -euo pipefail
          api='supabase/functions/lifemate-api'
          # API tests also inspect the sibling supabase/migrations contract.
          (cd "$api" && deno task test --allow-read=../..)

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Verify shared LifeMate client
        working-directory: packages/lifemate_client
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify shared LifeMate UI
        working-directory: packages/lifemate_ui
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify WellMate
        working-directory: wellmate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Verify CareMate
        working-directory: caremate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

  deploy-exact-main-api:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-all
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: beta
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false

      - name: Enforce exact-main backend source
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM_RELEASE" = 'BUILD-FULL-TEST-RELEASE'
          [[ "$RELEASE_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fulltest\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0

      - name: Verify production DB contract before API deploy
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/verify-production-db-contract.mjs

      - name: Deploy exact-main LifeMate API
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list >/dev/null
          secret_file="$(mktemp)"
          cleanup() { rm -f "$secret_file"; }
          trap cleanup EXIT
          chmod 600 "$secret_file"
          printf 'LIFEMATE_RELEASE_VERSION=%s\n' "$GITHUB_SHA" > "$secret_file"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --env-file "$secret_file"
          supabase functions deploy lifemate-api \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify deployed API is this exact main
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$LIFEMATE_API_BASE_URL/health")"
          echo "$health" | jq -e \
            --arg version "$GITHUB_SHA" \
            '.status == "ok" and .database == "ready" and .service == "lifemate-api" and .version == $version' \
            >/dev/null

  build-signed-full-test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [verify-all, deploy-exact-main-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: beta
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Enforce exact-main full-test source
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM_RELEASE" = 'BUILD-FULL-TEST-RELEASE'
          [[ "$RELEASE_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fulltest\.[0-9]+$ ]]
          test "$ENABLE_PHONE_OTP" = 'true'
          test "$ENABLE_WOMEN_CALENDAR_PILOT" = 'true'
          test "$ENABLE_GOOGLE_AUTH" = 'false'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Prepare permanent Android signing
        shell: bash
        env:
          WELLMATE_KEYSTORE_BASE64: ${{ secrets.WELLMATE_KEYSTORE_BASE64 }}
          WELLMATE_STORE_PASSWORD: ${{ secrets.WELLMATE_STORE_PASSWORD }}
          WELLMATE_KEY_PASSWORD: ${{ secrets.WELLMATE_KEY_PASSWORD }}
          WELLMATE_KEY_ALIAS: ${{ secrets.WELLMATE_KEY_ALIAS }}
          CAREMATE_KEYSTORE_BASE64: ${{ secrets.CAREMATE_KEYSTORE_BASE64 }}
          CAREMATE_STORE_PASSWORD: ${{ secrets.CAREMATE_STORE_PASSWORD }}
          CAREMATE_KEY_PASSWORD: ${{ secrets.CAREMATE_KEY_PASSWORD }}
          CAREMATE_KEY_ALIAS: ${{ secrets.CAREMATE_KEY_ALIAS }}
        run: bash tools/release/prepare-android-signing.sh

      - name: Build signed split Android and web test outputs
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count HEAD)"
          build_args=(
            --release
            --build-name="$RELEASE_NAME"
            --build-number="$build_number"
            --dart-define="SUPABASE_URL=$SUPABASE_URL"
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            --dart-define="LIFEMATE_API_BASE_URL=$LIFEMATE_API_BASE_URL"
            --dart-define="ENABLE_PHONE_OTP=true"
            --dart-define="ENABLE_WOMEN_CALENDAR_PILOT=true"
            --dart-define="ENABLE_GOOGLE_AUTH=false"
          )
          (cd wellmate && flutter pub get && flutter build apk --split-per-abi "${build_args[@]}" && flutter build appbundle "${build_args[@]}" && flutter build web "${build_args[@]}")
          (cd caremate && flutter pub get && flutter build apk --split-per-abi "${build_args[@]}" && flutter build appbundle "${build_args[@]}" && flutter build web "${build_args[@]}")
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Verify permanent signatures and package identities
        shell: bash
        run: |
          set -euo pipefail
          wellmate_arm64='wellmate/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          caremate_arm64='caremate/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          bash tools/release/verify-android-signing.sh "$wellmate_arm64" "$caremate_arm64"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          apkanalyzer="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          for apk in wellmate/build/app/outputs/flutter-apk/app-*-release.apk caremate/build/app/outputs/flutter-apk/app-*-release.apk; do
            "$apksigner" verify --verbose "$apk" >/dev/null
          done
          "$apkanalyzer" manifest application-id "$wellmate_arm64" | grep -Fxq 'com.lifemate.wellmate'
          "$apkanalyzer" manifest application-id "$caremate_arm64" | grep -Fxq 'com.lifemate.caremate'
          test -s wellmate/build/web/index.html
          test -s caremate/build/web/index.html

      - name: Create immutable full-test bundle
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          mkdir -p dist

          wellmate_arm64="wellmate-arm64-v8a-$RELEASE_NAME-$short_sha.apk"
          wellmate_armv7="wellmate-armeabi-v7a-$RELEASE_NAME-$short_sha.apk"
          wellmate_x64="wellmate-x86_64-$RELEASE_NAME-$short_sha.apk"
          wellmate_aab="wellmate-$RELEASE_NAME-$short_sha.aab"
          wellmate_web="wellmate-web-$RELEASE_NAME-$short_sha.tar.gz"
          caremate_arm64="caremate-arm64-v8a-$RELEASE_NAME-$short_sha.apk"
          caremate_armv7="caremate-armeabi-v7a-$RELEASE_NAME-$short_sha.apk"
          caremate_x64="caremate-x86_64-$RELEASE_NAME-$short_sha.apk"
          caremate_aab="caremate-$RELEASE_NAME-$short_sha.aab"
          caremate_web="caremate-web-$RELEASE_NAME-$short_sha.tar.gz"

          cp wellmate/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$wellmate_arm64"
          cp wellmate/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/$wellmate_armv7"
          cp wellmate/build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/$wellmate_x64"
          cp wellmate/build/app/outputs/bundle/release/app-release.aab "dist/$wellmate_aab"
          tar -C wellmate/build/web -czf "dist/$wellmate_web" .
          cp caremate/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$caremate_arm64"
          cp caremate/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/$caremate_armv7"
          cp caremate/build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/$caremate_x64"
          cp caremate/build/app/outputs/bundle/release/app-release.aab "dist/$caremate_aab"
          tar -C caremate/build/web -czf "dist/$caremate_web" .

          (cd dist && sha256sum *.apk *.aab *.tar.gz > SHA256SUMS.txt)

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg buildNumber "$BUILD_NUMBER" \
            --arg releaseName "$RELEASE_NAME" \
            --arg apiBase "$LIFEMATE_API_BASE_URL" \
            --arg supabaseProject "$SUPABASE_PROJECT_REF" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wellmateArm64 "$wellmate_arm64" \
            --arg wellmateArm64Sha "$(sha256sum "dist/$wellmate_arm64" | awk '{print $1}')" \
            --arg caremateArm64 "$caremate_arm64" \
            --arg caremateArm64Sha "$(sha256sum "dist/$caremate_arm64" | awk '{print $1}')" \
            '{commit:$commit,buildNumber:($buildNumber|tonumber),releaseName:$releaseName,environment:"production-full-test",apiBase:$apiBase,supabaseProject:$supabaseProject,features:{phoneOtp:true,womenCalendarPilot:true,googleAuth:false},builtAtUtc:$builtAt,preferredAndroidAbi:"arm64-v8a",apps:{wellmate:{arm64Apk:{file:$wellmateArm64,sha256:$wellmateArm64Sha}},caremate:{arm64Apk:{file:$caremateArm64,sha256:$caremateArm64Sha}}}}' \
            > dist/manifest.json

          jq -e '.commit == env.GITHUB_SHA and .features.phoneOtp == true and .features.womenCalendarPilot == true and .features.googleAuth == false and .environment == "production-full-test" and .preferredAndroidAbi == "arm64-v8a" and (.apps.wellmate.arm64Apk.sha256|length) == 64 and (.apps.caremate.arm64Apk.sha256|length) == 64' dist/manifest.json >/dev/null

          cp "dist/$wellmate_arm64" dist/wellmate-arm64.apk
          cp "dist/$caremate_arm64" dist/caremate-arm64.apk

      - name: Upload small WellMate arm64 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wellmate-arm64-${{ github.sha }}
          path: dist/wellmate-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload small CareMate arm64 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caremate-arm64-${{ github.sha }}
          path: dist/caremate-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete full-test release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-test-release-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f wellmate/android/key.properties caremate/android/key.properties
          if [[ -n "${LIFEMATE_ANDROID_SIGNING_DIR:-}" ]]; then
            rm -rf "$LIFEMATE_ANDROID_SIGNING_DIR"
          fi
