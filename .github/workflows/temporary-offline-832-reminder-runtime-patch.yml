name: temporary-offline-832-reminder-runtime-patch

on:
  push:
    branches:
      - feat/offline-832-pending-treatment-reminder-runtime-20260905
    paths:
      - .github/workflows/temporary-offline-832-reminder-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/offline-832-pending-treatment-reminder-runtime-20260905
      - name: Wire provisional reminders through canonical provider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path('wellmate/lib/providers/notification_provider.dart')
          text = provider.read_text()
          text = text.replace(
              "import 'grouped_medication_notification.dart';\n",
              "import 'grouped_medication_notification.dart';\nimport 'pending_treatment_create_reminder_sync.dart';\n",
              1,
          )
          text = text.replace(
              "  late final LifeMateLocalReminderScheduler _reminderScheduler =\n      LifeMateLocalReminderScheduler(\n        platform: FlutterLifeMateReminderPlatform(_notifications),\n      );\n",
              "  late final LifeMateLocalReminderScheduler _reminderScheduler =\n      LifeMateLocalReminderScheduler(\n        platform: FlutterLifeMateReminderPlatform(_notifications),\n      );\n  late final PendingTreatmentCreateReminderSync\n  _pendingTreatmentCreateReminderSync = PendingTreatmentCreateReminderSync(\n    scheduler: _reminderScheduler,\n  );\n",
              1,
          )
          text = text.replace(
              "  bool _inexactFallbackActive = false;\n",
              "  bool _canonicalInexactFallbackActive = false;\n  bool _pendingTreatmentInexactFallbackActive = false;\n",
              1,
          )
          text = text.replace(
              "  bool get inexactFallbackActive => _inexactFallbackActive;\n",
              "  bool get inexactFallbackActive =>\n      _canonicalInexactFallbackActive || _pendingTreatmentInexactFallbackActive;\n",
              1,
          )
          marker = "  Future<void> syncReminders(\n"
          insert = """  Future<void> syncPendingTreatmentCreateReminders(\n    Iterable<Map<String, dynamic>> pendingCreates, {\n    required String timeZone,\n    required bool isPersian,\n  }) async {\n    await initialize();\n    _latestTimeZone = timeZone.trim().isEmpty ? 'UTC' : timeZone.trim();\n    await _ensureNotificationPermissions();\n    final result = await _pendingTreatmentCreateReminderSync.sync(\n      pendingCreates: pendingCreates,\n      nowUtc: DateTime.now().toUtc(),\n      schedulingTimeZone: _latestTimeZone,\n      isPersian: isPersian,\n      exactAlarmGranted: _exactAlarmGranted,\n    );\n    _updatePendingTreatmentFallbackState(result.usedInexactFallback);\n  }\n\n  Future<void> _ensureNotificationPermissions() async {\n    if (_permissionRequested) return;\n    final android = _notifications\n        .resolvePlatformSpecificImplementation<\n          AndroidFlutterLocalNotificationsPlugin\n        >();\n    await android?.requestNotificationsPermission();\n    _exactAlarmGranted = await android?.requestExactAlarmsPermission();\n    _permissionRequested = true;\n  }\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('syncReminders marker not unique')
          text = text.replace(marker, insert + marker, 1)
          old_permission = """    if (!_permissionRequested) {\n      final android = _notifications\n          .resolvePlatformSpecificImplementation<\n            AndroidFlutterLocalNotificationsPlugin\n          >();\n      await android?.requestNotificationsPermission();\n      _exactAlarmGranted = await android?.requestExactAlarmsPermission();\n      _permissionRequested = true;\n    }\n"""
          if text.count(old_permission) != 1:
              raise SystemExit('permission block not unique')
          text = text.replace(old_permission, "    await _ensureNotificationPermissions();\n", 1)
          old_update = """  void _updateFallbackState(bool value) {\n    if (_inexactFallbackActive == value) return;\n    _inexactFallbackActive = value;\n    notifyListeners();\n  }\n"""
          new_update = """  void _updateFallbackState(bool value) {\n    final before = inexactFallbackActive;\n    _canonicalInexactFallbackActive = value;\n    if (before != inexactFallbackActive) notifyListeners();\n  }\n\n  void _updatePendingTreatmentFallbackState(bool value) {\n    final before = inexactFallbackActive;\n    _pendingTreatmentInexactFallbackActive = value;\n    if (before != inexactFallbackActive) notifyListeners();\n  }\n"""
          if text.count(old_update) != 1:
              raise SystemExit('fallback updater not found')
          text = text.replace(old_update, new_update, 1)
          provider.write_text(text)

          home = Path('wellmate/lib/screens/home/home_screen_content.dart')
          text = home.read_text()
          old = """      try {\n        await context.read<NotificationProvider>().syncReminders(\n          reminderWindow,\n          timeZone: profile['timeZone']?.toString() ?? 'Asia/Tehran',\n          isPersian: Localizations.localeOf(context).languageCode == 'fa',\n        );\n      } catch (error) {\n        debugPrint('WellMate reminder sync failed: $error');\n      }\n"""
          new = """      final notificationProvider = context.read<NotificationProvider>();\n      final reminderTimeZone =\n          profile['timeZone']?.toString() ?? 'Asia/Tehran';\n      final reminderIsPersian =\n          Localizations.localeOf(context).languageCode == 'fa';\n      try {\n        await notificationProvider.syncReminders(\n          reminderWindow,\n          timeZone: reminderTimeZone,\n          isPersian: reminderIsPersian,\n        );\n      } catch (error) {\n        debugPrint('WellMate reminder sync failed: $error');\n      }\n      try {\n        await notificationProvider.syncPendingTreatmentCreateReminders(\n          pendingTreatmentCreates,\n          timeZone: reminderTimeZone,\n          isPersian: reminderIsPersian,\n        );\n      } catch (error) {\n        debugPrint('WellMate pending treatment reminder sync failed: $error');\n      }\n"""
          if text.count(old) != 1:
              raise SystemExit('home reminder block not found')
          home.write_text(text.replace(old, new, 1))

          test = Path('wellmate/test/pending_treatment_create_reminder_runtime_contract_test.dart')
          test.write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('Home reconciles provisional pending-treatment reminders after schedule load', () {\n    final source = File(\n      'lib/screens/home/home_screen_content.dart',\n    ).readAsStringSync();\n\n    expect(source, contains('syncPendingTreatmentCreateReminders('));\n    expect(source, contains('pendingTreatmentCreates,'));\n    expect(source, contains('reminderTimeZone'));\n    expect(source, contains('reminderIsPersian'));\n  });\n\n  test('NotificationProvider reuses one shared scheduler for provisional reminders', () {\n    final source = File('lib/providers/notification_provider.dart').readAsStringSync();\n\n    expect(\n      RegExp(r'LifeMateLocalReminderScheduler\\s+_reminderScheduler').allMatches(source),\n      hasLength(1),\n    );\n    expect(\n      source,\n      contains('PendingTreatmentCreateReminderSync(\\n    scheduler: _reminderScheduler,'),\n    );\n    expect(source, isNot(contains('FlutterLocalNotificationsPlugin();\\n  final FlutterLocalNotificationsPlugin')));\n  });\n\n  test('canonical and provisional inexact fallback states cannot mask each other', () {\n    final source = File('lib/providers/notification_provider.dart').readAsStringSync();\n\n    expect(source, contains('_canonicalInexactFallbackActive'));\n    expect(source, contains('_pendingTreatmentInexactFallbackActive'));\n    expect(\n      source,\n      contains('_canonicalInexactFallbackActive || _pendingTreatmentInexactFallbackActive'),\n    );\n  });\n}\n""")
          PY
      - name: Format changed Dart files
        shell: bash
        run: |
          dart format \
            wellmate/lib/providers/notification_provider.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/test/pending_treatment_create_reminder_runtime_contract_test.dart
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/temporary-offline-832-reminder-runtime-patch.yml
          git add \
            wellmate/lib/providers/notification_provider.dart \
            wellmate/lib/screens/home/home_screen_content.dart \
            wellmate/test/pending_treatment_create_reminder_runtime_contract_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(wellmate): wire provisional treatment reminders at runtime (#832)"
          git push origin HEAD:feat/offline-832-pending-treatment-reminder-runtime-20260905
