name: one-shot WellMate version sync

on:
  push:
    branches:
      - feat/bb287-parity-completion
    paths:
      - .github/workflows/one-shot-wellmate-version-sync.yml

permissions:
  contents: write

jobs:
  patch-profile:
    if: github.event.head_commit.message == 'chore: run one-shot WellMate version sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/bb287-parity-completion

      - name: Replace stale profile version with the shared constant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wellmate/lib/screens/profile/profile_screen.dart')
          source = path.read_text(encoding='utf-8')

          import_line = "import '../../core/constants/app_version.dart';\n"
          anchor = "import '../../core/theme/app_style.dart';\n"
          if import_line not in source:
              if anchor not in source:
                  raise SystemExit('WellMate profile import anchor was not found')
              source = source.replace(anchor, import_line + anchor, 1)

          old = "'WellMate 0.8.0-beta.3'.toPersianDigit(isPersian)"
          new = "'WellMate $wellMateAppVersion'.toPersianDigit(isPersian)"
          if old not in source:
              raise SystemExit('Stale WellMate profile version label was not found')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit the deterministic patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wellmate/lib/screens/profile/profile_screen.dart
          git diff --cached --check
          git commit -m "fix(wellmate): use current version in profile"
          git push origin HEAD:feat/bb287-parity-completion
