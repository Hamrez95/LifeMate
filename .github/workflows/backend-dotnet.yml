name: backend-dotnet
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend-dotnet/**'
      - '.github/workflows/backend-dotnet.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'backend-dotnet/**'
      - '.github/workflows/backend-dotnet.yml'
      - 'AGENTS.md'
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lifemate_tests
          POSTGRES_USER: lifemate
          POSTGRES_PASSWORD: lifemate_test_password
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U lifemate -d lifemate_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: backend-dotnet/**/*.csproj
      - name: Restore
        run: dotnet restore backend-dotnet/LifeMate.sln
      - name: Build
        run: dotnet build backend-dotnet/LifeMate.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test backend-dotnet/tests/LifeMate.UnitTests/LifeMate.UnitTests.csproj --configuration Release --no-build --logger trx
      - name: Restore local .NET tools
        run: dotnet tool restore
      - name: Validate migrations
        env:
          ConnectionStrings__LifeMateDb: Host=localhost;Port=54329;Database=lifemate_tests;Username=lifemate;Password=lifemate_test_password
        run: dotnet ef migrations list --project backend-dotnet/src/LifeMate.Infrastructure --startup-project backend-dotnet/src/LifeMate.Api
      - name: Integration tests
        env:
          ConnectionStrings__LifeMateDb: Host=localhost;Port=54329;Database=lifemate_tests;Username=lifemate;Password=lifemate_test_password
        run: dotnet test backend-dotnet/tests/LifeMate.IntegrationTests/LifeMate.IntegrationTests.csproj --configuration Release --no-build --logger trx
