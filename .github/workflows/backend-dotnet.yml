name: backend-dotnet

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend-dotnet/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/backend-dotnet.yml'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'backend-dotnet/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/backend-dotnet.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: backend-dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend-dotnet/**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        id: restore
        shell: bash
        run: |
          set -o pipefail
          dotnet restore backend-dotnet/LifeMate.sln --verbosity minimal 2>&1 | tee /tmp/lifemate-restore.log

      - name: Upload restore diagnostics
        if: ${{ always() && steps.restore.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-restore-log
          path: /tmp/lifemate-restore.log
          retention-days: 1

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          dotnet build backend-dotnet/LifeMate.sln --configuration Release --no-restore 2>&1 | tee /tmp/lifemate-build.log

      - name: Upload build diagnostics
        if: ${{ always() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: /tmp/lifemate-build.log
          retention-days: 1

      - name: Unit tests
        run: dotnet test backend-dotnet/tests/LifeMate.UnitTests/LifeMate.UnitTests.csproj --configuration Release --no-build --logger trx

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Validate migrations
        id: migrations
        shell: bash
        env:
          ConnectionStrings__LifeMateDb: Host=localhost;Port=54329;Database=lifemate_design;Username=lifemate;Password=local_design_only
        run: |
          set -o pipefail
          dotnet ef migrations list --configuration Release --no-build --project backend-dotnet/src/LifeMate.Infrastructure --startup-project backend-dotnet/src/LifeMate.Api 2>&1 | tee /tmp/lifemate-migrations.log
          grep -q '20260719000100_InitialIdentityFoundation' /tmp/lifemate-migrations.log

      - name: Upload migration diagnostics
        if: ${{ always() && steps.migrations.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-migrations-log
          path: /tmp/lifemate-migrations.log
          retention-days: 1

      - name: Integration tests
        id: integration
        shell: bash
        env:
          ConnectionStrings__LifeMateDb: Host=localhost;Port=54329;Database=lifemate_tests;Username=lifemate;Password=lifemate_test_password
        run: |
          set -o pipefail
          dotnet test backend-dotnet/tests/LifeMate.IntegrationTests/LifeMate.IntegrationTests.csproj --configuration Release --no-build --logger trx 2>&1 | tee /tmp/lifemate-integration.log

      - name: Upload integration diagnostics
        if: ${{ always() && steps.integration.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-log
          path: /tmp/lifemate-integration.log
          retention-days: 1

      # Temporary branch-only step used to regenerate the hand-authored baseline migration
      # into canonical EF Core migration, designer, and model snapshot sources.
      - name: Generate canonical migration sources
        id: canonical
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/backend-ci-gate' }}
        shell: bash
        run: |
          set -o pipefail
          rm backend-dotnet/src/LifeMate.Infrastructure/Persistence/Migrations/20260719000100_InitialIdentityFoundation.cs
          rm -rf backend-dotnet/src/LifeMate.Infrastructure/bin backend-dotnet/src/LifeMate.Infrastructure/obj
          rm -rf backend-dotnet/src/LifeMate.Api/bin backend-dotnet/src/LifeMate.Api/obj
          dotnet restore backend-dotnet/LifeMate.sln --verbosity minimal
          dotnet ef migrations add InitialIdentityFoundation \
            --project backend-dotnet/src/LifeMate.Infrastructure \
            --startup-project backend-dotnet/src/LifeMate.Api \
            --output-dir Persistence/Migrations 2>&1 | tee /tmp/lifemate-canonical-migration.log

      - name: Upload canonical migration diagnostics
        if: ${{ always() && steps.canonical.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ef-migration-log
          path: /tmp/lifemate-canonical-migration.log
          retention-days: 1

      - name: Upload canonical migration sources
        if: ${{ steps.canonical.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ef-migration-sources
          path: backend-dotnet/src/LifeMate.Infrastructure/Persistence/Migrations
          retention-days: 1
