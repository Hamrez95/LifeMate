project_id = "lifemate-local"

[api]
enabled = true
port = 54321
schemas = ["public", "lifemate"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Local/self-hosted Auth baseline only. Hosted production Auth settings are
# provider configuration and require separate live evidence under Foundation #215.
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[functions.lifemate-api]
verify_jwt = false

[functions.lifemate-telemetry]
verify_jwt = true

[functions.lifemate-readiness]
verify_jwt = false
