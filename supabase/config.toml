project_id = "lifemate-local"

[api]
enabled = true
port = 54321
schemas = ["public", "lifemate"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[functions.lifemate-api]
verify_jwt = false

[functions.lifemate-telemetry]
verify_jwt = true

[functions.lifemate-readiness]
verify_jwt = false
